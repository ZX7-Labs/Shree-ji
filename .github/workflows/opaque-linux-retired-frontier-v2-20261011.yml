name: Opaque Linux retired archive frontier v2 gate

on:
  pull_request:
    paths:
      - ".github/workflows/opaque-linux-retired-frontier-v2-20261011.yml"
      - "verification-requests/linux-retired-frontier-v2-20261011.txt"
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_TOOL_OPTIONS: -Xmx5g
  TARGET_REF_HASH: 535f587822554ff667cbfc2f12d2067eb29413d54436bb8ce8ac21fe636c5f56
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 0390b264e868395fa5704c0d2a7c25bacab11aa15589c73e258baa6ea7f30b9a
  EXPECTED_PRIVATE_TREE_PROOF: 6f699092ac986d8ffde1c30cf35070e84ada9837fba66be00469af3089a23dac

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Recover exact private revision opaquely
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"

          root="$GITHUB_WORKSPACE/target"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"

          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"

          matched_ref=""
          private_head=""
          while read -r candidate_sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
              private_head="$candidate_sha"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          test -n "$private_head"
          echo "::add-mask::$matched_ref"
          echo "::add-mask::$private_head"

          test "$(printf '%s' "$private_head" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$private_head"
          git checkout -q --detach "$private_head"

          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_TREE_PROOF"
          test -z "$(git status --porcelain)"
          unset PRIVATE_TOKEN auth matched_ref private_head tree candidate_sha ref
          echo "OPAQUE_FRONTIER_V2_EXACT_RECOVERY=PASS"

      - name: Install pinned Rust and TLA tools
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null
          test "$(rustc +1.98.1 --version | awk '{print $2}')" = "1.98.1"
          test "$(cargo +1.98.1 --version | awk '{print $2}')" = "1.98.1"
          jar="$RUNNER_TEMP/tla2tools.jar"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "$jar" \
            "https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar" >/dev/null 2>&1
          echo "bee4a54f3ee3d4afc347c3240ec2d9e93b075104  $jar" | sha1sum --check --strict >/dev/null
          echo "OPAQUE_FRONTIER_V2_TOOLCHAIN=PASS"

      - name: Run exact Rust frontier gates without private logs
        shell: bash
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          failures=0

          run_gate() {
            label="$1"; shift
            log="$RUNNER_TEMP/${label}.private.log"
            set +e
            "$@" >"$log" 2>&1
            rc=$?
            set -e
            printf 'OPAQUE_FRONTIER_V2_%s_LOG_SHA256=%s\n' "$label" "$(sha256sum "$log" | awk '{print $1}')"
            printf 'OPAQUE_FRONTIER_V2_%s_RC=%s\n' "$label" "$rc"
            rm -f "$log"
            return "$rc"
          }

          run_gate FORMAT cargo +1.98.1 fmt --all -- --check || failures=$((failures + 1))
          run_gate CHECK cargo +1.98.1 check --locked --all-targets --features linux-peer-credentials || failures=$((failures + 1))
          run_gate CLIPPY cargo +1.98.1 clippy --locked --all-targets --features linux-peer-credentials -- -D warnings || failures=$((failures + 1))
          run_gate TEST cargo +1.98.1 test --locked --lib --features linux-peer-credentials root_supervisor_linux_retired_archive_frontier -- --test-threads=1 || failures=$((failures + 1))
          echo "OPAQUE_FRONTIER_V2_RUST_FAILURE_COUNT=$failures"
          test -z "$(git status --porcelain --untracked-files=no)"
          test "$failures" -eq 0
          echo "OPAQUE_FRONTIER_V2_RUST=PASS"

      - name: Parse and model-check exact archive safety models without disclosure
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          jar="$RUNNER_TEMP/tla2tools.jar"
          failures=0

          run_model() {
            label="$1"; cfg="$2"; tla="$3"
            sany="$RUNNER_TEMP/${label}.sany.private.log"
            tlc="$RUNNER_TEMP/${label}.tlc.private.log"

            set +e
            java -cp "$jar" tla2sany.SANY "$tla" >"$sany" 2>&1
            sany_rc=$?
            set -e
            printf 'OPAQUE_FRONTIER_V2_%s_SANY_SHA256=%s\n' "$label" "$(sha256sum "$sany" | awk '{print $1}')"
            printf 'OPAQUE_FRONTIER_V2_%s_SANY_RC=%s\n' "$label" "$sany_rc"
            rm -f "$sany"
            if [[ "$sany_rc" -ne 0 ]]; then
              return "$sany_rc"
            fi

            set +e
            timeout --signal=KILL 4800 java -XX:+UseParallelGC -jar "$jar" \
              -workers 2 -fp 0 -deadlock -config "$cfg" "$tla" >"$tlc" 2>&1
            tlc_rc=$?
            set -e
            printf 'OPAQUE_FRONTIER_V2_%s_TLC_SHA256=%s\n' "$label" "$(sha256sum "$tlc" | awk '{print $1}')"
            printf 'OPAQUE_FRONTIER_V2_%s_TLC_RC=%s\n' "$label" "$tlc_rc"
            rm -f "$tlc"
            return "$tlc_rc"
          }

          run_model ARCHIVE \
            spec/root_authority/RootSupervisorLinuxRetiredEvidenceArchive.cfg \
            spec/root_authority/RootSupervisorLinuxRetiredEvidenceArchive.tla || failures=$((failures + 1))
          run_model OWNER_BINDING \
            spec/root_authority/RootSupervisorLinuxRetiredOwnerArchiveBinding.cfg \
            spec/root_authority/RootSupervisorLinuxRetiredOwnerArchiveBinding.tla || failures=$((failures + 1))

          echo "OPAQUE_FRONTIER_V2_MODEL_FAILURE_COUNT=$failures"
          test -z "$(git status --porcelain --untracked-files=no)"
          test "$failures" -eq 0
          echo "OPAQUE_FRONTIER_V2_MODELS=PASS"

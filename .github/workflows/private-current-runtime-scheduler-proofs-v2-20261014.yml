name: Private current runtime scheduler proofs v2

on:
  push:
    paths:
      - ".github/workflows/private-current-runtime-scheduler-proofs-v2-20261014.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TARGET_REF_HASH: d071db074e8d0ca6b51599592e452ac4a4461046531f19dabe48ca8c6c4dcf6c
      EXPECTED_TARGET_PROOF: d26f8ddc4190952f49735c82867657e5dc32c2c8e4bed73a04f8a04c4476410a
    steps:
      - name: Checkout public shell
        uses: actions/checkout@v4

      - name: Recover exact private target
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_WRITE_TOKEN: ${{ secrets.LAS_PRIVATE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY" && test -n "$PRIVATE_WRITE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"; echo "::add-mask::$PRIVATE_WRITE_TOKEN"
          root="$RUNNER_TEMP/private-runtime-scheduler"; mkdir "$root"; cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_WRITE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin > "$refs"
          target_ref=""; target_sha=""
          while read -r sha ref; do
            h="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$h" == "$TARGET_REF_HASH" ]]; then target_ref="$ref"; target_sha="$sha"; fi
          done < "$refs"
          rm -f "$refs"
          test -n "$target_ref" && test -n "$target_sha"
          echo "::add-mask::$target_ref"; echo "::add-mask::$target_sha"
          test "$(printf '%s' "$target_sha" | sha256sum | awk '{print $1}')" = "$EXPECTED_TARGET_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$target_ref"
          git checkout -q -B target FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$target_sha"
          test -s tools/genericize_guarded_runtime_scheduler_tests_20261014.py
          test -s tools/remove_stale_guarded_scheduler_expects_20261014.py
          printf '%s' "$target_ref" > "$RUNNER_TEMP/target-ref"
          printf '%s' "$target_sha" > "$RUNNER_TEMP/target-start-sha"
          printf '%s' "$auth" > "$RUNNER_TEMP/private-auth"
          chmod 600 "$RUNNER_TEMP/target-ref" "$RUNNER_TEMP/target-start-sha" "$RUNNER_TEMP/private-auth"
          echo "LAS_RUNTIME_SCHEDULER_V2_RECOVERY=PASS"

      - name: Apply state proofs and remove stale expectations
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-runtime-scheduler"
          python3 tools/genericize_guarded_runtime_scheduler_tests_20261014.py
          python3 tools/remove_stale_guarded_scheduler_expects_20261014.py
          rm tools/genericize_guarded_runtime_scheduler_tests_20261014.py
          rm tools/remove_stale_guarded_scheduler_expects_20261014.py
          test ! -e tools/genericize_guarded_runtime_scheduler_tests_20261014.py
          test ! -e tools/remove_stale_guarded_scheduler_expects_20261014.py
          ! grep -q 'restore_prepared' src/effect_fabric/root_supervisor_linux_runtime.rs
          grep -q 'LinuxGuardedSessionScheduler<LinuxActiveGuardedSession, GUARDED_SESSIONS>' src/effect_fabric/root_supervisor_linux_runtime.rs
          git diff --check
          echo "LAS_RUNTIME_SCHEDULER_V2_PATCH=PASS"

      - name: Install pinned toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null
          ALR_ZIP="$RUNNER_TEMP/alr.zip"
          ALR_PREFIX="$RUNNER_TEMP/alr"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --output "$ALR_ZIP" \
            "https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip" >/dev/null 2>&1
          echo "09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  $ALR_ZIP" | sha256sum --check --strict >/dev/null
          mkdir -p "$ALR_PREFIX"; unzip -q "$ALR_ZIP" -d "$ALR_PREFIX"
          echo "$ALR_PREFIX/bin" >> "$GITHUB_PATH"
          export PATH="$ALR_PREFIX/bin:$PATH"
          alr -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1 >/dev/null
          ALR_WS="$RUNNER_TEMP/alire-runtime-scheduler"
          mkdir -p "$ALR_WS"
          (cd "$ALR_WS" && alr -n init --in-place --no-skel --lib las_runtime_scheduler >/dev/null)
          cat > "$RUNNER_TEMP/gprbuild-wrapper" <<EOF_GPR
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$ALR_WS"
          exec alr exec -- gprbuild "\$@"
          EOF_GPR
          chmod 0755 "$RUNNER_TEMP/gprbuild-wrapper"
          echo "LAS_RUNTIME_SCHEDULER_V2_TOOLCHAINS=PASS"

      - name: Strict compile lint and state proofs
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-runtime-scheduler"
          export GPRBUILD="$RUNNER_TEMP/gprbuild-wrapper"
          cargo +1.98.1 fmt --all
          cargo +1.98.1 fmt --all -- --check
          RUSTFLAGS='-D warnings' cargo +1.98.1 check --all-targets --features 'linux-peer-credentials root-ffi'
          cargo +1.98.1 clippy --all-targets --features 'linux-peer-credentials root-ffi' -- -D warnings
          cargo +1.98.1 test --features 'linux-peer-credentials root-ffi' root_supervisor_linux_runtime:: -- --nocapture
          cargo +1.98.1 test --features 'linux-peer-credentials root-ffi' root_supervisor_linux_control_resumability_tests:: -- --nocapture
          git diff --check
          echo "LAS_RUNTIME_SCHEDULER_V2_VERIFY=PASS"

      - name: Commit verified private scheduler proofs
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-runtime-scheduler"
          target_ref="$(cat "$RUNNER_TEMP/target-ref")"
          start_sha="$(cat "$RUNNER_TEMP/target-start-sha")"
          auth="$(cat "$RUNNER_TEMP/private-auth")"
          remote_sha="$(git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote origin "$target_ref" | awk '{print $1}')"
          echo "::add-mask::$remote_sha"
          test "$remote_sha" = "$start_sha"
          git config user.name "LAS Verification Integrator"
          git config user.email "las-verification@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -q -m "Prove guarded runtime scheduler transitions"
          new_sha="$(git rev-parse HEAD)"
          echo "::add-mask::$new_sha"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" push -q origin HEAD:"$target_ref"
          echo "LAS_RUNTIME_SCHEDULER_V2_RESULT=PASS"
          echo "LAS_RUNTIME_SCHEDULER_V2_COMMIT_PROOF=$(printf '%s' "$new_sha" | sha256sum | awk '{print $1}')"

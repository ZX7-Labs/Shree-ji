name: Apply retired-owner projection type repair v4

on:
  pull_request:
    paths:
      - ".github/workflows/apply-linux-retired-owner-projections-v4-type-repair-20261011.yml"
      - "verification-requests/apply-linux-retired-owner-projections-v4-type-repair-20261011.txt"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REF_HASH: 1fac30945223ebc9f0cc8e1bbadc2bffd24839393c448896663afd60ae943539
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 3e1858a0de2e48a7fa51968f00caa228b02cccce6c74c9d8b377b0b104f75bba
  EXPECTED_PRIVATE_TREE_PROOF: 5731bdeaab63de672f84f2133d3fed753dd6aa2a781078c6e716779b59aee004

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Recover exact private branch with write lease
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"; test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"; echo "::add-mask::$PRIVATE_TOKEN"
          root="$GITHUB_WORKSPACE/target"; mkdir "$root"; cd "$root"; git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"; echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/private-heads"; git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""; private_head=""
          while read -r candidate_sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"; matched_ref="$ref"; private_head="$candidate_sha"
            fi
          done <"$refs"
          rm -f "$refs"; test -n "$matched_ref"; test -n "$private_head"
          echo "::add-mask::$matched_ref"; echo "::add-mask::$private_head"
          test "$(printf '%s' "$private_head" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q origin "$matched_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$private_head"; git checkout -q -b repair-target "$private_head"
          tree="$(git rev-parse 'HEAD^{tree}')"; echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_TREE_PROOF"
          printf '%s' "$matched_ref" >"$RUNNER_TEMP/matched-ref"; printf '%s' "$private_head" >"$RUNNER_TEMP/private-head"; printf '%s' "$auth" >"$RUNNER_TEMP/auth"
          chmod 600 "$RUNNER_TEMP/matched-ref" "$RUNNER_TEMP/private-head" "$RUNNER_TEMP/auth"
          echo "PRIVATE_REPOSITORY=$PRIVATE_REPOSITORY" >> "$GITHUB_ENV"

      - name: Install exact production toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt >/dev/null
          archive="$RUNNER_TEMP/alr.zip"; prefix="$RUNNER_TEMP/alr"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --output "$archive" "https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip"
          echo "09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  $archive" | sha256sum --check --strict >/dev/null
          mkdir -p "$prefix"; unzip -q "$archive" -d "$prefix"; echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Select pinned Ada build tools
        shell: bash
        run: |
          set -euo pipefail
          alr -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1 >/dev/null
          alr_bin="$(command -v alr)"; workspace="$RUNNER_TEMP/root-production-toolchain"; mkdir -p "$workspace"; cd "$workspace"
          alr -n init --in-place --no-skel --lib root_production_toolchain >/dev/null
          gpr_wrapper="$RUNNER_TEMP/gprbuild-wrapper"
          cat >"$gpr_wrapper" <<EOF_GPR
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$workspace"
          exec "$alr_bin" exec -- gprbuild "\$@"
          EOF_GPR
          chmod +x "$gpr_wrapper"; "$gpr_wrapper" --version >/dev/null
          echo "GPRBUILD=$gpr_wrapper" >> "$GITHUB_ENV"

      - name: Apply exact type repair and verify production path
        shell: bash
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          file="src/effect_fabric/root_supervisor_linux_pre_action_plan.rs"
          python3 - "$file" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]); text=p.read_text()
          old='        let mut ordered = [None; ENTRIES];\n'
          new='        let mut ordered: [Option<LinuxPreActionTrustBinding>; ENTRIES] = [None; ENTRIES];\n'
          if text.count(old) != 1:
              raise SystemExit('exact type-repair anchor missing or ambiguous')
          p.write_text(text.replace(old,new))
          PY
          cargo +1.98.1 fmt --all
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "$file"
          cargo +1.98.1 fmt --all -- --check
          cargo +1.98.1 check --locked --all-targets --features "root-ffi linux-peer-credentials" >/dev/null
          cargo +1.98.1 test --locked --lib --features "root-ffi linux-peer-credentials" root_supervisor_linux_pre_action_plan -- --test-threads=1 >/dev/null
          echo "OPAQUE_OWNER_PROJECTION_TYPE_REPAIR=PASS"

      - name: Commit and push under exact remote-head lease
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          matched_ref="$(cat "$RUNNER_TEMP/matched-ref")"; expected_head="$(cat "$RUNNER_TEMP/private-head")"; auth="$(cat "$RUNNER_TEMP/auth")"
          current="$(git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote origin "$matched_ref" | awk '{print $1}')"
          test "$current" = "$expected_head"
          git config user.name "LAS Verification Committer"; git config user.email "las-verification@users.noreply.github.com"
          git add src/effect_fabric/root_supervisor_linux_pre_action_plan.rs
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -q -m "Repair retired pre-action projection type inference"
          new_head="$(git rev-parse HEAD)"; echo "::add-mask::$new_head"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" push -q origin "HEAD:$matched_ref"
          echo "OPAQUE_OWNER_PROJECTION_TYPE_REPAIR_PUSH=PASS"

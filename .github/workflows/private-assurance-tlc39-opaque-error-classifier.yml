name: Private assurance TLC39 opaque error classifier

on:
  push:
    branches: [main]
    paths:
      - "RUN_ASSURANCE_TLC39_OPAQUE_ERROR_CLASSIFIER"

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject obsolete 203-profile TLC39 classifier
        shell: bash
        run: |
          set -euo pipefail
          echo "LAS_ASSURANCE_TLC39_OPAQUE_CLASSIFIER=RETIRED"
          echo "Canonical TLC39 evidence now comes only from the frozen repaired-202 v3 continuation and terminal-attestation path."
          exit 1

name: Private current production assembly probe

on:
  push:
    paths:
      - ".github/workflows/private-current-production-assembly-probe-20261014.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_REF_HASH: dacb3ca65e53f8133e7206c1f3f50ee1e38439e5dbcd8869616e6db414d551b3
      EXPECTED_TARGET_PROOF: bbcce4693e0f7d0e9487232592448248aa9bfbbd21b0d7406a8f210d55e2cb8d
      SOURCE_REF_HASH: b04a74ff0e7f1b30935fd6807d8b17506c697daf0b895f7f778729cdfdcf3946
    steps:
      - name: Checkout public shell
        uses: actions/checkout@v4

      - name: Recover exact private integration target and historical assembly source
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_WRITE_TOKEN: ${{ secrets.LAS_PRIVATE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY" && test -n "$PRIVATE_WRITE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"; echo "::add-mask::$PRIVATE_WRITE_TOKEN"
          root="$RUNNER_TEMP/private-probe"; mkdir "$root"; cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_WRITE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin > "$refs"
          target_ref=""; target_sha=""; source_ref=""; source_sha=""
          while read -r sha ref; do
            h="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$h" == "$TARGET_REF_HASH" ]]; then target_ref="$ref"; target_sha="$sha"; fi
            if [[ "$h" == "$SOURCE_REF_HASH" ]]; then source_ref="$ref"; source_sha="$sha"; fi
          done < "$refs"
          rm -f "$refs"
          test -n "$target_ref" && test -n "$target_sha" && test -n "$source_ref" && test -n "$source_sha"
          echo "::add-mask::$target_ref"; echo "::add-mask::$target_sha"
          echo "::add-mask::$source_ref"; echo "::add-mask::$source_sha"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$target_ref"
          git checkout -q -B target FETCH_HEAD
          actual="$(git rev-parse HEAD)"; test "$actual" = "$target_sha"
          test "$(printf '%s' "$actual" | sha256sum | awk '{print $1}')" = "$EXPECTED_TARGET_PROOF"
          test -s tools/apply_current_production_assembly_rebase_20261014.py
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$source_ref"
          printf '%s' "$source_sha" > "$RUNNER_TEMP/source-sha"
          printf '%s' "$target_ref" > "$RUNNER_TEMP/target-ref"
          printf '%s' "$target_sha" > "$RUNNER_TEMP/target-start-sha"
          printf '%s' "$auth" > "$RUNNER_TEMP/private-auth"
          chmod 600 "$RUNNER_TEMP/source-sha" "$RUNNER_TEMP/target-ref" "$RUNNER_TEMP/target-start-sha" "$RUNNER_TEMP/private-auth"
          echo "LAS_PRODUCTION_REBASE_RECOVERY=PASS"

      - name: Overlay assembly source and apply private current-native rebase
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-probe"
          source_sha="$(cat "$RUNNER_TEMP/source-sha")"
          echo "::add-mask::$source_sha"
          files=(
            src/effect_fabric/root_supervisor_linux_production_bootstrap.rs
            src/effect_fabric/root_supervisor_linux_socket_activation.rs
            src/effect_fabric/root_supervisor_linux_production_resources.rs
            src/effect_fabric/root_supervisor_linux_production_process.rs
            src/effect_fabric/root_supervisor_linux_production_launch.rs
            src/effect_fabric/root_supervisor_linux_production_startup.rs
          )
          for file in "${files[@]}"; do
            git show "${source_sha}:${file}" > "$file"
          done
          python3 tools/apply_current_production_assembly_rebase_20261014.py
          git show "${source_sha}:src/effect_fabric/root_ffi.rs" > src/effect_fabric/root_ffi.rs
          rm tools/apply_current_production_assembly_rebase_20261014.py
          git diff --check
          echo "LAS_PRODUCTION_REBASE_PATCH=PASS"

      - name: Strict compile and focused verification
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-probe"
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null

          ALR_ZIP="$RUNNER_TEMP/alr.zip"
          ALR_PREFIX="$RUNNER_TEMP/alr"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "$ALR_ZIP" \
            "https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip" >/dev/null 2>&1
          echo "09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  $ALR_ZIP" | sha256sum --check --strict >/dev/null
          mkdir -p "$ALR_PREFIX"
          unzip -q "$ALR_ZIP" -d "$ALR_PREFIX"
          export PATH="$ALR_PREFIX/bin:$PATH"
          alr -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1 >/dev/null
          ALR_WS="$RUNNER_TEMP/alire-production-assembly"
          mkdir -p "$ALR_WS"
          (cd "$ALR_WS" && alr -n init --in-place --no-skel --lib las_production_assembly >/dev/null)
          GPRBUILD_WRAPPER="$RUNNER_TEMP/gprbuild-wrapper"
          cat > "$GPRBUILD_WRAPPER" <<EOF_GPR
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$ALR_WS"
          exec alr exec -- gprbuild "\$@"
          EOF_GPR
          chmod 0755 "$GPRBUILD_WRAPPER"

          cargo +1.98.1 fmt --all
          cargo +1.98.1 fmt --all -- --check
          RUSTFLAGS='-D warnings' GPRBUILD="$GPRBUILD_WRAPPER" cargo +1.98.1 check --all-targets --features 'linux-peer-credentials root-ffi'
          GPRBUILD="$GPRBUILD_WRAPPER" cargo +1.98.1 clippy --all-targets --features 'linux-peer-credentials root-ffi' -- -D warnings
          GPRBUILD="$GPRBUILD_WRAPPER" cargo +1.98.1 test --features 'linux-peer-credentials root-ffi' root_supervisor_linux_production_process:: -- --nocapture
          GPRBUILD="$GPRBUILD_WRAPPER" cargo +1.98.1 test --features 'linux-peer-credentials root-ffi' root_supervisor_linux_control_resumability_tests:: -- --nocapture
          test ! -e tools/apply_current_production_assembly_rebase_20261014.py
          git diff --check
          echo "LAS_PRODUCTION_REBASE_VERIFY=PASS"

      - name: Commit verified private integration branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-probe"
          target_ref="$(cat "$RUNNER_TEMP/target-ref")"
          start_sha="$(cat "$RUNNER_TEMP/target-start-sha")"
          auth="$(cat "$RUNNER_TEMP/private-auth")"
          remote_sha="$(git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote origin "$target_ref" | awk '{print $1}')"
          echo "::add-mask::$remote_sha"
          test "$remote_sha" = "$start_sha"
          git config user.name "LAS Verification Integrator"
          git config user.email "las-verification@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -q -m "Rebase Linux production assembly onto readiness runtime"
          new_sha="$(git rev-parse HEAD)"
          echo "::add-mask::$new_sha"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" push -q origin HEAD:"$target_ref"
          echo "LAS_PRODUCTION_REBASE_RESULT=PASS"
          echo "LAS_PRODUCTION_REBASE_COMMIT_PROOF=$(printf '%s' "$new_sha" | sha256sum | awk '{print $1}')"

name: Private segmented canonical verification (retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject obsolete segmented canonical verification
        shell: bash
        run: |
          set -euo pipefail
          echo "LAS_SEGMENTED_CANONICAL=RETIRED"
          echo "This workflow is bound to a historical 129-profile candidate. Current assurance closure is bound to the repaired 202-profile candidate and frozen continuation runners."
          exit 1

name: Public runner - pinned private Cognitive R1.3 research (quarantine)

on:
  push:
    branches:
      - quarantine/exact-private-root-reality-20261102
    paths:
      - .github/workflows/las-exact-private-cognitive-r13-20261102.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: las-exact-pr56-cognitive-scope-20261102
  cancel-in-progress: false

jobs:
  native-cognitive-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Only SHA-256 of the private ref and commit are public. No private source or SHA committed here.
      PRIVATE_REF_PROOF: d9367da77edb63e92ecb460d301db26af4c585f1926146fd7f7c829771bb5650
      EXPECTED_PRIVATE_COMMIT_PROOF: c58410a39d110c0b02f886039ac420ccbf4da5c744191aa78bcf1f9cbcd94c6f
    steps:
      - name: Resolve and fetch exactly one pinned private read-only source revision
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY" && test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          mkdir -m 0700 private-target
          cd private-target
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          ref_file="$RUNNER_TEMP/las-private-refs"
          fetch_log="$RUNNER_TEMP/las-private-fetch.log"
          # Neither ls-remote output nor fetch errors are printed publicly.
          git -c "http.extraHeader=AUTHORIZATION: basic $auth" \
            ls-remote --heads origin > "$ref_file" 2> "$fetch_log" || {
              echo 'LAS_PUBLIC_PRIVATE_REF_RESOLUTION=FAIL'; exit 1;
            }
          matched_ref=''
          match_count=0
          while read -r oid ref; do
            digest="$(printf '%s' "$ref" | sha256sum | cut -d' ' -f1)"
            if [[ "$digest" == "$PRIVATE_REF_PROOF" ]]; then
              matched_ref="$ref"
              match_count=$((match_count + 1))
            fi
          done < "$ref_file"
          test "$match_count" -eq 1 || { echo 'LAS_PUBLIC_REF_PROOF=FAIL'; exit 1; }
          expected_oid="$(awk -v ref="$matched_ref" '$2==ref {print $1}' "$ref_file")"
          expected_proof="$(printf '%s' "$expected_oid" | sha256sum | cut -d' ' -f1)"
          test "$expected_proof" = "$EXPECTED_PRIVATE_COMMIT_PROOF" || {
            echo 'LAS_PUBLIC_PRIVATE_HEAD_MOVED=BLOCKED'; exit 1;
          }
          echo "::add-mask::$expected_oid"
          git -c "http.extraHeader=AUTHORIZATION: basic $auth" \
            fetch -q --depth=1 origin "$matched_ref" > "$fetch_log" 2>&1 || {
              echo 'LAS_PUBLIC_PRIVATE_FETCH=FAIL'; exit 1;
            }
          git checkout -q --detach FETCH_HEAD > "$fetch_log" 2>&1 || {
            echo 'LAS_PUBLIC_PRIVATE_DETACH=FAIL'; exit 1;
          }
          actual="$(git rev-parse HEAD)"
          echo "::add-mask::$actual"
          actual_proof="$(printf '%s' "$actual" | sha256sum | cut -d' ' -f1)"
          test "$actual_proof" = "$EXPECTED_PRIVATE_COMMIT_PROOF" || {
            echo 'LAS_PUBLIC_PRIVATE_REVISION_MISMATCH=FAIL'; exit 1;
          }
          test -z "$(git status --porcelain --untracked-files=no)"
          rm -f "$ref_file" "$fetch_log"
          unset PRIVATE_TOKEN auth expected_oid actual matched_ref
          echo 'LAS_PUBLIC_PRIVATE_EXACT_SOURCE=PASS'
          echo "LAS_PUBLIC_PRIVATE_COMMIT_PROOF=$actual_proof"

      - name: Execute exact-source Cognitive R1.3 finite-grammar tests and mutations
        shell: bash
        run: |
          set -euo pipefail
          cd private-target
          log="$RUNNER_TEMP/las-private-cognitive-r13-replay.log"
          set +e
          python3 -I -B research/origin/cognitive_seed_relational_induction_r13/replay_verify.py \
            --expected-manifest-sha256 2db3a4b04aeb261c05bf5a3864ffd27460e0e51e746620b0ca1f2e8fc2ace619 >"$log" 2>&1
          rc=$?
          set -e
          echo "LAS_PUBLIC_COGNITIVE_R13_RC=$rc"
          echo "LAS_PUBLIC_COGNITIVE_R13_LOG_SHA256=$(sha256sum "$log" | cut -d' ' -f1)"
          if [[ "$rc" -ne 0 ]]; then
            echo 'LAS_PUBLIC_SCOPED_COGNITIVE_R13=FAIL'; exit 1
          fi
          for marker in SOURCE_SHA256_PINS=PASS UNITTEST_NORMAL_21=PASS UNITTEST_OPT_21=PASS MUTATIONS_11=PASS BENCHMARK_SYNTHETIC_10=PASS SCOPED_RESEARCH_REPLAY=PASS; do
            if ! grep -Fxq "$marker" "$log"; then
              echo 'LAS_PUBLIC_SCOPED_COGNITIVE_R13=INCOMPLETE'; exit 1
            fi
          done
          test -z "$(git status --porcelain --untracked-files=no)" || {
            echo 'LAS_PUBLIC_PRIVATE_TRACKED_TREE=FAIL'; exit 1;
          }
          echo 'LAS_PUBLIC_SCOPED_COGNITIVE_R13=PASS'

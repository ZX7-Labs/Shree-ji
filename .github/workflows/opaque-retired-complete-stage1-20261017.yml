name: Opaque retired complete transcript stage1 20261017

on:
  push:
    branches:
      - "verify/reconciled-baseline-repair-v3-bd95-20261017"
    paths:
      - ".github/workflows/opaque-retired-complete-stage1-20261017.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opaque-retired-complete-stage1-20261017
  cancel-in-progress: false

env:
  BASE_REF_HASH: 060aa23045ded14f2e9984282456adce3cd5fa94bd92f21f4eeacae5d41abff2
  BASE_SNAPSHOT_PROOF: bd4d73399dc34da2586900c270f6b33f2a1049e934472301f5546ad9973cc49e
  BASE_TREE_PROOF: 93bcdc3d05cc578589d0600beb22d21dda366b5cd9fd81cc31f4f487d9e35981
  EXPECTED_GREEN_BASELINE_TREE: ffc6621866ec4353d070d74746e0a2de8a9a9d20
  BASELINE_M1_BLOB: 1b848f7a6c9c7374597d2b4109a03c4195c22a6d
  BASELINE_M2_BLOB: 05c34343c5433ee384b91da449082fa31c82f9f3
  BASELINE_M3_BLOB: 465f297bc69c0279306c04f52e2bf928933ace82
  EFFECT_REF_HASH: 57902b32c7dba883a89cd5a6e47dea395ab8a06b111c3dcdcd0487d67f010f58
  EFFECT_SNAPSHOT_PROOF: 46064521fab1ccf4dcb889a1de2a7d3ed6096962f088b6a1da3287eccc266f2c
  EFFECT_TREE_PROOF: 0ca92537f4d34d73c177988a9e27dca9f58c2cb25c60d9199ab8d12ec710a66d
  EFFECT_OWNER_BLOB: bb4f6e5c803b7c64ea27e605659cf998fc942cc2
  EFFECT_SEMANTIC_BLOB: 6fb90f15a1194d596f420ebee9f0ed3e4ae2b112
  EFFECT_RECOVERY_BLOB: 67746f8a4776b872b3878f6861eb3bb7658a9fbd
  EFFECT_BORROW_BLOB: 13820e643e7d76cd087293429f6856183f4d9b07
  EFFECT_STAGE3_BLOB: 8881d312f2f679f1c53f60402d05ea83e7e89a15
  EFFECT_STAGE4_BLOB: 17634f0c98823a54d83235ae35cd5abf08d1476d
  COMPLETE_MATERIALIZER_BLOB: a35184cb70d931c34194e96192b208b8484b7ec9
  COMPLETE_HARNESS_BLOB: 9762c5a8f788302eb0ed9199941dae4b31904e5f

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Recover exact private source and verifier objects
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY" && test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          root="$RUNNER_TEMP/private"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          base_ref=""
          base_sha=""
          effect_ref=""
          effect_sha=""
          while read -r sha ref; do
            ref_hash="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$ref_hash" = "$BASE_REF_HASH" ]]; then
              test -z "$base_ref"
              base_ref="$ref"
              base_sha="$sha"
            fi
            if [[ "$ref_hash" = "$EFFECT_REF_HASH" ]]; then
              test -z "$effect_ref"
              effect_ref="$ref"
              effect_sha="$sha"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$base_ref" && test -n "$effect_ref" && test -n "$base_sha" && test -n "$effect_sha"
          echo "::add-mask::$base_ref"
          echo "::add-mask::$effect_ref"
          echo "::add-mask::$base_sha"
          echo "::add-mask::$effect_sha"
          test "$(printf '%s' "$base_sha" | sha256sum | awk '{print $1}')" = "$BASE_SNAPSHOT_PROOF"
          test "$(printf '%s' "$effect_sha" | sha256sum | awk '{print $1}')" = "$EFFECT_SNAPSHOT_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=128 origin "$base_ref" "$effect_ref"
          git checkout -q -B verify-baseline-target "$base_sha"
          base_tree="$(git rev-parse 'HEAD^{tree}')"
          effect_tree="$(git rev-parse "$effect_sha^{tree}")"
          echo "::add-mask::$base_tree"
          echo "::add-mask::$effect_tree"
          test "$(printf '%s' "$base_tree" | sha256sum | awk '{print $1}')" = "$BASE_TREE_PROOF"
          test "$(printf '%s' "$effect_tree" | sha256sum | awk '{print $1}')" = "$EFFECT_TREE_PROOF"
          for pair in \
            "tools/verification/private_reconciled_baseline_repair.py:$BASELINE_M1_BLOB" \
            "tools/verification/private_reconciled_baseline_visibility_repair.py:$BASELINE_M2_BLOB" \
            "tools/verification/private_reconciled_baseline_clippy_contract_repair.py:$BASELINE_M3_BLOB"; do
            path="${pair%%:*}"
            expected="${pair##*:}"
            test "$(git hash-object "$path")" = "$expected"
          done
          for pair in \
            "$EFFECT_OWNER_BLOB:effect-owner.py" \
            "$EFFECT_SEMANTIC_BLOB:effect-semantic.py" \
            "$EFFECT_RECOVERY_BLOB:effect-recovery.py" \
            "$EFFECT_BORROW_BLOB:effect-borrow.py" \
            "$EFFECT_STAGE3_BLOB:effect-stage3.sh" \
            "$EFFECT_STAGE4_BLOB:effect-stage4.sh" \
            "$COMPLETE_MATERIALIZER_BLOB:complete-materializer.py" \
            "$COMPLETE_HARNESS_BLOB:complete-stage1.sh"; do
            blob="${pair%%:*}"
            name="${pair##*:}"
            git cat-file blob "$blob" >"$RUNNER_TEMP/$name"
            test "$(git hash-object "$RUNNER_TEMP/$name")" = "$blob"
          done
          chmod 0700 "$RUNNER_TEMP/effect-stage3.sh" "$RUNNER_TEMP/effect-stage4.sh" "$RUNNER_TEMP/complete-stage1.sh"
          test -z "$(git status --porcelain --untracked-files=all)"
          printf 'WORK_ROOT=%s\nBASE_SHA=%s\n' "$root" "$base_sha" >>"$GITHUB_ENV"
          echo "LAS_RETIRED_COMPLETE_RECOVERY=PASS"

      - name: Install exact build toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null
          archive="$RUNNER_TEMP/alr.zip"
          prefix="$RUNNER_TEMP/alr"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --silent --show-error --output "$archive" "https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip"
          echo "09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  $archive" | sha256sum --check --strict >/dev/null
          mkdir -p "$prefix"
          unzip -q "$archive" -d "$prefix"
          export PATH="$prefix/bin:$PATH"
          echo "$prefix/bin" >>"$GITHUB_PATH"
          alr -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1 >/dev/null
          workspace="$RUNNER_TEMP/alr-work"
          mkdir -p "$workspace"
          cd "$workspace"
          alr -n init --in-place --no-skel --lib retired_complete_stage1 >/dev/null
          alr_path="$(command -v alr)"
          wrapper="$RUNNER_TEMP/gprbuild-via-alire"
          printf '%s\n' '#!/usr/bin/env bash' 'set -euo pipefail' "cd \"$workspace\"" "exec \"$alr_path\" exec -- gprbuild \"\$@\"" >"$wrapper"
          chmod 0755 "$wrapper"
          printf 'GPRBUILD=%s\n' "$wrapper" >>"$GITHUB_ENV"
          echo "LAS_RETIRED_COMPLETE_TOOLCHAINS=PASS"

      - name: Reverify baseline and effect then verify complete transcript
        shell: bash
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          cd "$WORK_ROOT"
          python3 tools/verification/private_reconciled_baseline_repair.py
          python3 tools/verification/private_reconciled_baseline_visibility_repair.py
          python3 tools/verification/private_reconciled_baseline_clippy_contract_repair.py
          cargo +1.98.1 fmt --all
          git add src
          baseline_tree="$(git write-tree)"
          test "$baseline_tree" = "$EXPECTED_GREEN_BASELINE_TREE"
          git config user.name "LAS Ephemeral Verification Canonicalizer"
          git config user.email "las-ephemeral-verifier@users.noreply.github.com"
          git commit -q -m "Ephemeral exact verified green baseline"
          green_commit="$(git rev-parse HEAD)"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_GREEN_BASELINE_TREE"

          work="$RUNNER_TEMP/complete-work"
          git worktree add -q -b verify-effect-target "$work" "$green_commit"
          cd "$work"
          test -z "$(git status --porcelain --untracked-files=all)"
          mkdir -p tools/verification
          install -m 0644 "$RUNNER_TEMP/effect-owner.py" tools/verification/private_retired_effect_owner_adapter_materialize.py
          install -m 0644 "$RUNNER_TEMP/effect-semantic.py" tools/verification/private_retired_effect_schema_semantic_repair.py
          install -m 0644 "$RUNNER_TEMP/effect-recovery.py" tools/verification/private_retired_effect_recovery_congruence_hardening.py
          install -m 0644 "$RUNNER_TEMP/effect-borrow.py" tools/verification/private_retired_effect_archive_borrow_repair.py
          install -m 0644 "$RUNNER_TEMP/effect-stage3.sh" tools/verification/private_retired_effect_candidate_stage3.sh
          install -m 0644 "$RUNNER_TEMP/complete-materializer.py" tools/verification/private_retired_archive_complete_transcript_materialize.py
          install -m 0644 "$RUNNER_TEMP/complete-stage1.sh" tools/verification/private_retired_archive_complete_candidate_stage1.sh
          git add tools/verification/private_retired_effect_owner_adapter_materialize.py \
            tools/verification/private_retired_effect_schema_semantic_repair.py \
            tools/verification/private_retired_effect_recovery_congruence_hardening.py \
            tools/verification/private_retired_effect_archive_borrow_repair.py \
            tools/verification/private_retired_effect_candidate_stage3.sh \
            tools/verification/private_retired_archive_complete_transcript_materialize.py \
            tools/verification/private_retired_archive_complete_candidate_stage1.sh
          git commit -q -m "Ephemeral effect and complete-transcript verifier overlay"

          effect_base="$(git rev-parse HEAD)"
          effect_package="$RUNNER_TEMP/effect-package"
          mkdir -p "$effect_package"
          set +e
          LAS_EFFECT_BASE_SHA="$effect_base" LAS_EFFECT_PACKAGE_DIR="$effect_package" LAS_EFFECT_EXPECTED_BRANCH=verify-effect-target bash "$RUNNER_TEMP/effect-stage4.sh" >"$RUNNER_TEMP/effect.log" 2>&1
          effect_rc=$?
          set -e
          if [[ "$effect_rc" -ne 0 ]]; then
            rm -rf "$effect_package" "$RUNNER_TEMP/effect.log"
            echo "LAS_RETIRED_COMPLETE_EFFECT_DEPENDENCY=FAIL"
            exit "$effect_rc"
          fi
          effect_tree="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["candidate_tree"])' "$effect_package/manifest.json")"
          test "$effect_tree" = "$(git rev-parse 'HEAD^{tree}')"
          echo "LAS_RETIRED_COMPLETE_EFFECT_DEPENDENCY=PASS"

          complete_base="$(git rev-parse HEAD)"
          complete_package="$RUNNER_TEMP/complete-package"
          mkdir -p "$complete_package"
          set +e
          LAS_COMPLETE_BASE_SHA="$complete_base" LAS_COMPLETE_PACKAGE_DIR="$complete_package" LAS_COMPLETE_EXPECTED_BRANCH=verify-effect-target bash "$RUNNER_TEMP/complete-stage1.sh" >"$RUNNER_TEMP/complete.log" 2>&1
          complete_rc=$?
          set -e
          if [[ "$complete_rc" -ne 0 ]]; then
            rm -rf "$complete_package" "$RUNNER_TEMP/complete.log" "$effect_package" "$RUNNER_TEMP/effect.log"
            echo "LAS_RETIRED_COMPLETE_RESULT=FAIL"
            exit "$complete_rc"
          fi
          complete_tree="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["candidate_tree"])' "$complete_package/manifest.json")"
          test "$complete_tree" = "$(git rev-parse 'HEAD^{tree}')"
          echo "LAS_VERIFIED_RETIRED_COMPLETE_CANDIDATE_TREE=$complete_tree"
          echo "LAS_RETIRED_COMPLETE_RESULT=PASS"
          rm -rf "$complete_package" "$RUNNER_TEMP/complete.log" "$effect_package" "$RUNNER_TEMP/effect.log"
name: Current exact canonical 203 acceptance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-current-exact-canonical-202-minus39.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject obsolete 203-profile acceptance path
        shell: bash
        run: |
          set -euo pipefail
          echo "LAS_CURRENT_203_ACCEPTANCE=RETIRED"
          echo "Canonical closure is bound to the repaired 202-profile source run, frozen current-202 V4 replacements, dedicated TLC39 continuation, terminal attestations, and exact 202-profile compute closure."
          exit 1

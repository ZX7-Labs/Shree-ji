name: Opaque retired effect stage2 fresh worktree 20261017

on:
  push:
    branches:
      - "verify/reconciled-baseline-repair-v3-bd95-20261017"
    paths:
      - ".github/workflows/opaque-effect-stage2-fresh-worktree-20261017.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opaque-effect-stage2-fresh-worktree-20261017
  cancel-in-progress: false

env:
  BASE_REF_HASH: 060aa23045ded14f2e9984282456adce3cd5fa94bd92f21f4eeacae5d41abff2
  BASE_SNAPSHOT_PROOF: bd4d73399dc34da2586900c270f6b33f2a1049e934472301f5546ad9973cc49e
  BASE_TREE_PROOF: 93bcdc3d05cc578589d0600beb22d21dda366b5cd9fd81cc31f4f487d9e35981
  EXPECTED_GREEN_BASELINE_TREE: ffc6621866ec4353d070d74746e0a2de8a9a9d20
  BASELINE_M1_BLOB: 1b848f7a6c9c7374597d2b4109a03c4195c22a6d
  BASELINE_M2_BLOB: 05c34343c5433ee384b91da449082fa31c82f9f3
  BASELINE_M3_BLOB: 465f297bc69c0279306c04f52e2bf928933ace82
  EFFECT_REF_HASH: 57902b32c7dba883a89cd5a6e47dea395ab8a06b111c3dcdcd0487d67f010f58
  EFFECT_SNAPSHOT_PROOF: f5ab152fc0cbe347294afc3c6280fe79bda36f51780661b641147167d14294e4
  EFFECT_TREE_PROOF: 9394ccc9b9aa1a54530f6574a492fdcc08d97cbaca3a408687cd3170a8b2a472
  EFFECT_OWNER_BLOB: bb4f6e5c803b7c64ea27e605659cf998fc942cc2
  EFFECT_SEMANTIC_BLOB: 6fb90f15a1194d596f420ebee9f0ed3e4ae2b112
  EFFECT_RECOVERY_BLOB: 67746f8a4776b872b3878f6861eb3bb7658a9fbd
  EFFECT_HARNESS_BLOB: a15e23ec5c7775905b161676bd2cae4b38a51426

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Recover exact private source and verifier objects
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY" && test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          root="$RUNNER_TEMP/private"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          base_ref=""
          base_sha=""
          effect_ref=""
          effect_sha=""
          while read -r sha ref; do
            ref_hash="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$ref_hash" = "$BASE_REF_HASH" ]]; then
              test -z "$base_ref"
              base_ref="$ref"
              base_sha="$sha"
            fi
            if [[ "$ref_hash" = "$EFFECT_REF_HASH" ]]; then
              test -z "$effect_ref"
              effect_ref="$ref"
              effect_sha="$sha"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$base_ref" && test -n "$effect_ref" && test -n "$base_sha" && test -n "$effect_sha"
          echo "::add-mask::$base_ref"
          echo "::add-mask::$effect_ref"
          echo "::add-mask::$base_sha"
          echo "::add-mask::$effect_sha"
          test "$(printf '%s' "$base_sha" | sha256sum | awk '{print $1}')" = "$BASE_SNAPSHOT_PROOF"
          test "$(printf '%s' "$effect_sha" | sha256sum | awk '{print $1}')" = "$EFFECT_SNAPSHOT_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=96 origin "$base_ref" "$effect_ref"
          git checkout -q -B verify-baseline-target "$base_sha"
          base_tree="$(git rev-parse 'HEAD^{tree}')"
          effect_tree="$(git rev-parse "$effect_sha^{tree}")"
          echo "::add-mask::$base_tree"
          echo "::add-mask::$effect_tree"
          test "$(printf '%s' "$base_tree" | sha256sum | awk '{print $1}')" = "$BASE_TREE_PROOF"
          test "$(printf '%s' "$effect_tree" | sha256sum | awk '{print $1}')" = "$EFFECT_TREE_PROOF"
          for pair in \
            "tools/verification/private_reconciled_baseline_repair.py:$BASELINE_M1_BLOB" \
            "tools/verification/private_reconciled_baseline_visibility_repair.py:$BASELINE_M2_BLOB" \
            "tools/verification/private_reconciled_baseline_clippy_contract_repair.py:$BASELINE_M3_BLOB"; do
            path="${pair%%:*}"
            expected="${pair##*:}"
            test "$(git hash-object "$path")" = "$expected"
          done
          git cat-file blob "$EFFECT_OWNER_BLOB" >"$RUNNER_TEMP/effect-owner.py"
          git cat-file blob "$EFFECT_SEMANTIC_BLOB" >"$RUNNER_TEMP/effect-semantic.py"
          git cat-file blob "$EFFECT_RECOVERY_BLOB" >"$RUNNER_TEMP/effect-recovery.py"
          git cat-file blob "$EFFECT_HARNESS_BLOB" >"$RUNNER_TEMP/effect-stage2.sh"
          test "$(git hash-object "$RUNNER_TEMP/effect-owner.py")" = "$EFFECT_OWNER_BLOB"
          test "$(git hash-object "$RUNNER_TEMP/effect-semantic.py")" = "$EFFECT_SEMANTIC_BLOB"
          test "$(git hash-object "$RUNNER_TEMP/effect-recovery.py")" = "$EFFECT_RECOVERY_BLOB"
          test "$(git hash-object "$RUNNER_TEMP/effect-stage2.sh")" = "$EFFECT_HARNESS_BLOB"
          chmod 0700 "$RUNNER_TEMP/effect-stage2.sh"
          test -z "$(git status --porcelain --untracked-files=all)"
          printf 'WORK_ROOT=%s\nBASE_SHA=%s\n' "$root" "$base_sha" >>"$GITHUB_ENV"
          echo "LAS_EFFECT_FRESH_RECOVERY=PASS"

      - name: Install exact build toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null
          archive="$RUNNER_TEMP/alr.zip"
          prefix="$RUNNER_TEMP/alr"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --silent --show-error --output "$archive" "https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip"
          echo "09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  $archive" | sha256sum --check --strict >/dev/null
          mkdir -p "$prefix"
          unzip -q "$archive" -d "$prefix"
          export PATH="$prefix/bin:$PATH"
          echo "$prefix/bin" >>"$GITHUB_PATH"
          alr -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1 >/dev/null
          workspace="$RUNNER_TEMP/alr-work"
          mkdir -p "$workspace"
          cd "$workspace"
          alr -n init --in-place --no-skel --lib retired_effect_stage2_fresh >/dev/null
          alr_path="$(command -v alr)"
          wrapper="$RUNNER_TEMP/gprbuild-via-alire"
          printf '%s\n' '#!/usr/bin/env bash' 'set -euo pipefail' "cd \"$workspace\"" "exec \"$alr_path\" exec -- gprbuild \"\$@\"" >"$wrapper"
          chmod 0755 "$wrapper"
          printf 'GPRBUILD=%s\n' "$wrapper" >>"$GITHUB_ENV"
          echo "LAS_EFFECT_FRESH_TOOLCHAINS=PASS"

      - name: Reconstruct verified baseline and verify effect in fresh worktree
        shell: bash
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          cd "$WORK_ROOT"
          python3 tools/verification/private_reconciled_baseline_repair.py
          python3 tools/verification/private_reconciled_baseline_visibility_repair.py
          python3 tools/verification/private_reconciled_baseline_clippy_contract_repair.py
          cargo +1.98.1 fmt --all
          git add src
          candidate_tree="$(git write-tree)"
          test "$candidate_tree" = "$EXPECTED_GREEN_BASELINE_TREE"
          git config user.name "LAS Ephemeral Verification Canonicalizer"
          git config user.email "las-ephemeral-verifier@users.noreply.github.com"
          git commit -q -m "Ephemeral exact verified green baseline"
          green_commit="$(git rev-parse HEAD)"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_GREEN_BASELINE_TREE"

          effect_root="$RUNNER_TEMP/effect-work"
          git worktree add -q -b verify-effect-target "$effect_root" "$green_commit"
          cd "$effect_root"
          test -z "$(git status --porcelain --untracked-files=all)"
          mkdir -p tools/verification
          install -m 0644 "$RUNNER_TEMP/effect-owner.py" tools/verification/private_retired_effect_owner_adapter_materialize.py
          install -m 0644 "$RUNNER_TEMP/effect-semantic.py" tools/verification/private_retired_effect_schema_semantic_repair.py
          install -m 0644 "$RUNNER_TEMP/effect-recovery.py" tools/verification/private_retired_effect_recovery_congruence_hardening.py
          git add tools/verification/private_retired_effect_owner_adapter_materialize.py tools/verification/private_retired_effect_schema_semantic_repair.py tools/verification/private_retired_effect_recovery_congruence_hardening.py
          git commit -q -m "Ephemeral retired effect verifier overlay"
          effect_base="$(git rev-parse HEAD)"
          effect_package="$RUNNER_TEMP/effect-package"
          mkdir -p "$effect_package"
          set +e
          LAS_EFFECT_BASE_SHA="$effect_base" LAS_EFFECT_PACKAGE_DIR="$effect_package" LAS_EFFECT_EXPECTED_BRANCH=verify-effect-target bash "$RUNNER_TEMP/effect-stage2.sh" >"$RUNNER_TEMP/effect.log" 2>&1
          rc=$?
          set -e
          if [[ "$rc" -eq 0 ]]; then
            candidate_tree="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["candidate_tree"])' "$effect_package/manifest.json")"
            test "$candidate_tree" = "$(git rev-parse 'HEAD^{tree}')"
            echo "LAS_VERIFIED_EFFECT_FRESH_CANDIDATE_TREE=$candidate_tree"
            echo "LAS_EFFECT_FRESH_RESULT=PASS"
          else
            echo "LAS_EFFECT_FRESH_RESULT=FAIL"
          fi
          exit "$rc"

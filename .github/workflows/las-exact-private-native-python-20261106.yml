name: Public exact private native Python verification (quarantine)

on:
  push:
    branches:
      - quarantine/exact-private-verification-20261106
    paths:
      - .github/workflows/las-exact-private-native-python-20261106.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: las-exact-native-python-20261106
  cancel-in-progress: false

jobs:
  private-source-native-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PRIVATE_REF_PROOF: 03a0d3846bf8e541feed0b7f454b946f67e896fd283b1da3a31367b6ff4f8209
      EXPECTED_PRIVATE_COMMIT_PROOF: 51212300ae5b175e1f9307118891c738f481c79f4ce22a06216190b6d217a126
      EXPECTED_NATIVE_VERIFIER_BLOB_PROOF: d4df90336770cf5275996ccf750325a091b071a86a708799281845dc0eb5c74f
    steps:
      - name: Resolve and fetch exactly one pinned private read-only source revision
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY" && test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          mkdir -m 0700 private-target
          cd private-target
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          ref_file="$RUNNER_TEMP/las-private-refs"
          fetch_log="$RUNNER_TEMP/las-private-fetch.log"
          # Neither ls-remote output nor fetch errors are printed publicly.
          git -c "http.extraHeader=AUTHORIZATION: basic $auth" \
            ls-remote --heads origin > "$ref_file" 2> "$fetch_log" || {
              echo 'LAS_PUBLIC_PRIVATE_REF_RESOLUTION=FAIL'; exit 1;
            }
          matched_ref=''
          match_count=0
          while read -r oid ref; do
            digest="$(printf '%s' "$ref" | sha256sum | cut -d' ' -f1)"
            if [[ "$digest" == "$PRIVATE_REF_PROOF" ]]; then
              matched_ref="$ref"
              match_count=$((match_count + 1))
            fi
          done < "$ref_file"
          test "$match_count" -eq 1 || { echo 'LAS_PUBLIC_REF_PROOF=FAIL'; exit 1; }
          expected_oid="$(awk -v ref="$matched_ref" '$2==ref {print $1}' "$ref_file")"
          expected_proof="$(printf '%s' "$expected_oid" | sha256sum | cut -d' ' -f1)"
          test "$expected_proof" = "$EXPECTED_PRIVATE_COMMIT_PROOF" || {
            echo 'LAS_PUBLIC_PRIVATE_HEAD_MOVED=BLOCKED'; exit 1;
          }
          echo "::add-mask::$expected_oid"
          git -c "http.extraHeader=AUTHORIZATION: basic $auth" \
            fetch -q --depth=1 origin "$matched_ref" > "$fetch_log" 2>&1 || {
              echo 'LAS_PUBLIC_PRIVATE_FETCH=FAIL'; exit 1;
            }
          git checkout -q --detach FETCH_HEAD > "$fetch_log" 2>&1 || {
            echo 'LAS_PUBLIC_PRIVATE_DETACH=FAIL'; exit 1;
          }
          actual="$(git rev-parse HEAD)"
          echo "::add-mask::$actual"
          actual_proof="$(printf '%s' "$actual" | sha256sum | cut -d' ' -f1)"
          test "$actual_proof" = "$EXPECTED_PRIVATE_COMMIT_PROOF" || {
            echo 'LAS_PUBLIC_PRIVATE_REVISION_MISMATCH=FAIL'; exit 1;
          }
          test -z "$(git status --porcelain --untracked-files=no)"
          rm -f "$ref_file" "$fetch_log"
          unset PRIVATE_TOKEN auth expected_oid actual matched_ref
          echo 'LAS_PUBLIC_PRIVATE_EXACT_SOURCE=PASS'
          echo "LAS_PUBLIC_PRIVATE_COMMIT_PROOF=$actual_proof"

      - name: Execute exact-source 12 native Python stages with adversarial count controls
        shell: bash
        run: |
          set -euo pipefail
          cd private-target
          script='tools/verification/run_bridge_native_suite.sh'
          test -f "$script" && test ! -L "$script"
          actual="$(git -c core.fsmonitor=false rev-parse --verify HEAD)"
          echo "::add-mask::$actual"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          test "$proof" = "$EXPECTED_PRIVATE_COMMIT_PROOF"
          test -z "$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all)"
          blob="$(git -c core.fsmonitor=false hash-object "$script")"
          echo "::add-mask::$blob"
          blob_proof="$(printf '%s' "$blob" | sha256sum | awk '{print $1}')"
          test "$blob_proof" = "$EXPECTED_NATIVE_VERIFIER_BLOB_PROOF"
          # The source-owned script verifies the exact native test counts,
          # process exit status, unique test identities, and source custody.
          # All diagnostics remain in runner.temp and are never uploaded.
          private_log="$RUNNER_TEMP/las-native-verification.private"
          if ! bash --noprofile --norc "$script" "$PWD" >"$private_log" 2>&1; then
            echo 'LAS_PUBLIC_NATIVE_PYTHON=FAIL:EXECUTION'
            exit 1
          fi
          grep -Fxq 'LAS_NATIVE_SCOPED=PASS' "$private_log"
          grep -Fxq 'LAS_NATIVE_STAGES=12' "$private_log"
          grep -Fxq 'LAS_NATIVE_CASES=336' "$private_log"
          grep -Fxq "LAS_PRIVATE_PROOF=$EXPECTED_PRIVATE_COMMIT_PROOF" "$private_log"
          test -z "$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all)"
          echo 'LAS_PUBLIC_NATIVE_PYTHON=SCOPED_PASS_NOT_FULL_CANONICAL'
          echo "LAS_PUBLIC_NATIVE_PYTHON_LOG_SHA256=$(sha256sum "$private_log" | cut -d' ' -f1)"

      - name: Scrub private source and local output before job completion
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$GITHUB_WORKSPACE/private-target"
          rm -f -- "$RUNNER_TEMP/las-native-verification.private" "$RUNNER_TEMP/las-private-refs" "$RUNNER_TEMP/las-private-fetch.log"
          echo 'LAS_PUBLIC_NATIVE_PYTHON=EPHEMERAL_CLEANUP'

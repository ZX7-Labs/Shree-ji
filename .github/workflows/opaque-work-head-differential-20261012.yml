name: Opaque work-head differential verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/opaque-work-head-differential-20261012.yml"

permissions:
  contents: read

concurrency:
  group: opaque-work-head-differential-20261012
  cancel-in-progress: false

env:
  TARGET_REF_HASH: 28a52175bfc55f4f8b2b0f4312cd2616a65a7082555149f4382746e2254e1b26
  EXPECTED_CURRENT_SNAPSHOT_PROOF: eb11cdcf9b76848f37dd8e2a9355f7761aafeaea4a01f270d1f2c38a15cf6b5b
  EXPECTED_CURRENT_TREE_PROOF: de1f37ca988fe82c2016c5f3359846cba9e6735ae407b1a1134cfc04a694d2a8
  EXPECTED_PARENT_SNAPSHOT_PROOF: e57d34b4c1c961d0a348d8acc64be50c63176a504998f521d80822e3ed0a5359

jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Install pinned Rust and Ada toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null
          test "$(rustc +1.98.1 --version | awk '{print $2}')" = "1.98.1"
          test "$(cargo +1.98.1 --version | awk '{print $2}')" = "1.98.1"

          archive="$RUNNER_TEMP/alr.zip"
          prefix="$RUNNER_TEMP/alr"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --output "$archive" \
            "https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip" \
            >/dev/null 2>&1
          echo "09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  $archive" \
            | sha256sum --check --strict >/dev/null
          mkdir -p "$prefix"
          unzip -q "$archive" -d "$prefix"
          export PATH="$prefix/bin:$PATH"
          alr -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1 >/dev/null

          ws="$RUNNER_TEMP/alire-workspace"
          mkdir -p "$ws"
          (cd "$ws" && alr -n init --in-place --no-skel --lib las_diff_toolchain >/dev/null)
          wrapper="$RUNNER_TEMP/gprbuild-wrapper"
          cat >"$wrapper" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$ws"
          exec "$prefix/bin/alr" exec -- gprbuild "\$@"
          EOF
          chmod +x "$wrapper"
          echo "GPRBUILD=$wrapper" >> "$GITHUB_ENV"
          echo "OPAQUE_DIFF_TOOLCHAIN=PASS"

      - name: Recover exact current and immediate parent opaquely
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"

          root="$GITHUB_WORKSPACE/target"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"

          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          while read -r candidate_sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          echo "::add-mask::$matched_ref"

          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=2 origin "$matched_ref"
          current="$(git rev-parse FETCH_HEAD)"
          echo "::add-mask::$current"
          test "$(printf '%s' "$current" | sha256sum | awk '{print $1}')" = "$EXPECTED_CURRENT_SNAPSHOT_PROOF"

          current_tree="$(git rev-parse 'FETCH_HEAD^{tree}')"
          echo "::add-mask::$current_tree"
          test "$(printf '%s' "$current_tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_CURRENT_TREE_PROOF"

          parent="$(git rev-parse 'FETCH_HEAD^')"
          echo "::add-mask::$parent"
          test "$(printf '%s' "$parent" | sha256sum | awk '{print $1}')" = "$EXPECTED_PARENT_SNAPSHOT_PROOF"
          test "$(git rev-list --count "$parent..$current")" = "1"

          git checkout -q --detach "$current"
          test -z "$(git status --porcelain)"
          unset PRIVATE_TOKEN auth matched_ref candidate_sha ref current_tree
          echo "OPAQUE_DIFF_RECOVERY=PASS"

          printf '%s' "$current" >"$RUNNER_TEMP/current-revision"
          printf '%s' "$parent" >"$RUNNER_TEMP/parent-revision"

      - name: Run exact current-vs-parent production differential
        shell: bash
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          current="$(cat "$RUNNER_TEMP/current-revision")"
          parent="$(cat "$RUNNER_TEMP/parent-revision")"
          echo "::add-mask::$current"
          echo "::add-mask::$parent"

          run_gate() {
            label="$1"
            gate="$2"
            shift 2
            log="$RUNNER_TEMP/${label}-${gate}.private.log"
            set +e
            CARGO_TARGET_DIR="$RUNNER_TEMP/cargo-${label}" "$@" >"$log" 2>&1
            rc=$?
            set -e
            printf 'OPAQUE_DIFF_%s_%s_LOG_SHA256=%s\n' "$label" "$gate" "$(sha256sum "$log" | awk '{print $1}')"
            printf 'OPAQUE_DIFF_%s_%s_RC=%s\n' "$label" "$gate" "$rc"
            rm -f "$log"
            printf '%s' "$rc"
          }

          run_candidate() {
            label="$1"
            revision="$2"
            git checkout -q --detach "$revision"
            test -z "$(git status --porcelain --untracked-files=no)"

            fmt_rc="$(run_gate "$label" FORMAT cargo +1.98.1 fmt --all -- --check)"
            check_rc="$(run_gate "$label" CHECK env GPRBUILD="$GPRBUILD" cargo +1.98.1 check --locked --all-targets --features root-ffi,linux-peer-credentials)"
            clippy_rc="$(run_gate "$label" CLIPPY env GPRBUILD="$GPRBUILD" cargo +1.98.1 clippy --locked --all-targets --features root-ffi,linux-peer-credentials -- -D warnings)"
            test_rc="$(run_gate "$label" TEST env GPRBUILD="$GPRBUILD" cargo +1.98.1 test --locked --lib --features root-ffi,linux-peer-credentials -- --test-threads=1)"

            test -z "$(git status --porcelain --untracked-files=no)"
            printf '%s %s %s %s\n' "$fmt_rc" "$check_rc" "$clippy_rc" "$test_rc" >"$RUNNER_TEMP/${label}-results"
          }

          run_candidate PARENT "$parent"
          run_candidate CURRENT "$current"

          read -r parent_fmt parent_check parent_clippy parent_test <"$RUNNER_TEMP/PARENT-results"
          read -r current_fmt current_check current_clippy current_test <"$RUNNER_TEMP/CURRENT-results"

          regressions=0
          for pair in \
            "$parent_fmt:$current_fmt" \
            "$parent_check:$current_check" \
            "$parent_clippy:$current_clippy" \
            "$parent_test:$current_test"; do
            before="${pair%%:*}"
            after="${pair##*:}"
            if [[ "$before" -eq 0 && "$after" -ne 0 ]]; then
              regressions=$((regressions + 1))
            fi
          done

          echo "OPAQUE_DIFF_REGRESSION_COUNT=$regressions"
          if [[ "$current_fmt" -eq 0 && "$current_check" -eq 0 && "$current_test" -eq 0 ]]; then
            echo "OPAQUE_DIFF_CURRENT_CORE=PASS"
          else
            echo "OPAQUE_DIFF_CURRENT_CORE=FAIL"
          fi
          if [[ "$current_clippy" -eq 0 ]]; then
            echo "OPAQUE_DIFF_CURRENT_CLIPPY=PASS"
          else
            echo "OPAQUE_DIFF_CURRENT_CLIPPY=FAIL"
          fi
          test "$regressions" -eq 0
          test "$current_fmt" -eq 0
          test "$current_check" -eq 0
          test "$current_test" -eq 0
          echo "OPAQUE_DIFF_RESULT=PASS"

name: Private resumable TLC slice

on:
  workflow_call:
    inputs:
      index:
        required: true
        type: number
      segment:
        required: true
        type: number
      resume_run_id:
        required: false
        type: string
        default: ""
      resume_artifact:
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject obsolete reusable TLC slice
        shell: bash
        run: |
          set -euo pipefail
          echo "LAS_PRIVATE_RESUMABLE_TLC_SLICE=RETIRED"
          echo "This reusable workflow is bound to a historical 129-profile candidate; current computation is isolated on frozen repaired-202 runner refs."
          exit 1

name: Exact private recovery owner propagation 20261013-18

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/exact-private-recovery-owner-propagation-20261013-18.yml"

permissions:
  contents: read

env:
  TARGET_REF_HASH: 2d8fa9528221b54908f36081fcb2a0bfba883c4b7a0972c4dd11fbaa6b24e718
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 3965dd9a61a7431143244c42725de979544e28322b0bbfe6ce81fd3822c0358e
  EXPECTED_PRIVATE_TREE_PROOF: 17c1426c91694d38c3e80af4ed22571e41cb21e97b1cd0de7182977337cfdbd1

jobs:
  verify-exact-private-revision:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null
          test "$(rustc +1.98.1 --version | awk '{print $2}')" = "1.98.1"
          test "$(cargo +1.98.1 --version | awk '{print $2}')" = "1.98.1"
          echo "LAS_RECOVERY_OWNER_TOOLCHAIN=PASS"

      - name: Recover exact private revision opaquely
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          root="$GITHUB_WORKSPACE/target"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          private_head=""
          while read -r candidate_sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
              private_head="$candidate_sha"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          test -n "$private_head"
          echo "::add-mask::$matched_ref"
          echo "::add-mask::$private_head"
          test "$(printf '%s' "$private_head" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$private_head"
          git checkout -q --detach "$private_head"
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_TREE_PROOF"
          test -z "$(git status --porcelain)"
          echo "LAS_RECOVERY_OWNER_EXACT_RECOVERY=PASS"

      - name: Verify lockfile reproducibility
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.expected"
          cargo +1.98.1 generate-lockfile >/dev/null 2>&1
          cmp --silent Cargo.lock "$RUNNER_TEMP/Cargo.lock.expected"
          git checkout -q -- Cargo.lock
          echo "LAS_RECOVERY_OWNER_LOCKFILE=PASS"

      - name: Verify formatting
        id: fmt
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          cargo +1.98.1 fmt --all -- --check >/dev/null 2>&1
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "LAS_RECOVERY_OWNER_FMT=PASS"

      - name: Prepare encrypted rustfmt repair bundle
        if: steps.fmt.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          cargo +1.98.1 fmt --all >/dev/null 2>&1
          changed="$RUNNER_TEMP/rustfmt-files.txt"
          git diff --name-only >"$changed"
          test -s "$changed"
          tar -czf "$RUNNER_TEMP/rustfmt-repair.tar.gz" -T "$changed"
          cat >"$RUNNER_TEMP/recipient.pem" <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIIEITCCAomgAwIBAgIUSDZhPk6kiL2oWpzyZ7VL47y7pgowDQYJKoZIhvcNAQEL
          BQAwIDEeMBwGA1UEAwwVTEFTIFJ1c3RmbXQgRXBoZW1lcmFsMB4XDTI2MTAxMjIx
          MjYzNVoXDTI2MTAxNDIxMjYzNVowIDEeMBwGA1UEAwwVTEFTIFJ1c3RmbXQgRXBo
          ZW1lcmFsMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAh+6AHVcymvvb
          QYUzlwzWed42wzz4LhPE8HYikWGzXD2qsTyY0liKsI1hkEID8Gi1CSDsv03gsF0T
          VTpF/E9WZe315m372JfDJ6sPfGAeyylaPxFfmBEtg2X9XPxwBVakk0Tevbqiy6rU
          8oKu6ZA68J1FerDWMtDwL6OiPoyes4R82Vcqn4izOo17cFPXzOXeNVgREDVybrze
          kDL9KMDohOv5hnTes7mILLG4YbLy2NyYvl28qI2I8VbWFPpI0U0G55eaiL9RMAim
          q1e5yc9c7EEmby0CfDIeCoya6dJm6Vgu2ydQBvDhFhtoxqvWQN6Tjk6uK1SFbD3R
          kHzIW10VvpFP7+OZ0d3EsDQ/pKCnXfXbQtnMYkqtJzd8m420Tjxko/RJtC2JBzJU
          4lqznA3YjETTqysnZuDquzAehhqGDhQI+BQXWAQ+/TwEaI0gQq5I4VMlQtwDcgqc
          uaNbGgrWTfd3Ge7axv4a1UVUv7K9hhS2bDYqtnDS0W3ffjx3isrHAgMBAAGjUzBR
          MB0GA1UdDgQWBBRCwdOMQCjx9NB2h2SgXVa+RmgxGzAfBgNVHSMEGDAWgBRCwdOM
          QCjx9NB2h2SgXVa+RmgxGzAPBgNVHRMBAf8EBTADAQH/MA0GCSqGSIb3DQEBCwUA
          A4IBgQBSUZ4VHx7M5LNtQZH+QO8zI9zM11Byv9LnZoQNRWWulJMmzd8ireyHvICQ
          6qq/oWMmqSlh0AxpyRIMhYFd5afb6boyN3+3vwsigvsf2gBZQ9RCOQKAMtmzjJpe
          L9Uy2HcD40qoZswFcqkwBS3+jRCiIxy0wKeHvA4Y8pxthXsE917HhxratYm42kYd
          Ig+FDz57YYnCQOu+iw1kDrNLboh6/YhwgVlsjhNSW0VoKYOlWyLVY4Tnt/tqBnsY
          XlCebiqBSTL/TXuITPS5wijjgEsoTO/L4fd8XiBsHnVEjgvszICv4LCYC3recPXO
          rQGso7JUbfYdgzTkVRwc4QjwsB+ahyfyoV/1HwTayw+deKWpz3tpt5/79mRZJ5Vk
          FB3nRzD1ntumpV4SqSQrxuYIdf5tA4luglLzk76DChh2AjOLaQyH5D4N8l95H7/C
          u+iEMNDiwLflfrJ1dhugeaqU10n4D5ZKQOxnDl6s2JjiWbf4I8pQqLR5GTh2kue9
          Q5WIrX4=
          -----END CERTIFICATE-----
          CERT
          openssl cms -encrypt -binary -aes-256-cbc \
            -in "$RUNNER_TEMP/rustfmt-repair.tar.gz" \
            -outform DER \
            -out "$RUNNER_TEMP/rustfmt-repair.cms" \
            "$RUNNER_TEMP/recipient.pem" >/dev/null 2>&1
          rm -f "$RUNNER_TEMP/rustfmt-repair.tar.gz" "$RUNNER_TEMP/recipient.pem"
          git reset --hard -q HEAD
          echo "LAS_RECOVERY_OWNER_FMT_REPAIR_ENCRYPTED=PASS"

      - name: Upload encrypted rustfmt repair bundle
        if: steps.fmt.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-repair-encrypted
          path: ${{ runner.temp }}/rustfmt-repair.cms
          if-no-files-found: error
          retention-days: 1

      - name: Compile default and Linux boundaries with warnings denied
        shell: bash
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          cargo +1.98.1 check --locked --all-targets >/dev/null 2>&1
          cargo +1.98.1 check --locked --features linux-peer-credentials --all-targets >/dev/null 2>&1
          echo "LAS_RECOVERY_OWNER_CHECK=PASS"

      - name: Clippy default and Linux boundaries
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          cargo +1.98.1 clippy --locked --all-targets -- -D warnings >/dev/null 2>&1
          cargo +1.98.1 clippy --locked --features linux-peer-credentials --all-targets -- -D warnings >/dev/null 2>&1
          echo "LAS_RECOVERY_OWNER_CLIPPY=PASS"

      - name: Run exact owner-retention discriminators
        shell: bash
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          cargo +1.98.1 test --locked --features linux-peer-credentials --lib \
            effect_fabric::root_supervisor_graceful_handoff_tests::graceful_rotation_retains_applied_root_continuation_without_root_reentry \
            -- --exact --test-threads=1 >/dev/null 2>&1
          cargo +1.98.1 test --locked --features linux-peer-credentials --lib \
            effect_fabric::root_supervisor_graceful_handoff_tests::graceful_activation_uncertainty_retains_nonresumable_owners_without_root_reentry \
            -- --exact --test-threads=1 >/dev/null 2>&1
          cargo +1.98.1 test --locked --features linux-peer-credentials --lib \
            effect_fabric::root_supervisor_epoch_coordinator_tests::applied_root_control_recovery_failure_retains_exact_continuation_without_reentry \
            -- --exact --test-threads=1 >/dev/null 2>&1
          echo "LAS_RECOVERY_OWNER_DISCRIMINATORS=PASS"

      - name: Run deterministic and adversarial regression suites
        shell: bash
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          cargo +1.98.1 test --locked --all-targets -- --test-threads=1 >/dev/null 2>&1
          cargo +1.98.1 test --locked --all-targets --features linux-peer-credentials -- --test-threads=1 >/dev/null 2>&1
          echo "LAS_RECOVERY_OWNER_TESTS=PASS"

      - name: Re-run Linux supervisor library tests under optimized codegen
        shell: bash
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          cargo +1.98.1 test --locked --release --features linux-peer-credentials --lib \
            effect_fabric::root_supervisor_ \
            -- --test-threads=1 >/dev/null 2>&1
          test -z "$(git status --porcelain --untracked-files=no)"
          test "$(printf '%s' "$(git rev-parse HEAD)" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          test "$(printf '%s' "$(git rev-parse 'HEAD^{tree}')" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_TREE_PROOF"
          echo "LAS_RECOVERY_OWNER_EXACT_GATE=PASS"

      - name: Enforce formatting debt
        if: always() && steps.fmt.outcome == 'failure'
        shell: bash
        run: |
          echo "LAS_RECOVERY_OWNER_FMT=FAIL"
          exit 1

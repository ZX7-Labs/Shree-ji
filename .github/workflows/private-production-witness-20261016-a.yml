name: Private production witness 20261016 A

on:
  push:
    branches:
      - "private-production-witness-20261016-a"
    paths:
      - "RUN_PRIVATE_PRODUCTION_WITNESS_20261016_A"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-production-witness-20261016-a
  cancel-in-progress: false

env:
  RUNNER_REF: private-production-witness-20261016-a
  TARGET_REF_HASH: a5f3dd87c6174b2ec1aafe984e6a5722b8cf90562d8ff21cb5e7b12f271466c2
  EXPECTED_HEAD_PROOF: 269a9a8c7afae986f8065e93745c9017f848292a118b2b9d006d007cbdb6b1f8
  EXPECTED_TREE_PROOF: 6998e8e80e6c8fb86fbac5e4c512af441f827b4536aa5448dfed6aa14568468e

jobs:
  verify-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Bind immutable public runner revision
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$RUNNER_REF"
          ref_json="$RUNNER_TEMP/runner-ref.json"
          curl --proto '=https' --tlsv1.2 --fail-with-body -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/$RUNNER_REF" >"$ref_json"
          runner_sha="$(python3 - "$ref_json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              print(json.load(handle)["object"]["sha"])
          PY
          )"
          rm -f "$ref_json"
          test "$runner_sha" = "$GITHUB_SHA"
          echo "LAS_PRODUCTION_WITNESS_RUNNER_BINDING=PASS"

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null
          cargo +1.98.1 --version
          rustc +1.98.1 --version

      - name: Install checksum-pinned Ada toolchain
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/alr.zip"
          prefix="$RUNNER_TEMP/alr"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip"
          echo "09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  $archive" \
            | sha256sum --check --strict
          mkdir -p "$prefix"
          unzip -q "$archive" -d "$prefix"
          echo "$prefix/bin" >>"$GITHUB_PATH"

          alr -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1 >/dev/null
          alr_bin="$(command -v alr)"
          test -x "$alr_bin"
          workspace="$RUNNER_TEMP/production-witness-toolchain"
          mkdir -p "$workspace"
          cd "$workspace"
          alr -n init --in-place --no-skel --lib production_witness_toolchain >/dev/null
          alr exec -- gnatmake --version
          alr exec -- gprbuild --version

          wrapper="$RUNNER_TEMP/gprbuild-via-alire"
          cat >"$wrapper" <<EOF_GPR
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$workspace"
          exec "$alr_bin" exec -- gprbuild "\$@"
          EOF_GPR
          chmod 0755 "$wrapper"
          "$wrapper" --version >/dev/null
          printf 'GPRBUILD=%s\n' "$wrapper" >>"$GITHUB_ENV"
          echo "LAS_PRODUCTION_WITNESS_TOOLCHAIN=PASS"

      - name: Recover exact private candidate
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_READ_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_READ_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_READ_TOKEN"

          root="$GITHUB_WORKSPACE/private"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_READ_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"

          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          actual=""
          while read -r candidate_sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
              actual="$candidate_sha"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          test -n "$actual"
          echo "::add-mask::$matched_ref"
          echo "::add-mask::$actual"
          test "$(printf '%s' "$actual" | sha256sum | awk '{print $1}')" = "$EXPECTED_HEAD_PROOF"

          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$actual"
          git checkout -q --detach "$actual"
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_TREE_PROOF"
          test -z "$(git status --porcelain)"
          echo "LAS_PRODUCTION_WITNESS_PRIVATE_IDENTITY=PASS"
          unset PRIVATE_READ_TOKEN auth matched_ref actual tree

      - name: Run exact privacy-preserving production gates
        shell: bash
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_READ_TOKEN"
          echo "::add-mask::$PRIVATE_READ_TOKEN"
          cd "$GITHUB_WORKSPACE/private"

          diagnostic="$RUNNER_TEMP/private-production-failure.log"
          encrypted="$RUNNER_TEMP/private-production-failure.log.enc"
          mac_file="$RUNNER_TEMP/private-production-failure.log.enc.hmac"
          rm -f "$diagnostic" "$encrypted" "$mac_file"

          seal_failure() {
            local stage="$1"
            local log="$2"
            local context secret mac_key
            context="$(printf '%s\0%s\0%s\0%s' "$GITHUB_SHA" "$EXPECTED_HEAD_PROOF" "$EXPECTED_TREE_PROOF" "$stage" | sha256sum | awk '{print $1}')"
            secret="$(printf '%s\0%s\0enc' "$PRIVATE_READ_TOKEN" "$context" | sha256sum | awk '{print $1}')"
            mac_key="$(printf '%s\0%s\0mac' "$PRIVATE_READ_TOKEN" "$context" | sha256sum | awk '{print $1}')"
            cp "$log" "$diagnostic"
            LAS_DIAG_SECRET="$secret" openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -salt \
              -pass env:LAS_DIAG_SECRET -in "$diagnostic" -out "$encrypted"
            openssl dgst -sha256 -mac HMAC -macopt "hexkey:$mac_key" "$encrypted" | awk '{print $NF}' >"$mac_file"
            rm -f "$diagnostic"
            echo "LAS_PRODUCTION_WITNESS_DIAGNOSTIC=SEALED"
            echo "LAS_PRODUCTION_WITNESS_DIAGNOSTIC_SHA256=$(sha256sum "$encrypted" | awk '{print $1}')"
          }

          run_gate() {
            local stage="$1"
            shift
            local log="$RUNNER_TEMP/${stage}.private.log"
            set +e
            "$@" >"$log" 2>&1
            local rc=$?
            set -e
            if [[ $rc -ne 0 ]]; then
              echo "LAS_PRODUCTION_WITNESS_STAGE=$stage"
              echo "LAS_PRODUCTION_WITNESS_RC=$rc"
              echo "LAS_PRODUCTION_WITNESS_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
              seal_failure "$stage" "$log"
              rm -f "$log"
              exit "$rc"
            fi
            rm -f "$log"
            echo "LAS_PRODUCTION_WITNESS_${stage}=PASS"
          }

          run_gate diff_check git diff --check
          run_gate trust_contract python3 tools/verification/root_trust_input_contract.py
          run_gate fmt_check cargo +1.98.1 fmt --all -- --check
          run_gate base_check env RUSTFLAGS=-Dwarnings cargo +1.98.1 check --locked --all-targets
          run_gate production_lib_check env RUSTFLAGS=-Dwarnings cargo +1.98.1 check --locked --lib --features "root-ffi linux-peer-credentials"
          run_gate production_all_targets_check env RUSTFLAGS=-Dwarnings cargo +1.98.1 check --locked --all-targets --features "root-ffi linux-peer-credentials"
          run_gate production_clippy cargo +1.98.1 clippy --locked --all-targets --features "root-ffi linux-peer-credentials" -- -D warnings
          run_gate production_lib_tests env RUSTFLAGS=-Dwarnings cargo +1.98.1 test --locked --lib --features "root-ffi linux-peer-credentials" -- --test-threads=1
          run_gate production_integration_tests env RUSTFLAGS=-Dwarnings cargo +1.98.1 test --locked --features "root-ffi linux-peer-credentials" --tests -- --test-threads=1
          run_gate production_release_check env RUSTFLAGS=-Dwarnings cargo +1.98.1 check --release --locked --all-targets --features "root-ffi linux-peer-credentials"
          run_gate production_release_lib_tests env RUSTFLAGS=-Dwarnings cargo +1.98.1 test --release --locked --lib --features "root-ffi linux-peer-credentials" -- --test-threads=1
          run_gate production_release_integration_tests env RUSTFLAGS=-Dwarnings cargo +1.98.1 test --release --locked --features "root-ffi linux-peer-credentials" --tests -- --test-threads=1

          test -z "$(git status --porcelain --untracked-files=no)"
          echo "LAS_PRODUCTION_WITNESS_RESULT=PASS"

      - name: Upload encrypted private failure diagnostic
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-production-witness-diagnostic-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/private-production-failure.log.enc
            ${{ runner.temp }}/private-production-failure.log.enc.hmac
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0

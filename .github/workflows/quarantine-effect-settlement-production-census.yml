name: QUARANTINE expected RED — production settlement driver reachability

on:
  push:
    branches:
      - quarantine/tlc-expected-negative-audit-repair-20261031
    paths:
      - .github/workflows/quarantine-effect-settlement-production-census.yml
      - tools/verification/guarded_effect_settlement_reachability.py

permissions:
  contents: read

jobs:
  source-scoped-reachability:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TARGET_BRANCH_PROOF: bfef81c13787a130d485ec445be47cddd779df8fff141805a4c663fdd6034b8c
      EXPECTED_PRIVATE_COMMIT_PROOF: d2b0cfcc6e4a583a694fcbfec561b1980de853a14d2a250e5fcee96b48941b22
      EXPECTED_PRIVATE_TEST_RUNNER_SHA256: 529de5130fd7f8cb9331fb535e8c762ec75afae6143fbe879c3917bd926495df
    steps:
      - name: Checkout exact public census and pinned controller without retained credentials
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Run source-independent fail-closed census unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B tools/verification/guarded_effect_settlement_reachability.py --self-test
      - name: Recover one privately pinned source revision
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_READ_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$PRIVATE_REPOSITORY" || -z "$PRIVATE_READ_TOKEN" ]]; then
            echo 'LAS_BRIDGE=FAIL:ACCESS'; exit 1
          fi
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_READ_TOKEN"
          private="$RUNNER_TEMP/private-source"
          mkdir -m 700 "$private"
          cd "$private"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          authorization="$(printf 'x-access-token:%s' "$PRIVATE_READ_TOKEN" | base64 -w0)"
          echo "::add-mask::$authorization"
          all_refs="$RUNNER_TEMP/private-heads"
          git -c core.fsmonitor=false -c http.extraHeader="AUTHORIZATION: basic $authorization" \
            ls-remote --heads origin > "$all_refs" 2> "$RUNNER_TEMP/secret-fetch-error"
          match=''
          while read -r _sha candidate; do
            candidate_proof="$(printf '%s' "$candidate" | sha256sum | awk '{print $1}')"
            if [[ "$candidate_proof" == "$TARGET_BRANCH_PROOF" ]]; then
              [[ -z "$match" ]] || { echo 'LAS_BRIDGE=FAIL:AMBIGUOUS_REF'; exit 1; }
              match="$candidate"
            fi
          done < "$all_refs"
          rm -f "$all_refs" "$RUNNER_TEMP/secret-fetch-error"
          [[ -n "$match" ]] || { echo 'LAS_BRIDGE=FAIL:TARGET'; exit 1; }
          echo "::add-mask::$match"
          git -c core.fsmonitor=false -c http.extraHeader="AUTHORIZATION: basic $authorization" \
            fetch -q --depth=1 origin "$match" > /dev/null 2> "$RUNNER_TEMP/secret-fetch-error"
          rm -f "$RUNNER_TEMP/secret-fetch-error"
          unset authorization PRIVATE_READ_TOKEN PRIVATE_REPOSITORY
          git -c core.fsmonitor=false checkout -q --detach FETCH_HEAD
          actual="$(git -c core.fsmonitor=false rev-parse --verify HEAD)"
          echo "::add-mask::$actual"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          if [[ "$proof" != "$EXPECTED_PRIVATE_COMMIT_PROOF" ]]; then
            echo 'LAS_BRIDGE=FAIL:SOURCE_PROOF'; exit 1
          fi
          if [[ -n "$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all)" ]]; then
            echo 'LAS_BRIDGE=FAIL:DIRTY'; exit 1
          fi
          test_runner='tools/verification/run_bridge_native_suite.sh'
          if ! printf '%s  %s\n' "$EXPECTED_PRIVATE_TEST_RUNNER_SHA256" "$test_runner" |
               sha256sum --check --strict >/dev/null 2>&1; then
            echo 'LAS_BRIDGE=FAIL:RUNNER_SOURCE'; exit 1
          fi
          echo "LAS_PRIVATE_SOURCE_PROOF=$proof"
          echo 'LAS_BRIDGE=EXACT_SOURCE_READY'

      - name: Identify actual non-forwarding production settlement driver
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/private-source"
          [[ -d "$root/.git" ]] || { echo 'LAS_SETTLEMENT_REACHABILITY=FAIL:SOURCE_MISSING'; exit 1; }
          cd "$root"
          [[ -z "$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all)" ]] || {
            echo 'LAS_SETTLEMENT_REACHABILITY=FAIL:SOURCE_DIRTY'; exit 1
          }
          private="$(mktemp -d "$RUNNER_TEMP/settlement-result.XXXXXXXX")"
          chmod 700 "$private"
          trap 'rm -rf -- "$private"' EXIT
          set +e
          python3 -I -B "$GITHUB_WORKSPACE/tools/verification/guarded_effect_settlement_reachability.py" \
            --source-root "$root" >"$private/census" 2>&1
          rc=$?
          set -e
          if (( rc == 17 )) && grep -Fxq 'LAS_SETTLEMENT_REACHABILITY=FAIL:NO_NONFORWARDING_PRODUCTION_DRIVER' "$private/census"; then
            echo 'LAS_SETTLEMENT_REACHABILITY=BLOCKED:NO_NONFORWARDING_PRODUCTION_DRIVER'
            exit 17
          elif (( rc == 18 )) && grep -Fxq 'LAS_SETTLEMENT_REACHABILITY=BLOCKED:NO_EXTERNAL_PRODUCTION_HOST_CALL' "$private/census"; then
            echo 'LAS_SETTLEMENT_REACHABILITY=BLOCKED:NO_EXTERNAL_PRODUCTION_HOST_CALL'
            exit 18
          elif (( rc == 0 )); then
            grep -Fxq 'LAS_SETTLEMENT_REACHABILITY=CANDIDATE_FOUND_INDEPENDENT_REVIEW_REQUIRED' "$private/census" || {
              echo 'LAS_SETTLEMENT_REACHABILITY=FAIL:UNEXPECTED_RECEIPT'; exit 1
            }
            echo 'LAS_SETTLEMENT_REACHABILITY=SCOPED_CALLSITE_CANDIDATE_ONLY_NOT_DEPLOYMENT_PASS'
          else
            echo 'LAS_SETTLEMENT_REACHABILITY=FAIL:CENSUS_SOURCE_OR_PARSER'
            exit 1
          fi

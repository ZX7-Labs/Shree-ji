name: Private indexed tail preflight (retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject obsolete indexed tail preflight
        shell: bash
        run: |
          set -euo pipefail
          echo "LAS_INDEXED_TAIL_PREFLIGHT=RETIRED"
          echo "This workflow is bound to a historical 129-profile candidate. Current assurance closure is bound to the repaired 202-profile candidate and frozen continuation runners."
          exit 1

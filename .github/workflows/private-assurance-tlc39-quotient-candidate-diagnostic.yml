name: Private assurance TLC39 quotient candidate diagnostic

on:
  push:
    branches: [main]
    paths:
      - "RUN_ASSURANCE_TLC39_QUOTIENT_CANDIDATE_DIAGNOSTIC"

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject obsolete 203-profile TLC39 candidate diagnostic
        shell: bash
        run: |
          set -euo pipefail
          echo "LAS_ASSURANCE_TLC39_QUOTIENT_CANDIDATE_DIAGNOSTIC=RETIRED"
          echo "This historical 203-profile candidate diagnostic is superseded by the repaired 202-profile TLC39 proof path."
          exit 1

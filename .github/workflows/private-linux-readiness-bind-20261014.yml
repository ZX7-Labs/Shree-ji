name: Private Linux readiness binding

on:
  push:
    paths:
      - ".github/workflows/private-linux-readiness-bind-20261014.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bind:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_REF_HASH: 28a52175bfc55f4f8b2b0f4312cd2616a65a7082555149f4382746e2254e1b26
      EXPECTED_TARGET_PROOF: 79f8e3d85f61bbd840ee15943434fcc3639368e2f243e0be536fb95ca2a45d6b
    steps:
      - name: Checkout public control shell
        uses: actions/checkout@v4

      - name: Recover exact private target
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_WRITE_TOKEN: ${{ secrets.LAS_PRIVATE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_WRITE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_WRITE_TOKEN"
          root="$RUNNER_TEMP/private-target"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_WRITE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin > "$refs"
          matched_ref=""; matched_sha=""
          while read -r sha ref; do
            h="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$h" == "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"; matched_sha="$sha"
            fi
          done < "$refs"
          rm -f "$refs"
          test -n "$matched_ref" && test -n "$matched_sha"
          echo "::add-mask::$matched_ref"; echo "::add-mask::$matched_sha"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          git checkout -q -B target FETCH_HEAD
          actual="$(git rev-parse HEAD)"; test "$actual" = "$matched_sha"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          test "$proof" = "$EXPECTED_TARGET_PROOF"
          test -s src/effect_fabric/linux_io_readiness.rs
          printf '%s' "$matched_ref" > "$RUNNER_TEMP/target-ref"
          printf '%s' "$actual" > "$RUNNER_TEMP/target-start-sha"
          printf '%s' "$auth" > "$RUNNER_TEMP/private-auth"
          chmod 600 "$RUNNER_TEMP/target-ref" "$RUNNER_TEMP/target-start-sha" "$RUNNER_TEMP/private-auth"
          echo "LAS_LINUX_READINESS_RECOVERY=PASS"

      - name: Bind control readiness evidence
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: anchor count={count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/lib.rs",
              '''    #[cfg(all(feature = "linux-peer-credentials", target_os = "linux"))]
              #[allow(unsafe_code)]
              pub(crate) mod linux_peer_credential_sensor;
          '''.replace('              ', '    '),
              '''    #[cfg(all(feature = "linux-peer-credentials", target_os = "linux"))]
              #[allow(unsafe_code)]
              pub(crate) mod linux_peer_credential_sensor;

              // Readiness is scheduling evidence only. This narrow poll(2) adapter owns no
              // descriptor and cannot widen Root or effect authority.
              #[cfg(all(feature = "linux-peer-credentials", target_os = "linux"))]
              #[allow(unsafe_code)]
              mod linux_io_readiness;
          '''.replace('              ', '    '),
          )

          replace_once(
              "src/effect_fabric/root_supervisor_linux_control_channel.rs",
              "use std::io::{self, Read, Write};\nuse std::os::unix::net::UnixStream;",
              "use std::io::{self, Read, Write};\nuse std::os::fd::{AsRawFd, RawFd};\nuse std::os::unix::net::UnixStream;",
          )
          replace_once(
              "src/effect_fabric/root_supervisor_linux_control_channel.rs",
              '''    pub(crate) const fn pending_reply(&self) -> Option<ControlRequestId> {
                  self.pending_reply
              }
          '''.replace('              ', ''),
              '''    pub(crate) const fn pending_reply(&self) -> Option<ControlRequestId> {
                  self.pending_reply
              }

              /// Non-owning descriptor identity for a synchronous readiness wait. The
              /// channel retains descriptor ownership for the entire session lifetime.
              pub(crate) fn readiness_fd(&self) -> RawFd {
                  self.stream.as_raw_fd()
              }

              /// Absolute deadline already owned by the active resumable transport phase.
              /// `None` means no partial request/reply currently has a running deadline.
              pub(crate) const fn resumable_deadline(&self) -> Option<Instant> {
                  if self.pending_reply_frame.is_some() || self.reply_deadline.is_some() {
                      self.reply_deadline
                  } else {
                      self.receive_deadline
                  }
              }
          '''.replace('              ', ''),
          )

          replace_once(
              "src/effect_fabric/root_supervisor_linux_control_session.rs",
              "use std::os::unix::net::UnixStream;",
              "use std::os::fd::RawFd;\nuse std::os::unix::net::UnixStream;\nuse std::time::Instant;",
          )
          replace_once(
              "src/effect_fabric/root_supervisor_linux_control_session.rs",
              '''    pub(super) const fn is_closed(&self) -> bool {
                  self.closed || self.channel.is_poisoned()
              }
          '''.replace('              ', ''),
              '''    pub(super) const fn is_closed(&self) -> bool {
                  self.closed || self.channel.is_poisoned()
              }

              pub(super) fn readiness_fd(&self) -> RawFd {
                  self.channel.readiness_fd()
              }

              pub(super) const fn io_deadline(&self) -> Option<Instant> {
                  self.channel.resumable_deadline()
              }
          '''.replace('              ', ''),
          )
          PY
          git diff --check
          echo "LAS_LINUX_READINESS_BINDING=PASS"

      - name: Verify control readiness boundary
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null
          cargo +1.98.1 fmt --all
          cargo +1.98.1 fmt --all -- --check
          RUSTFLAGS='-D warnings' cargo +1.98.1 check --all-targets --features linux-peer-credentials
          cargo +1.98.1 clippy --all-targets --features linux-peer-credentials -- -D warnings
          cargo +1.98.1 test --features linux-peer-credentials linux_io_readiness::tests:: -- --nocapture
          cargo +1.98.1 test --features linux-peer-credentials control_scheduler_tests:: -- --nocapture
          cargo +1.98.1 test --features linux-peer-credentials root_supervisor_linux_control_resumability_tests:: -- --nocapture
          git diff --check
          echo "LAS_LINUX_READINESS_VERIFY=PASS"

      - name: Commit exact private ref
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          target_ref="$(cat "$RUNNER_TEMP/target-ref")"
          start_sha="$(cat "$RUNNER_TEMP/target-start-sha")"
          auth="$(cat "$RUNNER_TEMP/private-auth")"
          remote_sha="$(git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote origin "$target_ref" | awk '{print $1}')"
          echo "::add-mask::$remote_sha"
          test "$remote_sha" = "$start_sha"
          git config user.name "LAS Verification Integrator"
          git config user.email "las-verification@users.noreply.github.com"
          git add src/lib.rs \
                  src/effect_fabric/linux_io_readiness.rs \
                  src/effect_fabric/root_supervisor_linux_control_channel.rs \
                  src/effect_fabric/root_supervisor_linux_control_session.rs
          git diff --cached --check
          git commit -q -m "Bind control sessions to Linux readiness evidence"
          new_sha="$(git rev-parse HEAD)"
          echo "::add-mask::$new_sha"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" push -q origin HEAD:"$target_ref"
          echo "LAS_LINUX_READINESS_RESULT=PASS"
          echo "LAS_LINUX_READINESS_COMMIT_PROOF=$(printf '%s' "$new_sha" | sha256sum | awk '{print $1}')"

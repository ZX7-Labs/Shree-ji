name: Exact revision encrypted diagnostic 20261012-01

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v-20261012-01.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Recover exact private revision
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
          TARGET_REF_HASH: 12246190df640013d9ee426d2a340387c6d22d0e8241135d6a20dcf1fe5a2bc0
          EXPECTED_HEAD_PROOF: c1b3b06dc372f212fd256e328c9a0dad282c1b2a44e179879061c15a0a19c99b
          EXPECTED_TREE_PROOF: 96dd6f1b2d519fe01e22647efa8d4f32f6e53f5badb00b199e9133246e0fc501
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"; test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"; echo "::add-mask::$PRIVATE_TOKEN"
          root="$RUNNER_TEMP/target"; mkdir "$root"; cd "$root"; git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"; echo "::add-mask::$auth"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$RUNNER_TEMP/heads"
          ref=""; head=""
          while read -r sha name; do
            if [[ "$(printf '%s' "$name" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then test -z "$ref"; ref="$name"; head="$sha"; fi
          done <"$RUNNER_TEMP/heads"
          rm -f "$RUNNER_TEMP/heads"; test -n "$ref"; test -n "$head"
          echo "::add-mask::$ref"; echo "::add-mask::$head"
          test "$(printf '%s' "$head" | sha256sum | awk '{print $1}')" = "$EXPECTED_HEAD_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$ref"
          test "$(git rev-parse FETCH_HEAD)" = "$head"; git checkout -q --detach "$head"
          tree="$(git rev-parse 'HEAD^{tree}')"; echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_TREE_PROOF"
          echo "V01_RECOVERY=PASS"

      - name: Install pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt >/dev/null
          echo "V01_TOOLCHAIN=PASS"

      - name: Materialize candidate and create encrypted diagnostic
        shell: bash
        env:
          ORIGINAL_HELPER_PATH_HASH: 3bd0f3b2ae73ca0acd5d1e08b47720c6cc80569d4b87901c2e1fc0b69f7504e2
          EXPECTED_TRANSFORM_SHA256: d97bb8c1f38b8ceeb9a5814e984947822b76cb2dcf681ead65443ab02c4e8e58
          EXPECTED_PATH_HASH_1: 680761d41ae8315a6bf67b2df5250c8b4ebc93b434b7de42be032b743c37b90a
          EXPECTED_PATH_HASH_2: 736cc80e53ddc8c5287113b778e1a8fb5f3973b1b5092cdf665c982b07ce8b6d
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/target"
          python3 - "$RUNNER_TEMP/transform.py" <<'PY'
          import ast,base64,gzip,hashlib,os,pathlib,subprocess,sys
          out=pathlib.Path(sys.argv[1]); choices={5:'SECOND',11:'FIRST'}
          tracked=[p.decode() for p in subprocess.check_output(['git','ls-files','-z']).split(b'\0') if p]
          helper=[p for p in tracked if hashlib.sha256(p.encode()).hexdigest()==os.environ['ORIGINAL_HELPER_PATH_HASH']]
          if len(helper)!=1: raise SystemExit(70)
          t=ast.parse(pathlib.Path(helper[0]).read_text(encoding='utf-8')); vals={}
          for n in t.body:
              if isinstance(n,ast.Assign) and len(n.targets)==1 and isinstance(n.targets[0],ast.Name) and isinstance(n.value,ast.Constant): vals[n.targets[0].id]=n.value.value
          data=gzip.decompress(base64.b64decode(vals['PAYLOAD']))
          if hashlib.sha256(data).hexdigest()!=os.environ['EXPECTED_TRANSFORM_SHA256']: raise SystemExit(71)
          out.write_bytes(data)
          state={'count':0,'replace':0}
          def chosen(obj,old,new,which):
              a=obj.find(old); b=obj.find(old,a+len(old)); c=obj.find(old,b+len(old))
              if a<0 or b<0 or c>=0: raise SystemExit(72)
              p=a if which=='FIRST' else b
              return obj[:p]+new+obj[p+len(old):]
          def cnt(obj,*args):
              state['count']+=1; o=state['count']; actual=obj.count(*args)
              if o in choices:
                  if actual!=2: raise SystemExit(73)
                  return 1
              return actual
          def rep(obj,*args):
              state['replace']+=1; o=state['replace']
              if o in choices:
                  if len(args)<2 or obj.count(args[0])!=2: raise SystemExit(74)
                  return chosen(obj,args[0],args[1],choices[o])
              return obj.replace(*args)
          class T(ast.NodeTransformer):
              def visit_Call(self,n):
                  self.generic_visit(n)
                  if n.lineno==6 and isinstance(n.func,ast.Attribute) and n.func.attr=='count': return ast.copy_location(ast.Call(ast.Name('cnt',ast.Load()),[n.func.value,*n.args],n.keywords),n)
                  if n.lineno==9 and isinstance(n.func,ast.Attribute) and n.func.attr=='replace': return ast.copy_location(ast.Call(ast.Name('rep',ast.Load()),[n.func.value,*n.args],n.keywords),n)
                  return n
          p=T().visit(ast.parse(data.decode('utf-8'))); ast.fix_missing_locations(p)
          ns={'__name__':'__main__','cnt':cnt,'rep':rep}; rc=0
          try: exec(compile(p,'<opaque>','exec'),ns,ns)
          except SystemExit as e: rc=e.code if isinstance(e.code,int) else 1
          if rc!=0 or state!={'count':11,'replace':11}: raise SystemExit(75)
          PY
          cargo +1.98.1 fmt --all
          changed="$RUNNER_TEMP/changed"
          git diff --name-only -z >"$changed"
          python3 - "$changed" <<'PY'
          import hashlib,os,sys
          p=[x for x in open(sys.argv[1],'rb').read().split(b'\0') if x]
          h=sorted(hashlib.sha256(x).hexdigest() for x in p)
          e=sorted([os.environ['EXPECTED_PATH_HASH_1'],os.environ['EXPECTED_PATH_HASH_2']])
          if h!=e: raise SystemExit(76)
          PY
          json="$RUNNER_TEMP/check.json"; stderr="$RUNNER_TEMP/check.stderr"
          set +e
          cargo +1.98.1 check --locked --all-targets --features linux-peer-credentials --message-format=json >"$json" 2>"$stderr"
          rc=$?
          set -e
          test "$rc" -eq 101
          diag="$RUNNER_TEMP/diag.txt"
          {
            echo "=== EXACT CARGO JSON E0432 ==="
            python3 - "$json" <<'PY'
          import json,sys
          for line in open(sys.argv[1],encoding='utf-8',errors='replace'):
              try:x=json.loads(line)
              except:continue
              if x.get('reason')!='compiler-message':continue
              m=x.get('message') or {}
              if (m.get('code') or {}).get('code')=='E0432':
                  print(json.dumps(m,ensure_ascii=False,separators=(',',':')))
          PY
            echo "=== DIFF U80 ==="
            git diff --no-ext-diff -U80
            echo "=== TRANSFORM ==="
            cat "$RUNNER_TEMP/transform.py"
          } >"$diag"
          echo "V01_DIAG_SHA256=$(sha256sum "$diag" | awk '{print $1}')"
          key="$RUNNER_TEMP/aes.key"; enc="$RUNNER_TEMP/diag.enc"; keyenc="$RUNNER_TEMP/key.enc"; pub="$RUNNER_TEMP/pub.pem"
          openssl rand -hex 32 >"$key"
          cat >"$pub" <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAwh5PZjq5l55DWCS61k0e
          R/QcuMmbr2WSnpJNUBiQGHJdWN6BDohFJq/CTCWmha6I8tiRvjEoIwqlRn6Qyi1U
          JBtjuog+QrN3/8lmue+Q2m5MYxoR2cixyjyq2tZGaoAc79efWiD/NFnh0JmIPBpB
          uuW/xfRpaod1uCrY3YnG+9jgWtAkAvbBoOtFTIn19nWOWjmqKMgN1SSp1kJ1vOfY
          huA4IqquJSZTnPqAhHTMukMDFIkTFANh3OemTEe+2Vom1QzmXmRyxPKAqTts1UF2
          JEeu3rLx4MpJIHNhcunsP92hIyqzxewzyK4HJleA9q25+hPkK0H2izHZQIxsYFia
          V7XTqsXSItlzB93Mtg34YMMRKamnLDI8hC/KFR9DCVWB6NZU5Ve4avBfSH8tDmin
          UfqJGI5jR14tv7QBFcpqaFhmaOeQTp3dKNhuAAdSkQjuglUxV4LAbmekMXw871jc
          kU3JhmSJSTBk9xLTTIkPIOlsvqbI83D2mkv4Wto1pGaPAgMBAAE=
          -----END PUBLIC KEY-----
          PEM
          openssl enc -aes-256-cbc -pbkdf2 -iter 250000 -md sha256 -salt -pass file:"$key" -in "$diag" -out "$enc"
          openssl pkeyutl -encrypt -pubin -inkey "$pub" -in "$key" -out "$keyenc"
          echo "V01_KEY_B64=$(base64 -w0 "$keyenc")"
          echo "V01_DATA_B64=$(base64 -w0 "$enc")"
          rm -f "$diag" "$key" "$enc" "$keyenc" "$pub" "$json" "$stderr" "$changed" "$RUNNER_TEMP/transform.py"
          echo "V01_ENCRYPTED_DIAGNOSTIC=PASS"

name: Exact candidate verification

on:
  push:
    branches: [main]
    paths: [RUN_PRIVATE_CANDIDATE.txt]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout trusted controller
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Bind exact private candidate
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          [[ "$PRIVATE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"

          mapfile -t pins < RUN_PRIVATE_CANDIDATE.txt
          test "${#pins[@]}" -eq 2
          [[ "${pins[0]}" =~ ^TARGET_REF_HASH=([a-f0-9]{64})$ ]]
          ref_hash="${BASH_REMATCH[1]}"
          [[ "${pins[1]}" =~ ^EXPECTED_PRIVATE_SNAPSHOT_PROOF=([a-f0-9]{64})$ ]]
          revision_proof="${BASH_REMATCH[1]}"

          root="$(mktemp -d /tmp/las-candidate.XXXXXXXX)"
          chmod 0711 "$root"
          source="$root/source"
          git init --quiet "$source"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          remote="https://github.com/$PRIVATE_REPOSITORY.git"
          git -c "http.extraHeader=AUTHORIZATION: basic $auth" ls-remote --heads "$remote" > "$root/refs" 2>/dev/null
          matched=""
          while read -r sha ref; do
            proof="$(printf '%s' "$ref" | sha256sum)"
            if [[ "${proof%% *}" == "$ref_hash" ]]; then
              test -z "$matched"
              matched="$ref"
              candidate="$sha"
            fi
          done < "$root/refs"
          rm -f "$root/refs"
          test -n "$matched"
          echo "::add-mask::$matched"
          echo "::add-mask::$candidate"
          proof="$(printf '%s' "$candidate" | sha256sum)"
          test "${proof%% *}" = "$revision_proof"
          git -C "$source" -c "http.extraHeader=AUTHORIZATION: basic $auth" \
            fetch --quiet --depth=1 "$remote" "$candidate" > /dev/null 2>&1
          unset auth PRIVATE_TOKEN PRIVATE_REPOSITORY remote
          git -C "$source" switch --quiet --create "${matched#refs/heads/}" FETCH_HEAD >/dev/null 2>&1
          test "$(git -C "$source" rev-parse HEAD)" = "$candidate"
          test -z "$(git -C "$source" status --porcelain --untracked-files=all)"
          printf 'LAS_BRIDGE_SOURCE=%s\nLAS_BRIDGE_CHECKOUT_PROOF=%s\n' "$source" "$revision_proof" >> "$GITHUB_ENV"
          echo "LAS_BRIDGE_CHECKOUT=PASS"

      - name: Run exact Linux integration baseline
        shell: bash
        run: |
          set -euo pipefail
          cd "$LAS_BRIDGE_SOURCE"
          log="$(mktemp "$RUNNER_TEMP/las-linux.XXXXXXXX")"
          trap 'rm -f "$log"' EXIT
          head="$(git rev-parse HEAD)"
          branch="$(git branch --show-current)"
          if ! sudo -n bash research/guarded_evolution_lab_v1/isolated_host/verify_original_host_native_handoff.sh > "$log" 2>&1; then
            echo "LAS_BRIDGE_LINUX=FAIL"
            exit 1
          fi
          if ! python3 -I -B tools/verification/feedback_linux_nonvacuity.py \
            --expected-head "$head" --expected-branch "$branch" --log "$log" >/dev/null 2>&1; then
            echo "LAS_BRIDGE_LINUX_CENSUS=FAIL"
            exit 1
          fi
          echo "LAS_BRIDGE_LINUX=PASS"

      - name: Run source-owned native and formal verification
        shell: bash
        env:
          LEGACY_PLAN: ${{ secrets.LAS_BRIDGE_LEGACY_PLAN }}
          NATIVE_PLAN: ${{ secrets.LAS_BRIDGE_NATIVE_PLAN }}
          LAS_MUST_RUN_APPROVED_SHA256: ${{ vars.LAS_BRIDGE_LEGACY_PLAN_SHA256 }}
          LAS_NATIVE_MUST_RUN_APPROVED_SHA256: ${{ vars.LAS_BRIDGE_NATIVE_PLAN_SHA256 }}
          LAS_NATIVE_VERIFIER_APPROVED_SHA256: ${{ vars.LAS_BRIDGE_VERIFIER_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          work="$(mktemp -d "$RUNNER_TEMP/las-verification.XXXXXXXX")"
          trap 'rm -rf "$work"' EXIT
          cd "$LAS_BRIDGE_SOURCE"
          export LAS_VERIFY_EXPECTED_BRANCH="$(git branch --show-current)"
          export LAS_MUST_RUN_PLAN_FILE="$work/legacy.json"
          export LAS_NATIVE_MUST_RUN_PLAN_FILE="$work/native.json"
          export TMPDIR="$work"
          test -n "$LEGACY_PLAN"
          test -n "$NATIVE_PLAN"
          printf '%s' "$LEGACY_PLAN" > "$LAS_MUST_RUN_PLAN_FILE"
          printf '%s' "$NATIVE_PLAN" > "$LAS_NATIVE_MUST_RUN_PLAN_FILE"
          unset LEGACY_PLAN NATIVE_PLAN
          for digest in "$LAS_MUST_RUN_APPROVED_SHA256" "$LAS_NATIVE_MUST_RUN_APPROVED_SHA256" "$LAS_NATIVE_VERIFIER_APPROVED_SHA256"; do
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
          done
          if ! bash tools/verify_codespaces_all.sh > "$work/verifier.log" 2>&1; then
            echo "LAS_BRIDGE_CANONICAL=FAIL"
            exit 1
          fi
          grep -Fxq "LAS_VERIFY_ALL_RESULT=PASS" "$work/verifier.log"
          proof="$(git rev-parse HEAD | tr -d '\n' | sha256sum)"
          test "${proof%% *}" = "$LAS_BRIDGE_CHECKOUT_PROOF"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "LAS_BRIDGE_CANONICAL=PASS"

      - name: Remove private checkout
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${LAS_BRIDGE_SOURCE:-}" =~ ^/tmp/las-candidate\.[A-Za-z0-9]+/source$ ]]; then
            sudo -n rm -rf -- "${LAS_BRIDGE_SOURCE%/source}"
          fi

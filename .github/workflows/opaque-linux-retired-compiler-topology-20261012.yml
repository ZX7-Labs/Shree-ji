name: Opaque retired-owner compiler topology 20261012

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/opaque-linux-retired-compiler-topology-20261012.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify:
    strategy:
      fail-fast: false
      matrix:
        fifth: [FIRST, SECOND]
        eleventh: [FIRST, SECOND]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Recover exact live private head opaquely
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
          TARGET_REF_HASH: 12246190df640013d9ee426d2a340387c6d22d0e8241135d6a20dcf1fe5a2bc0
          EXPECTED_HEAD_PROOF: c1b3b06dc372f212fd256e328c9a0dad282c1b2a44e179879061c15a0a19c99b
          EXPECTED_TREE_PROOF: 96dd6f1b2d519fe01e22647efa8d4f32f6e53f5badb00b199e9133246e0fc501
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"; test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"; echo "::add-mask::$PRIVATE_TOKEN"
          root="$RUNNER_TEMP/private-target"; mkdir "$root"; cd "$root"; git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"; echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""; head=""
          while read -r candidate_sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"; matched_ref="$ref"; head="$candidate_sha"
            fi
          done <"$refs"
          rm -f "$refs"; test -n "$matched_ref"; test -n "$head"
          echo "::add-mask::$matched_ref"; echo "::add-mask::$head"
          test "$(printf '%s' "$head" | sha256sum | awk '{print $1}')" = "$EXPECTED_HEAD_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$head"; git checkout -q --detach "$head"
          tree="$(git rev-parse 'HEAD^{tree}')"; echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_TREE_PROOF"
          test -z "$(git status --porcelain)"
          echo "LAS_TOPO_${{ matrix.fifth }}_${{ matrix.eleventh }}_RECOVERY=PASS"

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt >/dev/null
          test "$(rustc +1.98.1 --version | awk '{print $2}')" = "1.98.1"
          echo "LAS_TOPO_${{ matrix.fifth }}_${{ matrix.eleventh }}_TOOLCHAIN=PASS"

      - name: Materialize exact ambiguity candidate opaquely
        shell: bash
        env:
          FIFTH: ${{ matrix.fifth }}
          ELEVENTH: ${{ matrix.eleventh }}
          ORIGINAL_HELPER_PATH_HASH: 3bd0f3b2ae73ca0acd5d1e08b47720c6cc80569d4b87901c2e1fc0b69f7504e2
          EXPECTED_TRANSFORM_SHA256: d97bb8c1f38b8ceeb9a5814e984947822b76cb2dcf681ead65443ab02c4e8e58
          EXPECTED_PATH_HASH_1: 680761d41ae8315a6bf67b2df5250c8b4ebc93b434b7de42be032b743c37b90a
          EXPECTED_PATH_HASH_2: 736cc80e53ddc8c5287113b778e1a8fb5f3973b1b5092cdf665c982b07ce8b6d
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          python3 - <<'PY'
          import ast, base64, gzip, hashlib, os, pathlib, subprocess
          choices={5:os.environ['FIFTH'],11:os.environ['ELEVENTH']}
          tracked=[p.decode() for p in subprocess.check_output(['git','ls-files','-z']).split(b'\0') if p]
          matches=[p for p in tracked if hashlib.sha256(p.encode()).hexdigest()==os.environ['ORIGINAL_HELPER_PATH_HASH']]
          if len(matches)!=1: raise SystemExit(70)
          tree=ast.parse(pathlib.Path(matches[0]).read_text(encoding='utf-8')); vals={}
          for n in tree.body:
              if isinstance(n,ast.Assign) and len(n.targets)==1 and isinstance(n.targets[0],ast.Name) and isinstance(n.value,ast.Constant):
                  vals[n.targets[0].id]=n.value.value
          payload=vals.get('PAYLOAD'); expected=vals.get('EXPECTED')
          if not isinstance(payload,str) or not isinstance(expected,str): raise SystemExit(71)
          data=gzip.decompress(base64.b64decode(payload)); digest=hashlib.sha256(data).hexdigest()
          if digest!=expected or digest!=os.environ['EXPECTED_TRANSFORM_SHA256']: raise SystemExit(72)
          state={'count':0,'replace':0}
          def selected_replace(obj,old,new,choice):
              first=obj.find(old); second=obj.find(old,first+len(old)); third=obj.find(old,second+len(old))
              if first<0 or second<0 or third>=0: raise SystemExit(75)
              pos=first if choice=='FIRST' else second
              return obj[:pos]+new+obj[pos+len(old):]
          def las_count(obj,*args):
              state['count']+=1; ordinal=state['count']; actual=obj.count(*args)
              if ordinal in choices:
                  if actual!=2: raise SystemExit(73)
                  return 1
              return actual
          def las_replace(obj,*args):
              state['replace']+=1; ordinal=state['replace']; old=args[0] if args else None; new=args[1] if len(args)>1 else None
              before=obj.count(old) if isinstance(obj,(str,bytes)) and isinstance(old,type(obj)) else -1
              if ordinal in choices:
                  if before!=2 or not isinstance(obj,str) or not isinstance(old,str) or not isinstance(new,str): raise SystemExit(74)
                  return selected_replace(obj,old,new,choices[ordinal])
              return obj.replace(*args)
          class T(ast.NodeTransformer):
              def visit_Call(self,node):
                  self.generic_visit(node)
                  if isinstance(node.func,ast.Attribute) and node.func.attr=='count':
                      return ast.copy_location(ast.Call(ast.Name('las_count',ast.Load()),[node.func.value,*node.args],node.keywords),node)
                  if isinstance(node.func,ast.Attribute) and node.func.attr=='replace':
                      return ast.copy_location(ast.Call(ast.Name('las_replace',ast.Load()),[node.func.value,*node.args],node.keywords),node)
                  return node
          parsed=ast.parse(data.decode('utf-8'),filename='<opaque-transform>'); inst=T().visit(parsed); ast.fix_missing_locations(inst)
          ns={'__name__':'__main__','__file__':'<opaque-transform>','las_count':las_count,'las_replace':las_replace}
          exec(compile(inst,'<opaque-transform>','exec'),ns,ns)
          if state['count']!=11 or state['replace']!=11: raise SystemExit(76)
          paths=[p for p in subprocess.check_output(['git','diff','--name-only','-z']).split(b'\0') if p]
          hashes=sorted(hashlib.sha256(p).hexdigest() for p in paths)
          expected_paths=sorted([os.environ['EXPECTED_PATH_HASH_1'],os.environ['EXPECTED_PATH_HASH_2']])
          if len(paths)!=2 or hashes!=expected_paths: raise SystemExit(77)
          print(f"LAS_TOPO_{os.environ['FIFTH']}_{os.environ['ELEVENTH']}_TRANSFORM=PASS")
          PY
          cargo +1.98.1 fmt --all
          git diff --check

      - name: Classify Linux compiler diagnostics without source disclosure
        shell: bash
        env:
          FIFTH: ${{ matrix.fifth }}
          ELEVENTH: ${{ matrix.eleventh }}
          EXPECTED_PATH_HASH_1: 680761d41ae8315a6bf67b2df5250c8b4ebc93b434b7de42be032b743c37b90a
          EXPECTED_PATH_HASH_2: 736cc80e53ddc8c5287113b778e1a8fb5f3973b1b5092cdf665c982b07ce8b6d
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"; label="${FIFTH}_${ELEVENTH}"
          out="$RUNNER_TEMP/${label}.jsonl"
          set +e
          cargo +1.98.1 check --locked --all-targets --features linux-peer-credentials --message-format=json >"$out" 2>/dev/null
          rc=$?
          set -e
          python3 - "$out" <<'PY'
          import collections, hashlib, json, os, re, subprocess, sys
          label=f"{os.environ['FIFTH']}_{os.environ['ELEVENTH']}"
          pmap={os.environ['EXPECTED_PATH_HASH_1']:'TARGET_1',os.environ['EXPECTED_PATH_HASH_2']:'TARGET_2'}
          # Build added-line sets without exposing paths or source text.
          added={}
          raw=subprocess.check_output(['git','diff','--unified=0','--no-color'],text=True,errors='replace')
          cur=None
          for line in raw.splitlines():
              if line.startswith('+++ b/'):
                  cur=line[6:]; added.setdefault(cur,set())
              elif cur and line.startswith('@@'):
                  m=re.search(r'\+(\d+)(?:,(\d+))?',line)
                  if m:
                      start=int(m.group(1)); count=int(m.group(2) or '1')
                      added[cur].update(range(start,start+count))
          codes=collections.Counter(); locations=collections.Counter(); overlap=collections.Counter(); rendered=[]; total=0
          with open(sys.argv[1],encoding='utf-8',errors='replace') as f:
              for line in f:
                  try: obj=json.loads(line)
                  except Exception: continue
                  if obj.get('reason')!='compiler-message': continue
                  msg=obj.get('message') or {}
                  if msg.get('level')!='error': continue
                  total+=1
                  code=((msg.get('code') or {}).get('code') or 'NO_CODE')
                  codes[code]+=1
                  prim=[s for s in (msg.get('spans') or []) if s.get('is_primary')]
                  if not prim:
                      locations['NO_PRIMARY']+=1; overlap['NO_PRIMARY']+=1
                  for s in prim:
                      path=s.get('file_name') or ''
                      h=hashlib.sha256(path.encode()).hexdigest(); bucket=pmap.get(h,'OTHER')
                      locations[bucket]+=1
                      lo=int(s.get('line_start') or 0); hi=int(s.get('line_end') or lo)
                      hit=any(n in added.get(path,set()) for n in range(lo,hi+1))
                      overlap[bucket+('_ADDED' if hit else '_PREEXISTING')]+=1
                  rendered.append(hashlib.sha256((code+'\0'+str(len(prim))+'\0'+str(len(msg.get('children') or []))).encode()).hexdigest())
          print(f'LAS_TOPO_{label}_CARGO_RC={os.environ.get("CARGO_RC","UNKNOWN")}')
          print(f'LAS_TOPO_{label}_ERROR_COUNT={total}')
          print(f'LAS_TOPO_{label}_ERROR_CODES=' + ','.join(f'{k}:{v}' for k,v in sorted(codes.items())))
          print(f'LAS_TOPO_{label}_PRIMARY_LOCATIONS=' + ','.join(f'{k}:{v}' for k,v in sorted(locations.items())))
          print(f'LAS_TOPO_{label}_OVERLAP=' + ','.join(f'{k}:{v}' for k,v in sorted(overlap.items())))
          print(f'LAS_TOPO_{label}_DIAG_SHAPE_SHA256=' + hashlib.sha256('\n'.join(sorted(rendered)).encode()).hexdigest())
          print(f'LAS_TOPO_{label}_CLASSIFICATION=PASS')
          PY
          rm -f "$out"
          echo "LAS_TOPO_${label}_RAW_RC=$rc"

name: Frozen exact private Root SPARK full canonical proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/opaque-exact-current-root-spark-20261109.yml"

permissions:
  contents: read

env:
  TARGET_REF_HASH: 9e72c1a4537779a8dce3666299c00c3b625f2c234a16d60c151cea4c9d4a6525
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 0ca2a0057461a7bb63c52603a2c83fd726c6b045ccf4ba699e90e47c9197c340
  EXPECTED_PRIVATE_TREE_PROOF: 9e2bbf22fc4e9f6d72fe71b06a8755186b7a953260d2e2c66ad3bfd3292de4ec

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact private probe
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          mkdir target
          cd target
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          # Only an opaque branch identity and exact immutable revision are public.
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          while read -r _sha ref; do
            ref_hash="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$ref_hash" == "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
            fi
          done < "$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          echo "::add-mask::$matched_ref"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          actual="$(git rev-parse FETCH_HEAD)"
          echo "::add-mask::$actual"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          test "$proof" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          git checkout -q --detach "$actual"
          test "$(git rev-parse HEAD)" = "$actual"
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_TREE_PROOF"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "LAS_PRIVATE_EXACT_SPARK_REVISION=PINNED"
          unset PRIVATE_TOKEN auth matched_ref actual tree _sha ref ref_hash

      - name: Run exact Root SPARK gate
        shell: bash
        run: |
          set -euo pipefail
          cd target
          ALR_ZIP="$RUNNER_TEMP/alr.zip"
          ALR_PREFIX="$RUNNER_TEMP/alr"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "$ALR_ZIP" \
            "https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip" >/dev/null 2>&1
          echo "09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  $ALR_ZIP" | sha256sum --check --strict >/dev/null
          mkdir -p "$ALR_PREFIX"
          unzip -q "$ALR_ZIP" -d "$ALR_PREFIX"
          export PATH="$ALR_PREFIX/bin:$PATH"
          alr -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1 >/dev/null

          ALR_WS="$RUNNER_TEMP/alire-root-spark-only"
          mkdir -p "$ALR_WS"
          (
            cd "$ALR_WS"
            alr -n init --in-place --no-skel --lib las_root_spark_only >/dev/null
            alr with gnatprove=16.1.0 >/dev/null
          )

          PROOF_DIR="$RUNNER_TEMP/root-authority-proof"
          mkdir -p "$PROOF_DIR/obj"
          cat > "$PROOF_DIR/root_authority_proof_instances.ads" <<'EOF_PROOF'
          pragma SPARK_Mode (On);
          with Root_Authority;

          package Root_Authority_Proof_Instances is
             package Capacity_1   is new Root_Authority (Max_Grants => 1);
             package Capacity_2   is new Root_Authority (Max_Grants => 2);
             package Capacity_16  is new Root_Authority (Max_Grants => 16);
             package Capacity_256 is new Root_Authority (Max_Grants => 256);
          end Root_Authority_Proof_Instances;
          EOF_PROOF

          cat > "$PROOF_DIR/root_authority_proof.gpr" <<EOF_GPR
          project Root_Authority_Proof is
             for Source_Dirs use
               ("$GITHUB_WORKSPACE/target/src/root_authority", "$PROOF_DIR");
             for Object_Dir use "$PROOF_DIR/obj";
             package Compiler is
                for Default_Switches ("Ada") use ("-gnat2022");
             end Compiler;
          end Root_Authority_Proof;
          EOF_GPR

          set +e
          (
            cd "$ALR_WS"
            alr exec -- gnatprove \
              -P"$PROOF_DIR/root_authority_proof.gpr" \
              -U \
              --mode=all \
              --level=4 \
              --proof=progressive:all \
              --checks-as-errors=on \
              --proof-warnings=on \
              --report=statistics \
              --warnings=error \
              --pedantic \
              -j2
          ) >"$RUNNER_TEMP/spark.log" 2>&1
          rc=$?
          set -e
          echo "LAS_SPARK_ONLY_RC=$rc"
          if grep -q "GNAT BUG DETECTED" "$RUNNER_TEMP/spark.log"; then
            echo "LAS_SPARK_ONLY_ICE=YES"
          else
            echo "LAS_SPARK_ONLY_ICE=NO"
          fi
          echo "LAS_SPARK_ONLY_LOG_SHA256=$(sha256sum "$RUNNER_TEMP/spark.log" | awk '{print $1}')"
          if [[ "$rc" -ne 0 ]]; then
            echo "LAS_PRIVATE_ROOT_SPARK_FULL_PROOF=FAIL_OR_INCOMPLETE"
            exit "$rc"
          fi
          echo "LAS_PRIVATE_ROOT_SPARK_NATIVE_COMMAND=PASS"

      - name: Fail-closed original GNATprove proof-obligation census
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B - "$RUNNER_TEMP/root-authority-proof/obj/gnatprove/gnatprove.out" <<'PY'
          import hashlib
          import pathlib
          import re
          import sys

          # GNATprove 16.1 prints a fixed-width table; whitespace token counts
          # cannot prove the last two debt columns still exist. Keep all six
          # columns explicit, forbid missing cells and independently sum counts.
          def read_summary(raw):
              lines = raw.splitlines()
              headers = [i for i, line in enumerate(lines)
                         if "SPARK Analysis results" in line]
              if len(headers) != 1:
                  raise ValueError("proof summary header missing or duplicated")
              header = lines[headers[0]].rstrip()
              header_tokens = [
                  match.group(0)
                  for match in re.finditer(r"\S.*?(?=\s{2,}|$)", header)
              ]
              # GNATprove versions show an optional intermediate statistics
              # column. Require exactly a published named schema; no shifting
              # of Justified/Unproved is ever accepted.
              schemas = (
                  ("Total", "Flow", "Interval", "Provers", "Justified", "Unproved"),
                  ("Total", "Flow", "Provers", "Justified", "Unproved"),
                  ("Total", "Flow", "CodePeer", "Provers", "Justified", "Unproved"),
              )
              if (not header_tokens or header_tokens[0] != "SPARK Analysis results"
                      or tuple(header_tokens[1:]) not in schemas):
                  raise ValueError("proof summary columns changed")
              labels = tuple(header_tokens[1:])
              ends = [header.index(label) + len(label) for label in labels]
              starts = [header.index("Total")] + ends[:-1]
              categories = (
                  "Data Dependencies", "Flow Dependencies", "Initialization",
                  "Non-Aliasing", "Run-time Checks", "Assertions", "Functional Contracts",
                  "LSP Verification", "Termination", "Concurrency", "Total"
              )
              def numeric(cell):
                  match = re.fullmatch(r"(\d+|\.)(?: \([^()]*\))?", cell)
                  if match is None:
                      raise ValueError("missing or invalid proof column")
                  return 0 if match.group(1) == "." else int(match.group(1))
              rows = {}
              for line in lines[headers[0]+1:headers[0]+45]:
                  label = line[:starts[0]].strip()
                  if label not in categories:
                      continue
                  if label in rows:
                      raise ValueError("duplicate proof category")
                  # A visually omitted Unproved cell must never shift Justified
                  # into its position and produce a false zero-debt outcome.
                  if len(line.rstrip()) != ends[-1]:
                      raise ValueError("truncated proof summary column")
                  fields = [line[s:e].strip() for s, e in zip(starts, ends)]
                  counts = [numeric(cell) for cell in fields]
                  if counts[0] != sum(counts[1:]):
                      raise ValueError("proof category does not reconcile")
                  rows[label] = counts
              if not all(name in rows for name in
                         ("Total", "Run-time Checks", "Functional Contracts")):
                  raise ValueError("missing required proof categories")
              if rows["Total"][0] != sum(
                      count[0] for name, count in rows.items() if name != "Total"):
                  raise ValueError("proof grand total does not reconcile")
              total, runtime, contracts = (
                  rows["Total"][0],
                  rows["Run-time Checks"][0],
                  rows["Functional Contracts"][0],
              )
              return total, runtime, contracts, rows["Total"][-2], rows["Total"][-1]

          # Independent synthetic valid + malformed controls, all public-only.
          # A missing final debt column, any numeric proof debt, omitted category,
          # inconsistent sum, and duplicate category must cause a real failure.
          fixture_header = (
              "SPARK Analysis results        Total          Flow   Interval"
              "                         Provers   Justified   Unproved"
          )
          def fixture(name, total, flow=".", interval=".", provers=".",
                      justified=".", unproved="."):
              widths = (5, 14, 11, 32, 12, 11)
              fields = (total, flow, interval, provers, justified, unproved)
              return f"{name:<30}" + "".join(
                  str(value).rjust(width) for value, width in zip(fields, widths)
              )
          runtime_row = fixture("Run-time Checks", 4, provers=4)
          contract_row = fixture("Functional Contracts", 2, provers=2)
          total_row = fixture("Total", 6, provers=6)
          ok = "\n".join((fixture_header, runtime_row, contract_row, total_row)) + "\n"
          if read_summary(ok) != (6, 4, 2, 0, 0):
              raise AssertionError("proof valid fixture rejected")
          broken = (
              ok.replace(total_row, total_row[:-1]),
              ok.replace(total_row, fixture("Total", 6, provers=5, unproved=1)),
              ok.replace(total_row, fixture("Total", 6, provers=5, justified=1)),
              ok.replace(total_row, fixture("Total", 6, provers=5)),
              ok.replace(contract_row, ""),
              ok + total_row + "\n",
          )
          for case in broken:
              try:
                  count, runtime, contract, justified, unproved = read_summary(case)
                  accepted = count > 0 and runtime > 0 and contract > 0 and justified == 0 and unproved == 0
              except ValueError:
                  accepted = False
              if accepted:
                  raise AssertionError("proof fixture false-green")
          # Older valid five-measure schemas must also preserve the terminal
          # debt columns. Verify their positive and adversarial cases separately.
          fixture5_names = ("Total", "Flow", "Provers", "Justified", "Unproved")
          fixture5_widths = (5, 14, 32, 12, 11)
          fixture5_header = "SPARK Analysis results".ljust(30) + "".join(
              name.rjust(width) for name, width
              in zip(fixture5_names, fixture5_widths)
          )
          def fixture5(name, total, provers, justified=".", unproved="."):
              values = (total, ".", provers, justified, unproved)
              return name.ljust(30) + "".join(
                  str(value).rjust(width) for value, width
                  in zip(values, fixture5_widths)
              )
          r5 = fixture5("Run-time Checks", 4, 4)
          c5 = fixture5("Functional Contracts", 2, 2)
          t5 = fixture5("Total", 6, 6)
          ok5 = "\n".join((fixture5_header, r5, c5, t5)) + "\n"
          if read_summary(ok5) != (6, 4, 2, 0, 0):
              raise AssertionError("older valid proof fixture rejected")
          for malformed in (
              ok5.replace(t5, t5[:-1]),
              ok5.replace(t5, fixture5("Total", 6, 5, unproved=1)),
              ok5.replace(t5, fixture5("Total", 6, 5, justified=1)),
              ok5.replace(t5, fixture5("Total", 6, 5)),
              ok5.replace(c5, ""),
              ok5 + t5 + "\n",
          ):
              try:
                  count, runtime, contracts, justified, unproved = read_summary(malformed)
                  accepted = (
                      count > 0 and runtime > 0 and contracts > 0
                      and justified == 0 and unproved == 0
                  )
              except ValueError:
                  accepted = False
              if accepted:
                  raise AssertionError("older proof fixture false-green")
          print("LAS_SPARK_CENSUS_SYNTHETIC_NEGATIVES=PASS")
          path = pathlib.Path(sys.argv[1])
          if not path.is_file() or path.is_symlink() or path.stat().st_size > 16_000_000:
              raise SystemExit("LAS_SPARK_CENSUS=INCOMPLETE_REPORT")
          raw_bytes = path.read_bytes()
          try:
              total,runtime,contracts,justified,unproved=read_summary(raw_bytes.decode("utf-8"))
          except (ValueError,UnicodeError) as exc:
              # Exactly the parser's own reason and table shape, never private
              # source paths, units, user code or raw GNATprove text.
              print("LAS_SPARK_CENSUS=INCOMPLETE_OR_UNPARSEABLE")
              print("LAS_SPARK_CENSUS_PARSE_CLASS=" + str(exc) if isinstance(exc, ValueError)
                    else "LAS_SPARK_CENSUS_PARSE_CLASS=INVALID_ENCODING")
              lines=raw_bytes.decode("utf-8","replace").splitlines()
              print("LAS_SPARK_REPORT_HEADER_CANDIDATES=" + str(sum("SPARK Analysis results" in x for x in lines)))
              for name in ("Total","Run-time Checks","Functional Contracts","Assertions"):
                  matches=[x for x in lines if x.strip().startswith(name) and (len(x.strip())==len(name) or x.strip()[len(name)].isspace())]
                  widths=[len(re.split(r"\s{2,}",x.strip())) for x in matches]
                  print("LAS_SPARK_REPORT_"+name.upper().replace(" ","_").replace("-","_")+"_ROWS="+str(len(matches)))
                  print("LAS_SPARK_REPORT_"+name.upper().replace(" ","_").replace("-","_")+"_COLS="+",".join(str(x) for x in widths[:4]))
              raise SystemExit(1) from exc
          print("LAS_SPARK_CENSUS_TOTAL=" + str(total))
          print("LAS_SPARK_CENSUS_RUNTIME=" + str(runtime))
          print("LAS_SPARK_CENSUS_CONTRACTS=" + str(contracts))
          print("LAS_SPARK_CENSUS_JUSTIFIED=" + str(justified))
          print("LAS_SPARK_CENSUS_UNPROVED=" + str(unproved))
          print("LAS_SPARK_CENSUS_SHA256=" + hashlib.sha256(raw_bytes).hexdigest())
          if total <= 0 or runtime <= 0 or justified != 0 or unproved != 0:
              raise SystemExit("LAS_SPARK_CENSUS=FAIL_NONVACUITY_OR_PROOF_DEBT")
          print("LAS_SPARK_CENSUS=PASS")
          PY
          echo "LAS_PRIVATE_ROOT_SPARK_NONVACUOUS_PROOF=PASS"

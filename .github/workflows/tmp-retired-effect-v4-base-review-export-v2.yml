name: Temporary opaque retired effect v4 base review export v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-retired-effect-v4-base-review-export-v2.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Recover exact private revision opaquely
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
          TARGET_REF_HASH: a7195b2116dc080ad9d3be4184fef8c5fc791983798984d5fc25cd3f38e878ab
          EXPECTED_PRIVATE_SNAPSHOT_PROOF: f15eebcfaa8fb997898b97ed632269b2551e308ec1f0f1f889e4b935bdd5d84f
          EXPECTED_PRIVATE_TREE_PROOF: 9bcaea87c6af2eda91731f2c16526dfb225e6e929ecd62f07c2558e9e632eea7
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"; test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"; echo "::add-mask::$PRIVATE_TOKEN"
          root="$RUNNER_TEMP/private-target"; mkdir "$root"; cd "$root"; git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"; echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/private-heads"; git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""; private_head=""
          while read -r candidate_sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then test -z "$matched_ref"; matched_ref="$ref"; private_head="$candidate_sha"; fi
          done <"$refs"
          rm -f "$refs"; test -n "$matched_ref"; test -n "$private_head"
          echo "::add-mask::$matched_ref"; echo "::add-mask::$private_head"
          test "$(printf '%s' "$private_head" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$private_head"; git checkout -q --detach "$private_head"
          tree="$(git rev-parse 'HEAD^{tree}')"; echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_TREE_PROOF"
          test -z "$(git status --porcelain)"
          unset PRIVATE_TOKEN auth matched_ref private_head tree candidate_sha ref
          echo "LAS_BASE_V2_EXACT_RECOVERY=PASS"

      - name: Select exact six private files opaquely
        shell: bash
        env:
          EXPECTED_PATH_HASHES: |
            577cbe123ea611e0205c0a595ea25d41e1c43c507c8439264a148f4906dba9a0
            5b89ebd95ae5bd0a2001acc3da8f2b30646a3a49483966e6f7c71c7538f55336
            933fb5901ecca40e0c510961bb42f77a92e97a8edd4cf46633dd4b0889a52a73
            b68c1a40c3bd9e1a111e13782c2040df87dba050dd5e911c0586bc750209a1e9
            c6dab830b8322ddb21d865595d3d99a36d8457044f9901beecb0df6373ceaaf5
            f1ed409300b965a0572e7559552f652feba637a9b4363860b0bb3f598c05d566
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          allpaths="$RUNNER_TEMP/all-paths"
          selected="$RUNNER_TEMP/selected-paths"
          git ls-files -z >"$allpaths"
          python3 - "$allpaths" "$selected" <<'PY'
          import hashlib, os, sys
          expected = set(os.environ['EXPECTED_PATH_HASHES'].split())
          data = open(sys.argv[1], 'rb').read().split(b'\0')
          matches = [p for p in data if p and hashlib.sha256(p).hexdigest() in expected]
          actual = {hashlib.sha256(p).hexdigest() for p in matches}
          if len(matches) != 6 or actual != expected:
              raise SystemExit('unexpected private base selection')
          with open(sys.argv[2], 'wb') as out:
              out.write(b'\0'.join(matches) + b'\0')
          PY
          rm -f "$allpaths"
          echo "LAS_BASE_V2_SELECTION=PASS"

      - name: Encrypt exact base files to session-only public key
        shell: bash
        env:
          RECIPIENT_PUBLIC_KEY_B64: 
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          tarball="$RUNNER_TEMP/base-review.tar.gz"
          tar --null -T "$RUNNER_TEMP/selected-paths" -czf "$tarball"
          pass="$RUNNER_TEMP/base-review.pass"
          openssl rand -hex 32 >"$pass"
          cipher="$RUNNER_TEMP/base-review.enc"
          openssl enc -aes-256-cbc -pbkdf2 -salt -in "$tarball" -out "$cipher" -pass file:"$pass"
          pub="$RUNNER_TEMP/session-public.pem"
          printf '%s' "$RECIPIENT_PUBLIC_KEY_B64" | base64 -d >"$pub"
          wrapped="$RUNNER_TEMP/base-review.pass.enc"
          openssl pkeyutl -encrypt -pubin -inkey "$pub" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in "$pass" -out "$wrapped"
          rm -f "$tarball" "$pass" "$pub" "$RUNNER_TEMP/selected-paths"
          echo "LAS_BASE_V2_CIPHERTEXT_SHA256=$(sha256sum "$cipher" | awk '{print $1}')"
          echo "LAS_BASE_V2_WRAPPED_KEY_SHA256=$(sha256sum "$wrapped" | awk '{print $1}')"

      - name: Upload ciphertext only
        uses: actions/upload-artifact@v4
        with:
          name: retired-effect-v4-base-private-review-v2
          path: |
            ${{ runner.temp }}/base-review.enc
            ${{ runner.temp }}/base-review.pass.enc
          if-no-files-found: error
          retention-days: 1

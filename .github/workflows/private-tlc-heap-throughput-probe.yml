name: Private TLC heap throughput probe (retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject obsolete heap throughput probe
        shell: bash
        run: |
          set -euo pipefail
          echo "LAS_TLC_HEAP_PROBE=RETIRED"
          echo "This workflow is bound to a historical 129-profile candidate. Current performance evidence must be measured against the repaired current 202-profile candidate."
          exit 1

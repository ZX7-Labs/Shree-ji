name: Exact private archive frontier stale-lease and unsafe release negative controls

on:
  push:
    branches:
      - verify/retired-archive-frontier-nonforgeable-20261018
    paths:
      - .github/workflows/private-retired-stale-lease-formal-gate.yml

permissions:
  contents: read

concurrency:
  group: archive-frontier-exact-private-tlc-20261018
  cancel-in-progress: false

jobs:
  verify_isolated_private_model:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
      PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
      EXACT_REF_SHA256: 9b88dc648e0d416e95b9dd505dc7071a546275729d40873477826f49259bc5ab
      EXACT_COMMIT_SHA256: 90a9d6e05994589d9b68ab111b2d7891c4b048bce5f5b19d39a31e6134c92796
      MODULE_PATH_SHA256: 71201baa4c7970fb2bbe8c8756355cbba326bd032f6072be536bcbbbc614a433
      POSITIVE_CONFIG_SHA256: ca0cf8bff49574d4e5fe9516bb48efa84f270b2dd81dc8cd96bc061a2bea6453
      NEGATIVE_CONFIG_SHA256: 534988471b4be93f2073979a1d6fb56f0dba41df428e23138e4925cf40a28f43
      STALE_NEGATIVE_CONFIG_SHA256: c3f89bed50aa4c19e2d03669348cec7d2f49f0489c50ff11622a77b3faa558ac
    steps:
      - name: Bind exact private source and source-free model identities
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          cd "$RUNNER_TEMP"
          mkdir -p private-archive-frontier-formal
          cd private-archive-frontier-formal
          git init -q
          git remote add origin "https://github.com/$PRIVATE_REPOSITORY.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$RUNNER_TEMP/private-refs" 2>/dev/null
          matched=""
          exact=""
          while read -r sha ref; do
            fingerprint="$(printf '%s' "$ref" | sha256sum | cut -d' ' -f1)"
            if [ "$fingerprint" = "$EXACT_REF_SHA256" ]; then
              test -z "$matched"
              matched="$ref"
              exact="$sha"
            fi
          done <"$RUNNER_TEMP/private-refs"
          rm -f "$RUNNER_TEMP/private-refs"
          test -n "$matched"
          echo "::add-mask::$matched"
          echo "::add-mask::$exact"
          test "$(printf '%s' "$exact" | sha256sum | cut -d' ' -f1)" = "$EXACT_COMMIT_SHA256"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --no-tags --depth=1 origin "$matched" >"$RUNNER_TEMP/private-fetch" 2>&1
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$exact"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo 'LAS_FORMAL_EXACT_SOURCE=BOUND'

      - name: Pin model checker binary and resolve opaque model paths
        shell: bash
        run: |
          set -euo pipefail
          set +x
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "$RUNNER_TEMP/tla2tools.jar" \
            "https://github.com/tlaplus/tlaplus/releases/download/v1.7.2/tla2tools.jar" >"$RUNNER_TEMP/tla-fetch" 2>&1
          printf '%s  %s\n' '7f21faa2cdae3189e7d5fadb4488f0dfcc658407' "$RUNNER_TEMP/tla2tools.jar" | sha1sum --check --strict >"$RUNNER_TEMP/tla-pin" 2>&1
          echo "LAS_TLC_JAR_SHA256=$(sha256sum "$RUNNER_TEMP/tla2tools.jar" | cut -d' ' -f1)"
          cd "$RUNNER_TEMP/private-archive-frontier-formal"
          source_file=""
          positive_file=""
          negative_file=""
          stale_negative_file=""
          while IFS= read -r file; do
            digest="$(printf '%s' "$file" | sha256sum | cut -d' ' -f1)"
            if [ "$digest" = "$MODULE_PATH_SHA256" ]; then
              test -z "$source_file"
              source_file="$file"
            fi
            if [ "$digest" = "$POSITIVE_CONFIG_SHA256" ]; then
              test -z "$positive_file"
              positive_file="$file"
            fi
            if [ "$digest" = "$NEGATIVE_CONFIG_SHA256" ]; then
              test -z "$negative_file"
              negative_file="$file"
            fi
            if [ "$digest" = "$STALE_NEGATIVE_CONFIG_SHA256" ]; then
              test -z "$stale_negative_file"
              stale_negative_file="$file"
            fi
          done < <(git ls-files)
          test -n "$source_file"
          test -n "$positive_file"
          test -n "$negative_file"
          test -n "$stale_negative_file"
          test "$(dirname "$stale_negative_file")" = "$(dirname "$source_file")"
          test "$(dirname "$source_file")" = "$(dirname "$positive_file")"
          test "$(dirname "$source_file")" = "$(dirname "$negative_file")"
          echo "::add-mask::$source_file"
          echo "::add-mask::$positive_file"
          echo "::add-mask::$negative_file"
          echo "::add-mask::$stale_negative_file"
          printf '%s\n' "$source_file" >"$RUNNER_TEMP/modulepath"
          printf '%s\n' "$positive_file" >"$RUNNER_TEMP/positivepath"
          printf '%s\n' "$negative_file" >"$RUNNER_TEMP/negativepath"
          printf '%s\n' "$stale_negative_file" >"$RUNNER_TEMP/stalenegativepath"
          echo 'LAS_FORMAL_PATH_BINDING=PASS'

      - name: Parse model then check all safety invariants and deliberate mutation
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: -Xmx2g
        run: |
          set -euo pipefail
          set +x
          cd "$RUNNER_TEMP/private-archive-frontier-formal"
          source_file="$(cat "$RUNNER_TEMP/modulepath")"
          positive_file="$(cat "$RUNNER_TEMP/positivepath")"
          negative_file="$(cat "$RUNNER_TEMP/negativepath")"
          stale_negative_file="$(cat "$RUNNER_TEMP/stalenegativepath")"
          if java -cp "$RUNNER_TEMP/tla2tools.jar" tla2sany.SANY "$source_file" >"$RUNNER_TEMP/private-parse.log" 2>&1; then
            echo 'LAS_FORMAL_SYNTAX=PASS'
          else
            echo 'LAS_FORMAL_SYNTAX=FAIL'
            exit 1
          fi
          if java -XX:+UseParallelGC -jar "$RUNNER_TEMP/tla2tools.jar" -workers 2 \
            -config "$positive_file" "$source_file" >"$RUNNER_TEMP/private-positive.log" 2>&1; then
            echo 'LAS_FORMAL_POSITIVE=PASS'
          else
            # Restrict all public diagnostics to fixed outcome codes only.
            # Never print the private source, TLC trace, names, paths or formulas.
            if grep -Fq 'Deadlock reached' "$RUNNER_TEMP/private-positive.log"; then
              echo 'LAS_FORMAL_POSITIVE_REASON=DEADLOCK'
            elif grep -Fq 'Invariant' "$RUNNER_TEMP/private-positive.log" && grep -Fq 'violated' "$RUNNER_TEMP/private-positive.log"; then
              echo 'LAS_FORMAL_POSITIVE_REASON=INVARIANT'
            elif grep -Fq 'Attempted to evaluate' "$RUNNER_TEMP/private-positive.log"; then
              echo 'LAS_FORMAL_POSITIVE_REASON=EVALUATION'
            elif grep -Eq 'Exception|Error:' "$RUNNER_TEMP/private-positive.log"; then
              echo 'LAS_FORMAL_POSITIVE_REASON=ENGINE_OR_MODEL_ERROR'
            else
              echo 'LAS_FORMAL_POSITIVE_REASON=OTHER'
            fi
            echo 'LAS_FORMAL_POSITIVE=FAIL'
            exit 1
          fi
          if java -XX:+UseParallelGC -jar "$RUNNER_TEMP/tla2tools.jar" -workers 2 \
            -config "$negative_file" "$source_file" >"$RUNNER_TEMP/private-negative.log" 2>&1; then
            echo 'LAS_FORMAL_NEGATIVE_CONTROL=FAIL_FALSE_GREEN'
            exit 1
          fi
          # Compare only a digest of the violated invariant's lexical name.
          # No private symbol, formula, trace or error text may reach public logs.
          if python3 - "$RUNNER_TEMP/private-negative.log" '08a092e933243eec3c7597669a9747925ea3373a693f5bc73fe38872a2fefa64' <<'PY'
          import hashlib, pathlib, re, sys
          content = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          names = re.findall(r'Invariant ([A-Za-z_][A-Za-z_0-9]*) is violated', content)
          ok = len(names) == 1 and hashlib.sha256(names[0].encode()).hexdigest() == sys.argv[2]
          sys.exit(0 if ok else 1)
          PY
          then
            echo 'LAS_FORMAL_NEGATIVE_CONTROL=COUNTEREXAMPLE_CONFIRMED'
          else
            echo 'LAS_FORMAL_NEGATIVE_CONTROL=WRONG_FAILURE'
            exit 1
          fi
          if java -XX:+UseParallelGC -jar "$RUNNER_TEMP/tla2tools.jar" -workers 2 \
            -config "$stale_negative_file" "$source_file" >"$RUNNER_TEMP/private-stale-negative.log" 2>&1; then
            echo 'LAS_FORMAL_STALE_LEASE_CONTROL=FALSE_GREEN'
            exit 1
          fi
          if python3 - "$RUNNER_TEMP/private-stale-negative.log" '670a2ed38d22ac10e0f5ec3639dd4ea90c3e1172ba6aed3e02c3663c665488ed' <<'PY'
          import hashlib, pathlib, re, sys
          content = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          names = re.findall(r'Invariant ([A-Za-z_][A-Za-z_0-9]*) is violated', content)
          ok = len(names) == 1 and hashlib.sha256(names[0].encode()).hexdigest() == sys.argv[2]
          sys.exit(0 if ok else 1)
          PY
          then
            echo 'LAS_FORMAL_STALE_LEASE_CONTROL=COUNTEREXAMPLE_CONFIRMED'
          else
            echo 'LAS_FORMAL_STALE_LEASE_CONTROL=WRONG_FAILURE'
            exit 1
          fi
          test -z "$(git status --porcelain --untracked-files=no)"
          echo 'LAS_FORMAL_PRIVATE_TREE=CLEAN'
          echo 'LAS_FORMAL_SCOPE=ABSTRACT_CONTROL_ONLY_NOT_DURABLE_DEPLOYMENT'

name: Private assurance TLC39 quotient diagnostic

on:
  push:
    branches: [main]
    paths:
      - "RUN_ASSURANCE_TLC39_QUOTIENT_DIAGNOSTIC"

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject superseded TLC39 quotient diagnostic
        shell: bash
        run: |
          set -euo pipefail
          echo "LAS_ASSURANCE_TLC39_QUOTIENT_DIAGNOSTIC=RETIRED"
          echo "This historical 202-profile diagnostic is not bound to the repaired current candidate; canonical TLC39 evidence is produced only by the frozen repaired-202 v3 continuation and terminal attestation."
          exit 1

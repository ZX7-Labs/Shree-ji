name: Private current runtime hardening

on:
  push:
    paths:
      - ".github/workflows/private-current-runtime-hardening-20261014.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TARGET_REF_HASH: d071db074e8d0ca6b51599592e452ac4a4461046531f19dabe48ca8c6c4dcf6c
      EXPECTED_TARGET_PROOF: b613fa6a660b42e1dc2efae772b262ee88daca52168a2d1ee4dccad47630f1e5
    steps:
      - name: Checkout public shell
        uses: actions/checkout@v4

      - name: Recover exact private hardening target
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_WRITE_TOKEN: ${{ secrets.LAS_PRIVATE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY" && test -n "$PRIVATE_WRITE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"; echo "::add-mask::$PRIVATE_WRITE_TOKEN"
          root="$RUNNER_TEMP/private-runtime-hardening"; mkdir "$root"; cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_WRITE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin > "$refs"
          target_ref=""; target_sha=""
          while read -r sha ref; do
            h="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$h" == "$TARGET_REF_HASH" ]]; then target_ref="$ref"; target_sha="$sha"; fi
          done < "$refs"
          rm -f "$refs"
          test -n "$target_ref" && test -n "$target_sha"
          echo "::add-mask::$target_ref"; echo "::add-mask::$target_sha"
          test "$(printf '%s' "$target_sha" | sha256sum | awk '{print $1}')" = "$EXPECTED_TARGET_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$target_ref"
          git checkout -q -B target FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$target_sha"
          test -s tools/harden_guarded_runtime_postprocess_20261014.py
          printf '%s' "$target_ref" > "$RUNNER_TEMP/target-ref"
          printf '%s' "$target_sha" > "$RUNNER_TEMP/target-start-sha"
          printf '%s' "$auth" > "$RUNNER_TEMP/private-auth"
          chmod 600 "$RUNNER_TEMP/target-ref" "$RUNNER_TEMP/target-start-sha" "$RUNNER_TEMP/private-auth"
          echo "LAS_RUNTIME_HARDENING_RECOVERY=PASS"

      - name: Apply guarded post-process hardening
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-runtime-hardening"
          python3 tools/harden_guarded_runtime_postprocess_20261014.py
          rm tools/harden_guarded_runtime_postprocess_20261014.py
          test ! -e tools/harden_guarded_runtime_postprocess_20261014.py
          ! grep -q 'restore_prepared' src/effect_fabric/root_supervisor_linux_runtime.rs
          test "$(grep -c 'occupied.state = LinuxGuardedSlotState::Prepared' src/effect_fabric/root_supervisor_linux_runtime.rs)" = 1
          git diff --check
          echo "LAS_RUNTIME_HARDENING_PATCH=PASS"

      - name: Install pinned Rust and Ada toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null
          ALR_ZIP="$RUNNER_TEMP/alr.zip"
          ALR_PREFIX="$RUNNER_TEMP/alr"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "$ALR_ZIP" \
            "https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip" >/dev/null 2>&1
          echo "09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  $ALR_ZIP" | sha256sum --check --strict >/dev/null
          mkdir -p "$ALR_PREFIX"
          unzip -q "$ALR_ZIP" -d "$ALR_PREFIX"
          export PATH="$ALR_PREFIX/bin:$PATH"
          alr -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1 >/dev/null
          ALR_WS="$RUNNER_TEMP/alire-runtime-hardening"
          mkdir -p "$ALR_WS"
          (cd "$ALR_WS" && alr -n init --in-place --no-skel --lib las_runtime_hardening >/dev/null)
          cat > "$RUNNER_TEMP/gprbuild-wrapper" <<EOF_GPR
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$ALR_WS"
          exec alr exec -- gprbuild "\$@"
          EOF_GPR
          chmod 0755 "$RUNNER_TEMP/gprbuild-wrapper"
          echo "LAS_RUNTIME_HARDENING_TOOLCHAINS=PASS"

      - name: Strict compile lint and focused proofs
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-runtime-hardening"
          export GPRBUILD="$RUNNER_TEMP/gprbuild-wrapper"
          cargo +1.98.1 fmt --all
          cargo +1.98.1 fmt --all -- --check
          RUSTFLAGS='-D warnings' cargo +1.98.1 check --all-targets --features 'linux-peer-credentials root-ffi'
          cargo +1.98.1 clippy --all-targets --features 'linux-peer-credentials root-ffi' -- -D warnings
          cargo +1.98.1 test --features 'linux-peer-credentials root-ffi' root_supervisor_linux_runtime:: -- --nocapture
          cargo +1.98.1 test --features 'linux-peer-credentials root-ffi' root_supervisor_linux_control_resumability_tests:: -- --nocapture
          cargo +1.98.1 test --features 'linux-peer-credentials root-ffi' root_supervisor_linux_guarded_session:: -- --nocapture
          ! grep -q 'restore_prepared' src/effect_fabric/root_supervisor_linux_runtime.rs
          test "$(grep -c 'occupied.state = LinuxGuardedSlotState::Prepared' src/effect_fabric/root_supervisor_linux_runtime.rs)" = 1
          git diff --check
          echo "LAS_RUNTIME_HARDENING_VERIFY=PASS"

      - name: Commit verified private runtime hardening
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-runtime-hardening"
          target_ref="$(cat "$RUNNER_TEMP/target-ref")"
          start_sha="$(cat "$RUNNER_TEMP/target-start-sha")"
          auth="$(cat "$RUNNER_TEMP/private-auth")"
          remote_sha="$(git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote origin "$target_ref" | awk '{print $1}')"
          echo "::add-mask::$remote_sha"
          test "$remote_sha" = "$start_sha"
          git config user.name "LAS Verification Integrator"
          git config user.email "las-verification@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -q -m "Harden guarded runtime post-process ownership"
          new_sha="$(git rev-parse HEAD)"
          echo "::add-mask::$new_sha"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" push -q origin HEAD:"$target_ref"
          echo "LAS_RUNTIME_HARDENING_RESULT=PASS"
          echo "LAS_RUNTIME_HARDENING_COMMIT_PROOF=$(printf '%s' "$new_sha" | sha256sum | awk '{print $1}')"

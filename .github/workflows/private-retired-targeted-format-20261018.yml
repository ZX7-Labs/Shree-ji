name: Retired one-time private Rustfmt writer 20261018

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Refuse reuse of completed private-source write capability
        shell: bash
        run: |
          echo 'LAS_ONE_TIME_RUSTFMT_WRITER=RETIRED'
          echo 'Exact reviewed source revision required for each future temporary Rust-only writer.'
          exit 1

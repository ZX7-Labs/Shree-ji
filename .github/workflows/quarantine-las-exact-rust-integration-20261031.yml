name: Quarantine exact private Rust integration gate

on:
  push:
    branches:
      - quarantine/las-native-python-98-exact-20261031
    paths:
      - .github/workflows/quarantine-las-exact-rust-integration-20261031.yml

permissions:
  contents: read

jobs:
  exact-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    env:
      TARGET_BRANCH_PROOF: 2e7d4bb17d6ca183c895b195861e75f8bfd9de9b031d4b4306a0e7ad836de47e
      EXPECTED_PRIVATE_COMMIT_PROOF: 5f885861d5708ad82d2bf5d550adf53cd7ad8137f01a4dddf5a7efaf4f8aa58f
      EXPECTED_PRIVATE_RUNNER_BLOB_PROOF: 05e9176f1487e4a9303b38ae49f2cc88892c10657b1e43892935b27267235102
    steps:
      - name: Recover one privately pinned source revision
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_READ_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$PRIVATE_REPOSITORY" || -z "$PRIVATE_READ_TOKEN" ]]; then
            echo 'LAS_BRIDGE=FAIL:ACCESS'; exit 1
          fi
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_READ_TOKEN"
          private="$RUNNER_TEMP/private-source"
          mkdir -m 700 "$private"
          cd "$private"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          authorization="$(printf 'x-access-token:%s' "$PRIVATE_READ_TOKEN" | base64 -w0)"
          echo "::add-mask::$authorization"
          all_refs="$RUNNER_TEMP/private-heads"
          git -c core.fsmonitor=false -c http.extraHeader="AUTHORIZATION: basic $authorization" \
            ls-remote --heads origin > "$all_refs" 2> "$RUNNER_TEMP/secret-fetch-error"
          match=''
          while read -r _sha candidate; do
            candidate_proof="$(printf '%s' "$candidate" | sha256sum | awk '{print $1}')"
            if [[ "$candidate_proof" == "$TARGET_BRANCH_PROOF" ]]; then
              [[ -z "$match" ]] || { echo 'LAS_BRIDGE=FAIL:AMBIGUOUS_REF'; exit 1; }
              match="$candidate"
            fi
          done < "$all_refs"
          rm -f "$all_refs" "$RUNNER_TEMP/secret-fetch-error"
          [[ -n "$match" ]] || { echo 'LAS_BRIDGE=FAIL:TARGET'; exit 1; }
          echo "::add-mask::$match"
          git -c core.fsmonitor=false -c http.extraHeader="AUTHORIZATION: basic $authorization" \
            fetch -q --depth=1 origin "$match" > /dev/null 2> "$RUNNER_TEMP/secret-fetch-error"
          rm -f "$RUNNER_TEMP/secret-fetch-error"
          unset authorization PRIVATE_READ_TOKEN PRIVATE_REPOSITORY
          git -c core.fsmonitor=false checkout -q --detach FETCH_HEAD
          actual="$(git -c core.fsmonitor=false rev-parse --verify HEAD)"
          echo "::add-mask::$actual"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          if [[ "$proof" != "$EXPECTED_PRIVATE_COMMIT_PROOF" ]]; then
            echo 'LAS_BRIDGE=FAIL:SOURCE_PROOF'; exit 1
          fi
          if [[ -n "$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all)" ]]; then
            echo 'LAS_BRIDGE=FAIL:DIRTY'; exit 1
          fi
          test_runner='tools/verification/run_bridge_native_suite.sh'
          runner_blob="$(git -c core.fsmonitor=false hash-object "$test_runner")"
          runner_proof="$(printf '%s' "$runner_blob" | sha256sum | awk '{print $1}')"
          if [[ "$runner_proof" != "$EXPECTED_PRIVATE_RUNNER_BLOB_PROOF" ]]; then
            echo 'LAS_BRIDGE=FAIL:RUNNER_SOURCE'; exit 1
          fi
          echo "LAS_PRIVATE_SOURCE_PROOF=$proof"
          echo 'LAS_BRIDGE=EXACT_SOURCE_READY'

      - name: Verify pinned Rust 1.98.1 crate, source policy and unit tests
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-source"
          logs="$(mktemp -d "$RUNNER_TEMP/private-rust-settlement.XXXXXXXX")"
          chmod 700 "$logs"
          trap 'rm -rf -- "$logs"' EXIT
          if ! rustup toolchain install 1.98.1 --profile minimal >"$logs/rustup" 2>&1 ||
             ! rustup component add --toolchain 1.98.1 rustfmt clippy >>"$logs/rustup" 2>&1; then
            echo 'LAS_SETTLEMENT_RUST=FAIL:TOOLCHAIN'; exit 1
          fi
          if cargo +1.98.1 fmt --all -- --check >"$logs/fmt" 2>&1; then
            echo 'LAS_SETTLEMENT_RUST=FORMAT_PINNED_PASS'
          else
            # Keep the entire private formatter output in the ephemeral runner.
            echo 'LAS_SETTLEMENT_RUST=FORMAT_PENDING_NO_SOURCE_EXPORTED'
          fi
          if ! RUSTFLAGS=-Dwarnings cargo +1.98.1 check --locked --all-targets >"$logs/check" 2>&1; then
            echo 'LAS_SETTLEMENT_RUST=FAIL:COMPILE'; exit 1
          fi
          echo 'LAS_SETTLEMENT_RUST=DEFAULT_COMPILE_PASS'
          if ! cargo +1.98.1 clippy --locked --all-targets -- -D warnings >"$logs/clippy" 2>&1; then
            echo 'LAS_SETTLEMENT_RUST=FAIL:CLIPPY'; exit 1
          fi
          echo 'LAS_SETTLEMENT_RUST=CLIPPY_PASS'
          if ! RUSTFLAGS=-Dwarnings cargo +1.98.1 test --locked --lib -- --test-threads=1 >"$logs/test" 2>&1; then
            echo 'LAS_SETTLEMENT_RUST=FAIL:UNIT_TESTS'; exit 1
          fi
          grep -Eq '^test result: ok\. [1-9][0-9]* passed;' "$logs/test" || {
            echo 'LAS_SETTLEMENT_RUST=FAIL:VACUOUS_TEST'; exit 1
          }
          echo 'LAS_SETTLEMENT_RUST=LIB_TESTS_PASS'
          if ! RUSTFLAGS=-Dwarnings cargo +1.98.1 check --locked --features linux-peer-credentials --all-targets >"$logs/linux" 2>&1; then
            echo 'LAS_SETTLEMENT_RUST=FAIL:LINUX_COMPILE'; exit 1
          fi
          if [[ -n "$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all)" ]]; then
            echo 'LAS_SETTLEMENT_RUST=FAIL:SOURCE_DRIFT'; exit 1
          fi
          if [[ -s "$logs/fmt" ]]; then
            echo 'LAS_SETTLEMENT_RUST=FAIL:FORMAT_INCOMPLETE'
            exit 1
          fi
          echo 'LAS_RUST_INTEGRATION=EXACT_SCOPED_RUST_PASS_NOT_RELEASE_APPROVAL'

      - name: Run full default and Linux-feature Rust target tests
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-source"
          logs="$(mktemp -d "$RUNNER_TEMP/las-rust-alltargets.XXXXXXXX")"
          chmod 700 "$logs"
          trap 'rm -rf -- "$logs"' EXIT
          if ! RUSTFLAGS=-Dwarnings cargo +1.98.1 test --locked --all-targets -- --test-threads=1 > "$logs/default.private" 2>&1; then
            echo 'LAS_RUST_INTEGRATION=FAIL:DEFAULT_ALL_TARGET_TESTS'; exit 1
          fi
          grep -Eq '^test result: ok\. [1-9][0-9]* passed;' "$logs/default.private" || {
            echo 'LAS_RUST_INTEGRATION=FAIL:DEFAULT_VACUOUS'; exit 1
          }
          echo 'LAS_RUST_INTEGRATION=DEFAULT_ALL_TARGET_TESTS_PASS'
          if ! RUSTFLAGS=-Dwarnings cargo +1.98.1 test --locked --features linux-peer-credentials --all-targets -- --test-threads=1 > "$logs/linux.private" 2>&1; then
            echo 'LAS_RUST_INTEGRATION=FAIL:LINUX_ALL_TARGET_TESTS'; exit 1
          fi
          grep -Eq '^test result: ok\. [1-9][0-9]* passed;' "$logs/linux.private" || {
            echo 'LAS_RUST_INTEGRATION=FAIL:LINUX_VACUOUS'; exit 1
          }
          [[ -z "$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all)" ]] || {
            echo 'LAS_RUST_INTEGRATION=FAIL:SOURCE_DRIFT'; exit 1
          }
          echo 'LAS_RUST_INTEGRATION=LINUX_ALL_TARGET_TESTS_PASS_NOT_RELEASE_APPROVAL'

      - name: Scrub private checkout and temporary diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$RUNNER_TEMP/private-source"
          rm -f -- "$RUNNER_TEMP/private-heads" "$RUNNER_TEMP/secret-fetch-error"
          echo 'LAS_RUST_INTEGRATION=EPHEMERAL_CLEANUP'

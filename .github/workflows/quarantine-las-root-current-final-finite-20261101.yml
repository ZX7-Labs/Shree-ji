name: Root latest exact-source assurance quarantine-las-root-current-final-finite-20261101
on:
  push:
    branches:
      - quarantine/las-root-current-native-20261101
    paths:
      - .github/workflows/quarantine-las-root-current-final-finite-20261101.yml
permissions:
  contents: read
jobs:
  exact-private-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_BRANCH_PROOF: 6bd51faba0c4c360fef7e9aa8f52e8efe7d1fa81dcf57093c01d8cbe7557bfa2
      EXPECTED_PRIVATE_COMMIT_PROOF: dbc6091d0075b7146d24d1637ef14f885344290bef538ca1ba33892584b2ced2
      EXPECTED_PRIVATE_RUNNER_BLOB_PROOF: d4df90336770cf5275996ccf750325a091b071a86a708799281845dc0eb5c74f
    steps:
      - name: Recover exact read-only private source without publishing code
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_READ_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$PRIVATE_REPOSITORY" || -z "$PRIVATE_READ_TOKEN" ]]; then
            echo 'LAS_NATIVE_BRIDGE=FAIL:ACCESS'; exit 1
          fi
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_READ_TOKEN"
          private="$RUNNER_TEMP/private-source"
          mkdir -m 700 "$private"
          cd "$private"
          git init -q
          git remote add origin "https://github.com/$PRIVATE_REPOSITORY.git"
          authorization="$(printf 'x-access-token:%s' "$PRIVATE_READ_TOKEN" | base64 -w0)"
          echo "::add-mask::$authorization"
          all_refs="$RUNNER_TEMP/private-heads"
          git -c core.fsmonitor=false -c http.extraHeader="AUTHORIZATION: basic $authorization" ls-remote --heads origin > "$all_refs" 2> "$RUNNER_TEMP/secret-fetch-error" || {
            echo 'LAS_NATIVE_BRIDGE=FAIL:READ'; exit 1
          }
          match=''
          while read -r _sha candidate; do
            candidate_proof="$(printf '%s' "$candidate" | sha256sum | awk '{print $1}')"
            if [[ "$candidate_proof" == "$TARGET_BRANCH_PROOF" ]]; then
              [[ -z "$match" ]] || { echo 'LAS_NATIVE_BRIDGE=FAIL:AMBIGUOUS_REF'; exit 1; }
              match="$candidate"
            fi
          done < "$all_refs"
          rm -f "$all_refs" "$RUNNER_TEMP/secret-fetch-error"
          [[ -n "$match" ]] || { echo 'LAS_NATIVE_BRIDGE=FAIL:TARGET'; exit 1; }
          echo "::add-mask::$match"
          git -c core.fsmonitor=false -c http.extraHeader="AUTHORIZATION: basic $authorization" fetch -q --depth=1 origin "$match" > /dev/null 2> "$RUNNER_TEMP/secret-fetch-error" || {
            echo 'LAS_NATIVE_BRIDGE=FAIL:FETCH'; exit 1
          }
          rm -f "$RUNNER_TEMP/secret-fetch-error"
          unset authorization PRIVATE_READ_TOKEN PRIVATE_REPOSITORY
          git -c core.fsmonitor=false checkout -q --detach FETCH_HEAD
          actual="$(git -c core.fsmonitor=false rev-parse --verify HEAD)"
          echo "::add-mask::$actual"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          [[ "$proof" == "$EXPECTED_PRIVATE_COMMIT_PROOF" ]] || {
            echo 'LAS_NATIVE_BRIDGE=FAIL:SOURCE_PIN'; exit 1
          }
          [[ -z "$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all)" ]] || {
            echo 'LAS_NATIVE_BRIDGE=FAIL:DIRTY'; exit 1
          }
          script='tools/verification/run_bridge_native_suite.sh'
          [[ -f "$script" && ! -L "$script" ]] || {
            echo 'LAS_NATIVE_BRIDGE=FAIL:RUNNER_MISSING'; exit 1
          }
          blob="$(git -c core.fsmonitor=false hash-object "$script")"
          blob_proof="$(printf '%s' "$blob" | sha256sum | awk '{print $1}')"
          [[ "$blob_proof" == "$EXPECTED_PRIVATE_RUNNER_BLOB_PROOF" ]] || {
            echo 'LAS_NATIVE_BRIDGE=FAIL:RUNNER_PIN'; exit 1
          }
          echo "LAS_NATIVE_BRIDGE=SOURCE_PINNED:$proof"

      - name: Execute source-owned non-vacuous 12-stage native suite
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-source"
          private_log="$(mktemp "$RUNNER_TEMP/las-native-private.XXXXXXXX")"
          chmod 600 "$private_log"
          trap 'rm -f -- "$private_log"' EXIT
          if ! bash tools/verification/run_bridge_native_suite.sh "$PWD" > "$private_log" 2>&1; then
            echo 'LAS_NATIVE_BRIDGE=FAIL:PRIVATE_SUITE'; exit 1
          fi
          grep -Fxq 'LAS_NATIVE_SCOPED=PASS' "$private_log" || {
            echo 'LAS_NATIVE_BRIDGE=FAIL:PASS_MARKER'; exit 1
          }
          grep -Fxq 'LAS_NATIVE_STAGES=12' "$private_log" || {
            echo 'LAS_NATIVE_BRIDGE=FAIL:STAGES'; exit 1
          }
          grep -Fxq 'LAS_NATIVE_CASES=336' "$private_log" || {
            echo 'LAS_NATIVE_BRIDGE=FAIL:CASES'; exit 1
          }
          grep -Fxq "LAS_PRIVATE_PROOF=$EXPECTED_PRIVATE_COMMIT_PROOF" "$private_log" || {
            echo 'LAS_NATIVE_BRIDGE=FAIL:SOURCE_RESULT'; exit 1
          }
          echo 'LAS_NATIVE_BRIDGE=SCOPED_PRIVATE_PYTHON_PASS_NOT_PRODUCT_RELEASE'

      - name: Explore exact private Root resource refinement and seven unsafe mutations
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/private-source/tools/experiments/root_external_effect_refinement"
          test -f "$work/root_external_effect_refinement.py"
          test -f "$work/test_root_external_effect_refinement.py"
          cd "$work"
          logs="$(mktemp -d "$RUNNER_TEMP/las-root-oracle.XXXXXXXX")"
          chmod 700 "$logs"
          python3 -I -B -m unittest discover -s . -p 'test_*.py' -q > "$logs/normal.private" 2>&1 || {
            echo 'LAS_ROOT_RESOURCE_MODEL=FAIL:NORMAL'; exit 1
          }
          grep -Eq '^Ran 10 tests in ' "$logs/normal.private" || {
            echo 'LAS_ROOT_RESOURCE_MODEL=FAIL:VACUOUS_NORMAL'; exit 1
          }
          python3 -O -I -B -m unittest discover -s . -p 'test_*.py' -q > "$logs/optimized.private" 2>&1 || {
            echo 'LAS_ROOT_RESOURCE_MODEL=FAIL:OPTIMIZED'; exit 1
          }
          grep -Eq '^Ran 10 tests in ' "$logs/optimized.private" || {
            echo 'LAS_ROOT_RESOURCE_MODEL=FAIL:VACUOUS_OPTIMIZED'; exit 1
          }
          python3 -I -B root_external_effect_refinement.py > "$logs/model.private" 2>&1 || {
            echo 'LAS_ROOT_RESOURCE_MODEL=FAIL:REACHABILITY'; exit 1
          }
          python3 -I -B - "$logs/model.private" <<'PY_ORACLE'
          import json, sys
          x=json.load(open(sys.argv[1],encoding="utf-8"))
          if x.get("violations") != [] or x.get("states",0) <= 50 or x.get("edges",0) <= 100:
              raise SystemExit("incomplete bounded model")
          PY_ORACLE
          cd "$RUNNER_TEMP/private-source"
          [[ -z "$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all)" ]] || {
            echo 'LAS_ROOT_RESOURCE_MODEL=FAIL:SOURCE_DRIFT'; exit 1
          }
          rm -rf -- "$logs"
          echo 'LAS_ROOT_RESOURCE_MODEL=SCOPED_FINITE_STATE_PASS_NOT_PHYSICAL_OR_RELEASE'

      - name: Scrub ephemeral checkout
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$RUNNER_TEMP/private-source"
          rm -f -- "$RUNNER_TEMP/private-heads" "$RUNNER_TEMP/secret-fetch-error"
          echo 'LAS_NATIVE_BRIDGE=EPHEMERAL_CLEANUP'

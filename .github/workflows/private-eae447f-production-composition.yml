name: October eae exact production composition

on:
  push:
    branches:
      - "verify/eae447f-full-202-20261016"
    paths:
      - ".github/workflows/private-eae447f-production-composition.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eae447f-production-composition
  cancel-in-progress: false

env:
  TARGET_REF_HASH: fa860b84036231adb90c52b224a64957c56e4d15e36c54f1d5a40761bee6edff
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 584bd773cdbc52fbea800f5eb839f48237970118e4e03d8e720accbeb74ecb6d
  EXPECTED_PRIVATE_TREE_PROOF: 62c39377ae92680d74613228fe54c6e0f6cd525469f636ae6ab57d90976d3541
  EXPECTED_VERIFIER_BLOB: 62e3e6dc0fad5dddc7fb0a453a3cd681d911e590

jobs:
  verify-production-composition:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Recover exact frozen private candidate
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"

          root="$GITHUB_WORKSPACE/target"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"

          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          matched_sha=""
          while read -r sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
              matched_sha="$sha"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          test -n "$matched_sha"
          echo "::add-mask::$matched_ref"
          echo "::add-mask::$matched_sha"

          test "$(printf '%s' "$matched_sha" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          actual="$(git rev-parse FETCH_HEAD)"
          test "$actual" = "$matched_sha"
          echo "::add-mask::$actual"
          git checkout -q --detach "$actual"

          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_TREE_PROOF"
          test "$(git hash-object tools/verify_codespaces_all.sh)" = "$EXPECTED_VERIFIER_BLOB"
          test -z "$(git status --porcelain --untracked-files=no)"
          unset PRIVATE_TOKEN auth matched_ref matched_sha actual tree
          echo "LAS_EAE_PRODUCTION_PRIVATE_BINDING=PASS"

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal
          rustup component add --toolchain 1.98.1 rustfmt clippy
          cargo +1.98.1 --version
          rustc +1.98.1 --version --verbose

      - name: Install checksum-pinned Alire
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/alr.zip"
          prefix="$RUNNER_TEMP/alr"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip"
          echo "09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  $archive" \
            | sha256sum --check --strict
          mkdir -p "$prefix"
          unzip -q "$archive" -d "$prefix"
          echo "$prefix/bin" >>"$GITHUB_PATH"

      - name: Install exact Ada build toolchain
        shell: bash
        run: |
          set -euo pipefail
          alr -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1
          workspace="$RUNNER_TEMP/production-linux-root-toolchain"
          mkdir -p "$workspace"
          cd "$workspace"
          alr -n init --in-place --no-skel --lib production_linux_root_toolchain
          alr exec -- gnatmake --version
          alr exec -- gprbuild --version
          gpr_path="$(alr exec -- sh -lc 'command -v gprbuild')"
          printf 'GPRBUILD=%s\n' "$gpr_path" >>"$GITHUB_ENV"

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          cargo +1.98.1 fmt --all -- --check

      - name: Compile exact production feature composition
        shell: bash
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          cargo +1.98.1 check --locked --features "root-ffi linux-peer-credentials" --all-targets

      - name: Clippy exact production feature composition
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          cargo +1.98.1 clippy --locked --features "root-ffi linux-peer-credentials" --all-targets -- -D warnings

      - name: Test exact production feature composition
        shell: bash
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          cargo +1.98.1 test --locked --features "root-ffi linux-peer-credentials" --lib -- --test-threads=1
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "LAS_EAE_PRODUCTION_COMPOSITION=PASS"

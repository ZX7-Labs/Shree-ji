name: Private Linux control readiness-interest apply

on:
  push:
    branches: [main]
    paths:
      - "RUN_LINUX_CONTROL_READINESS_INTEREST"

permissions:
  contents: read

concurrency:
  group: private-linux-control-readiness-interest-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout public control shell
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Load opaque exact target
        shell: bash
        run: |
          set -euo pipefail
          test -s RUN_LINUX_CONTROL_READINESS_INTEREST
          ref_hash="$(awk -F= '$1=="TARGET_REF_HASH"{print $2}' RUN_LINUX_CONTROL_READINESS_INTEREST)"
          proof="$(awk -F= '$1=="EXPECTED_PRIVATE_SNAPSHOT_PROOF"{print $2}' RUN_LINUX_CONTROL_READINESS_INTEREST)"
          [[ "$ref_hash" =~ ^[0-9a-f]{64}$ ]]
          [[ "$proof" =~ ^[0-9a-f]{64}$ ]]
          echo "TARGET_REF_HASH=$ref_hash" >> "$GITHUB_ENV"
          echo "EXPECTED_PRIVATE_SNAPSHOT_PROOF=$proof" >> "$GITHUB_ENV"

      - name: Checkout exact hidden private revision
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_WRITE_TOKEN: ${{ secrets.LAS_PRIVATE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_WRITE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_WRITE_TOKEN"
          root="$RUNNER_TEMP/private-target"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_WRITE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin > "$refs"
          matched_ref=""
          matched_sha=""
          while read -r sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" == "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
              matched_sha="$sha"
            fi
          done < "$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          test -n "$matched_sha"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          git checkout -q -B exact-target FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          echo "::add-mask::$actual"
          test "$actual" = "$matched_sha"
          test "$(printf '%s' "$actual" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          printf '%s' "$matched_ref" > "$RUNNER_TEMP/private-ref"
          printf '%s' "$actual" > "$RUNNER_TEMP/private-start-sha"
          printf '%s' "$auth" > "$RUNNER_TEMP/private-auth"
          chmod 600 "$RUNNER_TEMP/private-ref" "$RUNNER_TEMP/private-start-sha" "$RUNNER_TEMP/private-auth"
          echo "LAS_CONTROL_READINESS_START_PROOF=$EXPECTED_PRIVATE_SNAPSHOT_PROOF"

      - name: Install pinned Rust verification components
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null

      - name: Apply private source-owned readiness patch
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          test -f tools/apply_linux_control_readiness_interest_20261014.py
          python3 tools/apply_linux_control_readiness_interest_20261014.py
          rm tools/apply_linux_control_readiness_interest_20261014.py
          cargo +1.98.1 fmt --all
          git diff --check

      - name: Verify exact readiness semantics
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          grep -q 'enum LinuxControlIoInterest' src/effect_fabric/root_supervisor_linux_control_session.rs
          grep -q 'Pending(LinuxControlIoInterest)' src/effect_fabric/root_supervisor_linux_control_session.rs
          grep -q 'LinuxControlIoInterest::Readable' src/effect_fabric/root_supervisor_linux_control_session.rs
          grep -q 'LinuxControlIoInterest::Writable' src/effect_fabric/root_supervisor_linux_control_session.rs
          grep -q 'Pending(LinuxControlIoInterest::Writable)' src/effect_fabric/root_supervisor_linux_control_resumability_tests.rs
          echo 'LAS_CONTROL_READINESS_STATIC=PASS'

      - name: Strict compile lint and focused regressions
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          cargo +1.98.1 fmt --all -- --check
          RUSTFLAGS='-D warnings' cargo +1.98.1 check --locked --all-targets --features linux-peer-credentials
          cargo +1.98.1 clippy --locked --all-targets --features linux-peer-credentials -- -D warnings
          cargo +1.98.1 test --locked --features linux-peer-credentials root_supervisor_linux_control_resumability_tests::
          echo 'LAS_CONTROL_READINESS_FOCUSED=PASS'

      - name: Full Linux composition regression gate
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          cargo +1.98.1 test --locked --all-targets --features linux-peer-credentials
          cargo +1.98.1 fmt --all -- --check
          git diff --check
          echo 'LAS_CONTROL_READINESS_LINUX_FULL=PASS'

      - name: Enforce exact scope and fast-forward hidden ref
        shell: bash
        env:
          PRIVATE_WRITE_TOKEN: ${{ secrets.LAS_PRIVATE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          matched_ref="$(cat "$RUNNER_TEMP/private-ref")"
          start_sha="$(cat "$RUNNER_TEMP/private-start-sha")"
          auth="$(cat "$RUNNER_TEMP/private-auth")"
          echo "::add-mask::$PRIVATE_WRITE_TOKEN"
          echo "::add-mask::$auth"
          echo "::add-mask::$start_sha"
          git diff --name-only | sort > "$RUNNER_TEMP/changed"
          cat > "$RUNNER_TEMP/expected" <<'EOF'
          src/effect_fabric/root_supervisor_linux_control_resumability_tests.rs
          src/effect_fabric/root_supervisor_linux_control_session.rs
          tools/apply_linux_control_readiness_interest_20261014.py
          EOF
          sort -o "$RUNNER_TEMP/expected" "$RUNNER_TEMP/expected"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/changed"
          remote_sha="$(git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote origin "$matched_ref" | awk '{print $1}')"
          echo "::add-mask::$remote_sha"
          test "$remote_sha" = "$start_sha"
          git config user.name 'LAS Verification Integrator'
          git config user.email 'las-verification@users.noreply.github.com'
          git add -- src/effect_fabric/root_supervisor_linux_control_session.rs src/effect_fabric/root_supervisor_linux_control_resumability_tests.rs
          git add -u -- tools/apply_linux_control_readiness_interest_20261014.py
          git diff --cached --check
          git commit -q -m 'Expose exact control readiness interest'
          new_sha="$(git rev-parse HEAD)"
          tree_sha="$(git rev-parse HEAD^{tree})"
          echo "::add-mask::$new_sha"
          echo "::add-mask::$tree_sha"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" push -q origin HEAD:"$matched_ref"
          echo 'LAS_CONTROL_READINESS_APPLY=PASS'
          echo "LAS_CONTROL_READINESS_COMMIT_PROOF=$(printf '%s' "$new_sha" | sha256sum | awk '{print $1}')"
          echo "LAS_CONTROL_READINESS_TREE_PROOF=$(printf '%s' "$tree_sha" | sha256sum | awk '{print $1}')"

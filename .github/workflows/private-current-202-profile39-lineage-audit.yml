name: Audit exact current 202 profile-39 lineage

on:
  push:
    branches:
      - verify/current-202-source-201-closure-20261015
    paths:
      - ".github/workflows/private-current-202-profile39-lineage-audit.yml"
      - "tools/audit_current_202_profile39_lineage.py"
      - "RUN_CURRENT_202_PROFILE39_LINEAGE_AUDIT"

permissions:
  contents: read
  actions: read

env:
  INITIAL_RUN_ID: "38624716259"
  EXPECTED_WORKFLOW_PATH: .github/workflows/private-repaired-202-tlc39-continuation.yml
  EXPECTED_WORKFLOW_BLOB: b0d34658082e9062c9e714cb1125a66385abac83
  EXPECTED_AUDITOR_BLOB: 85bcfd67ffddbb434f7c261e9d2fa294d52abcdc
  TARGET_REF_HASH: 28a52175bfc55f4f8b2b0f4312cd2616a65a7082555149f4382746e2254e1b26
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 1b139dc7920e82d5f9bdd2a68c072ad88bc0049d5ef1377380899164da5f93f9
  EXPECTED_PRIVATE_TREE_PROOF: 7fb364587ed7c9f76d8fd9f69cb4a4d58e576a44a1e653d019c8114ccb65353f
  EXPECTED_VERIFIER_BLOB: 62e3e6dc0fad5dddc7fb0a453a3cd681d911e590

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout audit shell
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact auditor implementation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object tools/audit_current_202_profile39_lineage.py)" = "$EXPECTED_AUDITOR_BLOB"
          python3 -m py_compile tools/audit_current_202_profile39_lineage.py
          rm -rf tools/__pycache__
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "LAS_CURRENT_202_PROFILE39_LINEAGE_AUDITOR_BINDING=PASS"

      - name: Revalidate exact frozen private candidate
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"

          root="$RUNNER_TEMP/private-profile39-lineage"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          refs="$RUNNER_TEMP/private-profile39-lineage-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          matched_sha=""
          while read -r sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
              matched_sha="$sha"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          test -n "$matched_sha"
          echo "::add-mask::$matched_ref"
          echo "::add-mask::$matched_sha"
          test "$(printf '%s' "$matched_sha" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$matched_sha"
          git checkout -q --detach "$matched_sha"
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_TREE_PROOF"
          test "$(git hash-object tools/verify_codespaces_all.sh)" = "$EXPECTED_VERIFIER_BLOB"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "LAS_CURRENT_202_PROFILE39_LINEAGE_PRIVATE_BINDING=PASS"
          unset PRIVATE_TOKEN PRIVATE_REPOSITORY auth matched_ref matched_sha tree

      - name: Resolve terminal run request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          terminal="$INITIAL_RUN_ID"
          if [[ -f RUN_CURRENT_202_PROFILE39_LINEAGE_AUDIT ]]; then
            terminal="$(tr -d '[:space:]' < RUN_CURRENT_202_PROFILE39_LINEAGE_AUDIT)"
          fi
          [[ "$terminal" =~ ^[1-9][0-9]*$ ]]
          echo "terminal_run_id=$terminal" >>"$GITHUB_OUTPUT"
          echo "LAS_CURRENT_202_PROFILE39_LINEAGE_REQUEST=PASS"

      - name: Prove complete immutable workflow lineage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TERMINAL_RUN_ID: ${{ steps.request.outputs.terminal_run_id }}
        run: |
          set -euo pipefail
          python3 tools/audit_current_202_profile39_lineage.py

name: Diagnose current exact pre-TLC Rust matrix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-current-pre-tlc-rust-matrix-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REF_HASH: af0d56a467d595cbb494bb1174899ca1fd0ebe33e4d5b8f7e459539fee0578ab
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: e01693f374b4c35bb340fa65eb7df1f48d8f0c064aef86cc96f49b9fa0ca3f26
  EXPECTED_PRIVATE_TREE_PROOF: a7d0cbf54c0b507b95bb0123dd03ca73b3da03be45db86b761813daf416d1f80

jobs:
  rust_matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Install exact Rust and Ada build toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null
          ALR_ZIP="$RUNNER_TEMP/alr.zip"; ALR_PREFIX="$RUNNER_TEMP/alr"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --output "$ALR_ZIP" \
            "https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip" >/dev/null 2>&1
          echo "09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  $ALR_ZIP" | sha256sum --check --strict >/dev/null
          mkdir -p "$ALR_PREFIX"; unzip -q "$ALR_ZIP" -d "$ALR_PREFIX"; export PATH="$ALR_PREFIX/bin:$PATH"
          alr -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1 >/dev/null
          ALR_WS="$RUNNER_TEMP/alire-workspace"; mkdir -p "$ALR_WS"
          (cd "$ALR_WS" && alr -n init --in-place --no-skel --lib las_verify_toolchain >/dev/null)
          GPRBUILD_WRAPPER="$RUNNER_TEMP/gprbuild-wrapper"
          cat > "$GPRBUILD_WRAPPER" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$ALR_WS"
          exec "$ALR_PREFIX/bin/alr" exec -- gprbuild "\$@"
          EOF
          chmod +x "$GPRBUILD_WRAPPER"
          echo "GPRBUILD=$GPRBUILD_WRAPPER" >> "$GITHUB_ENV"

      - name: Recover exact private materialized revision
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"; test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"; echo "::add-mask::$PRIVATE_TOKEN"
          mkdir target; cd target; git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          while read -r sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"; matched_ref="$ref"
            fi
          done <"$refs"
          rm -f "$refs"; test -n "$matched_ref"; echo "::add-mask::$matched_ref"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          actual="$(git rev-parse FETCH_HEAD)"; echo "::add-mask::$actual"
          test "$(printf '%s' "$actual" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          git checkout -q --detach "$actual"
          tree="$(git rev-parse 'HEAD^{tree}')"; echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_TREE_PROOF"
          test -z "$(git status --porcelain --untracked-files=no)"
          unset PRIVATE_TOKEN auth matched_ref actual tree
          echo "LAS_RUST_MATRIX_RECOVERY=PASS"

      - name: Verify source-owned 22-case Rust test evidence policy
        shell: bash
        run: |
          set -euo pipefail
          cd target
          source_pin() {
            file="$1"; sha="$2"
            test -f "$file" && test ! -L "$file"
            test "$(git -c core.fsmonitor=false hash-object -- "$file")" = "$sha"
          }
          source_pin tools/verification/canonical_rust_test_evidence.py 38e03d7b78d95c516f5b0499f0e0c5a5b05e04ef
          source_pin tools/verification/canonical_rust_suite_policy.py 0d158e9dcf0acb81823d4e9199d15b44619204d9
          source_pin tools/verification/test_canonical_rust_suite_policy.py ccc9c7701282f9a2a17754bad33dfe5722b8f4f0
          source_pin src/defence_evolution/protected_evaluation_suite_performance.rs 4a57888d64bb37500e70a1be1d8214d672a2e11c
          receipt="$RUNNER_TEMP/suite-policy-tests.private.log"
          python3 -I -B -m unittest discover -s tools/verification -p test_canonical_rust_suite_policy.py >"$receipt" 2>&1
          grep -Eq '^Ran 22 tests in [0-9.]+s$' "$receipt"
          grep -Fx OK "$receipt" >/dev/null
          echo LAS_SOURCE_SUITE_POLICY_TESTS=22/22
          echo "LAS_SOURCE_SUITE_POLICY_LOG_SHA256=$(sha256sum "$receipt" | awk '{print $1}')"
          test -z "$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all)"

      - name: Run privacy-preserving Rust gate matrix
        shell: bash
        run: |
          set -euo pipefail
          cd target
          test_name="$(python3 -I -B tools/verification/canonical_rust_suite_policy.py --mode target)"
          [[ "$test_name" =~ ^[A-Za-z0-9_:]+$ ]]
          failed=0
          run_gate() {
            code="$1"; shift
            log="$RUNNER_TEMP/${code}.private.log"
            set +e
            "$@" >"$log" 2>&1
            rc=$?
            set -e
            # Exact private source owns the skip/measurement evidence rule.
            if [[ "$code" == TEST_* && "$rc" -eq 0 ]]; then
              mode=suite
              if [[ "$code" == TEST_MEASUREMENT_RELEASE ]]; then mode=release-measurement; fi
              receipt="$RUNNER_TEMP/private-native-suite-policy.log"
              if python3 -I -B tools/verification/canonical_rust_suite_policy.py --mode "$mode" "$log" >"$receipt" 2>&1 &&
                 grep -Fx 'LAS_NATIVE_SUITE_RECEIPT=PASS' "$receipt" >/dev/null; then
                echo "LAS_RUST_MATRIX_NATIVE_SUITE_POLICY=PASS"
              else
                echo "LAS_RUST_MATRIX_NATIVE_SUITE_POLICY=REFUSED"
                rc=97
              fi
              echo "LAS_RUST_MATRIX_NATIVE_SUITE_RECEIPT_SHA256=$(sha256sum "$receipt" | awk '{print $1}')"
              rm -f "$receipt"
            fi
            echo "LAS_RUST_MATRIX_${code}_RC=$rc"
            echo "LAS_RUST_MATRIX_${code}_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
            if [[ "$rc" -eq 0 ]]; then
              echo "LAS_RUST_MATRIX_${code}=PASS"
            else
              echo "LAS_RUST_MATRIX_${code}=FAIL"
              failed=$((failed+1))
            fi
            rm -f "$log"
          }
          run_gate FMT cargo +1.98.1 fmt --all -- --check
          run_gate CHECK_DEFAULT env RUSTFLAGS=-Dwarnings cargo +1.98.1 check --locked --all-targets
          run_gate CHECK_LINUX env RUSTFLAGS=-Dwarnings cargo +1.98.1 check --locked --features linux-peer-credentials --all-targets
          run_gate CHECK_ROOT env RUSTFLAGS=-Dwarnings GPRBUILD="$GPRBUILD" cargo +1.98.1 check --locked --features root-ffi --all-targets
          run_gate CHECK_ALL env RUSTFLAGS=-Dwarnings GPRBUILD="$GPRBUILD" cargo +1.98.1 check --locked --all-features --all-targets
          run_gate CLIPPY_DEFAULT cargo +1.98.1 clippy --locked --all-targets -- -D warnings
          run_gate CLIPPY_LINUX cargo +1.98.1 clippy --locked --features linux-peer-credentials --all-targets -- -D warnings
          run_gate CLIPPY_ROOT env GPRBUILD="$GPRBUILD" cargo +1.98.1 clippy --locked --features root-ffi --all-targets -- -D warnings
          run_gate CLIPPY_ALL env GPRBUILD="$GPRBUILD" cargo +1.98.1 clippy --locked --all-features --all-targets -- -D warnings
          run_gate TEST_DEFAULT env RUSTFLAGS=-Dwarnings cargo +1.98.1 test --locked --all-targets -- --test-threads=1
          run_gate TEST_LINUX env RUSTFLAGS=-Dwarnings cargo +1.98.1 test --locked --features linux-peer-credentials --all-targets -- --test-threads=1
          run_gate TEST_ROOT env RUSTFLAGS=-Dwarnings GPRBUILD="$GPRBUILD" cargo +1.98.1 test --locked --features root-ffi --all-targets -- --test-threads=1
          run_gate TEST_ALL env RUSTFLAGS=-Dwarnings GPRBUILD="$GPRBUILD" cargo +1.98.1 test --locked --all-features --all-targets -- --test-threads=1
          run_gate TEST_RELEASE_DEFAULT env RUSTFLAGS=-Dwarnings cargo +1.98.1 test --locked --release --lib -- --test-threads=1
          run_gate TEST_RELEASE_ALL env RUSTFLAGS=-Dwarnings GPRBUILD="$GPRBUILD" cargo +1.98.1 test --locked --release --all-features --lib -- --test-threads=1
          run_gate TEST_MEASUREMENT_RELEASE env RUSTFLAGS=-Dwarnings GPRBUILD="$GPRBUILD" cargo +1.98.1 test --locked --release --all-features --lib "$test_name" -- --exact --ignored --test-threads=1 --nocapture
          echo "LAS_RUST_MATRIX_FAIL_COUNT=$failed"
          test "$failed" -eq 0

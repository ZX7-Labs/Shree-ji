name: Diagnose current exact pre-TLC Rust matrix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-current-pre-tlc-rust-matrix-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REF_HASH: 6c2920c58a71643d7846b5751eff97784d3fee374a43e36da8201bd97cdaafcf
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 748a0995e144d97fe282b68aa3dc88c2e7aedbc3e85976a326d12114b329066c
  EXPECTED_PRIVATE_TREE_PROOF: 6145fd718b21e11e2d817068ad96a61c5a745976d1a6f02a6513a42180d84afd

jobs:
  rust_matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Install exact Rust and Ada build toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null
          ALR_ZIP="$RUNNER_TEMP/alr.zip"; ALR_PREFIX="$RUNNER_TEMP/alr"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --output "$ALR_ZIP" \
            "https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip" >/dev/null 2>&1
          echo "09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  $ALR_ZIP" | sha256sum --check --strict >/dev/null
          mkdir -p "$ALR_PREFIX"; unzip -q "$ALR_ZIP" -d "$ALR_PREFIX"; export PATH="$ALR_PREFIX/bin:$PATH"
          alr -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1 >/dev/null
          ALR_WS="$RUNNER_TEMP/alire-workspace"; mkdir -p "$ALR_WS"
          (cd "$ALR_WS" && alr -n init --in-place --no-skel --lib las_verify_toolchain >/dev/null)
          GPRBUILD_WRAPPER="$RUNNER_TEMP/gprbuild-wrapper"
          cat > "$GPRBUILD_WRAPPER" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$ALR_WS"
          exec "$ALR_PREFIX/bin/alr" exec -- gprbuild "\$@"
          EOF
          chmod +x "$GPRBUILD_WRAPPER"
          echo "GPRBUILD=$GPRBUILD_WRAPPER" >> "$GITHUB_ENV"

      - name: Recover exact private materialized revision
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"; test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"; echo "::add-mask::$PRIVATE_TOKEN"
          mkdir target; cd target; git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          while read -r sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"; matched_ref="$ref"
            fi
          done <"$refs"
          rm -f "$refs"; test -n "$matched_ref"; echo "::add-mask::$matched_ref"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          actual="$(git rev-parse FETCH_HEAD)"; echo "::add-mask::$actual"
          test "$(printf '%s' "$actual" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          git checkout -q --detach "$actual"
          tree="$(git rev-parse 'HEAD^{tree}')"; echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_TREE_PROOF"
          test -z "$(git status --porcelain --untracked-files=no)"
          unset PRIVATE_TOKEN auth matched_ref actual tree
          echo "LAS_RUST_MATRIX_RECOVERY=PASS"

      - name: Run privacy-preserving Rust gate matrix
        shell: bash
        run: |
          set -euo pipefail
          cd target
          failed=0
          run_gate() {
            code="$1"; shift
            log="$RUNNER_TEMP/${code}.private.log"
            set +e
            "$@" >"$log" 2>&1
            rc=$?
            set -e
            # Reuse the exact audited private canonical verifier instead of
            # inventing another libtest grammar. Pin its immutable Git blob
            # against the independently reviewed private source checkout.
            # The controller separately checks the canonical JSON result,
            # count, ignored rows, and internally consistent completion facts.
            # No test names, source content, or raw private logs enter stdout.
            if [[ "$code" == TEST_* && "$rc" -eq 0 ]]; then
              verifier="tools/verification/canonical_rust_test_evidence.py"
              receipt="$RUNNER_TEMP/${code}.native-test-receipt"
              if [[ ! -f "$verifier" || -L "$verifier" ]] ||
                 [[ "$(git -c core.fsmonitor=false hash-object -- "$verifier")" != "0304175fe9aef6b2d5af78e6d3256f9cbd7eecde" ]]; then
                echo "LAS_RUST_MATRIX_TEST_VERIFIER_IDENTITY=REFUSED"
                rc=97
              elif ! python3 -I -B "$verifier" "$log" >"$receipt" 2>/dev/null; then
                # Diagnose only the *shape* of the source-owned refusal.
                # Do not print private test names, paths, stderr or raw log.
                echo "LAS_RUST_MATRIX_TEST_REJECT_STAGE=CANONICAL"
                python3 -I -B - "$receipt" "$code" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          path, gate = Path(sys.argv[1]), sys.argv[2]
          allowed = {"missing-or-malformed-libtest-summary",
                     "zero-passing-or-failed-tests",
                     "missing-or-contradictory-completed-test-rows"}
          if re.fullmatch(r"TEST_[A-Z_]+", gate) and path.is_file():
              data = path.read_bytes()
              if data.startswith(b"LAS_RUST_TEST_EVIDENCE=") and len(data) <= 4096:
                  try:
                      item = json.loads(data.split(b"=", 1)[1])
                      if type(item) is dict:
                          errors = item.get("validation_errors")
                          rows = item.get("observed_test_rows")
                          for error in sorted(set(errors)) if type(errors) is list else []:
                              if error in allowed:
                                  print("LAS_RUST_MATRIX_" + gate + "_SOURCE_REJECT=" + error)
                          for name in ("passed", "failed", "ignored", "summary_records"):
                              value = item.get(name)
                              if type(value) is int and 0 <= value <= 1000000:
                                  print("LAS_RUST_MATRIX_" + gate + "_SOURCE_" + name.upper() + "=" + str(value))
                          if type(rows) is dict:
                              for name in ("started", "ok", "ignored", "failed", "pending"):
                                  value = rows.get(name)
                                  if type(value) is int and 0 <= value <= 1000000:
                                      print("LAS_RUST_MATRIX_" + gate + "_OBSERVED_" + name.upper() + "=" + str(value))
                  except (ValueError, TypeError, UnicodeError):
                      pass
          PY
                echo "LAS_RUST_MATRIX_TEST_RECEIPT=REFUSED"
                rc=97
              elif ! python3 -I -B - "$receipt" "$code" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          path, gate = Path(sys.argv[1]), sys.argv[2]
          if not re.fullmatch(r"TEST_[A-Z_]+", gate) or not path.is_file():
              raise SystemExit("ERROR: invalid native test receipt identity")
          data = path.read_bytes()
          prefix = b"LAS_RUST_TEST_EVIDENCE="
          if not 0 < len(data) <= 4096 or not data.startswith(prefix) or not data.endswith(b"\n"):
              raise SystemExit("ERROR: invalid native test receipt encoding")
          def unique(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("duplicate receipt key")
                  result[key] = value
              return result
          result = json.loads(data[len(prefix):], object_pairs_hook=unique)
          required = {"nonvacuous", "validation_errors", "passed", "failed", "ignored",
                      "summary_records", "observed_test_rows", "selected_test_names"}
          if type(result) is not dict or set(result) != required:
              raise SystemExit("ERROR: malformed native test receipt")
          rows = result["observed_test_rows"]
          if type(rows) is not dict or set(rows) != {"started", "ok", "ignored", "failed", "pending"}:
              raise SystemExit("ERROR: malformed test row census")
          numbers = [result["passed"], result["failed"], result["ignored"], result["summary_records"]]
          if any(type(x) is not int for x in numbers):
              raise SystemExit("ERROR: noninteger test summary census")
          if any(type(x) is not int for x in rows.values()):
              raise SystemExit("ERROR: noninteger completion census")
          if (result["nonvacuous"] is not True or result["validation_errors"] != []
                  or result["selected_test_names"] is not None
                  or result["passed"] < 10 or result["failed"] != 0 or result["ignored"] != 0
                  or result["summary_records"] < 1 or rows["ok"] != result["passed"]
                  or rows["started"] < rows["ok"] or rows["ignored"] != 0
                  or rows["failed"] != 0 or rows["pending"] != 0):
              raise SystemExit("ERROR: vacuous, skipped or inconsistent native test receipt")
          print("LAS_RUST_MATRIX_" + gate + "_NONVACUOUS=PASS")
          print("LAS_RUST_MATRIX_" + gate + "_PASSED_TESTS=" + str(result["passed"]))
          print("LAS_RUST_MATRIX_" + gate + "_SUMMARY_GROUPS=" + str(result["summary_records"]))
          PY
              then
                echo "LAS_RUST_MATRIX_TEST_REJECT_STAGE=PUBLIC_STRUCTURED_RECEIPT"
                echo "LAS_RUST_MATRIX_TEST_RECEIPT=REFUSED"
                rc=97
              fi
              rm -f "$receipt"
            fi
            echo "LAS_RUST_MATRIX_${code}_RC=$rc"
            echo "LAS_RUST_MATRIX_${code}_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
            if [[ "$rc" -eq 0 ]]; then
              echo "LAS_RUST_MATRIX_${code}=PASS"
            else
              echo "LAS_RUST_MATRIX_${code}=FAIL"
              failed=$((failed+1))
            fi
            rm -f "$log"
          }
          run_gate FMT cargo +1.98.1 fmt --all -- --check
          run_gate CHECK_DEFAULT env RUSTFLAGS=-Dwarnings cargo +1.98.1 check --locked --all-targets
          run_gate CHECK_LINUX env RUSTFLAGS=-Dwarnings cargo +1.98.1 check --locked --features linux-peer-credentials --all-targets
          run_gate CHECK_ROOT env RUSTFLAGS=-Dwarnings GPRBUILD="$GPRBUILD" cargo +1.98.1 check --locked --features root-ffi --all-targets
          run_gate CHECK_ALL env RUSTFLAGS=-Dwarnings GPRBUILD="$GPRBUILD" cargo +1.98.1 check --locked --all-features --all-targets
          run_gate CLIPPY_DEFAULT cargo +1.98.1 clippy --locked --all-targets -- -D warnings
          run_gate CLIPPY_LINUX cargo +1.98.1 clippy --locked --features linux-peer-credentials --all-targets -- -D warnings
          run_gate CLIPPY_ROOT env GPRBUILD="$GPRBUILD" cargo +1.98.1 clippy --locked --features root-ffi --all-targets -- -D warnings
          run_gate CLIPPY_ALL env GPRBUILD="$GPRBUILD" cargo +1.98.1 clippy --locked --all-features --all-targets -- -D warnings
          run_gate TEST_DEFAULT env RUSTFLAGS=-Dwarnings cargo +1.98.1 test --locked --all-targets -- --test-threads=1
          run_gate TEST_LINUX env RUSTFLAGS=-Dwarnings cargo +1.98.1 test --locked --features linux-peer-credentials --all-targets -- --test-threads=1
          run_gate TEST_ROOT env RUSTFLAGS=-Dwarnings GPRBUILD="$GPRBUILD" cargo +1.98.1 test --locked --features root-ffi --all-targets -- --test-threads=1
          run_gate TEST_ALL env RUSTFLAGS=-Dwarnings GPRBUILD="$GPRBUILD" cargo +1.98.1 test --locked --all-features --all-targets -- --test-threads=1
          run_gate TEST_RELEASE_DEFAULT env RUSTFLAGS=-Dwarnings cargo +1.98.1 test --locked --release --lib -- --test-threads=1
          run_gate TEST_RELEASE_ALL env RUSTFLAGS=-Dwarnings GPRBUILD="$GPRBUILD" cargo +1.98.1 test --locked --release --all-features --lib -- --test-threads=1
          echo "LAS_RUST_MATRIX_FAIL_COUNT=$failed"
          test "$failed" -eq 0

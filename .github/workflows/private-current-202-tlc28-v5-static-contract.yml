name: Private current-202 TLC28 v5 static contract

on:
  push:
    branches: [current-202-tlc28-v5-experiment-attestation]
    paths:
      - "RUN_CURRENT_202_TLC28_V5_STATIC_CONTRACT"

permissions:
  contents: read

concurrency:
  group: current-202-tlc28-v5-static-contract
  cancel-in-progress: false

env:
  V4_RUNNER_SHA: 3d37edb1debc9a4dd32da51ec3164840dbc4b252
  V5_RUNNER_SHA: dc7221eb78f71256fde7e532145de21cb3b3aa66
  WRAPPER_PATH: .github/workflows/private-assurance-slow-tlc-continuation.yml
  SLICE_PATH: .github/workflows/_private-assurance-tlc-continuation-slice.yml
  V4_WRAPPER_BLOB: 70b8c18144f55625460e86337e8c5999a699facf
  V4_SLICE_BLOB: 30f44487a8d433045bfc5c3310aa7356a5b8d2ea
  V5_WRAPPER_BLOB: df1a4ef27481e378b32b72c01dc945e94f6010b7
  V5_SLICE_BLOB: 646b27926b4f934369158d93a601f600e9b24ea4

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify exact v4 and v5 runner bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          for spec in \
            "v4-wrapper|$V4_RUNNER_SHA|$WRAPPER_PATH|$V4_WRAPPER_BLOB" \
            "v4-slice|$V4_RUNNER_SHA|$SLICE_PATH|$V4_SLICE_BLOB" \
            "v5-wrapper|$V5_RUNNER_SHA|$WRAPPER_PATH|$V5_WRAPPER_BLOB" \
            "v5-slice|$V5_RUNNER_SHA|$SLICE_PATH|$V5_SLICE_BLOB"; do
            IFS='|' read -r label ref path expected_blob <<<"$spec"
            encoded_path="$(python3 - "$path" <<'PY'
          import sys, urllib.parse
          print(urllib.parse.quote(sys.argv[1], safe='/'))
          PY
          )"
            json="$RUNNER_TEMP/$label.json"
            out="$RUNNER_TEMP/$label.yml"
            curl --proto '=https' --tlsv1.2 --fail-with-body -sS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api/contents/$encoded_path?ref=$ref" >"$json"
            python3 - "$json" "$expected_blob" "$out" <<'PY'
          import base64, json, sys
          src, expected, out = sys.argv[1:]
          data=json.load(open(src, encoding="utf-8"))
          if data.get("sha") != expected:
              raise SystemExit("unexpected workflow blob")
          content=base64.b64decode(data.get("content",""), validate=False)
          open(out,"wb").write(content)
          PY
          done
          echo "LAS_CURRENT_202_V5_STATIC_EXACT_BYTES=PASS"

      - name: Verify unchanged TLC semantics and explicit migration boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - \
            "$RUNNER_TEMP/v4-slice.yml" "$RUNNER_TEMP/v5-slice.yml" \
            "$RUNNER_TEMP/v4-wrapper.yml" "$RUNNER_TEMP/v5-wrapper.yml" <<'PY'
          from pathlib import Path
          import re, sys

          v4s, v5s, v4w, v5w = [Path(p).read_text(encoding="utf-8") for p in sys.argv[1:]]

          shared_exact = [
              'EXPECTED_PRIVATE_SNAPSHOT_PROOF: 1b139dc7920e82d5f9bdd2a68c072ad88bc0049d5ef1377380899164da5f93f9',
              'EXPECTED_PRIVATE_TREE_PROOF: 7fb364587ed7c9f76d8fd9f69cb4a4d58e576a44a1e653d019c8114ccb65353f',
              'EXPECTED_VERIFIER_BLOB: 62e3e6dc0fad5dddc7fb0a453a3cd681d911e590',
              'EXPECTED_TLC_MAP_SHA256: da7bb51d531d0e5e5e6994c80be8f254a110cb8181e6121e3a557fdff9428cee',
              'EXPECTED_TLA_JAR_SHA1: bee4a54f3ee3d4afc347c3240ec2d9e93b075104',
              'TLC_WORKERS: "4"',
              'SLICE_SECONDS: "16800"',
              'CHECKPOINT_GRACE_SECONDS: "900"',
              'INITIAL_MIN_FREE_KB: "67108864"',
              'MIN_FREE_KB: "50331648"',
              'JAVA_TOOL_OPTIONS: -Xmx5g',
              'args=(-workers "$TLC_WORKERS" -lncheck final -fp 0 -checkpoint 5 -metadir "$meta")',
              '[[ "$deadlock" != "1" ]] || args+=(-deadlock)',
              'args+=(-config "$cfg_base" "$tla_base")',
              '(cd "$cfg_dir"; exec java -XX:+UseParallelGC -jar "$TLA_JAR" "${args[@]}") >"$log" 2>&1 &',
              'if (( now >= deadline || free_kb <= MIN_FREE_KB )); then',
              'if (( free_kb <= MIN_FREE_KB )); then cut_reason="storage"; else cut_reason="time"; fi',
          ]
          for needle in shared_exact:
              if needle not in v4s or needle not in v5s:
                  raise SystemExit(f"shared TLC contract drift: {needle}")

          severe_re = re.compile(r"severe='([^']+)'")
          v4_severe=severe_re.search(v4s)
          v5_severe=severe_re.search(v5s)
          if not v4_severe or not v5_severe or v4_severe.group(1) != v5_severe.group(1):
              raise SystemExit("severe failure classifier drift")

          forbidden_v5 = [
              '-simulate',
              'TLC_WORKERS: "1"',
              'TLC_WORKERS: "2"',
              'TLC_WORKERS: "8"',
              'MIN_FREE_KB: "12582912"',
          ]
          for needle in forbidden_v5:
              if needle in v5s:
                  raise SystemExit(f"forbidden semantic/resource weakening: {needle}")

          required_v5 = [
              'EXPECTED_PROFILE_BINDING_SHA256: 8d281f3bc8b39b1f8ee88d692d7548a137af9194c9cce39acf675374ca36ee65',
              'EXPECTED_JAVA_FINGERPRINT: 3c5fc3a0a04ae9bdc453367fd84cbb268fa5dd467c674685f1db682c705b0ad4',
              'CHECKPOINT_SCHEMA: "current-202-periodic-barrier-v5-storage-repair-exp1"',
              'LEGACY_CHECKPOINT_SCHEMA: "current-202-periodic-barrier-v4"',
              'LEGACY_RUNNER_SHA: "3d37edb1debc9a4dd32da51ec3164840dbc4b252"',
              'LINEAGE_RUN_ID: "38889300529"',
              'LINEAGE_SEGMENT: "13"',
              'LINEAGE_ARTIFACT: "current-202-v4-state-28-13"',
              'test "$actual_mac" = "$expected_mac"',
              'grep -qx "schema=$source_schema" "$manifest"',
              'grep -qx "runner=$source_runner" "$manifest"',
              'grep -qx "profile=$PROFILE_BINDING_SHA256" "$manifest"',
              'rm -rf "$RUNNER_TEMP/resume"',
              'test ! -e "$RUNNER_TEMP/resume"',
              'test "$free_after_cleanup" -gt "$free_before_cleanup"',
              'test "$free_after_cleanup" -gt "$MIN_FREE_KB"',
              'lineage_runner=%s',
              'lineage_run=%s',
              'lineage_segment=%s',
          ]
          for needle in required_v5:
              if needle not in v5s:
                  raise SystemExit(f"missing v5 migration/storage contract: {needle}")

          required_wrapper = [
              'current-202-tlc28-v5-storage-repair-experiment',
              'test "$continuation_sha" = "$GITHUB_SHA"',
              '38889300529',
              'current-202-v4-state-28-13',
              'LAS_CURRENT_202_V5_ORCHESTRATOR_GENERATION=$RESUME_GENERATION',
              'resume_generation:',
          ]
          for needle in required_wrapper:
              if needle not in v5w:
                  raise SystemExit(f"missing v5 orchestrator contract: {needle}")

          if 'current-202-periodic-barrier-v5-storage-repair-exp1' in v4s:
              raise SystemExit("v4 source unexpectedly contains v5 schema")
          if 'rm -rf "$RUNNER_TEMP/resume"' in v4s:
              raise SystemExit("v4 baseline unexpectedly contains transport cleanup")

          print("LAS_CURRENT_202_V5_STATIC_TLC_SEMANTICS=PASS")
          print("LAS_CURRENT_202_V5_STATIC_MIGRATION_BOUNDARY=PASS")
          print("LAS_CURRENT_202_V5_STATIC_STORAGE_REPAIR=PASS")
          PY

name: Candidate3 exact resumable TLC39 continuation 20261016

on:
  workflow_dispatch:
    inputs:
      index:
        description: Exact candidate3 canonical TLC profile index; must be 39
        required: true
        default: "39"
        type: string
      segment:
        description: Exact continuation segment number
        required: true
        default: "1"
        type: string
      resume_run_id:
        description: Prior candidate3 TLC39 checkpoint-producing workflow run
        required: false
        default: ""
        type: string
      resume_artifact:
        description: Prior authenticated encrypted candidate3 TLC39 checkpoint artifact
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: candidate3-resumable-tlc39
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TARGET_INDEX: ${{ inputs.index }}
      SEGMENT: ${{ inputs.segment }}
      RESUME_RUN_ID: ${{ inputs.resume_run_id }}
      RESUME_ARTIFACT: ${{ inputs.resume_artifact }}
      CONTINUATION_REF: verify/candidate3-resumable-tlc-20261016
    steps:
      - name: Validate candidate3 TLC39 continuation request
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$CONTINUATION_REF"
          test "$TARGET_INDEX" = 39
          [[ "$SEGMENT" =~ ^[0-9]+$ ]]
          test "$SEGMENT" -ge 1
          if [[ "$SEGMENT" -eq 1 ]]; then
            test -z "$RESUME_RUN_ID"
            test -z "$RESUME_ARTIFACT"
          else
            [[ "$RESUME_RUN_ID" =~ ^[0-9]+$ ]]
            test "$RESUME_ARTIFACT" = "candidate3-resume-state-39-$((SEGMENT - 1))"
          fi
          echo "LAS_CANDIDATE3_TLC39_ORCHESTRATOR_REQUEST=PASS"

  continuation:
    needs: validate
    uses: ./.github/workflows/_private-candidate3-resumable-tlc-slice-20261016.yml
    with:
      index: 39
      segment: ${{ fromJSON(inputs.segment) }}
      resume_run_id: ${{ inputs.resume_run_id }}
      resume_artifact: ${{ inputs.resume_artifact }}
      mode: profile39
    secrets: inherit

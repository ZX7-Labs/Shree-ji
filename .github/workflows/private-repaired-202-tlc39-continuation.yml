name: Repaired exact 202 TLC39 continuation (default branch retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired-default-branch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject default-branch TLC39 continuation
        shell: bash
        run: |
          set -euo pipefail
          echo "LAS_REPAIRED_202_TLC39_DEFAULT_BRANCH=RETIRED"
          echo "Canonical TLC39 execution is bound exclusively to repaired-202-tlc39-v3-runner and its frozen workflow revision."
          exit 1

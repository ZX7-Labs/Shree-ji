name: Private slow TLC resumable verification

on:
  push:
    branches: [main]
    paths:
      - "RUN_SLOW_TLC_CONTINUATION"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject obsolete 129-profile continuation
        shell: bash
        run: |
          set -euo pipefail
          echo "LAS_PRIVATE_SLOW_TLC_CONTINUATION=RETIRED"
          echo "Current assurance uses only the repaired 202-profile V4 generic continuation and dedicated TLC39 continuation."
          exit 1

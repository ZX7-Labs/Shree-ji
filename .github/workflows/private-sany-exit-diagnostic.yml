name: Private SANY exit diagnostic

on:
  push:
    branches: [main]
    paths:
      - "RUN_SANY_EXIT_DIAG"

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject obsolete SANY diagnostic
        shell: bash
        run: |
          set -euo pipefail
          echo "LAS_SANY_EXIT_DIAG=RETIRED"
          echo "This diagnostic is bound to a historical 129-profile candidate and is not evidence for the repaired current 202-profile closure."
          exit 1

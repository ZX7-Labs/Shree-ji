name: Exact private final gate 20261014-07

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/exact-private-final-gate-20261014-07.yml"

permissions:
  contents: read

env:
  TARGET_REF_HASH: 28a52175bfc55f4f8b2b0f4312cd2616a65a7082555149f4382746e2254e1b26
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 4df9c3eecec183892da9f280dcb5c88fb8faae1049da7a2aadcd6b27f986801d
  EXPECTED_PRIVATE_TREE_PROOF: be7c6ec02d5b0813512ad98dccad4bedc066526b59c06fa69e52fcfa6f75d82f

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null
          test "$(rustc +1.98.1 --version | awk '{print $2}')" = "1.98.1"
          test "$(cargo +1.98.1 --version | awk '{print $2}')" = "1.98.1"
          echo "LAS_FINAL07_TOOLCHAIN=PASS"

      - name: Recover exact private revision opaquely
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"; test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"; echo "::add-mask::$PRIVATE_TOKEN"
          root="$RUNNER_TEMP/private-target"; mkdir "$root"; cd "$root"; git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"; echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""; private_head=""
          while read -r candidate_sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"; matched_ref="$ref"; private_head="$candidate_sha"
            fi
          done <"$refs"
          rm -f "$refs"; test -n "$matched_ref"; test -n "$private_head"
          echo "::add-mask::$matched_ref"; echo "::add-mask::$private_head"
          test "$(printf '%s' "$private_head" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$private_head"
          git checkout -q --detach "$private_head"
          tree="$(git rev-parse 'HEAD^{tree}')"; echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_TREE_PROOF"
          test -z "$(git status --porcelain)"
          echo "LAS_FINAL07_EXACT_RECOVERY=PASS"

      - name: Diagnose formatting delta without publishing source
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.expected"
          cargo +1.98.1 generate-lockfile >/dev/null 2>&1
          cmp --silent Cargo.lock "$RUNNER_TEMP/Cargo.lock.expected"
          git checkout -q -- Cargo.lock
          cargo +1.98.1 fmt --all >/dev/null 2>&1
          changed="$(git diff --name-only | wc -l | tr -d ' ')"
          echo "FORMAT_FILE_COUNT=$changed"
          git diff --numstat | awk '{printf "FORMAT_STATS added=%s deleted=%s\n", $1, $2}'
          git diff --unified=0 --no-color | sed -nE 's/^@@ -([0-9]+(,[0-9]+)?) \+([0-9]+(,[0-9]+)?) @@.*$/FORMAT_HUNK old=\1 new=\3/p'
          test "$changed" -eq 0
          echo "LAS_FINAL07_STATIC=PASS"

      - name: Compile default and Linux targets
        shell: bash
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          cargo +1.98.1 check --locked --all-targets >/dev/null 2>&1
          cargo +1.98.1 check --locked --all-targets --features linux-peer-credentials >/dev/null 2>&1
          test -z "$(git status --porcelain)"
          echo "LAS_FINAL07_COMPILE=PASS"

      - name: Lint default and Linux targets
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          cargo +1.98.1 clippy --locked --all-targets -- -D warnings >/dev/null 2>&1
          cargo +1.98.1 clippy --locked --all-targets --features linux-peer-credentials -- -D warnings >/dev/null 2>&1
          test -z "$(git status --porcelain)"
          echo "LAS_FINAL07_CLIPPY=PASS"

      - name: Verify guarded resumability boundary
        shell: bash
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          cargo +1.98.1 test --locked --features linux-peer-credentials --lib effect_fabric::root_supervisor_linux_guarded_resumability_tests -- --test-threads=1 >/dev/null 2>&1
          cargo +1.98.1 test --locked --features linux-peer-credentials --lib effect_fabric::root_supervisor_linux_channel::tests:: -- --test-threads=1 >/dev/null 2>&1
          test -z "$(git status --porcelain)"
          echo "LAS_FINAL07_FOCUSED=PASS"

      - name: Verify full deterministic and Linux matrices
        shell: bash
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          cargo +1.98.1 test --locked --all-targets -- --test-threads=1 >/dev/null 2>&1
          cargo +1.98.1 test --locked --all-targets --features linux-peer-credentials -- --test-threads=1 >/dev/null 2>&1
          cargo +1.98.1 test --locked --release --features linux-peer-credentials --lib effect_fabric::root_supervisor_ -- --test-threads=1 >/dev/null 2>&1
          cargo +1.98.1 fmt --all -- --check >/dev/null 2>&1
          test -z "$(git status --porcelain)"
          echo "LAS_FINAL07_FULL=PASS"

      - name: Enforce immutable exact revision result
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          test "$(printf '%s' "$(git rev-parse HEAD)" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          test "$(printf '%s' "$(git rev-parse 'HEAD^{tree}')" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_TREE_PROOF"
          test -z "$(git status --porcelain)"
          echo "LAS_FINAL07_EXACT_GATE=PASS"

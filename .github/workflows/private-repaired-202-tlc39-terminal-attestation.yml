name: Repaired exact 202 TLC39 terminal attestation

on:
  push:
    branches: [main]
    paths:
      - "RUN_REPAIRED_202_TLC39_TERMINAL_ATTEST"
  workflow_dispatch:
    inputs:
      terminal_run_id:
        description: Completed TLC39 continuation run that claims terminal PASS
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: repaired-202-exact-tlc39-terminal-attestation
  cancel-in-progress: false

env:
  TARGET_REF_HASH: 28a52175bfc55f4f8b2b0f4312cd2616a65a7082555149f4382746e2254e1b26
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 1b139dc7920e82d5f9bdd2a68c072ad88bc0049d5ef1377380899164da5f93f9
  EXPECTED_PRIVATE_TREE_PROOF: 7fb364587ed7c9f76d8fd9f69cb4a4d58e576a44a1e653d019c8114ccb65353f
  EXPECTED_VERIFIER_BLOB: 62e3e6dc0fad5dddc7fb0a453a3cd681d911e590
  EXPECTED_TLC_MAP_SHA256: da7bb51d531d0e5e5e6994c80be8f254a110cb8181e6121e3a557fdff9428cee
  EXPECTED_INDEX39_CFG_SHA256: 186ddf4cbea68ae055b349ed7bb808aad5ed0146b3618b99754efa46c735e092
  EXPECTED_INDEX39_TLA_SHA256: 391c62071a571370904c26fdb39c647e1a17e7869a71072cd8e59a8f4967f0c1
  EXPECTED_RUNNER_SHA: d806afec7b4eb903febea33c595365322cd9652b
  EXPECTED_RUNNER_REF: repaired-202-tlc39-v3-runner
  EXPECTED_CONTINUATION_WORKFLOW_BLOB: 44986289bf12aec99e8359b7348401bc061b015d
  EXPECTED_CONTINUATION_WORKFLOW_PATH: .github/workflows/private-repaired-202-tlc39-continuation.yml
  EXPECTED_CHECKPOINT_SCHEMA: periodic-barrier-v3
  EXPECTED_TLC_WORKERS: "4"
  TERMINAL_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.terminal_run_id || '' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      terminal_run_id: ${{ steps.request.outputs.terminal_run_id }}
      segment: ${{ steps.terminal.outputs.segment }}
      terminal_job_id: ${{ steps.terminal.outputs.job_id }}
      terminal_job_log_sha256: ${{ steps.terminal.outputs.job_log_sha256 }}
      tlc_log_sha256: ${{ steps.terminal.outputs.tlc_log_sha256 }}
      generated: ${{ steps.terminal.outputs.generated }}
      distinct: ${{ steps.terminal.outputs.distinct }}
      queued: ${{ steps.terminal.outputs.queued }}
      cut_reason: ${{ steps.terminal.outputs.cut_reason }}
    steps:
      - name: Checkout attestation request
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Validate terminal attestation request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          requested="$TERMINAL_RUN_ID"
          if [[ "$GITHUB_EVENT_NAME" = "push" ]]; then
            test -f RUN_REPAIRED_202_TLC39_TERMINAL_ATTEST
            requested="$(tr -d '[:space:]' < RUN_REPAIRED_202_TLC39_TERMINAL_ATTEST)"
          fi
          [[ "$requested" =~ ^[1-9][0-9]*$ ]]
          echo "TERMINAL_RUN_ID=$requested" >>"$GITHUB_ENV"
          echo "terminal_run_id=$requested" >>"$GITHUB_OUTPUT"
          echo "LAS_REPAIRED_202_TLC39_ATTEST_REQUEST=PASS"

      - name: Revalidate exact frozen private candidate
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          ROOT="$GITHUB_WORKSPACE/private-target"
          mkdir "$ROOT"
          cd "$ROOT"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          while read -r sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          echo "::add-mask::$matched_ref"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          actual="$(git rev-parse FETCH_HEAD)"
          echo "::add-mask::$actual"
          test "$(printf '%s' "$actual" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          git checkout -q --detach "$actual"
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_TREE_PROOF"
          test "$(git hash-object tools/verify_codespaces_all.sh)" = "$EXPECTED_VERIFIER_BLOB"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "LAS_REPAIRED_202_TLC39_ATTEST_PRIVATE_BINDING=PASS"
          unset PRIVATE_TOKEN auth matched_ref actual tree

      - name: Verify exact terminal continuation run
        id: terminal
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          run_json="$RUNNER_TEMP/terminal-run.json"
          jobs_json="$RUNNER_TEMP/terminal-jobs.json"
          workflow_json="$RUNNER_TEMP/terminal-workflow.json"
          log="$RUNNER_TEMP/terminal-job.log"
          curl --proto '=https' --tlsv1.2 --fail-with-body -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api/actions/runs/$TERMINAL_RUN_ID" >"$run_json"
          python3 - "$run_json" "$EXPECTED_RUNNER_SHA" "$EXPECTED_RUNNER_REF" "$EXPECTED_CONTINUATION_WORKFLOW_PATH" <<'PY'
          import json, sys
          path, runner_sha, runner_ref, workflow_path = sys.argv[1:]
          data = json.load(open(path, encoding="utf-8"))
          if data.get("status") != "completed" or data.get("conclusion") != "success":
              raise SystemExit("terminal run is not completed success")
          if data.get("run_attempt") != 1 or data.get("head_sha") != runner_sha or data.get("path") != workflow_path:
              raise SystemExit("terminal run revision binding mismatch")
          event = data.get("event")
          branch = data.get("head_branch")
          if event == "push":
              if branch != "main":
                  raise SystemExit("terminal push run is not bound to main")
          elif event == "workflow_dispatch":
              if branch != runner_ref:
                  raise SystemExit("terminal continuation run is not bound to stable runner ref")
          else:
              raise SystemExit("unexpected terminal run event")
          PY
          encoded_path="$(python3 - "$EXPECTED_CONTINUATION_WORKFLOW_PATH" <<'PY'
          import sys, urllib.parse
          print(urllib.parse.quote(sys.argv[1], safe='/'))
          PY
          )"
          curl --proto '=https' --tlsv1.2 --fail-with-body -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api/contents/$encoded_path?ref=$EXPECTED_RUNNER_SHA" >"$workflow_json"
          actual_workflow_blob="$(python3 - "$workflow_json" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1], encoding="utf-8")).get("sha", ""))
          PY
          )"
          test "$actual_workflow_blob" = "$EXPECTED_CONTINUATION_WORKFLOW_BLOB"
          curl --proto '=https' --tlsv1.2 --fail-with-body -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api/actions/runs/$TERMINAL_RUN_ID/jobs?per_page=100" >"$jobs_json"
          read -r job_id segment_mode < <(
            python3 - "$jobs_json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          jobs = data.get("jobs", [])
          if data.get("total_count") != 1 or len(jobs) != 1 or jobs[0].get("name") != "slice":
              raise SystemExit("terminal run must contain exactly one slice job")
          job = jobs[0]
          if job.get("status") != "completed" or job.get("conclusion") != "success":
              raise SystemExit("terminal slice job is not successful")
          steps = {s.get("name"): (s.get("status"), s.get("conclusion")) for s in job.get("steps", [])}
          required = ("Validate exact continuation request", "Reclaim runner storage for exhaustive TLC", "Recover exact frozen repaired candidate", "Bind exact canonical map and profile 39", "Run exact canonical TLC39 slice")
          for name in required:
              if steps.get(name) != ("completed", "success"):
                  raise SystemExit(f"required terminal step not successful: {name}")
          for name in ("Seal authenticated encrypted checkpoint", "Upload authenticated encrypted checkpoint", "Dispatch next exact slice"):
              if steps.get(name) != ("completed", "skipped"):
                  raise SystemExit(f"terminal PASS unexpectedly continued checkpoint chain: {name}")
          download = steps.get("Download prior authenticated encrypted checkpoint")
          restore = steps.get("Authenticate and restore prior checkpoint")
          if download == ("completed", "skipped") and restore == ("completed", "skipped"):
              mode = "initial"
          elif download == ("completed", "success") and restore == ("completed", "success"):
              mode = "resumed"
          else:
              raise SystemExit("checkpoint restore steps are inconsistent")
          print(job["id"], mode)
          PY
          )
          [[ "$job_id" =~ ^[1-9][0-9]*$ ]]
          curl --proto '=https' --tlsv1.2 --fail-with-body -sSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api/actions/jobs/$job_id/logs" >"$log"
          read -r segment tlc_log_sha256 generated distinct queued cut_reason < <(
            python3 - "$log" "$segment_mode" "$EXPECTED_CHECKPOINT_SCHEMA" "$EXPECTED_TLC_WORKERS" <<'PY'
          import re, sys
          path, mode, schema, workers = sys.argv[1:]
          stamp = re.compile(r'^\d{4}-\d{2}-\d{2}T\S+Z (.*)$')
          emitted = []
          for line in open(path, encoding="utf-8", errors="replace"):
              match = stamp.match(line.rstrip("\n"))
              if match:
                  emitted.append(match.group(1))
          required = {
              "LAS_REPAIRED_202_TLC39_REQUEST=PASS",
              f"LAS_REPAIRED_202_TLC39_CHECKPOINT_SCHEMA={schema}",
              f"LAS_REPAIRED_202_TLC39_WORKERS={workers}",
              "LAS_REPAIRED_202_TLC39_RECOVERY=PASS",
              "LAS_REPAIRED_202_TLC39_BINDING=PASS",
              "LAS_REPAIRED_202_TLC39_RC=0",
              "LAS_REPAIRED_202_TLC39_RESULT=PASS",
          }
          if required.difference(emitted):
              raise SystemExit("missing emitted terminal PASS markers")
          forbidden = (
              "LAS_REPAIRED_202_TLC39_RESULT=FAIL",
              "LAS_REPAIRED_202_TLC39_RESULT=FAIL_CLOSED",
              "LAS_REPAIRED_202_TLC39_RESULT=FAIL_BARRIER",
              "LAS_REPAIRED_202_TLC39_RESULT=SLICE_CHECKPOINT",
              "LAS_REPAIRED_202_TLC39_BARRIER_TIMEOUT=1",
          )
          if any(line.startswith(forbidden) for line in emitted):
              raise SystemExit("terminal log contains non-PASS TLC39 evidence")
          def one(pattern, label):
              values = [m.group(1) for line in emitted if (m := re.fullmatch(pattern, line))]
              if len(values) != 1:
                  raise SystemExit(f"missing or ambiguous {label}")
              return values[0]
          segment = int(one(r'LAS_REPAIRED_202_TLC39_SEGMENT=([1-9][0-9]*)', "segment"))
          tlc_log_sha = one(r'LAS_REPAIRED_202_TLC39_LOG_SHA256=([0-9a-f]{64})', "TLC log digest")
          generated = int(one(r'LAS_REPAIRED_202_TLC39_GENERATED=([0-9]+)', "generated count"))
          distinct = int(one(r'LAS_REPAIRED_202_TLC39_DISTINCT=([0-9]+)', "distinct count"))
          queued = int(one(r'LAS_REPAIRED_202_TLC39_QUEUE=([0-9]+)', "queue count"))
          cut_reason = one(r'LAS_REPAIRED_202_TLC39_CUT_REASON=([a-z]+)', "cut reason")
          if mode == "initial":
              if segment != 1:
                  raise SystemExit("initial terminal run is not segment 1")
          else:
              if segment <= 1:
                  raise SystemExit("resumed terminal run has invalid segment")
              for marker in ("LAS_REPAIRED_202_TLC39_CHECKPOINT_AUTH=PASS", "LAS_REPAIRED_202_TLC39_RECOVER_DIR=PASS"):
                  if marker not in emitted:
                      raise SystemExit("resumed terminal run lacks authenticated recovery evidence")
          print(segment, tlc_log_sha, generated, distinct, queued, cut_reason)
          PY
          )
          job_log_sha256="$(sha256sum "$log" | awk '{print $1}')"
          echo "segment=$segment" >>"$GITHUB_OUTPUT"
          echo "job_id=$job_id" >>"$GITHUB_OUTPUT"
          echo "job_log_sha256=$job_log_sha256" >>"$GITHUB_OUTPUT"
          echo "tlc_log_sha256=$tlc_log_sha256" >>"$GITHUB_OUTPUT"
          echo "generated=$generated" >>"$GITHUB_OUTPUT"
          echo "distinct=$distinct" >>"$GITHUB_OUTPUT"
          echo "queued=$queued" >>"$GITHUB_OUTPUT"
          echo "cut_reason=$cut_reason" >>"$GITHUB_OUTPUT"
          echo "LAS_REPAIRED_202_TLC39_TERMINAL_RUN=PASS"
          rm -f "$run_json" "$jobs_json" "$workflow_json" "$log"

  record:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TERMINAL_RUN_ID: ${{ needs.verify.outputs.terminal_run_id }}
      TERMINAL_SEGMENT: ${{ needs.verify.outputs.segment }}
      TERMINAL_JOB_ID: ${{ needs.verify.outputs.terminal_job_id }}
      TERMINAL_JOB_LOG_SHA256: ${{ needs.verify.outputs.terminal_job_log_sha256 }}
      TLC_LOG_SHA256: ${{ needs.verify.outputs.tlc_log_sha256 }}
      GENERATED: ${{ needs.verify.outputs.generated }}
      DISTINCT: ${{ needs.verify.outputs.distinct }}
      QUEUED: ${{ needs.verify.outputs.queued }}
      CUT_REASON: ${{ needs.verify.outputs.cut_reason }}
    steps:
      - name: Checkout latest public control shell
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Record durable non-sensitive terminal attestation
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TERMINAL_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          git fetch -q origin main
          git checkout -q -B tlc39-terminal-attestation origin/main
          cat > LAS_REPAIRED_202_TLC39_TERMINAL.json <<EOF
          {
            "schema": "las-repaired-202-tlc39-terminal-v2",
            "private_snapshot_proof": "$EXPECTED_PRIVATE_SNAPSHOT_PROOF",
            "private_tree_proof": "$EXPECTED_PRIVATE_TREE_PROOF",
            "canonical_verifier_blob": "$EXPECTED_VERIFIER_BLOB",
            "tlc_map_sha256": "$EXPECTED_TLC_MAP_SHA256",
            "profile_index": 39,
            "cfg_sha256": "$EXPECTED_INDEX39_CFG_SHA256",
            "tla_sha256": "$EXPECTED_INDEX39_TLA_SHA256",
            "runner_sha": "$EXPECTED_RUNNER_SHA",
            "continuation_workflow_blob": "$EXPECTED_CONTINUATION_WORKFLOW_BLOB",
            "terminal_run_id": $TERMINAL_RUN_ID,
            "terminal_job_id": $TERMINAL_JOB_ID,
            "terminal_segment": $TERMINAL_SEGMENT,
            "terminal_job_log_sha256": "$TERMINAL_JOB_LOG_SHA256",
            "tlc_log_sha256": "$TLC_LOG_SHA256",
            "states_generated": $GENERATED,
            "distinct_states": $DISTINCT,
            "states_left_on_queue": $QUEUED,
            "cut_reason": "$CUT_REASON",
            "result": "PASS"
          }
          EOF
          git add LAS_REPAIRED_202_TLC39_TERMINAL.json
          if git diff --cached --quiet; then
            echo "LAS_REPAIRED_202_TLC39_TERMINAL_ATTESTATION=UNCHANGED"
            exit 0
          fi
          git -c user.name='LAS Verification Attestor' \
              -c user.email='las-verification@users.noreply.github.com' \
              commit -q -m 'Record exact TLC39 terminal attestation'
          pushed=0
          for attempt in 1 2 3; do
            if git push -q origin HEAD:main; then
              pushed=1
              break
            fi
            git fetch -q origin main
            git rebase -q origin/main
          done
          test "$pushed" -eq 1
          attestation_commit="$(git rev-parse HEAD)"
          git fetch -q origin main
          git merge-base --is-ancestor "$attestation_commit" origin/main
          echo "LAS_REPAIRED_202_TLC39_TERMINAL_ATTESTATION=PASS"

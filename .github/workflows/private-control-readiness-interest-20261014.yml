name: Private control readiness interest

on:
  push:
    paths:
      - ".github/workflows/private-control-readiness-interest-20261014.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_REF_HASH: 28a52175bfc55f4f8b2b0f4312cd2616a65a7082555149f4382746e2254e1b26
      EXPECTED_TARGET_PROOF: 77d40f6d299311ea90a2e392ef7233a00df9d2431d624452c4602cb470675c6d
      SOURCE_REF_HASH: 4c0a01d6a646db08de3b121df2837c57d1b0a42190229ead01314dbb3550f04d
    steps:
      - name: Checkout public control shell
        uses: actions/checkout@v4

      - name: Recover exact target and readiness source
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_WRITE_TOKEN: ${{ secrets.LAS_PRIVATE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_WRITE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_WRITE_TOKEN"

          root="$RUNNER_TEMP/private-target"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_WRITE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"

          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin > "$refs"
          target_ref=""; target_sha=""; source_ref=""; source_sha=""
          while read -r sha ref; do
            h="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$h" == "$TARGET_REF_HASH" ]]; then target_ref="$ref"; target_sha="$sha"; fi
            if [[ "$h" == "$SOURCE_REF_HASH" ]]; then source_ref="$ref"; source_sha="$sha"; fi
          done < "$refs"
          rm -f "$refs"
          test -n "$target_ref" && test -n "$target_sha"
          test -n "$source_ref" && test -n "$source_sha"
          echo "::add-mask::$target_ref"; echo "::add-mask::$target_sha"
          echo "::add-mask::$source_ref"; echo "::add-mask::$source_sha"

          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$target_ref"
          git checkout -q -B target FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$target_sha"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          test "$proof" = "$EXPECTED_TARGET_PROOF"

          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=2 origin "$source_ref"
          fetched_source="$(git rev-parse FETCH_HEAD)"
          test "$fetched_source" = "$source_sha"
          printf '%s' "$target_ref" > "$RUNNER_TEMP/target-ref"
          printf '%s' "$target_sha" > "$RUNNER_TEMP/target-start-sha"
          printf '%s' "$source_sha" > "$RUNNER_TEMP/source-sha"
          printf '%s' "$auth" > "$RUNNER_TEMP/private-auth"
          chmod 600 "$RUNNER_TEMP/target-ref" "$RUNNER_TEMP/target-start-sha" "$RUNNER_TEMP/source-sha" "$RUNNER_TEMP/private-auth"
          echo "LAS_CONTROL_READINESS_RECOVERY=PASS"

      - name: Apply readiness commit only
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          source_sha="$(cat "$RUNNER_TEMP/source-sha")"
          echo "::add-mask::$source_sha"
          git cherry-pick --no-commit "$source_sha"
          changed="$(git diff --name-only --cached)"
          test "$changed" = $'src/effect_fabric/root_supervisor_linux_control_resumability_tests.rs\nsrc/effect_fabric/root_supervisor_linux_control_session.rs'
          git diff --check --cached
          grep -q 'pub(super) enum LinuxControlIoInterest' src/effect_fabric/root_supervisor_linux_control_session.rs
          grep -q 'Pending(LinuxControlIoInterest)' src/effect_fabric/root_supervisor_linux_control_session.rs
          echo "LAS_CONTROL_READINESS_PATCH=PASS"

      - name: Verify exact readiness boundary
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null
          cargo +1.98.1 fmt --all
          cargo +1.98.1 fmt --all -- --check
          RUSTFLAGS='-D warnings' cargo +1.98.1 check --all-targets --features linux-peer-credentials
          cargo +1.98.1 clippy --all-targets --features linux-peer-credentials -- -D warnings
          cargo +1.98.1 test --features linux-peer-credentials root_supervisor_linux_control_resumability_tests:: -- --nocapture
          git diff --check
          echo "LAS_CONTROL_READINESS_VERIFY=PASS"

      - name: Commit and fast-forward exact private ref
        shell: bash
        env:
          PRIVATE_WRITE_TOKEN: ${{ secrets.LAS_PRIVATE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          target_ref="$(cat "$RUNNER_TEMP/target-ref")"
          start_sha="$(cat "$RUNNER_TEMP/target-start-sha")"
          auth="$(cat "$RUNNER_TEMP/private-auth")"
          remote_sha="$(git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote origin "$target_ref" | awk '{print $1}')"
          echo "::add-mask::$remote_sha"
          test "$remote_sha" = "$start_sha"
          git config user.name "LAS Verification Integrator"
          git config user.email "las-verification@users.noreply.github.com"
          git add src/effect_fabric/root_supervisor_linux_control_session.rs src/effect_fabric/root_supervisor_linux_control_resumability_tests.rs
          git commit -q -m "Expose exact control readiness interest"
          new_sha="$(git rev-parse HEAD)"
          echo "::add-mask::$new_sha"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" push -q origin HEAD:"$target_ref"
          echo "LAS_CONTROL_READINESS_RESULT=PASS"
          echo "LAS_CONTROL_READINESS_COMMIT_PROOF=$(printf '%s' "$new_sha" | sha256sum | awk '{print $1}')"

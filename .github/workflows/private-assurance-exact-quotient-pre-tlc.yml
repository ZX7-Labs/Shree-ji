name: Private assurance exact quotient pre-TLC

on:
  push:
    branches: [main]
    paths:
      - "RUN_ASSURANCE_EXACT_QUOTIENT_PRE_TLC"

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject obsolete pre-TLC path
        shell: bash
        run: |
          set -euo pipefail
          echo "LAS_ASSURANCE_EXACT_QUOTIENT_PRE_TLC=RETIRED"
          echo "This path is bound to a historical candidate; repaired 202-profile closure revalidates its own exact private candidate and canonical pre-TLC stage."
          exit 1

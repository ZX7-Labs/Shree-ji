name: Exact private retired-evidence Rust diagnostic (quarantined)

on:
  push:
    branches:
      - verify/retired-evidence-rust-20261018
    paths:
      - .github/workflows/private-retired-evidence-rust-diagnostic.yml

permissions:
  contents: read

concurrency:
  group: isolated-retired-evidence-source-diagnostic-20261018
  cancel-in-progress: false

jobs:
  exact_source_rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      EXPECTED_REF_PROOF: e68bd23d60258be9ea6f2a679c7bfb74d6a7d323c99ddd2c5e07012fb410294c
      EXPECTED_COMMIT_PROOF: 7c4247752bf55e517f7355e40fb728948f156aa265a3db6312c6666976d127cd
      RUSTFLAGS: -Dwarnings
      CARGO_TERM_COLOR: never
      PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
      PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}

    steps:
      - name: Validate exact private identity without publishing it
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"

          private_dir="$RUNNER_TEMP/las-private"
          mkdir -p "$private_dir"
          cd "$private_dir"
          git init -q
          git remote add origin "https://github.com/$PRIVATE_REPOSITORY.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          refs_file="$RUNNER_TEMP/private-ref-list"
          if ! git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin > "$refs_file" 2>/dev/null; then
            echo 'LAS_PRIVATE_EXACT_CHECKOUT=UNAVAILABLE'
            exit 71
          fi

          matched_ref=""
          matched_sha=""
          while read -r sha ref; do
            ref_proof="$(printf '%s' "$ref" | sha256sum | cut -d' ' -f1)"
            if [ "$ref_proof" = "$EXPECTED_REF_PROOF" ]; then
              if [ -n "$matched_ref" ]; then
                echo 'LAS_PRIVATE_REF_BINDING=AMBIGUOUS'
                exit 72
              fi
              matched_ref="$ref"
              matched_sha="$sha"
            fi
          done < "$refs_file"
          rm -f "$refs_file"
          if [ -z "$matched_ref" ]; then
            echo 'LAS_PRIVATE_REF_BINDING=ABSENT'
            exit 73
          fi
          echo "::add-mask::$matched_ref"
          echo "::add-mask::$matched_sha"

          candidate_proof="$(printf '%s' "$matched_sha" | sha256sum | cut -d' ' -f1)"
          if [ "$candidate_proof" != "$EXPECTED_COMMIT_PROOF" ]; then
            echo 'LAS_PRIVATE_EXACT_REVISION=STALE'
            exit 74
          fi
          if ! git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch --quiet --no-tags --depth=1 origin "$matched_ref" >"$RUNNER_TEMP/private-fetch.log" 2>&1; then
            echo 'LAS_PRIVATE_FETCH=FAILED'
            exit 75
          fi
          git checkout --quiet --detach FETCH_HEAD
          current="$(git rev-parse HEAD)"
          echo "::add-mask::$current"
          test "$current" = "$matched_sha"
          test "$(printf '%s' "$current" | sha256sum | cut -d' ' -f1)" = "$EXPECTED_COMMIT_PROOF"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo 'LAS_PRIVATE_EXACT_REVISION=BOUND'
          echo 'LAS_PUBLIC_RUNNER_SOURCE_POLICY=EPHEMERAL_READ_ONLY'

      - name: Install pinned Rust diagnostic toolchain
        shell: bash
        run: |
          set -euo pipefail
          if ! rustup toolchain install 1.98.1 --profile minimal >"$RUNNER_TEMP/rust-install.log" 2>&1; then
            echo 'LAS_RUST_TOOLCHAIN=UNAVAILABLE'
            exit 76
          fi
          if ! rustup component add --toolchain 1.98.1 rustfmt clippy >>"$RUNNER_TEMP/rust-install.log" 2>&1; then
            echo 'LAS_RUST_TOOLCHAIN_COMPONENTS=UNAVAILABLE'
            exit 77
          fi
          echo 'LAS_RUST_TOOLCHAIN=PINNED_1_98_1'

      - name: Install exact pinned Ada toolchain for concrete Root FFI tests
        shell: bash
        run: |
          set -euo pipefail
          ALR_ZIP="$RUNNER_TEMP/alr-2.1.1.zip"
          ALR_PREFIX="$RUNNER_TEMP/alire"
          if ! curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --output "$ALR_ZIP" "https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip" >"$RUNNER_TEMP/alire-fetch.log" 2>&1; then
            echo 'LAS_PINNED_ADA_TOOLCHAIN=DOWNLOAD_FAILED'
            exit 78
          fi
          echo '09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  '"$ALR_ZIP" | sha256sum --check --strict >/dev/null
          mkdir -p "$ALR_PREFIX"
          unzip -q "$ALR_ZIP" -d "$ALR_PREFIX"
          if ! "$ALR_PREFIX/bin/alr" -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1 >"$RUNNER_TEMP/alire-toolchain.log" 2>&1; then
            echo 'LAS_PINNED_ADA_TOOLCHAIN=INSTALL_FAILED'
            exit 79
          fi
          ALR_WS="$RUNNER_TEMP/alire-workspace"
          mkdir -p "$ALR_WS"
          if ! (cd "$ALR_WS" && "$ALR_PREFIX/bin/alr" -n init --in-place --no-skel --lib las_verify_toolchain) >"$RUNNER_TEMP/alire-init.log" 2>&1; then
            echo 'LAS_PINNED_ADA_TOOLCHAIN=WORKSPACE_FAILED'
            exit 80
          fi
          WRAP="$RUNNER_TEMP/gprbuild-via-alire"
          printf '%s\n' '#!/usr/bin/env bash' 'set -euo pipefail' 'cd "$LAS_ALIRE_WS"' 'exec "$LAS_ALR_BIN" exec -- gprbuild "$@"' >"$WRAP"
          chmod 0755 "$WRAP"
          echo "LAS_ALIRE_WS=$ALR_WS" >>"$GITHUB_ENV"
          echo "LAS_ALR_BIN=$ALR_PREFIX/bin/alr" >>"$GITHUB_ENV"
          echo "GPRBUILD=$WRAP" >>"$GITHUB_ENV"
          echo 'LAS_PINNED_ADA_TOOLCHAIN=GNAT_16_1_GPRBUILD_26_0_1'

      - name: Exercise complete source Rust diagnostics without publishing private logs
        shell: bash
        run: |
          set -euo pipefail
          set +x
          cd "$RUNNER_TEMP/las-private"
          gate_failure=0
          git ls-files -- '*.rs' | LC_ALL=C sort > "$RUNNER_TEMP/private-owner-ordinals"
          run_private_gate() {
            local label="$1"
            shift
            local output="$RUNNER_TEMP/private-rust-$label.log"
            if "$@" > "$output" 2>&1; then
              if [ "$label" = "TEST_RETIRED_ALL_FEATURES" ] || [ "$label" = "TEST_RETIRED_DIAGNOSTIC" ]; then
                local cases
                cases="$(sed -nE 's/^running ([0-9]+) tests?$/\1/p' "$output" | tail -n 1)"
                if [ -z "$cases" ] || [ "$cases" -le 0 ]; then
                  echo "LAS_RUST_DIAG_${label}=ZERO_TESTS_NOT_PASS"
                  gate_failure=1
                else
                  echo "LAS_RUST_DIAG_${label}_COUNT=$cases"
                  if [ "$label" = "TEST_RETIRED_DIAGNOSTIC" ]; then
                    echo "LAS_RUST_DIAG_${label}=PASS_WITH_WARNINGS_NOT_ACCEPTANCE"
                  else
                    echo "LAS_RUST_DIAG_${label}=PASS"
                  fi
                fi
              else
                echo "LAS_RUST_DIAG_${label}=PASS"
              fi
            else
              local rc="$?"
              gate_failure=1
              local error_count
              error_count="$(grep -c '^error' "$output" || true)"
              local log_proof
              log_proof="$(sha256sum "$output" | cut -d' ' -f1)"
              echo "LAS_RUST_DIAG_${label}=FAIL"
              echo "LAS_RUST_DIAG_${label}_RC=$rc"
              echo "LAS_RUST_DIAG_${label}_ERROR_COUNT=$error_count"
              echo "LAS_RUST_DIAG_${label}_LOG_SHA256=$log_proof"
              # The public surface contains only exact deterministic owner ordinals
              # and compiler diagnostic identifier, never a private source path,
              # source fragment, symbol, compiler message, or raw diagnostic.
              python3 - "$output" "$RUNNER_TEMP/private-owner-ordinals" "$label" <<'PY'
          import json, pathlib, re, sys
          log_path, list_path, label = sys.argv[1:]
          owners = pathlib.Path(list_path).read_text().splitlines()
          indices = {path: index for index, path in enumerate(owners, 1)}
          emitted = set()
          for line in pathlib.Path(log_path).read_text(errors="replace").splitlines():
              if line.startswith("Diff in "):
                  match = re.search(r"/las-private/([^:]+):", line)
                  if match and match.group(1) in indices:
                      emitted.add((indices[match.group(1)], "RUSTFMT", 0))
              try:
                  record = json.loads(line)
              except (ValueError, TypeError):
                  continue
              if record.get("reason") != "compiler-message":
                  continue
              message = record.get("message") or {}
              if message.get("level") != "error":
                  continue
              code = (message.get("code") or {}).get("code") or "UNCLASSIFIED"
              if not re.fullmatch(r"[A-Za-z_0-9]{1,80}", code):
                  code = "UNCLASSIFIED"
              primary = next((v for v in message.get("spans", [])
                              if v.get("is_primary")), None)
              file_name = (primary or {}).get("file_name", "")
              bucket = int((primary or {}).get("line_start") or 0) // 16
              normalized = file_name.replace("\\\\", "/").lstrip("./")
              owner = indices.get(normalized, 0)
              if owner == 0:
                  matches = [i for p, i in indices.items()
                             if normalized.endswith("/" + p)]
                  owner = matches[0] if len(matches) == 1 else 0
              emitted.add((owner, code, bucket))
          for ordinal, code, bucket in sorted(emitted)[:100]:
              print(f"LAS_RUST_DIAG_{label}_OWNER_ORDINAL={ordinal};CODE={code};BUCKET16={bucket}")
          PY
            fi
          }

          run_private_gate FORMAT cargo +1.98.1 fmt --all -- --check
          run_private_gate CHECK_DEFAULT cargo +1.98.1 check --message-format=json --locked --all-targets
          run_private_gate CHECK_LINUX cargo +1.98.1 check --message-format=json --locked --features linux-peer-credentials --all-targets
          run_private_gate CHECK_ALL_FEATURES cargo +1.98.1 check --message-format=json --locked --all-features --all-targets
          run_private_gate CLIPPY_DEFAULT cargo +1.98.1 clippy --message-format=json --locked --all-targets -- -D warnings
          run_private_gate TEST_RETIRED_ALL_FEATURES cargo +1.98.1 test --message-format=json --locked --all-features --lib retired_archive_effect_ -- --test-threads=1
          # Independent diagnostic only: warning policy remains strict in every
          # acceptance gate. This executes behavioral tests even if inherited
          # warning debt blocks strict compilation; never treat it as promotion.
          run_private_gate TEST_RETIRED_DIAGNOSTIC env RUSTFLAGS= cargo +1.98.1 test --message-format=json --locked --all-features --lib retired_archive_effect_ -- --test-threads=1

          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo 'LAS_RUST_DIAG_TREE=CHANGED'
            gate_failure=1
          else
            echo 'LAS_RUST_DIAG_TREE=CLEAN'
          fi
          if [ "$gate_failure" -ne 0 ]; then
            echo 'LAS_RUST_DIAG_TARGET=NOT_PASS'
            exit 1
          fi
          echo 'LAS_RUST_DIAG_TARGET=PASS'
          echo 'LAS_FULL_CANONICAL_RESULT=NOT_EVALUATED'

name: Exact private Linux ownership retention 20261013-18

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/exact-private-linux-ownership-retention-20261013-18.yml"

permissions:
  contents: read

env:
  TARGET_REF_HASH: 848c0f95eaf6476c9dbfad7b9702a9409ff930d3e512c3f9ce99f0e4011d3764
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 9fdb156b8fd0134c8100fdf2e2f1835a91661c78424a05d3c45afd12fbd72b9d
  EXPECTED_PRIVATE_TREE_PROOF: bd94f06c71b2266f59f712c9b3d64053fae44070cfee4ab705599e4b67b41626

jobs:
  verify-exact-private-revision:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null
          test "$(rustc +1.98.1 --version | awk '{print $2}')" = "1.98.1"
          test "$(cargo +1.98.1 --version | awk '{print $2}')" = "1.98.1"
          echo "LAS_OWNERSHIP_TOOLCHAIN=PASS"

      - name: Recover exact private revision opaquely
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          root="$GITHUB_WORKSPACE/target"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          private_head=""
          while read -r candidate_sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
              private_head="$candidate_sha"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          test -n "$private_head"
          echo "::add-mask::$matched_ref"
          echo "::add-mask::$private_head"
          test "$(printf '%s' "$private_head" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$private_head"
          git checkout -q --detach "$private_head"
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_TREE_PROOF"
          test -z "$(git status --porcelain)"
          echo "LAS_OWNERSHIP_EXACT_RECOVERY=PASS"

      - name: Verify lockfile reproducibility
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.expected"
          cargo +1.98.1 generate-lockfile >/dev/null 2>&1
          cmp --silent Cargo.lock "$RUNNER_TEMP/Cargo.lock.expected"
          git checkout -q -- Cargo.lock
          echo "LAS_OWNERSHIP_LOCKFILE=PASS"

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          cargo +1.98.1 fmt --all -- --check >/dev/null 2>&1
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "LAS_OWNERSHIP_FMT=PASS"

      - name: Compile default and Linux boundaries with warnings denied
        shell: bash
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          cargo +1.98.1 check --locked --all-targets >/dev/null 2>&1
          cargo +1.98.1 check --locked --features linux-peer-credentials --all-targets >/dev/null 2>&1
          echo "LAS_OWNERSHIP_CHECK=PASS"

      - name: Clippy default and Linux boundaries
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          cargo +1.98.1 clippy --locked --all-targets -- -D warnings >/dev/null 2>&1
          cargo +1.98.1 clippy --locked --features linux-peer-credentials --all-targets -- -D warnings >/dev/null 2>&1
          echo "LAS_OWNERSHIP_CLIPPY=PASS"

      - name: Run ownership and direct-rotation discriminators
        shell: bash
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          run_exact() {
            test_name="$1"
            listing="$(cargo +1.98.1 test --locked --features linux-peer-credentials --lib "$test_name" -- --exact --list 2>/dev/null)"
            printf '%s\n' "$listing" | grep -Fqx "$test_name: test"
            cargo +1.98.1 test --locked --features linux-peer-credentials --lib "$test_name" \
              -- --exact --test-threads=1 >/dev/null 2>&1
          }
          run_exact effect_fabric::root_supervisor_epoch_coordinator_tests::active_epoch_denies_direct_generation_advance_without_any_state_transition
          run_exact effect_fabric::root_supervisor_epoch_coordinator_tests::applied_root_control_recovery_failure_retains_exact_continuation_without_reentry
          run_exact effect_fabric::root_supervisor_epoch_coordinator_tests::applied_root_activation_write_failure_becomes_nonresumable_without_root_reentry
          run_exact effect_fabric::root_supervisor_epoch_pre_root_ownership_tests::manifest_bootstrap_write_failure_retains_every_pre_root_owner_without_root_entry
          run_exact effect_fabric::root_supervisor_epoch_pre_root_ownership_tests::control_bootstrap_write_failure_retains_manifest_and_all_remaining_owners_pre_root
          run_exact effect_fabric::root_supervisor_epoch_pre_root_ownership_tests::guarded_bootstrap_write_failure_retains_prepared_control_and_every_owner_pre_root
          run_exact effect_fabric::root_supervisor_graceful_handoff::tests::pre_root_guarded_projection_failure_retains_every_owner_without_root_reentry
          run_exact effect_fabric::root_supervisor_graceful_handoff::tests::post_root_graceful_failure_resumes_without_second_rotation_crossing
          echo "LAS_OWNERSHIP_DISCRIMINATORS=PASS"

      - name: Run deterministic and adversarial regression suites
        shell: bash
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          cargo +1.98.1 test --locked --all-targets -- --test-threads=1 >/dev/null 2>&1
          cargo +1.98.1 test --locked --all-targets --features linux-peer-credentials -- --test-threads=1 >/dev/null 2>&1
          echo "LAS_OWNERSHIP_TESTS=PASS"

      - name: Re-run supervisor library tests under optimized codegen
        shell: bash
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          cargo +1.98.1 test --locked --release --features linux-peer-credentials --lib \
            effect_fabric::root_supervisor_ \
            -- --test-threads=1 >/dev/null 2>&1
          test -z "$(git status --porcelain --untracked-files=no)"
          test "$(printf '%s' "$(git rev-parse HEAD)" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          test "$(printf '%s' "$(git rev-parse 'HEAD^{tree}')" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_TREE_PROOF"
          echo "LAS_OWNERSHIP_EXACT_GATE=PASS"

name: Opaque owner binding formatted extraction

on:
  pull_request:
    paths:
      - "verification-requests/linux-retired-frontier-v2-20261011.txt"
      - ".github/workflows/opaque-owner-binding-formatted-extract-20261011.yml"

permissions:
  contents: read

env:
  TARGET_REF_HASH: 535f587822554ff667cbfc2f12d2067eb29413d54436bb8ce8ac21fe636c5f56
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 180e54be973a334df60e23595c41632e6ffddab4be1f9fcbad345d90399b51eb
  EXPECTED_PRIVATE_TREE_PROOF: 4582a797a9542ab556ef9c6ea0de0242635b1ec1364b1ce16d1b991c2349db73

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Recover exact private revision opaquely
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"; test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"; echo "::add-mask::$PRIVATE_TOKEN"
          root="$GITHUB_WORKSPACE/target"; mkdir "$root"; cd "$root"; git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"; echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""; private_head=""
          while read -r candidate_sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"; matched_ref="$ref"; private_head="$candidate_sha"
            fi
          done <"$refs"
          rm -f "$refs"; test -n "$matched_ref"; test -n "$private_head"
          echo "::add-mask::$matched_ref"; echo "::add-mask::$private_head"
          test "$(printf '%s' "$private_head" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$private_head"; git checkout -q --detach "$private_head"
          tree="$(git rev-parse 'HEAD^{tree}')"; echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_TREE_PROOF"
          test -z "$(git status --porcelain)"
          unset PRIVATE_TOKEN auth matched_ref private_head tree candidate_sha ref
          echo "OPAQUE_FORMAT_EXTRACT_EXACT_RECOVERY=PASS"

      - name: Install pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null
          test "$(rustc +1.98.1 --version | awk '{print $2}')" = "1.98.1"
          test "$(cargo +1.98.1 --version | awk '{print $2}')" = "1.98.1"

      - name: Apply exact green remediation and format
        shell: bash
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          target="src/effect_fabric/root_supervisor_linux_retired_owner_binding.rs"
          python3 - "$target" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          text = p.read_text(encoding="utf-8")

          start = text.index("    fn owner_mismatch_rejection_and_provider_uncertainty_fail_closed() {")
          end = text.index("    #[test]", start + 1)
          section = text[start:end]
          old_decl = "        let mut verifier = verifier("
          old_call = "        let failure = verifier\n            .verify_exact("
          if section.count(old_decl) != 1 or section.count(old_call) != 1:
              raise SystemExit("expected shadowing sites not unique")
          section = section.replace(old_decl, "        let mut binding_verifier = verifier(", 1)
          section = section.replace(old_call, "        let failure = binding_verifier\n            .verify_exact(", 1)
          text = text[:start] + section + text[end:]

          replacements = [
              ("    const fn accepts_scope(self, scope: LinuxRetiredOwnerBindingAuthenticationScope) -> bool {",
               "    fn accepts_scope(self, scope: LinuxRetiredOwnerBindingAuthenticationScope) -> bool {"),
              ("    const fn accepts_receipt(self, receipt: LinuxRetiredOwnerBindingAuthenticationReceipt) -> bool {",
               "    fn accepts_receipt(self, receipt: LinuxRetiredOwnerBindingAuthenticationReceipt) -> bool {"),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"expected exact qualifier site not unique: {old}")
              text = text.replace(old, new, 1)

          production_expect = '''    #[expect(\n        clippy::too_many_arguments,\n        reason = "all trust coordinates remain explicit at the high-assurance binding boundary"\n    )]\n    pub(super) fn verify_exact('''
          production_replacement = '''    #[expect(\n        clippy::result_large_err,\n        reason = "bounded failure-atomic evidence stays stack-owned and allocation-free"\n    )]\n    pub(super) fn verify_exact('''
          if text.count(production_expect) != 1:
              raise SystemExit("production lint expectation not unique")
          text = text.replace(production_expect, production_replacement, 1)

          helper = '''    fn verifier(\n        transition: DurablyVerifiedLinuxRetiredArchiveTransition,'''
          helper_with_expect = '''    #[expect(\n        clippy::too_many_arguments,\n        reason = "test fixture keeps independent trust coordinates explicit"\n    )]\n    fn verifier(\n        transition: DurablyVerifiedLinuxRetiredArchiveTransition,'''
          if text.count(helper) != 1:
              raise SystemExit("test helper not unique")
          text = text.replace(helper, helper_with_expect, 1)
          p.write_text(text, encoding="utf-8")
          PY

          cargo +1.98.1 fmt --all
          cargo +1.98.1 fmt --all -- --check
          cargo +1.98.1 check --locked --all-targets --features linux-peer-credentials
          cargo +1.98.1 clippy --locked --all-targets --features linux-peer-credentials -- -D warnings
          cargo +1.98.1 test --locked --lib --features linux-peer-credentials root_supervisor_linux_retired -- --test-threads=1
          echo "OPAQUE_FORMATTED_SOURCE_SHA256=$(sha256sum "$target" | awk '{print $1}')"

      - name: Encrypt formatted source to ephemeral extraction key
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          target="src/effect_fabric/root_supervisor_linux_retired_owner_binding.rs"
          tar -czf "$RUNNER_TEMP/source.tar.gz" "$target"
          key="$RUNNER_TEMP/source.key"
          openssl rand -hex 32 >"$key"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -salt \
            -pass file:"$key" -in "$RUNNER_TEMP/source.tar.gz" -out "$RUNNER_TEMP/source.enc"
          cat >"$RUNNER_TEMP/extract-public.pem" <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA7LzjOcaemx+GaZm/tp0l
          wxfma6IjWiBIuyOvSd5zodO41TnX8HKOXNdJGajPZhhrR4yaySXD2pPWUTbli7It
          lRvN9RLNZxATz85U6Ylf59mzFqVHis7mcwepsQiV4GfoAWHW0WyJdkuVdJZ57uMk
          45bdvfRTxbtk8axZ4qt8ROitBHjONjJYupA0UQcrV0SGwN7BoGg4MXKYd6VxTzB4
          rXG7l7fW3OusC5GwbAmWoXGfM/loGOMHNYrV38RW+veFlAxCMmLEYjy5BjeN7qHY
          DXOj17z5UNvdpev7R0NzONuJKPJHinJ6lArXILUfSLojDIBhi6SunEbyCIWQqt71
          dSVptnpttQiNkG+3zi7A5cEkXiLimjn4TGfAKPvhBoEkIn6B3SUpa6YPPhaBX8ky
          RS7gT1ob5sYRTaALUuxPIkA6UICyO2nDdnAB/m8K3affurUzuraMryRJd4N4UrCp
          twhyeuldO3TTHjQwLe/7YBu/6KF71GG8yxCh5pimISgJAgMBAAE=
          -----END PUBLIC KEY-----
          PEM
          openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/extract-public.pem" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in "$key" -out "$RUNNER_TEMP/key.enc"
          rm -f "$RUNNER_TEMP/source.tar.gz" "$key" "$RUNNER_TEMP/extract-public.pem"

      - name: Upload encrypted formatted source only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opaque-owner-binding-formatted
          path: |
            ${{ runner.temp }}/key.enc
            ${{ runner.temp }}/source.enc
          if-no-files-found: error
          retention-days: 1

name: Current exact slow-profile diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject obsolete 203-profile diagnostic
        shell: bash
        run: |
          set -euo pipefail
          echo "LAS_CURRENT_203_SLOW_PROFILE_DIAGNOSTIC=RETIRED"
          echo "The repaired 202-profile closure has an exact frozen replacement set and resumable V4/TLC39 proof paths; this historical 203-profile diagnostic must not consume runner time."
          exit 1

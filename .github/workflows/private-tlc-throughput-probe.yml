name: Private TLC throughput probe (retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject obsolete throughput probe
        shell: bash
        run: |
          set -euo pipefail
          echo "LAS_TLC_THROUGHPUT_PROBE=RETIRED"
          echo "This probe is bound to a historical 129-profile candidate; current performance evidence must be measured against the repaired current 202-profile candidate."
          exit 1

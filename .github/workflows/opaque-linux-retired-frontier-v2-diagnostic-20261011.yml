name: Opaque Linux retired owner binding diagnostic

on:
  pull_request:
    paths:
      - "verification-requests/linux-retired-frontier-v2-20261011.txt"
      - ".github/workflows/opaque-linux-retired-frontier-v2-diagnostic-20261011.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REF_HASH: 535f587822554ff667cbfc2f12d2067eb29413d54436bb8ce8ac21fe636c5f56
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 180e54be973a334df60e23595c41632e6ffddab4be1f9fcbad345d90399b51eb
  EXPECTED_PRIVATE_TREE_PROOF: 4582a797a9542ab556ef9c6ea0de0242635b1ec1364b1ce16d1b991c2349db73

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Recover exact private revision opaquely
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"; test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"; echo "::add-mask::$PRIVATE_TOKEN"
          root="$GITHUB_WORKSPACE/target"; mkdir "$root"; cd "$root"; git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"; echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""; private_head=""
          while read -r candidate_sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"; matched_ref="$ref"; private_head="$candidate_sha"
            fi
          done <"$refs"
          rm -f "$refs"; test -n "$matched_ref"; test -n "$private_head"
          echo "::add-mask::$matched_ref"; echo "::add-mask::$private_head"
          test "$(printf '%s' "$private_head" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$private_head"; git checkout -q --detach "$private_head"
          tree="$(git rev-parse 'HEAD^{tree}')"; echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_TREE_PROOF"
          test -z "$(git status --porcelain)"
          unset PRIVATE_TOKEN auth matched_ref private_head tree candidate_sha ref
          echo "OPAQUE_BINDING_DIAG_EXACT_RECOVERY=PASS"

      - name: Install pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null
          test "$(rustc +1.98.1 --version | awk '{print $2}')" = "1.98.1"
          test "$(cargo +1.98.1 --version | awk '{print $2}')" = "1.98.1"

      - name: Apply candidate remediation and run Rust gates
        shell: bash
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          target="src/effect_fabric/root_supervisor_linux_retired_owner_binding.rs"
          python3 - "$target" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          text = p.read_text(encoding="utf-8")

          start = text.index("    fn owner_mismatch_rejection_and_provider_uncertainty_fail_closed() {")
          end = text.index("    #[test]", start + 1)
          section = text[start:end]
          old_decl = "        let mut verifier = verifier("
          old_call = "        let failure = verifier\n            .verify_exact("
          if section.count(old_decl) != 1 or section.count(old_call) != 1:
              raise SystemExit("expected shadowing sites not unique")
          section = section.replace(old_decl, "        let mut binding_verifier = verifier(", 1)
          section = section.replace(old_call, "        let failure = binding_verifier\n            .verify_exact(", 1)
          text = text[:start] + section + text[end:]

          replacements = [
              ("    const fn accepts_scope(self, scope: LinuxRetiredOwnerBindingAuthenticationScope) -> bool {",
               "    fn accepts_scope(self, scope: LinuxRetiredOwnerBindingAuthenticationScope) -> bool {"),
              ("    const fn accepts_receipt(self, receipt: LinuxRetiredOwnerBindingAuthenticationReceipt) -> bool {",
               "    fn accepts_receipt(self, receipt: LinuxRetiredOwnerBindingAuthenticationReceipt) -> bool {"),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"expected exact qualifier site not unique: {old}")
              text = text.replace(old, new, 1)

          production_expect = '''    #[expect(\n        clippy::too_many_arguments,\n        reason = "all trust coordinates remain explicit at the high-assurance binding boundary"\n    )]\n    pub(super) fn verify_exact('''
          production_replacement = '''    #[expect(\n        clippy::result_large_err,\n        reason = "bounded failure-atomic evidence stays stack-owned and allocation-free"\n    )]\n    pub(super) fn verify_exact('''
          if text.count(production_expect) != 1:
              raise SystemExit("production lint expectation not unique")
          text = text.replace(production_expect, production_replacement, 1)

          helper = '''    fn verifier(\n        transition: DurablyVerifiedLinuxRetiredArchiveTransition,'''
          helper_with_expect = '''    #[expect(\n        clippy::too_many_arguments,\n        reason = "test fixture keeps independent trust coordinates explicit"\n    )]\n    fn verifier(\n        transition: DurablyVerifiedLinuxRetiredArchiveTransition,'''
          if text.count(helper) != 1:
              raise SystemExit("test helper not unique")
          text = text.replace(helper, helper_with_expect, 1)
          p.write_text(text, encoding="utf-8")
          PY

          cargo +1.98.1 fmt --all
          failures=0
          run_gate() {
            label="$1"; shift
            log="$RUNNER_TEMP/${label}.log"
            set +e
            "$@" >"$log" 2>&1
            rc=$?
            set -e
            printf '%s_rc=%s\n' "$label" "$rc" >>"$RUNNER_TEMP/meta.txt"
            printf '%s_sha256=%s\n' "$label" "$(sha256sum "$log" | awk '{print $1}')" >>"$RUNNER_TEMP/meta.txt"
            if [[ "$rc" -ne 0 ]]; then failures=$((failures + 1)); fi
          }
          : >"$RUNNER_TEMP/meta.txt"
          run_gate format cargo +1.98.1 fmt --all -- --check
          run_gate check cargo +1.98.1 check --locked --all-targets --features linux-peer-credentials
          run_gate clippy cargo +1.98.1 clippy --locked --all-targets --features linux-peer-credentials -- -D warnings
          run_gate test cargo +1.98.1 test --locked --lib --features linux-peer-credentials root_supervisor_linux_retired -- --test-threads=1
          printf 'failure_count=%s\n' "$failures" >>"$RUNNER_TEMP/meta.txt"
          printf 'target_sha256=%s\n' "$(sha256sum "$target" | awk '{print $1}')" >>"$RUNNER_TEMP/meta.txt"
          printf 'lib_sha256=%s\n' "$(sha256sum src/lib.rs | awk '{print $1}')" >>"$RUNNER_TEMP/meta.txt"
          echo "OPAQUE_BINDING_DIAG_FAILURE_COUNT=$failures"

          tar -czf "$RUNNER_TEMP/diag.tar.gz" \
            "$target" src/lib.rs -C "$RUNNER_TEMP" meta.txt format.log check.log clippy.log test.log
          key="$RUNNER_TEMP/diag.key"
          openssl rand -hex 32 >"$key"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -salt \
            -pass file:"$key" -in "$RUNNER_TEMP/diag.tar.gz" -out "$RUNNER_TEMP/diag.enc"
          cat >"$RUNNER_TEMP/public.pem" <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEArhr/Fcy7/2XQkfK7Cvvj
          OQtH72pFpS8nHaJiBe08xrLXIBy/o8aUKVqFZKBme793/5hHr5i4tNwJcH1OEF78
          bbXHTHWRBur9lVb8EIvlYC21/WgdgExAu8hwqIKI20IFOSdZpCwL03VNp8aav8tP
          uaMo8hw02q1RoTZpyCb9uMWDEpuedoRRbGU4v8vp7Cs6WbTpK5WRt+1csURquk8y
          3aiwcGmT9Se3svezfQB8k+T5nIW0J4y3uBCwxHVxCdmOz9jZmfpB5N6dJ1PdUuzd
          T6yVqPvtq1yH8UYGkPYOuX8GdQjghrizvE0IfeIz/liO2Jg/VfXnjcF2p5TmikdL
          LQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/public.pem" -in "$key" -out "$RUNNER_TEMP/key.enc"
          rm -f "$RUNNER_TEMP/diag.tar.gz" "$key" "$RUNNER_TEMP/public.pem" "$RUNNER_TEMP/meta.txt" \
            "$RUNNER_TEMP/format.log" "$RUNNER_TEMP/check.log" "$RUNNER_TEMP/clippy.log" "$RUNNER_TEMP/test.log"

      - name: Upload encrypted diagnostic only
        uses: actions/upload-artifact@v4
        with:
          name: opaque-binding-diagnostic
          path: |
            ${{ runner.temp }}/key.enc
            ${{ runner.temp }}/diag.enc
          if-no-files-found: error
          retention-days: 1

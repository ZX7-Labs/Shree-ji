name: Private assurance frontier refinement diagnostic

on:
  push:
    branches: [main]
    paths:
      - "RUN_ASSURANCE_FRONTIER_REFINEMENT_DIAGNOSTIC"

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject obsolete 203-profile frontier diagnostic
        shell: bash
        run: |
          set -euo pipefail
          echo "LAS_ASSURANCE_FRONTIER_REFINEMENT_DIAGNOSTIC=RETIRED"
          echo "This diagnostic is bound to a historical 203-profile snapshot and is not evidence for the repaired 202-profile closure."
          exit 1

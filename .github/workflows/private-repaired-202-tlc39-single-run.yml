name: Retired repaired-202 TLC39 single run

on:
  push:
    branches: [main]
    paths:
      - "RUN_REPAIRED_202_TLC39_SINGLE"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject redundant TLC39 single-run path
        shell: bash
        run: |
          set -euo pipefail
          echo "LAS_REPAIRED_202_TLC39_SINGLE=RETIRED"
          echo "Canonical current-202 closure uses the frozen repaired-202 TLC39 v3 checkpoint continuation and terminal attestation path."
          exit 1

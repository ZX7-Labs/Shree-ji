name: Repaired exact 202 TLC39 single run

on:
  push:
    branches: [main]
    paths:
      - "RUN_REPAIRED_202_TLC39_SINGLE"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REF_HASH: 28a52175bfc55f4f8b2b0f4312cd2616a65a7082555149f4382746e2254e1b26
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 1b139dc7920e82d5f9bdd2a68c072ad88bc0049d5ef1377380899164da5f93f9
  EXPECTED_PRIVATE_TREE_PROOF: 7fb364587ed7c9f76d8fd9f69cb4a4d58e576a44a1e653d019c8114ccb65353f
  EXPECTED_VERIFIER_BLOB: 62e3e6dc0fad5dddc7fb0a453a3cd681d911e590
  EXPECTED_TLC_PROFILE_COUNT: "202"
  EXPECTED_TLC_MAP_SHA256: da7bb51d531d0e5e5e6994c80be8f254a110cb8181e6121e3a557fdff9428cee
  EXPECTED_INDEX39_CFG_SHA256: 186ddf4cbea68ae055b349ed7bb808aad5ed0146b3618b99754efa46c735e092
  EXPECTED_INDEX39_TLA_SHA256: 391c62071a571370904c26fdb39c647e1a17e7869a71072cd8e59a8f4967f0c1
  EXPECTED_TLA_JAR_SHA1: bee4a54f3ee3d4afc347c3240ec2d9e93b075104
  TARGET_INDEX: "39"
  TLC_WORKERS: "4"
  RUN_SECONDS: "19800"
  MIN_FREE_KB: "12582912"
  JAVA_TOOL_OPTIONS: -Xmx5g

jobs:
  tlc39:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: Validate exact single-run request
        shell: bash
        run: |
          set -euo pipefail
          test "$TARGET_INDEX" -eq 39
          test "$TLC_WORKERS" -eq 4
          test "$RUN_SECONDS" -ge 3600
          test "$RUN_SECONDS" -le 20400
          test "$MIN_FREE_KB" -ge 8388608
          echo "LAS_REPAIRED_202_TLC39_SINGLE_REQUEST=PASS"

      - name: Reclaim runner storage
        shell: bash
        run: |
          set -euo pipefail
          before_kb="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          echo "LAS_REPAIRED_202_TLC39_SINGLE_FREE_KB_BEFORE=$before_kb"
          for path in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/az /opt/hostedtoolcache/CodeQL; do
            [[ ! -e "$path" ]] || sudo rm -rf "$path"
          done
          sudo apt-get clean
          docker system prune --all --force >/dev/null 2>&1 || true
          after_kb="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          echo "LAS_REPAIRED_202_TLC39_SINGLE_FREE_KB_AFTER=$after_kb"
          test "$after_kb" -ge 31457280

      - name: Recover exact frozen repaired candidate
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"

          ROOT="$GITHUB_WORKSPACE/target"
          mkdir "$ROOT"
          cd "$ROOT"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"

          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          while read -r sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          echo "::add-mask::$matched_ref"

          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          actual="$(git rev-parse FETCH_HEAD)"
          echo "::add-mask::$actual"
          test "$(printf '%s' "$actual" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          git checkout -q --detach "$actual"

          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_TREE_PROOF"
          test "$(git hash-object tools/verify_codespaces_all.sh)" = "$EXPECTED_VERIFIER_BLOB"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "LAS_REPAIRED_202_TLC39_SINGLE_RECOVERY=PASS"
          unset PRIVATE_TOKEN auth matched_ref actual tree

      - name: Bind exact canonical map and profile 39
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/target"
          cd "$ROOT"
          map_py="$RUNNER_TEMP/tlc-map.py"
          python3 - tools/verify_codespaces_all.sh "$map_py" <<'PY'
          from pathlib import Path
          import sys
          src = Path(sys.argv[1]).read_text(encoding="utf-8")
          mh = 'python3 - "$ROOT" > "$TLC_MAP" <<\'PY\'\n'
          me = '\nPY\n\nrun_tlc_profile() {'
          if src.count(mh) != 1 or src.count(me) != 1:
              raise SystemExit("canonical map anchors not unique")
          start = src.index(mh) + len(mh)
          end = src.index(me, start)
          Path(sys.argv[2]).write_text(src[start:end] + "\n", encoding="utf-8")
          PY

          map="$RUNNER_TEMP/tlc-map.tsv"
          map_err="$RUNNER_TEMP/tlc-map.private.err"
          if ! python3 "$map_py" "$ROOT" >"$map" 2>"$map_err"; then
            echo "LAS_REPAIRED_202_TLC39_SINGLE_MAP_ERROR_SHA256=$(sha256sum "$map_err" | awk '{print $1}')"
            rm -f "$map_err"
            exit 1
          fi
          rm -f "$map_err"
          test "$(wc -l <"$map" | tr -d ' ')" = "$EXPECTED_TLC_PROFILE_COUNT"
          test "$(sha256sum "$map" | awk '{print $1}')" = "$EXPECTED_TLC_MAP_SHA256"

          line="$(sed -n "$((TARGET_INDEX + 1))p" "$map")"
          test -n "$line"
          IFS=$'\t' read -r cfg tla deadlock expectation <<<"$line"
          test -n "$cfg"
          test -n "$tla"
          test "$(printf '%s' "$cfg" | sha256sum | awk '{print $1}')" = "$EXPECTED_INDEX39_CFG_SHA256"
          test "$(printf '%s' "$tla" | sha256sum | awk '{print $1}')" = "$EXPECTED_INDEX39_TLA_SHA256"
          test "$deadlock" = "0"
          test -z "$expectation"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "LAS_REPAIRED_202_TLC39_SINGLE_BINDING=PASS"

      - name: Run exact canonical TLC39 with compact queue
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/target"
          cd "$ROOT"

          TLA_JAR="$RUNNER_TEMP/tla2tools.jar"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --output "$TLA_JAR" \
            "https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar" >/dev/null 2>&1
          echo "$EXPECTED_TLA_JAR_SHA1  $TLA_JAR" | sha1sum --check --strict >/dev/null

          map_py="$RUNNER_TEMP/tlc-map.py"
          python3 - tools/verify_codespaces_all.sh "$map_py" <<'PY'
          from pathlib import Path
          import sys
          src = Path(sys.argv[1]).read_text(encoding="utf-8")
          mh = 'python3 - "$ROOT" > "$TLC_MAP" <<\'PY\'\n'
          me = '\nPY\n\nrun_tlc_profile() {'
          if src.count(mh) != 1 or src.count(me) != 1:
              raise SystemExit("canonical map anchors not unique")
          start = src.index(mh) + len(mh)
          end = src.index(me, start)
          Path(sys.argv[2]).write_text(src[start:end] + "\n", encoding="utf-8")
          PY

          map="$RUNNER_TEMP/tlc-map.tsv"
          map_err="$RUNNER_TEMP/tlc-map.private.err"
          if ! python3 "$map_py" "$ROOT" >"$map" 2>"$map_err"; then
            echo "LAS_REPAIRED_202_TLC39_SINGLE_MAP_ERROR_SHA256=$(sha256sum "$map_err" | awk '{print $1}')"
            rm -f "$map_err"
            exit 1
          fi
          rm -f "$map_err"
          test "$(wc -l <"$map" | tr -d ' ')" = "$EXPECTED_TLC_PROFILE_COUNT"
          test "$(sha256sum "$map" | awk '{print $1}')" = "$EXPECTED_TLC_MAP_SHA256"
          line="$(sed -n "$((TARGET_INDEX + 1))p" "$map")"
          IFS=$'\t' read -r cfg tla deadlock expectation <<<"$line"
          test -n "$cfg"; test -n "$tla"; test -z "$expectation"
          test "$(printf '%s' "$cfg" | sha256sum | awk '{print $1}')" = "$EXPECTED_INDEX39_CFG_SHA256"
          test "$(printf '%s' "$tla" | sha256sum | awk '{print $1}')" = "$EXPECTED_INDEX39_TLA_SHA256"

          cfg_dir="$(dirname "$cfg")"
          cfg_base="$(basename "$cfg")"
          tla_base="$(basename "$tla")"
          log="$RUNNER_TEMP/tlc39.single.private.log"
          meta="$RUNNER_TEMP/tlc39-single-meta"
          mkdir -p "$meta"

          args=(-workers "$TLC_WORKERS" -lncheck final -fp 0 -checkpoint 5 -metadir "$meta")
          [[ "$deadlock" != "1" ]] || args+=(-deadlock)
          args+=(-config "$cfg_base" "$tla_base")

          set +e
          (cd "$cfg_dir"; exec java -Dtlc2.tool.ModelChecker.BAQueue=true -XX:+UseParallelGC -jar "$TLA_JAR" "${args[@]}") >"$log" 2>&1 &
          tlc_pid=$!
          set -e

          tlc_running() {
            local stat
            stat="$(ps -o stat= -p "$tlc_pid" 2>/dev/null | awk 'NR==1 {print $1}')"
            [[ -n "$stat" && "$stat" != Z* ]]
          }

          started="$(date +%s)"
          deadline="$((started + RUN_SECONDS))"
          next_report="$started"
          resource_cut=0
          cut_reason="none"

          while tlc_running; do
            now="$(date +%s)"
            free_kb="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
            if (( now >= next_report )); then
              echo "LAS_REPAIRED_202_TLC39_SINGLE_FREE_KB=$free_kb"
              next_report="$((now + 300))"
            fi
            if (( free_kb <= MIN_FREE_KB || now >= deadline )); then
              resource_cut=1
              if (( free_kb <= MIN_FREE_KB )); then
                cut_reason="storage"
              else
                cut_reason="time"
              fi
              echo "LAS_REPAIRED_202_TLC39_SINGLE_RESOURCE_CUT=$cut_reason"
              kill -TERM "$tlc_pid" 2>/dev/null || true
              for _ in {1..20}; do
                tlc_running || break
                sleep 1
              done
              tlc_running && kill -KILL "$tlc_pid" 2>/dev/null || true
              break
            fi
            sleep 15
          done

          set +e
          wait "$tlc_pid"
          rc=$?
          set -e

          metrics="$(python3 - "$log" <<'PY'
          import re, sys
          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          matches = re.findall(r'([0-9,]+) states generated.*?, ([0-9,]+) distinct states found.*?, ([0-9,]+) states left on queue', text)
          if matches:
              g, d, q = matches[-1]
              print(g.replace(',', ''), d.replace(',', ''), q.replace(',', ''))
          else:
              print('0 0 0')
          PY
          )"
          read -r generated distinct queued <<<"$metrics"
          final_free_kb="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          echo "LAS_REPAIRED_202_TLC39_SINGLE_GENERATED=$generated"
          echo "LAS_REPAIRED_202_TLC39_SINGLE_DISTINCT=$distinct"
          echo "LAS_REPAIRED_202_TLC39_SINGLE_QUEUE=$queued"
          echo "LAS_REPAIRED_202_TLC39_SINGLE_FINAL_FREE_KB=$final_free_kb"
          echo "LAS_REPAIRED_202_TLC39_SINGLE_RC=$rc"
          echo "LAS_REPAIRED_202_TLC39_SINGLE_CUT_REASON=$cut_reason"
          echo "LAS_REPAIRED_202_TLC39_SINGLE_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"

          severe='Invariant .* is violated|Property .* is violated|Temporal propert(y|ies).*violat|liveness.*violat|Deadlock reached|Parsing or semantic analysis failed|parse error|semantic error|(checkpoint|recover).*(error|fail|exception)|(error|fail|exception).*(checkpoint|recover)|fingerprint.*collision|collision.*fingerprint|OutOfMemoryError|Cannot allocate memory|No space left on device|Disk quota exceeded|Exception in thread|java\.lang\.|java\.io\.|java\.nio\.|TLC threw an unexpected exception|TLC Bug|AssertionError|An error occurred while running TLC'
          if grep -Eiq "$severe" "$log"; then
            rm -f "$log"
            echo "LAS_REPAIRED_202_TLC39_SINGLE_RESULT=FAIL_CLOSED"
            exit 1
          fi

          if (( resource_cut )); then
            rm -f "$log"
            echo "LAS_REPAIRED_202_TLC39_SINGLE_RESULT=RESOURCE_LIMIT"
            exit 1
          fi

          if [[ "$rc" -eq 0 ]] && grep -Fq 'Model checking completed. No error has been found.' "$log" && [[ "$queued" -eq 0 ]]; then
            rm -f "$log"
            echo "LAS_REPAIRED_202_TLC39_SINGLE_RESULT=PASS"
            exit 0
          fi

          rm -f "$log"
          echo "LAS_REPAIRED_202_TLC39_SINGLE_RESULT=FAIL"
          exit 1

name: Opaque chained complete transcript diagnostic 20261017

on:
  push:
    branches:
      - "verify/reconciled-baseline-repair-v3-bd95-20261017"
    paths:
      - ".github/workflows/opaque-chain-complete-diagnostic-20261017.yml"

permissions:
  contents: read

env:
  BASE_REF_HASH: 060aa23045ded14f2e9984282456adce3cd5fa94bd92f21f4eeacae5d41abff2
  BASE_SNAPSHOT_PROOF: bd4d73399dc34da2586900c270f6b33f2a1049e934472301f5546ad9973cc49e
  BASE_TREE_PROOF: 93bcdc3d05cc578589d0600beb22d21dda366b5cd9fd81cc31f4f487d9e35981
  EXPECTED_GREEN_BASELINE_TREE: ffc6621866ec4353d070d74746e0a2de8a9a9d20
  EFFECT_REF_HASH: 57902b32c7dba883a89cd5a6e47dea395ab8a06b111c3dcdcd0487d67f010f58
  M1_BLOB: bb4f6e5c803b7c64ea27e605659cf998fc942cc2
  M2_BLOB: 6fb90f15a1194d596f420ebee9f0ed3e4ae2b112
  M3_BLOB: 67746f8a4776b872b3878f6861eb3bb7658a9fbd
  M4_BLOB: 13820e643e7d76cd087293429f6856183f4d9b07
  M5_BLOB: ace99b29dcf1ab6041d602247158f07ab13d41eb
  EFFECT_STAGE3_BLOB: 8881d312f2f679f1c53f60402d05ea83e7e89a15
  EFFECT_STAGE5_BLOB: 5e0c7018f6e5d81df3d8fca80853e18268317584
  COMPLETE_MATERIALIZER_BLOB: a35184cb70d931c34194e96192b208b8484b7ec9
  COMPLETE_VERIFIER_BLOB: 9762c5a8f788302eb0ed9199941dae4b31904e5f
  OWNER_MATERIALIZER_BLOB: 2b0c4b756131b92afa313abafe20461e2cabfff2
  OWNER_VERIFIER_BLOB: 1c0040c4af117bbfcdd06f24805eeb05f49b3c8f
  RECLAIM_MATERIALIZER_BLOB: 0b65004b5ec67373ac53127de1193ecbecfba902
  RECLAIM_HYGIENE_BLOB: 28ad68dd4153a2d1e76e7529afc1b31b8c8e251a
  RECLAIM_VERIFIER_BLOB: c3f905737be180b4aa839a96f4d95f9cd4a9348f
  RSA_MODULUS_HEX: 
  RSA_EXPONENT: "65537"

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Recover exact private base and chain objects
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY" && test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"; echo "::add-mask::$PRIVATE_TOKEN"
          root="$RUNNER_TEMP/private"; mkdir "$root"; cd "$root"; git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"; echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/refs"; git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          base_ref=; base_sha=; effect_ref=
          while read -r sha ref; do
            h="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$h" = "$BASE_REF_HASH" ]]; then test -z "$base_ref"; base_ref="$ref"; base_sha="$sha"; fi
            if [[ "$h" = "$EFFECT_REF_HASH" ]]; then test -z "$effect_ref"; effect_ref="$ref"; fi
          done <"$refs"
          rm -f "$refs"; test -n "$base_ref" && test -n "$effect_ref" && test -n "$base_sha"
          echo "::add-mask::$base_ref"; echo "::add-mask::$effect_ref"; echo "::add-mask::$base_sha"
          test "$(printf '%s' "$base_sha" | sha256sum | awk '{print $1}')" = "$BASE_SNAPSHOT_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=224 origin "$base_ref" "$effect_ref"
          git checkout -q -B verify-baseline-target "$base_sha"
          test "$(printf '%s' "$(git rev-parse 'HEAD^{tree}')" | sha256sum | awk '{print $1}')" = "$BASE_TREE_PROOF"
          for pair in \
            "$M1_BLOB:m1.py" "$M2_BLOB:m2.py" "$M3_BLOB:m3.py" "$M4_BLOB:m4.py" "$M5_BLOB:m5.py" \
            "$EFFECT_STAGE3_BLOB:effect-stage3.sh" "$EFFECT_STAGE5_BLOB:effect-stage5.sh" \
            "$COMPLETE_MATERIALIZER_BLOB:complete.py" "$COMPLETE_VERIFIER_BLOB:complete.sh" \
            "$OWNER_MATERIALIZER_BLOB:owner.py" "$OWNER_VERIFIER_BLOB:owner.sh" \
            "$RECLAIM_MATERIALIZER_BLOB:reclaim.py" "$RECLAIM_HYGIENE_BLOB:reclaim-hygiene.py" \
            "$RECLAIM_VERIFIER_BLOB:reclaim.sh"; do
            blob="${pair%%:*}"; name="${pair##*:}"
            git cat-file blob "$blob" >"$RUNNER_TEMP/$name"
            test "$(git hash-object "$RUNNER_TEMP/$name")" = "$blob"
          done
          printf 'WORK_ROOT=%s\nBASE_SHA=%s\n' "$root" "$base_sha" >>"$GITHUB_ENV"
          echo "LAS_CHAIN_COMPLETE_DIAG_RECOVERY=PASS"

      - name: Install exact build toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null
          archive="$RUNNER_TEMP/alr.zip"; prefix="$RUNNER_TEMP/alr"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --silent --show-error --output "$archive" "https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip"
          echo "09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  $archive" | sha256sum --check --strict >/dev/null
          mkdir -p "$prefix"; unzip -q "$archive" -d "$prefix"; export PATH="$prefix/bin:$PATH"; echo "$prefix/bin" >>"$GITHUB_PATH"
          alr -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1 >/dev/null
          workspace="$RUNNER_TEMP/alr-work"; mkdir -p "$workspace"; cd "$workspace"
          alr -n init --in-place --no-skel --lib retired_archive_chain_complete_diag >/dev/null
          alr_path="$(command -v alr)"; wrapper="$RUNNER_TEMP/gprbuild-via-alire"
          printf '%s\n' '#!/usr/bin/env bash' 'set -euo pipefail' "cd \"$workspace\"" "exec \"$alr_path\" exec -- gprbuild \"\$@\"" >"$wrapper"
          chmod 0755 "$wrapper"; printf 'GPRBUILD=%s\n' "$wrapper" >>"$GITHUB_ENV"
          echo "LAS_CHAIN_COMPLETE_DIAG_TOOLCHAINS=PASS"

      - name: Reproduce exact chain context and capture complete verifier
        shell: bash
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          cd "$WORK_ROOT"
          python3 tools/verification/private_reconciled_baseline_repair.py >/dev/null 2>&1
          python3 tools/verification/private_reconciled_baseline_visibility_repair.py >/dev/null 2>&1
          python3 tools/verification/private_reconciled_baseline_clippy_contract_repair.py >/dev/null 2>&1
          cargo +1.98.1 fmt --all >/dev/null 2>&1
          git add src; test "$(git write-tree)" = "$EXPECTED_GREEN_BASELINE_TREE"
          git config user.name "LAS Ephemeral Chain Complete Diagnostic"
          git config user.email "las-chain-complete-diag@users.noreply.github.com"
          git commit -q -m "Ephemeral exact verified green baseline"
          work="$RUNNER_TEMP/archive-chain"; git worktree add -q -b verify-archive-chain "$work" HEAD; cd "$work"
          mkdir -p tools/verification
          install -m 0644 "$RUNNER_TEMP/m1.py" tools/verification/private_retired_effect_owner_adapter_materialize.py
          install -m 0644 "$RUNNER_TEMP/m2.py" tools/verification/private_retired_effect_schema_semantic_repair.py
          install -m 0644 "$RUNNER_TEMP/m3.py" tools/verification/private_retired_effect_recovery_congruence_hardening.py
          install -m 0644 "$RUNNER_TEMP/m4.py" tools/verification/private_retired_effect_archive_borrow_repair.py
          install -m 0644 "$RUNNER_TEMP/m5.py" tools/verification/private_retired_effect_default_feature_test_gate_repair.py
          install -m 0755 "$RUNNER_TEMP/effect-stage3.sh" tools/verification/private_retired_effect_candidate_stage3.sh
          install -m 0755 "$RUNNER_TEMP/effect-stage5.sh" tools/verification/private_retired_effect_candidate_stage5.sh
          install -m 0644 "$RUNNER_TEMP/complete.py" tools/verification/private_retired_archive_complete_transcript_materialize.py
          install -m 0755 "$RUNNER_TEMP/complete.sh" tools/verification/private_retired_archive_complete_candidate_stage1.sh
          install -m 0644 "$RUNNER_TEMP/owner.py" tools/verification/private_retired_archive_owner_commit_host_materialize.py
          install -m 0755 "$RUNNER_TEMP/owner.sh" tools/verification/private_retired_archive_owner_commit_candidate_stage1.sh
          install -m 0644 "$RUNNER_TEMP/reclaim.py" tools/verification/private_retired_archive_reclaim_materialize.py
          install -m 0644 "$RUNNER_TEMP/reclaim-hygiene.py" tools/verification/private_retired_archive_reclaim_ownership_hygiene.py
          install -m 0755 "$RUNNER_TEMP/reclaim.sh" tools/verification/private_retired_archive_reclaim_candidate_stage1.sh
          git add tools/verification; git commit -q -m "Ephemeral exact archive reclaim chain verifier overlay"

          effect_base="$(git rev-parse HEAD)"; effect_pkg="$RUNNER_TEMP/effect-package"; mkdir -p "$effect_pkg"
          if LAS_EFFECT_BASE_SHA="$effect_base" LAS_EFFECT_PACKAGE_DIR="$effect_pkg" LAS_EFFECT_EXPECTED_BRANCH=verify-archive-chain \
             bash tools/verification/private_retired_effect_candidate_stage5.sh >"$RUNNER_TEMP/effect.log" 2>&1; then
            effect_tree="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["candidate_tree"])' "$effect_pkg/manifest.json")"
            test "$effect_tree" = "$(git rev-parse 'HEAD^{tree}')"
            echo "LAS_CHAIN_COMPLETE_DIAG_EFFECT_TREE=$effect_tree"
          else
            echo "LAS_CHAIN_COMPLETE_DIAG_FAILED_BEFORE_COMPLETE=EFFECT"
            exit 1
          fi

          complete_base="$(git rev-parse HEAD)"; complete_pkg="$RUNNER_TEMP/complete-package"; mkdir -p "$complete_pkg"
          set +e
          LAS_COMPLETE_BASE_SHA="$complete_base" LAS_COMPLETE_PACKAGE_DIR="$complete_pkg" LAS_COMPLETE_EXPECTED_BRANCH=verify-archive-chain \
            bash tools/verification/private_retired_archive_complete_candidate_stage1.sh >"$RUNNER_TEMP/complete.log" 2>&1
          rc=$?
          set -e
          printf 'COMPLETE_RC=%s\n' "$rc" >>"$GITHUB_ENV"
          printf 'COMPLETE_BASE=%s\n' "$complete_base" >>"$GITHUB_ENV"
          echo "LAS_CHAIN_COMPLETE_DIAG_RC=$rc"

      - name: Encrypt complete diagnostic log
        if: always() && env.COMPLETE_RC != ''
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/complete.log"
          python3 - "$RSA_MODULUS_HEX" "$RSA_EXPONENT" "$RUNNER_TEMP/pub.der" <<'PY'
          import pathlib,sys
          n=int(sys.argv[1],16); e=int(sys.argv[2]); out=pathlib.Path(sys.argv[3])
          def L(n):
              if n < 128: return bytes([n])
              b=n.to_bytes((n.bit_length()+7)//8,'big'); return bytes([0x80|len(b)])+b
          def T(tag,c): return bytes([tag])+L(len(c))+c
          def I(v):
              b=v.to_bytes((v.bit_length()+7)//8 or 1,'big')
              if b[0]&0x80: b=b'\x00'+b
              return T(0x02,b)
          rsa=T(0x30,I(n)+I(e)); alg=T(0x30,bytes.fromhex('06092a864886f70d010101')+bytes.fromhex('0500'))
          out.write_bytes(T(0x30,alg+T(0x03,b'\x00'+rsa)))
          PY
          openssl pkey -pubin -inform DER -in "$RUNNER_TEMP/pub.der" -out "$RUNNER_TEMP/pub.pem" >/dev/null 2>&1
          keymat_hex="$(openssl rand -hex 64)"; enc_key="${keymat_hex:0:64}"; mac_key="${keymat_hex:64:64}"; iv="$(openssl rand -hex 16)"
          python3 - "$keymat_hex" "$RUNNER_TEMP/keymat.bin" <<'PY'
          import pathlib,sys
          pathlib.Path(sys.argv[2]).write_bytes(bytes.fromhex(sys.argv[1]))
          PY
          openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/pub.pem" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in "$RUNNER_TEMP/keymat.bin" -out "$RUNNER_TEMP/keymat.rsa"
          openssl enc -aes-256-cbc -K "$enc_key" -iv "$iv" -in "$RUNNER_TEMP/complete.log" -out "$RUNNER_TEMP/complete.log.enc"
          printf '%s' "$iv" >"$RUNNER_TEMP/iv.hex"
          cat "$RUNNER_TEMP/iv.hex" "$RUNNER_TEMP/complete.log.enc" | openssl dgst -sha256 -mac HMAC -macopt "hexkey:$mac_key" -binary >"$RUNNER_TEMP/complete.log.hmac"
          out="$RUNNER_TEMP/export"; mkdir "$out"
          cp "$RUNNER_TEMP/keymat.rsa" "$RUNNER_TEMP/iv.hex" "$RUNNER_TEMP/complete.log.enc" "$RUNNER_TEMP/complete.log.hmac" "$out/"
          printf '{"schema":"las-chain-complete-diagnostic-v1","complete_rc":%s}\n' "$COMPLETE_RC" >"$out/envelope.json"
          echo "LAS_CHAIN_COMPLETE_DIAG_CIPHERTEXT_SHA256=$(sha256sum "$RUNNER_TEMP/complete.log.enc" | awk '{print $1}')"
          echo "LAS_CHAIN_COMPLETE_DIAG_ENCRYPTION=PASS"

      - name: Upload encrypted complete diagnostic only
        if: always() && env.COMPLETE_RC != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opaque-chain-complete-diagnostic-20261017
          path: ${{ runner.temp }}/export
          if-no-files-found: error
          retention-days: 1

      - name: Preserve complete verifier verdict
        if: always() && env.COMPLETE_RC != ''
        shell: bash
        run: |
          exit "$COMPLETE_RC"

name: Retire completed retired-owner migration tooling 20261012

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/opaque-retired-helper-retirement-20261012.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REF_HASH: 12246190df640013d9ee426d2a340387c6d22d0e8241135d6a20dcf1fe5a2bc0
  EXPECTED_START_HEAD_PROOF: eae214ecf5fbcd274dc0e5ef32747a62ccce3d480be8e7b46931512d26ea03ad
  EXPECTED_START_TREE_PROOF: baf8e7cf99e3a2d2806a0edc1e9ab2bba3218170fae0991457e410af99d67032
  HELPER_A_PATH_HASH: 3bd0f3b2ae73ca0acd5d1e08b47720c6cc80569d4b87901c2e1fc0b69f7504e2
  HELPER_B_PATH_HASH: 3339f22991f94a6f36ccc66648584a4ea905fe49d2e0d854321e69643eb0d7c4

jobs:
  retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Recover exact committed private head and helper chain
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_READ_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
          PRIVATE_WRITE_TOKEN: ${{ secrets.LAS_PRIVATE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"; test -n "$PRIVATE_READ_TOKEN"; test -n "$PRIVATE_WRITE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"; echo "::add-mask::$PRIVATE_READ_TOKEN"; echo "::add-mask::$PRIVATE_WRITE_TOKEN"
          root="$RUNNER_TEMP/private-target"; mkdir "$root"; cd "$root"; git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_READ_TOKEN" | base64 -w0)"; echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/private-heads"; git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""; head=""
          while read -r sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then test -z "$matched_ref"; matched_ref="$ref"; head="$sha"; fi
          done <"$refs"
          rm -f "$refs"; test -n "$matched_ref"; test -n "$head"
          echo "::add-mask::$matched_ref"; echo "::add-mask::$head"
          test "$(printf '%s' "$head" | sha256sum | awk '{print $1}')" = "$EXPECTED_START_HEAD_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=64 origin "$matched_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$head"; git checkout -q --detach "$head"
          tree="$(git rev-parse 'HEAD^{tree}')"; echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_START_TREE_PROOF"
          test -z "$(git status --porcelain)"
          printf '%s' "$matched_ref" >"$RUNNER_TEMP/matched-ref"; printf '%s' "$head" >"$RUNNER_TEMP/start-sha"
          python3 - "$RUNNER_TEMP/helper-paths" <<'PY'
          import hashlib,os,pathlib,subprocess,sys
          tracked=[p.decode() for p in subprocess.check_output(['git','ls-files','-z']).split(b'\0') if p]
          targets=[os.environ['HELPER_A_PATH_HASH'],os.environ['HELPER_B_PATH_HASH']]; helpers=[]
          for target in targets:
              m=[p for p in tracked if hashlib.sha256(p.encode()).hexdigest()==target]
              if len(m)!=1: raise SystemExit(70)
              helpers.append(pathlib.Path(m[0]))
          text_files=[]
          for q in tracked:
              p=pathlib.Path(q)
              try: txt=p.read_text(encoding='utf-8')
              except Exception: continue
              text_files.append((p,txt))
          helper_set={str(x) for x in helpers}
          for idx,h in enumerate(helpers,1):
              refs=sorted({str(p) for p,txt in text_files if p!=h and str(h) in txt})
              base_refs=sorted({str(p) for p,txt in text_files if p!=h and h.name in txt})
              external=[p for p in refs if p not in helper_set]; external_base=[p for p in base_refs if p not in helper_set]
              if external or external_base: raise SystemExit(71+idx)
              if idx==1 and not (refs==[str(helpers[1])] and base_refs==[str(helpers[1])]): raise SystemExit(74)
              if idx==2 and (refs or base_refs): raise SystemExit(75)
          with open(sys.argv[1],'wb') as f:
              for h in helpers: f.write(str(h).encode()+b'\0')
          print('LAS_HELPER_RETIRE_ISOLATION=PASS')
          PY
          echo "LAS_HELPER_RETIRE_RECOVERY=PASS"

      - name: Install pinned Rust and Ada toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null
          test "$(rustc +1.98.1 --version | awk '{print $2}')" = "1.98.1"
          archive="$RUNNER_TEMP/alr.zip"; prefix="$RUNNER_TEMP/alr"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --output "$archive" "https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip" >/dev/null 2>&1
          echo "09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  $archive" | sha256sum --check --strict >/dev/null
          mkdir -p "$prefix"; unzip -q "$archive" -d "$prefix"
          "$prefix/bin/alr" -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1 >/dev/null
          workspace="$RUNNER_TEMP/root-production-toolchain"; mkdir -p "$workspace"; cd "$workspace"
          "$prefix/bin/alr" -n init --in-place --no-skel --lib root_production_toolchain >/dev/null
          gpr_wrapper="$RUNNER_TEMP/gprbuild-wrapper"
          printf '#!/usr/bin/env bash\nset -euo pipefail\ncd %q\nexec %q exec -- gprbuild "$@"\n' "$workspace" "$prefix/bin/alr" >"$gpr_wrapper"
          chmod +x "$gpr_wrapper"; "$gpr_wrapper" --version >/dev/null
          echo "GPRBUILD=$gpr_wrapper" >>"$GITHUB_ENV"
          echo "LAS_HELPER_RETIRE_TOOLCHAINS=PASS"

      - name: Delete exactly the isolated helper chain and prove boundary
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          mapfile -d '' helpers <"$RUNNER_TEMP/helper-paths"; test "${#helpers[@]}" -eq 2
          git rm -q -- "${helpers[@]}"
          all="$RUNNER_TEMP/all-changed"; deleted="$RUNNER_TEMP/deleted"
          git diff --name-only -z >"$all"; git diff --diff-filter=D --name-only -z >"$deleted"
          python3 - "$all" "$deleted" <<'PY'
          import hashlib,os,sys
          def read(p): return [x for x in open(p,'rb').read().split(b'\0') if x]
          allp=read(sys.argv[1]); deleted=read(sys.argv[2]); expected=sorted([os.environ['HELPER_A_PATH_HASH'],os.environ['HELPER_B_PATH_HASH']])
          for label,paths in [('ALL',allp),('DELETED',deleted)]:
              hashes=sorted(hashlib.sha256(p).hexdigest() for p in paths)
              if len(paths)!=2 or hashes!=expected: raise SystemExit(80)
              print(f'LAS_HELPER_RETIRE_{label}_COUNT=2')
          PY
          rm -f "$all" "$deleted"; git diff --check
          echo "LAS_HELPER_RETIRE_DELETE_BOUNDARY=PASS"

      - name: Run full gate matrix after helper retirement candidate
        shell: bash
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"; failures=0
          run_gate() {
            label="$1"; shift; log="$RUNNER_TEMP/helper-retire-${label}.private.log"
            set +e; "$@" >"$log" 2>&1; rc=$?; set -e
            echo "LAS_HELPER_RETIRE_${label}_RC=$rc"
            echo "LAS_HELPER_RETIRE_${label}_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
            rm -f "$log"; if [[ "$rc" -ne 0 ]]; then failures=$((failures+1)); fi
          }
          run_gate TRUST_CONTRACT python3 tools/verification/root_trust_input_contract.py
          run_gate FORMAT cargo +1.98.1 fmt --all -- --check
          run_gate DEFAULT_CHECK cargo +1.98.1 check --locked --all-targets
          run_gate LINUX_CHECK cargo +1.98.1 check --locked --all-targets --features linux-peer-credentials
          run_gate PRODUCTION_CHECK cargo +1.98.1 check --locked --all-targets --features "root-ffi linux-peer-credentials"
          run_gate PRODUCTION_CLIPPY cargo +1.98.1 clippy --locked --all-targets --features "root-ffi linux-peer-credentials" -- -D warnings
          run_gate RETIRED_BOUND_TEST cargo +1.98.1 test --locked --lib --features linux-peer-credentials root_supervisor_linux_retired_bound_archive -- --test-threads=1
          run_gate RETIRED_OWNER_TEST cargo +1.98.1 test --locked --lib --features "root-ffi linux-peer-credentials" retired_projection_tests -- --test-threads=1
          run_gate RETIRED_SINK_TEST cargo +1.98.1 test --locked --lib --features linux-peer-credentials root_supervisor_linux_retired_owner_projection -- --test-threads=1
          run_gate PRODUCTION_LIB_TEST cargo +1.98.1 test --locked --lib --features "root-ffi linux-peer-credentials" -- --test-threads=1
          run_gate RELEASE_CHECK cargo +1.98.1 check --release --locked --all-targets --features "root-ffi linux-peer-credentials"
          echo "LAS_HELPER_RETIRE_FAILURE_COUNT=$failures"
          test "$failures" -eq 0
          echo "LAS_HELPER_RETIRE_GATE_MATRIX=PASS"

      - name: Commit and guarded CAS push helper retirement
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_READ_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
          PRIVATE_WRITE_TOKEN: ${{ secrets.LAS_PRIVATE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          start_sha="$(cat "$RUNNER_TEMP/start-sha")"; matched_ref="$(cat "$RUNNER_TEMP/matched-ref")"
          echo "::add-mask::$start_sha"; echo "::add-mask::$matched_ref"; echo "::add-mask::$PRIVATE_REPOSITORY"; echo "::add-mask::$PRIVATE_READ_TOKEN"; echo "::add-mask::$PRIVATE_WRITE_TOKEN"
          test "$(printf '%s' "$start_sha" | sha256sum | awk '{print $1}')" = "$EXPECTED_START_HEAD_PROOF"
          mapfile -d '' helpers <"$RUNNER_TEMP/helper-paths"; test "${#helpers[@]}" -eq 2
          git config user.name "LAS Verification Committer"; git config user.email "las-verification@users.noreply.github.com"
          git add -u -- "${helpers[@]}"
          staged="$RUNNER_TEMP/staged"; git diff --cached --diff-filter=D --name-only -z >"$staged"
          python3 - "$staged" <<'PY'
          import hashlib,os,sys
          paths=[p for p in open(sys.argv[1],'rb').read().split(b'\0') if p]; expected=sorted([os.environ['HELPER_A_PATH_HASH'],os.environ['HELPER_B_PATH_HASH']])
          if len(paths)!=2 or sorted(hashlib.sha256(p).hexdigest() for p in paths)!=expected: raise SystemExit(90)
          print('LAS_HELPER_RETIRE_STAGED_BOUNDARY=PASS')
          PY
          rm -f "$staged"
          git commit -q -m "Retire completed retired-owner migration tooling"
          new_sha="$(git rev-parse HEAD)"; new_tree="$(git rev-parse 'HEAD^{tree}')"; echo "::add-mask::$new_sha"; echo "::add-mask::$new_tree"
          test "$(git rev-parse HEAD^)" = "$start_sha"; test -z "$(git status --porcelain)"
          read_auth="$(printf 'x-access-token:%s' "$PRIVATE_READ_TOKEN" | base64 -w0)"; write_auth="$(printf 'x-access-token:%s' "$PRIVATE_WRITE_TOKEN" | base64 -w0)"; echo "::add-mask::$read_auth"; echo "::add-mask::$write_auth"
          remote_sha="$(git -c http.extraHeader="AUTHORIZATION: basic $read_auth" ls-remote origin "$matched_ref" | awk '{print $1}')"; echo "::add-mask::$remote_sha"; test "$remote_sha" = "$start_sha"
          git -c http.extraHeader="AUTHORIZATION: basic $write_auth" push -q origin HEAD:"$matched_ref"
          post_sha="$(git -c http.extraHeader="AUTHORIZATION: basic $read_auth" ls-remote origin "$matched_ref" | awk '{print $1}')"; echo "::add-mask::$post_sha"; test "$post_sha" = "$new_sha"
          git -c http.extraHeader="AUTHORIZATION: basic $read_auth" fetch -q --depth=2 origin "$matched_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$new_sha"; test "$(git rev-parse "$new_sha^")" = "$start_sha"; test "$(git rev-parse "$new_sha^{tree}")" = "$new_tree"
          changed="$RUNNER_TEMP/readback-deleted"; git diff --diff-filter=D --name-only -z "$start_sha..$new_sha" >"$changed"
          python3 - "$changed" <<'PY'
          import hashlib,os,sys
          paths=[p for p in open(sys.argv[1],'rb').read().split(b'\0') if p]; expected=sorted([os.environ['HELPER_A_PATH_HASH'],os.environ['HELPER_B_PATH_HASH']])
          if len(paths)!=2 or sorted(hashlib.sha256(p).hexdigest() for p in paths)!=expected: raise SystemExit(91)
          print('LAS_HELPER_RETIRE_READBACK_DELETED_COUNT=2')
          PY
          rm -f "$changed"
          echo "LAS_HELPER_RETIRE_PUSH=PASS"
          echo "LAS_HELPER_RETIRE_NEW_HEAD_PROOF=$(printf '%s' "$new_sha" | sha256sum | awk '{print $1}')"
          echo "LAS_HELPER_RETIRE_NEW_TREE_PROOF=$(printf '%s' "$new_tree" | sha256sum | awk '{print $1}')"

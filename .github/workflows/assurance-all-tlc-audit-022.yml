name: Exact private bounded all-207 TLC source audit (quarantine only)

on:
  push:
    branches:
      - quarantine/assurance-scoped-native-bridge-20261031
    paths:
      - .github/workflows/assurance-all-tlc-audit-022.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fixed-private-all-tlc-audit-022
  # Cancel stale, proven-misbound source-model attempts rather than occupying
  # hosted runners while the exact profile resolver has been corrected.
  cancel-in-progress: true

jobs:
  tlc-full-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      # Only non-sensitive one-way proofs appear in the PUBLIC shell.
      TARGET_BRANCH_PROOF: 0a9d756901b297941bbaf17509c374fcbbbf6e38862e10a80ec265fc97ce52df
      EXPECTED_PRIVATE_COMMIT_PROOF: 1adce8a16b15daa5022b11634ffccb7c21785e6ccb449a6055acf2e2d5514e43
      EXPECTED_PRIVATE_TEST_RUNNER_SHA256: 529de5130fd7f8cb9331fb535e8c762ec75afae6143fbe879c3917bd926495df
    steps:
      - name: Recover one privately pinned source revision
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_READ_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$PRIVATE_REPOSITORY" || -z "$PRIVATE_READ_TOKEN" ]]; then
            echo 'LAS_BRIDGE=FAIL:ACCESS'; exit 1
          fi
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_READ_TOKEN"
          private="$RUNNER_TEMP/private-source"
          mkdir -m 700 "$private"
          cd "$private"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          authorization="$(printf 'x-access-token:%s' "$PRIVATE_READ_TOKEN" | base64 -w0)"
          echo "::add-mask::$authorization"
          all_refs="$RUNNER_TEMP/private-heads"
          git -c core.fsmonitor=false -c http.extraHeader="AUTHORIZATION: basic $authorization" \
            ls-remote --heads origin > "$all_refs" 2> "$RUNNER_TEMP/secret-fetch-error"
          match=''
          while read -r _sha candidate; do
            candidate_proof="$(printf '%s' "$candidate" | sha256sum | awk '{print $1}')"
            if [[ "$candidate_proof" == "$TARGET_BRANCH_PROOF" ]]; then
              [[ -z "$match" ]] || { echo 'LAS_BRIDGE=FAIL:AMBIGUOUS_REF'; exit 1; }
              match="$candidate"
            fi
          done < "$all_refs"
          rm -f "$all_refs" "$RUNNER_TEMP/secret-fetch-error"
          [[ -n "$match" ]] || { echo 'LAS_BRIDGE=FAIL:TARGET'; exit 1; }
          echo "::add-mask::$match"
          git -c core.fsmonitor=false -c http.extraHeader="AUTHORIZATION: basic $authorization" \
            fetch -q --depth=1 origin "$match" > /dev/null 2> "$RUNNER_TEMP/secret-fetch-error"
          rm -f "$RUNNER_TEMP/secret-fetch-error"
          unset authorization PRIVATE_READ_TOKEN PRIVATE_REPOSITORY
          git -c core.fsmonitor=false checkout -q --detach FETCH_HEAD
          actual="$(git -c core.fsmonitor=false rev-parse --verify HEAD)"
          echo "::add-mask::$actual"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          if [[ "$proof" != "$EXPECTED_PRIVATE_COMMIT_PROOF" ]]; then
            echo 'LAS_BRIDGE=FAIL:SOURCE_PROOF'; exit 1
          fi
          if [[ -n "$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all)" ]]; then
            echo 'LAS_BRIDGE=FAIL:DIRTY'; exit 1
          fi
          test_runner='tools/verification/run_bridge_native_suite.sh'
          if ! printf '%s  %s\n' "$EXPECTED_PRIVATE_TEST_RUNNER_SHA256" "$test_runner" |
               sha256sum --check --strict >/dev/null 2>&1; then
            echo 'LAS_BRIDGE=FAIL:RUNNER_SOURCE'; exit 1
          fi
          echo "LAS_PRIVATE_SOURCE_PROOF=$proof"
          echo 'LAS_BRIDGE=EXACT_SOURCE_READY'

      - name: Obtain source-workflow pinned TLA tools
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/las-tlc-tools.jar"
          private_log="$RUNNER_TEMP/las-tlc-tools-download-private.log"
          if ! curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
               --output "$archive" \
               'https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar' >"$private_log" 2>&1; then
            echo 'LAS_TLC_SCOPE=FAIL:TOOL_DOWNLOAD'; exit 1
          fi
          if ! printf '%s  %s\n' 'bee4a54f3ee3d4afc347c3240ec2d9e93b075104' "$archive" | sha1sum --check --strict >"$private_log" 2>&1; then
            echo 'LAS_TLC_SCOPE=FAIL:SOURCE_PIN'; exit 1
          fi
          # Exact canonical private verifier pins v1.7.4. A second digest
          # may be added only after independent byte verification of this version.
          echo 'LAS_TLC_SCOPE=EXACT_CANONICAL_VERSION_SHA1_PINNED'

      - name: Audit full source-tracked TLC profile set in eight bounded shards
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: -Xmx5g
          TLC_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-source"
          archive="$RUNNER_TEMP/las-tlc-tools.jar"
          logs="$(mktemp -d "$RUNNER_TEMP/las-tlc-all.XXXXXXXX")"
          chmod 700 "$logs"
          trap 'rm -rf -- "$logs"' EXIT
          # SCOPED AUDIT ONLY. Pinned canonical source owns both the
          # positive/negative distinction and the exact model/deadlock mapping.
          if ! python3 -I -B - "$PWD" "$PWD/tools/verify_codespaces_all.sh" > "$logs/map.tsv" 2>"$logs/map-private.err" <<'PY'
          import pathlib, sys
          root = pathlib.Path(sys.argv[1])
          source = pathlib.Path(sys.argv[2]).read_text(encoding="utf-8")
          marker = """if ! python3 - "$ROOT" > "$TLC_MAP.pending" <<'PY'\n"""
          if source.count(marker) != 1:
              raise SystemExit(2)
          tail = source.split(marker, 1)[1]
          closing = "\nPY\nthen"
          if tail.count(closing) != 1:
              raise SystemExit(2)
          # Execute only the source-pinned canonical generator. This remains
          # SELF-CONTROLLED scoped evidence, never independent approval.
          sys.argv = ["canonical-map", str(root)]
          exec(compile(tail.split(closing, 1)[0], "<pinned-canonical-map>", "exec"),
               {"__name__": "__main__"})
          PY
          then
            echo 'LAS_ALL_TLC=FAIL:CANONICAL_MAP_UNAVAILABLE'; exit 1
          fi
          mapfile -t cases < "$logs/map.tsv"
          if (( ${#cases[@]} != 207 )); then
            echo 'LAS_ALL_TLC=FAIL:CANONICAL_PROFILE_COUNT'; exit 1
          fi
          checked=0
          declared_negatives=0
          for record in "${cases[@]}"; do
            IFS=$'\t' read -r cfg chosen deadlock expectation <<< "$record"
            if [[ -z "$cfg" || -z "$chosen" || ! "$deadlock" =~ ^[01]$ ]]; then
              echo 'LAS_ALL_TLC=FAIL:INVALID_CANONICAL_ENTRY'; exit 1
            fi
            if [[ "$cfg" == *Negative.cfg ]]; then
              [[ -n "$expectation" ]] || { echo 'LAS_ALL_TLC=FAIL:MISSING_NEGATIVE_RULE'; exit 1; }
              declared_negatives=$((declared_negatives + 1))
            else
              [[ -z "$expectation" ]] || { echo 'LAS_ALL_TLC=FAIL:UNEXPECTED_NEGATIVE_RULE'; exit 1; }
            fi
            # Private profile digest only schedules work; NEVER emit it publicly.
            digest="$(printf '%s' "$cfg" | sha256sum | awk '{print $1}')"
            bucket="$((16#${digest:0:4} % 8))"
            [[ "$bucket" -eq "$TLC_SHARD" ]] || continue
            if [[ -L "$cfg" || -L "$chosen" || ! -f "$cfg" || ! -f "$chosen" ]] ||
               ! git -c core.fsmonitor=false ls-files --error-unmatch "$cfg" "$chosen" >/dev/null 2>&1; then
              echo 'LAS_ALL_TLC=FAIL:UNTRACKED_OR_UNSAFE_PROFILE'; exit 1
            fi
            checked=$((checked + 1))
            # Mirror canonical v1.7.4 liveness soundness flags. Changing these
            # to v1.7.2, omitting final liveness, or globally disabling deadlock
            # checks would make the scoped evidence non-comparable.
            args=(-workers auto -lncheck final -fp 0)
            if [[ "$deadlock" == "1" ]]; then args+=(-deadlock); fi
            args+=(-config "$(basename "$cfg")" "$(basename "$chosen")")
            # Model imports are resolved in the owning module directory, as in
            # the private canonical verifier; raw logs stay runner-private.
            if (cd "$(dirname "$cfg")" && timeout --signal=TERM --kill-after=15s 9m \
                 java -XX:+UseParallelGC -jar "$archive" "${args[@]}") > "$logs/case_$checked" 2>&1; then
              java_rc=0
            else
              java_rc=$?
            fi
            if (( java_rc == 124 || java_rc == 137 || java_rc == 143 )); then
              echo 'LAS_ALL_TLC=INCOMPLETE:RESOURCE_OR_TIMEOUT'; exit 1
            fi
            if ! python3 -I -B tools/verification/canonical_tlc_result_evidence.py \
                 "$logs/case_$checked" "$java_rc" 0 --expectation "$expectation" \
                 > "$logs/receipt_$checked" 2>&1; then
              echo 'LAS_ALL_TLC=FAIL:CASE_EVIDENCE_REJECTED'; exit 1
            fi
          done
          if (( declared_negatives != 12 )); then
            echo 'LAS_ALL_TLC=FAIL:NEGATIVE_CONTROL_COUNT'; exit 1
          fi
          if (( checked == 0 )); then
            echo 'LAS_ALL_TLC=FAIL:EMPTY_SHARD'; exit 1
          fi
          if [[ -n "$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all)" ]]; then
            echo 'LAS_ALL_TLC=FAIL:SOURCE_DRIFT'; exit 1
          fi
          echo "LAS_ALL_TLC=SHARD_${TLC_SHARD}_SCOPED_PASS_CASES_${checked}_NOT_RELEASE_APPROVAL"

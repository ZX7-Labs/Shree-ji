name: Private Linux retired bound frontier v3 repair apply 20261011

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-linux-retired-bound-frontier-v3-repair-apply-20261011.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REF_HASH: 64acb92f533de14d70efc0a74479ee0912c0baedd38b97df084a1acb45a9be85
  EXPECTED_HEAD_PROOF: 31f730cbb2c51e8a9022b13d3f67ac0ee18af68633deb58beb34fdd9125918ff
  EXPECTED_TREE_PROOF: 1e1b2c03bf797c25f1a89daeb69c7d501adbe46d893f247ed5259158fa92da23
  EXPECTED_REPAIRED_FILE_SHA256: 5735046a6f0f1f28264d4d40a9e15419d70e4a8050adf09b7aed7782acecb807

jobs:
  apply-verify-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null
          test "$(rustc +1.98.1 --version | awk '{print $2}')" = "1.98.1"
          test "$(cargo +1.98.1 --version | awk '{print $2}')" = "1.98.1"

      - name: Apply verify and commit exact private repair
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_READ_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
          PRIVATE_WRITE_TOKEN: ${{ secrets.LAS_PRIVATE_WRITE_TOKEN }}
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_READ_TOKEN"
          test -n "$PRIVATE_WRITE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_READ_TOKEN"
          echo "::add-mask::$PRIVATE_WRITE_TOKEN"

          root="$GITHUB_WORKSPACE/private"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          read_auth="$(printf 'x-access-token:%s' "$PRIVATE_READ_TOKEN" | base64 -w0)"
          write_auth="$(printf 'x-access-token:%s' "$PRIVATE_WRITE_TOKEN" | base64 -w0)"
          echo "::add-mask::$read_auth"
          echo "::add-mask::$write_auth"

          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $read_auth" ls-remote --heads origin >"$refs"
          matched_ref=""; start_sha=""
          while read -r candidate_sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
              start_sha="$candidate_sha"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"; test -n "$start_sha"
          echo "::add-mask::$matched_ref"; echo "::add-mask::$start_sha"
          test "$(printf '%s' "$start_sha" | sha256sum | awk '{print $1}')" = "$EXPECTED_HEAD_PROOF"

          git -c http.extraHeader="AUTHORIZATION: basic $read_auth" fetch -q --depth=1 origin "$matched_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$start_sha"
          git checkout -q --detach "$start_sha"
          start_tree="$(git rev-parse 'HEAD^{tree}')"
          echo "::add-mask::$start_tree"
          test "$(printf '%s' "$start_tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_TREE_PROOF"
          test -z "$(git status --porcelain)"

          target="src/effect_fabric/root_supervisor_linux_retired_bound_archive.rs"
          python3 - "$target" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          text = p.read_text(encoding="utf-8")

          fn = "    fn next_archive_must_continue_exact_successor_and_use_fresh_owner_commitments() {"
          start = text.index(fn)
          end = text.index("    #[test]", start + len(fn))
          section = text[start:end]
          old = "        verifier\n            .verify_bind_and_persist("
          if section.count(old) != 1:
              raise SystemExit("target must-use site is not unique")
          section = section.replace(old, "        let _first = verifier\n            .verify_bind_and_persist(", 1)
          text = text[:start] + section + text[end:]

          old_expect = '''    #[expect(\n        clippy::result_large_err,\n        reason = "bounded failure-atomic evidence stays stack-owned and allocation-free"\n    )]\n    pub(super) fn verify_bind_and_persist('''
          new_expect = '''    #[expect(\n        clippy::type_complexity,\n        reason = "independent archive, owner, and durable-store failure channels remain explicit at the high-assurance boundary"\n    )]\n    pub(super) fn verify_bind_and_persist('''
          if text.count(old_expect) != 1:
              raise SystemExit("target Clippy expectation site is not unique")
          text = text.replace(old_expect, new_expect, 1)
          p.write_text(text, encoding="utf-8")
          PY

          cargo +1.98.1 fmt --all
          test "$(git diff --name-only)" = "$target"
          test "$(sha256sum "$target" | awk '{print $1}')" = "$EXPECTED_REPAIRED_FILE_SHA256"
          git diff --check
          echo "LAS_BOUND_V3_REPAIR_SCOPE=PASS"
          echo "LAS_BOUND_V3_REPAIR_FILE=PASS"

          run_stage() {
            local stage="$1"; shift
            local log="$RUNNER_TEMP/${stage}.private.log"
            set +e
            "$@" >"$log" 2>&1
            local rc=$?
            set -e
            echo "LAS_BOUND_V3_REPAIR_${stage}_RC=$rc"
            echo "LAS_BOUND_V3_REPAIR_${stage}_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
            if [[ $rc -ne 0 ]]; then exit "$rc"; fi
            rm -f "$log"
          }

          run_stage FORMAT cargo +1.98.1 fmt --all -- --check
          run_stage CHECK cargo +1.98.1 check --locked --all-targets --features linux-peer-credentials
          run_stage CLIPPY cargo +1.98.1 clippy --locked --all-targets --features linux-peer-credentials -- -D warnings
          run_stage TEST cargo +1.98.1 test --locked --lib --features linux-peer-credentials root_supervisor_linux_retired_bound_archive -- --test-threads=1

          git config user.name "LAS Verification Committer"
          git config user.email "las-verification@users.noreply.github.com"
          git add -- "$target"
          test "$(git diff --cached --name-only)" = "$target"
          git diff --cached --check
          git commit -q -m "Repair retired bound frontier v3 Rust gate"
          test "$(git rev-parse HEAD^)" = "$start_sha"
          new_sha="$(git rev-parse HEAD)"
          new_tree="$(git rev-parse 'HEAD^{tree}')"
          echo "::add-mask::$new_sha"; echo "::add-mask::$new_tree"

          remote_sha="$(git -c http.extraHeader="AUTHORIZATION: basic $write_auth" ls-remote origin "$matched_ref" | awk '{print $1}')"
          echo "::add-mask::$remote_sha"
          test "$remote_sha" = "$start_sha"
          test "$(printf '%s' "$remote_sha" | sha256sum | awk '{print $1}')" = "$EXPECTED_HEAD_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $write_auth" push -q origin HEAD:"$matched_ref"
          post_sha="$(git -c http.extraHeader="AUTHORIZATION: basic $read_auth" ls-remote origin "$matched_ref" | awk '{print $1}')"
          test "$post_sha" = "$new_sha"
          echo "LAS_BOUND_V3_REPAIR_PRIVATE_COMMIT=PASS"
          echo "LAS_BOUND_V3_REPAIR_PRIVATE_COMMIT_PROOF=$(printf '%s' "$new_sha" | sha256sum | awk '{print $1}')"
          echo "LAS_BOUND_V3_REPAIR_PRIVATE_TREE_PROOF=$(printf '%s' "$new_tree" | sha256sum | awk '{print $1}')"

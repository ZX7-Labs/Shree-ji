#[test]
fn readiness_scheduler_does_not_repoll_partial_request_until_readable_is_observed() {
    let Fixture {
        mut peer,
        session,
        mut service,
        boundary,
        installs,
    } = build_fixture();
    let mut scheduler = LinuxControlSessionScheduler::<1>::new().unwrap();
    let slot = scheduler.store(session).unwrap();
    let frame = install_command(21).canonical_bytes();
    let split = CONTROL_FRAME_LEN / 2;
    peer.write_all(&frame[..split]).unwrap();

    assert_eq!(
        scheduler
            .step_next(|session| session.try_process_one(&mut service, &boundary))
            .unwrap(),
        Some(LinuxControlSchedulerStep::Waiting {
            slot,
            interest: LinuxControlIoInterest::Readable,
        })
    );
    assert_eq!(installs.get(), 0);
    assert_eq!(
        scheduler.waiting_interest(slot).unwrap(),
        Some(LinuxControlIoInterest::Readable)
    );

    // Repeated outer-loop steps cannot touch the socket while readiness is absent.
    assert_eq!(
        scheduler
            .step_next(|session| session.try_process_one(&mut service, &boundary))
            .unwrap(),
        None
    );
    peer.write_all(&frame[split..]).unwrap();
    assert_eq!(
        scheduler
            .step_next(|session| session.try_process_one(&mut service, &boundary))
            .unwrap(),
        None
    );
    assert_eq!(installs.get(), 0);

    scheduler
        .mark_ready(slot, LinuxControlIoInterest::Readable)
        .unwrap();
    assert_eq!(
        scheduler
            .step_next(|session| session.try_process_one(&mut service, &boundary))
            .unwrap(),
        Some(LinuxControlSchedulerStep::Complete {
            slot,
            step: ControlSessionStep::Replied,
        })
    );
    assert_eq!(installs.get(), 1);
    read_reply(&mut peer, 21);
    assert_eq!(
        scheduler.waiting_interest(slot).unwrap(),
        Some(LinuxControlIoInterest::Readable)
    );
}

#[test]
fn readiness_scheduler_requires_writable_before_resuming_exact_staged_reply() {
    let Fixture {
        mut peer,
        mut session,
        mut service,
        boundary,
        installs,
    } = build_fixture();
    session.pause_next_reply_flush_for_test();
    let mut scheduler = LinuxControlSessionScheduler::<1>::new().unwrap();
    let slot = scheduler.store(session).unwrap();
    peer.write_all(&install_command(31).canonical_bytes()).unwrap();
    peer.write_all(&install_command(32).canonical_bytes()).unwrap();

    assert_eq!(
        scheduler
            .step_next(|session| session.try_process_one(&mut service, &boundary))
            .unwrap(),
        Some(LinuxControlSchedulerStep::Waiting {
            slot,
            interest: LinuxControlIoInterest::Writable,
        })
    );
    assert_eq!(installs.get(), 1);

    assert_eq!(
        scheduler.mark_ready(slot, LinuxControlIoInterest::Readable),
        Err(LinuxControlReadinessError::InterestMismatch {
            expected: LinuxControlIoInterest::Writable,
            observed: LinuxControlIoInterest::Readable,
        })
    );
    assert_eq!(
        scheduler
            .step_next(|session| session.try_process_one(&mut service, &boundary))
            .unwrap(),
        None
    );
    assert_eq!(installs.get(), 1);

    scheduler
        .mark_ready(slot, LinuxControlIoInterest::Writable)
        .unwrap();
    assert_eq!(
        scheduler
            .step_next(|session| session.try_process_one(&mut service, &boundary))
            .unwrap(),
        Some(LinuxControlSchedulerStep::Complete {
            slot,
            step: ControlSessionStep::Replied,
        })
    );
    assert_eq!(installs.get(), 1);
    read_reply(&mut peer, 31);

    // The pipelined second command is still fenced until readable readiness is supplied.
    assert_eq!(
        scheduler
            .step_next(|session| session.try_process_one(&mut service, &boundary))
            .unwrap(),
        None
    );
    scheduler
        .mark_ready(slot, LinuxControlIoInterest::Readable)
        .unwrap();
    assert_eq!(
        scheduler
            .step_next(|session| session.try_process_one(&mut service, &boundary))
            .unwrap(),
        Some(LinuxControlSchedulerStep::Complete {
            slot,
            step: ControlSessionStep::Replied,
        })
    );
    assert_eq!(installs.get(), 2);
    read_reply(&mut peer, 32);
}

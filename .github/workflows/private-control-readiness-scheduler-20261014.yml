#[derive(Clone, Copy, Debug, Eq, PartialEq)]
pub(super) enum LinuxControlSchedulerInitError {
    ZeroCapacity,
}

#[derive(Clone, Copy, Debug, Eq, PartialEq)]
pub(super) enum LinuxControlReadinessError {
    SlotOutOfRange,
    Vacant,
    AlreadyRunnable,
    InterestMismatch {
        expected: LinuxControlIoInterest,
        observed: LinuxControlIoInterest,
    },
}

#[derive(Clone, Copy, Debug, Eq, PartialEq)]
pub(super) enum LinuxControlSchedulerStep {
    Waiting {
        slot: usize,
        interest: LinuxControlIoInterest,
    },
    Complete {
        slot: usize,
        step: ControlSessionStep,
    },
}

#[derive(Clone, Copy, Debug, Eq, PartialEq)]
enum LinuxControlSlotState {
    Runnable,
    Waiting(LinuxControlIoInterest),
}

struct LinuxControlOccupiedSlot {
    session: LinuxActiveControlSession,
    state: LinuxControlSlotState,
}

enum LinuxControlSessionSlot {
    Vacant,
    Occupied(LinuxControlOccupiedSlot),
}

/// Fixed-capacity owner for accepted control sessions.
///
/// A session is runnable only on initial acceptance or after the caller supplies the exact
/// readiness event requested by its previous resumable step. `Pending(Readable)` and
/// `Pending(Writable)` therefore become scheduler state, not a hint that an outer loop may
/// ignore. Completing one reply moves a still-open session back to `Waiting(Readable)`;
/// even a pipelined next command cannot be polled again until the readiness boundary says
/// input may advance. Any processing error consumes the uncertain session.
#[must_use = "scheduler owns accepted control sessions and their exact readiness obligations"]
pub(super) struct LinuxControlSessionScheduler<const CONTROL_SESSIONS: usize> {
    slots: [LinuxControlSessionSlot; CONTROL_SESSIONS],
    next: usize,
}

impl<const CONTROL_SESSIONS: usize> LinuxControlSessionScheduler<CONTROL_SESSIONS> {
    pub(super) fn new() -> Result<Self, LinuxControlSchedulerInitError> {
        if CONTROL_SESSIONS == 0 {
            return Err(LinuxControlSchedulerInitError::ZeroCapacity);
        }
        Ok(Self {
            slots: std::array::from_fn(|_| LinuxControlSessionSlot::Vacant),
            next: 0,
        })
    }

    pub(super) fn has_capacity(&self) -> bool {
        self.slots
            .iter()
            .any(|slot| matches!(slot, LinuxControlSessionSlot::Vacant))
    }

    /// Store one newly accepted session. The caller must check `has_capacity` before
    /// accepting from the kernel; failure here therefore signals an internal ownership
    /// contradiction and returns the session unchanged rather than dropping it.
    pub(super) fn store(
        &mut self,
        session: LinuxActiveControlSession,
    ) -> Result<usize, LinuxActiveControlSession> {
        let Some(slot) = self
            .slots
            .iter_mut()
            .position(|slot| matches!(slot, LinuxControlSessionSlot::Vacant))
        else {
            return Err(session);
        };
        self.slots[slot] = LinuxControlSessionSlot::Occupied(LinuxControlOccupiedSlot {
            session,
            state: LinuxControlSlotState::Runnable,
        });
        Ok(slot)
    }

    pub(super) fn waiting_interest(
        &self,
        slot: usize,
    ) -> Result<Option<LinuxControlIoInterest>, LinuxControlReadinessError> {
        let Some(slot) = self.slots.get(slot) else {
            return Err(LinuxControlReadinessError::SlotOutOfRange);
        };
        match slot {
            LinuxControlSessionSlot::Vacant => Err(LinuxControlReadinessError::Vacant),
            LinuxControlSessionSlot::Occupied(occupied) => match occupied.state {
                LinuxControlSlotState::Runnable => Ok(None),
                LinuxControlSlotState::Waiting(interest) => Ok(Some(interest)),
            },
        }
    }

    /// Convert exactly one matching kernel-readiness observation into permission to retry.
    /// A mismatched event leaves the session waiting for its original interest.
    pub(super) fn mark_ready(
        &mut self,
        slot: usize,
        observed: LinuxControlIoInterest,
    ) -> Result<(), LinuxControlReadinessError> {
        let Some(slot) = self.slots.get_mut(slot) else {
            return Err(LinuxControlReadinessError::SlotOutOfRange);
        };
        match slot {
            LinuxControlSessionSlot::Vacant => Err(LinuxControlReadinessError::Vacant),
            LinuxControlSessionSlot::Occupied(occupied) => match occupied.state {
                LinuxControlSlotState::Runnable => Err(LinuxControlReadinessError::AlreadyRunnable),
                LinuxControlSlotState::Waiting(expected) if expected != observed => {
                    Err(LinuxControlReadinessError::InterestMismatch { expected, observed })
                }
                LinuxControlSlotState::Waiting(_) => {
                    occupied.state = LinuxControlSlotState::Runnable;
                    Ok(())
                }
            },
        }
    }

    /// Advance at most one runnable control session in round-robin order. Waiting sessions
    /// are skipped without touching their transport, which makes repeated outer-loop calls
    /// harmless until readiness has been observed.
    pub(super) fn step_next<Error, Advance>(
        &mut self,
        mut advance: Advance,
    ) -> Result<Option<LinuxControlSchedulerStep>, Error>
    where
        Advance: FnMut(&mut LinuxActiveControlSession) -> Result<LinuxControlProcessProgress, Error>,
    {
        for offset in 0..CONTROL_SESSIONS {
            let slot_index = (self.next + offset) % CONTROL_SESSIONS;
            let runnable = matches!(
                &self.slots[slot_index],
                LinuxControlSessionSlot::Occupied(LinuxControlOccupiedSlot {
                    state: LinuxControlSlotState::Runnable,
                    ..
                })
            );
            if !runnable {
                continue;
            }

            self.next = (slot_index + 1) % CONTROL_SESSIONS;
            let previous = std::mem::replace(
                &mut self.slots[slot_index],
                LinuxControlSessionSlot::Vacant,
            );
            let LinuxControlSessionSlot::Occupied(mut occupied) = previous else {
                unreachable!("runnable slot was checked immediately before extraction");
            };

            match advance(&mut occupied.session) {
                Ok(LinuxControlProcessProgress::Pending(interest)) => {
                    debug_assert!(!occupied.session.is_closed());
                    occupied.state = LinuxControlSlotState::Waiting(interest);
                    self.slots[slot_index] = LinuxControlSessionSlot::Occupied(occupied);
                    return Ok(Some(LinuxControlSchedulerStep::Waiting {
                        slot: slot_index,
                        interest,
                    }));
                }
                Ok(LinuxControlProcessProgress::Complete(step)) => {
                    if !occupied.session.is_closed() {
                        occupied.state =
                            LinuxControlSlotState::Waiting(LinuxControlIoInterest::Readable);
                        self.slots[slot_index] = LinuxControlSessionSlot::Occupied(occupied);
                    }
                    return Ok(Some(LinuxControlSchedulerStep::Complete {
                        slot: slot_index,
                        step,
                    }));
                }
                Err(error) => {
                    drop(occupied);
                    return Err(error);
                }
            }
        }
        Ok(None)
    }
}


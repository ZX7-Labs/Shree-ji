name: Opaque baseline repair e07f v2 20261017

on:
  push:
    branches:
      - "verify/reconciled-baseline-repair-v2-e07f-20261017"
    paths:
      - ".github/workflows/opaque-baseline-repair-e07f-v2-20261017.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opaque-baseline-repair-e07f-v2-20261017
  cancel-in-progress: false

env:
  TARGET_REF_HASH: 060aa23045ded14f2e9984282456adce3cd5fa94bd92f21f4eeacae5d41abff2
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: b31f813ca672670272306a8bd4b310b68502932e0260973f5e3a7811446c3dbd
  EXPECTED_PRIVATE_TREE_PROOF: 07fecc93573f973397679704f219aed1ecf6ab7f2eedb72449fd01d002b39f57
  STAGE_HARNESS_BLOB: e2c1fb39c92d7eac3b6fb29333d42d95e0c3eab7
  BRIDGE_CERT_DER_B64: 

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Recover exact frozen private repair base
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY" && test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          root="$RUNNER_TEMP/private"; mkdir "$root"; cd "$root"; git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"; echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""; matched_sha=""
          while read -r sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"; matched_ref="$ref"; matched_sha="$sha"
            fi
          done <"$refs"
          rm -f "$refs"; test -n "$matched_ref"; test -n "$matched_sha"
          echo "::add-mask::$matched_ref"; echo "::add-mask::$matched_sha"
          test "$(printf '%s' "$matched_sha" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=64 origin "$matched_ref"
          actual="$(git rev-parse FETCH_HEAD)"; test "$actual" = "$matched_sha"; echo "::add-mask::$actual"
          git checkout -q -B verify-target "$actual"
          tree="$(git rev-parse 'HEAD^{tree}')"; echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_TREE_PROOF"
          git cat-file blob "$STAGE_HARNESS_BLOB" >"$RUNNER_TEMP/private-baseline-repair-v2.sh"
          test "$(git hash-object "$RUNNER_TEMP/private-baseline-repair-v2.sh")" = "$STAGE_HARNESS_BLOB"
          chmod 0700 "$RUNNER_TEMP/private-baseline-repair-v2.sh"
          test -z "$(git status --porcelain --untracked-files=all)"
          printf 'WORK_ROOT=%s\nBASE_SHA=%s\n' "$root" "$actual" >> "$GITHUB_ENV"
          echo "LAS_BASELINE_REPAIR_V2_BASE_RECOVERY=PASS"

      - name: Install exact build toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null
          archive="$RUNNER_TEMP/alr.zip"; prefix="$RUNNER_TEMP/alr"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --silent --show-error --output "$archive" "https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip"
          echo "09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  $archive" | sha256sum --check --strict >/dev/null
          mkdir -p "$prefix"; unzip -q "$archive" -d "$prefix"; export PATH="$prefix/bin:$PATH"; echo "$prefix/bin" >> "$GITHUB_PATH"
          alr -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1 >/dev/null
          workspace="$RUNNER_TEMP/alr-work"; mkdir -p "$workspace"; cd "$workspace"
          alr -n init --in-place --no-skel --lib baseline_repair_e07f_v2 >/dev/null
          alr_path="$(command -v alr)"; wrapper="$RUNNER_TEMP/gprbuild-via-alire"
          cat > "$wrapper" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$workspace"
          exec "$alr_path" exec -- gprbuild "\$@"
          EOF
          chmod 0755 "$wrapper"; printf 'GPRBUILD=%s\n' "$wrapper" >> "$GITHUB_ENV"
          echo "LAS_BASELINE_REPAIR_V2_TOOLCHAINS=PASS"

      - name: Execute fail-closed private repair candidate and encrypt output
        shell: bash
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/package"; log="$RUNNER_TEMP/private-repair-v2.log"; mkdir -p "$package"; cd "$WORK_ROOT"
          set +e
          LAS_BASELINE_REPAIR_BASE_SHA="$BASE_SHA" LAS_BASELINE_REPAIR_PACKAGE_DIR="$package" LAS_BASELINE_REPAIR_EXPECTED_BRANCH=verify-target bash "$RUNNER_TEMP/private-baseline-repair-v2.sh" >"$log" 2>&1
          rc=$?
          set -e
          cp "$log" "$package/verification.log"
          tarball="$RUNNER_TEMP/private-repair-v2.tar.gz"; tar -C "$package" -czf "$tarball" .
          cert_der="$RUNNER_TEMP/bridge-cert.der"; cert_pem="$RUNNER_TEMP/bridge-cert.pem"
          printf '%s' "$BRIDGE_CERT_DER_B64" | base64 -d >"$cert_der"; openssl x509 -inform DER -in "$cert_der" -out "$cert_pem"
          ciphertext="$RUNNER_TEMP/opaque-baseline-repair-e07f-v2.p7m"
          openssl cms -encrypt -binary -aes256 -outform DER -recip "$cert_pem" -in "$tarball" -out "$ciphertext"
          rm -rf "$package" "$tarball" "$cert_der" "$cert_pem" "$log"
          echo "LAS_BASELINE_REPAIR_V2_CIPHERTEXT_SHA256=$(sha256sum "$ciphertext" | awk '{print $1}')"
          if [[ "$rc" -eq 0 ]]; then echo "LAS_BASELINE_REPAIR_V2_RUN_RESULT=PASS"; else echo "LAS_BASELINE_REPAIR_V2_RUN_RESULT=FAIL"; fi
          exit "$rc"

      - name: Upload encrypted diagnostics only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opaque-baseline-repair-e07f-v2-20261017
          path: ${{ runner.temp }}/opaque-baseline-repair-e07f-v2.p7m
          if-no-files-found: error
          retention-days: 1

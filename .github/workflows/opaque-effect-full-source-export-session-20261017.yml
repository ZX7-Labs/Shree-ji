name: Opaque verified effect full-source session export 20261017

on:
  push:
    branches:
      - "verify/reconciled-baseline-repair-v3-bd95-20261017"
    paths:
      - ".github/workflows/opaque-effect-full-source-export-session-20261017.yml"

permissions:
  contents: read

env:
  BASE_REF_HASH: 060aa23045ded14f2e9984282456adce3cd5fa94bd92f21f4eeacae5d41abff2
  BASE_SNAPSHOT_PROOF: bd4d73399dc34da2586900c270f6b33f2a1049e934472301f5546ad9973cc49e
  BASE_TREE_PROOF: 93bcdc3d05cc578589d0600beb22d21dda366b5cd9fd81cc31f4f487d9e35981
  EXPECTED_FINAL_SOURCE_TREE: 5b1eea71f2e1c253c4b665f593f5a4c69b6f2a14
  EFFECT_REF_HASH: 57902b32c7dba883a89cd5a6e47dea395ab8a06b111c3dcdcd0487d67f010f58
  M1_BLOB: bb4f6e5c803b7c64ea27e605659cf998fc942cc2
  M2_BLOB: 6fb90f15a1194d596f420ebee9f0ed3e4ae2b112
  M3_BLOB: 67746f8a4776b872b3878f6861eb3bb7658a9fbd
  M4_BLOB: 13820e643e7d76cd087293429f6856183f4d9b07
  M5_BLOB: ace99b29dcf1ab6041d602247158f07ab13d41eb
  RSA_MODULUS_HEX: 
  RSA_EXPONENT: "65537"

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Recover frozen private base and exact materializers
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY" && test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"; echo "::add-mask::$PRIVATE_TOKEN"
          root="$RUNNER_TEMP/private"; mkdir "$root"; cd "$root"; git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"; echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/refs"; git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          base_ref=; base_sha=; effect_ref=
          while read -r sha ref; do
            h="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$h" = "$BASE_REF_HASH" ]]; then test -z "$base_ref"; base_ref="$ref"; base_sha="$sha"; fi
            if [[ "$h" = "$EFFECT_REF_HASH" ]]; then test -z "$effect_ref"; effect_ref="$ref"; fi
          done <"$refs"
          rm -f "$refs"; test -n "$base_ref" && test -n "$effect_ref" && test -n "$base_sha"
          echo "::add-mask::$base_ref"; echo "::add-mask::$effect_ref"; echo "::add-mask::$base_sha"
          test "$(printf '%s' "$base_sha" | sha256sum | awk '{print $1}')" = "$BASE_SNAPSHOT_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=224 origin "$base_ref" "$effect_ref"
          git checkout -q --detach "$base_sha"
          test "$(printf '%s' "$(git rev-parse 'HEAD^{tree}')" | sha256sum | awk '{print $1}')" = "$BASE_TREE_PROOF"
          for pair in "$M1_BLOB:m1.py" "$M2_BLOB:m2.py" "$M3_BLOB:m3.py" "$M4_BLOB:m4.py" "$M5_BLOB:m5.py"; do
            blob="${pair%%:*}"; name="${pair##*:}"
            git cat-file blob "$blob" >"$RUNNER_TEMP/$name"
            test "$(git hash-object "$RUNNER_TEMP/$name")" = "$blob"
          done
          printf 'WORK_ROOT=%s\nBASE_SHA=%s\n' "$root" "$base_sha" >>"$GITHUB_ENV"
          echo "LAS_SESSION_EXPORT_RECOVERY=PASS"

      - name: Install pinned formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt >/dev/null
          echo "LAS_SESSION_EXPORT_TOOLCHAIN=PASS"

      - name: Reconstruct and encrypt exact verified full source delta
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK_ROOT"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 tools/verification/private_reconciled_baseline_repair.py >/dev/null 2>&1
          python3 tools/verification/private_reconciled_baseline_visibility_repair.py >/dev/null 2>&1
          python3 tools/verification/private_reconciled_baseline_clippy_contract_repair.py >/dev/null 2>&1
          python3 "$RUNNER_TEMP/m1.py" >/dev/null 2>&1
          python3 "$RUNNER_TEMP/m2.py" >/dev/null 2>&1
          python3 "$RUNNER_TEMP/m3.py" >/dev/null 2>&1
          python3 "$RUNNER_TEMP/m4.py" >/dev/null 2>&1
          python3 "$RUNNER_TEMP/m5.py" >/dev/null 2>&1
          cargo +1.98.1 fmt --all >/dev/null 2>&1
          git add src
          tree="$(git write-tree)"; test "$tree" = "$EXPECTED_FINAL_SOURCE_TREE"
          changed="$RUNNER_TEMP/changed.txt"; git diff --cached --name-only HEAD -- src | LC_ALL=C sort >"$changed"
          test "$(wc -l < "$changed" | tr -d ' ')" = 14
          if grep -Ev '^src/' "$changed" | grep -q .; then exit 1; fi
          pathset_sha="$(sha256sum "$changed" | awk '{print $1}')"
          package="$RUNNER_TEMP/package"; mkdir -p "$package/files"
          python3 - "$changed" "$package" "$BASE_SHA" "$tree" "$pathset_sha" <<'PY'
          import json, pathlib, subprocess, sys
          changed, package, base_commit, final_tree, pathset_sha = sys.argv[1:]
          paths=[p for p in pathlib.Path(changed).read_text(encoding='utf-8').splitlines() if p]
          out=pathlib.Path(package); entries=[]
          for path in paths:
              src=pathlib.Path(path)
              if not path.startswith('src/') or not src.is_file(): raise SystemExit('invalid source export member')
              dst=out/'files'/path; dst.parent.mkdir(parents=True, exist_ok=True); dst.write_bytes(src.read_bytes())
              blob=subprocess.check_output(['git','hash-object',path], text=True).strip()
              mode=subprocess.check_output(['git','ls-files','-s','--',path], text=True).split()[0]
              entries.append({'path':path,'mode':mode,'blob':blob,'size':src.stat().st_size})
          manifest={'schema':'las-verified-retired-effect-full-source-session-v1','base_commit':base_commit,'verified_final_tree':final_tree,'source_pathset_sha256':pathset_sha,'files':entries}
          (out/'manifest.json').write_text(json.dumps(manifest,sort_keys=True,separators=(',',':'))+'\n',encoding='utf-8')
          PY
          tarball="$RUNNER_TEMP/source.tar.gz"; tar -C "$package" -czf "$tarball" .
          python3 - "$RSA_MODULUS_HEX" "$RSA_EXPONENT" "$RUNNER_TEMP/pub.der" <<'PY'
          import pathlib,sys
          n=int(sys.argv[1],16); e=int(sys.argv[2]); out=pathlib.Path(sys.argv[3])
          def L(n):
              if n < 128: return bytes([n])
              b=n.to_bytes((n.bit_length()+7)//8,'big'); return bytes([0x80|len(b)])+b
          def T(tag,c): return bytes([tag])+L(len(c))+c
          def I(v):
              b=v.to_bytes((v.bit_length()+7)//8 or 1,'big')
              if b[0]&0x80: b=b'\x00'+b
              return T(0x02,b)
          rsa=T(0x30,I(n)+I(e)); alg=T(0x30,bytes.fromhex('06092a864886f70d010101')+bytes.fromhex('0500'))
          out.write_bytes(T(0x30,alg+T(0x03,b'\x00'+rsa)))
          PY
          openssl pkey -pubin -inform DER -in "$RUNNER_TEMP/pub.der" -out "$RUNNER_TEMP/pub.pem" >/dev/null 2>&1
          keymat_hex="$(openssl rand -hex 64)"; enc_key="${keymat_hex:0:64}"; mac_key="${keymat_hex:64:64}"; iv="$(openssl rand -hex 16)"
          python3 - "$keymat_hex" "$RUNNER_TEMP/keymat.bin" <<'PY'
          import pathlib,sys
          pathlib.Path(sys.argv[2]).write_bytes(bytes.fromhex(sys.argv[1]))
          PY
          openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/pub.pem" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in "$RUNNER_TEMP/keymat.bin" -out "$RUNNER_TEMP/keymat.rsa"
          openssl enc -aes-256-cbc -K "$enc_key" -iv "$iv" -in "$tarball" -out "$RUNNER_TEMP/source.enc"
          printf '%s' "$iv" >"$RUNNER_TEMP/iv.hex"
          cat "$RUNNER_TEMP/iv.hex" "$RUNNER_TEMP/source.enc" | openssl dgst -sha256 -mac HMAC -macopt "hexkey:$mac_key" -binary >"$RUNNER_TEMP/source.hmac"
          out="$RUNNER_TEMP/export"; mkdir "$out"; cp "$RUNNER_TEMP/keymat.rsa" "$RUNNER_TEMP/iv.hex" "$RUNNER_TEMP/source.enc" "$RUNNER_TEMP/source.hmac" "$out/"
          printf '{"schema":"las-hybrid-envelope-v1","final_tree":"%s"}\n' "$tree" >"$out/envelope.json"
          echo "LAS_SESSION_EXPORT_TREE=$tree"
          echo "LAS_SESSION_EXPORT_CIPHERTEXT_SHA256=$(sha256sum "$RUNNER_TEMP/source.enc" | awk '{print $1}')"
          echo "LAS_SESSION_EXPORT=PASS"

      - name: Upload encrypted session export only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opaque-verified-effect-full-source-session-20261017
          path: ${{ runner.temp }}/export
          if-no-files-found: error
          retention-days: 1

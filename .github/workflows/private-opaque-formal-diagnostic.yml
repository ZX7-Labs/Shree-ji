name: Private opaque formal diagnostic (retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject superseded request-driven formal diagnostic
        shell: bash
        run: |
          set -euo pipefail
          echo "LAS_OPAQUE_FORMAL_DIAGNOSTIC=RETIRED"
          echo "Request-driven historical diagnostics are disabled on main. Current assurance is bound to explicit repaired-202 snapshot proofs and frozen runner refs."
          exit 1

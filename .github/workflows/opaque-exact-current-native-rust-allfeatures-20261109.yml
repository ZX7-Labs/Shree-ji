name: Frozen private exact source native Rust all-features validation
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/opaque-exact-current-native-rust-allfeatures-20261109.yml"
permissions:
  contents: read
concurrency:
  group: opaque-native-rust-allfeatures-exact-source
  cancel-in-progress: false
env:
  EXPECTED_PRIVATE_REF_PROOF: 9e72c1a4537779a8dce3666299c00c3b625f2c234a16d60c151cea4c9d4a6525
  EXPECTED_PRIVATE_HEAD_PROOF: 0ca2a0057461a7bb63c52603a2c83fd726c6b045ccf4ba699e90e47c9197c340
  EXPECTED_PRIVATE_TREE_PROOF: 9e2bbf22fc4e9f6d72fe71b06a8755186b7a953260d2e2c66ad3bfd3292de4ec
jobs:
  rust-allfeatures:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Read exact private revision with masked identity
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          if [[ -z "$PRIVATE_REPOSITORY" || -z "$PRIVATE_TOKEN" ]]; then
            echo "LAS_PRIVATE_SOURCE_ACCESS=BLOCKED"
            exit 1
          fi
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          root="$GITHUB_WORKSPACE/target"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          if ! git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$RUNNER_TEMP/opaque-heads" 2>"$RUNNER_TEMP/opaque-git-error"; then
            echo "LAS_PRIVATE_SOURCE_ACCESS=BLOCKED"
            exit 1
          fi
          matched_ref=""
          matched_sha=""
          while read -r sha ref; do
            ref_proof="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$ref_proof" == "$EXPECTED_PRIVATE_REF_PROOF" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
              matched_sha="$sha"
            fi
          done <"$RUNNER_TEMP/opaque-heads"
          rm -f "$RUNNER_TEMP/opaque-heads"
          test -n "$matched_ref"
          test -n "$matched_sha"
          echo "::add-mask::$matched_ref"
          echo "::add-mask::$matched_sha"
          test "$(printf '%s' "$matched_sha" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_HEAD_PROOF"
          if ! git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref" >/dev/null 2>"$RUNNER_TEMP/opaque-git-error"; then
            echo "LAS_PRIVATE_FETCH=BLOCKED"
            exit 1
          fi
          actual="$(git rev-parse FETCH_HEAD)"
          echo "::add-mask::$actual"
          test "$(printf '%s' "$actual" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_HEAD_PROOF"
          git checkout -q --detach "$actual" 2>"$RUNNER_TEMP/opaque-git-error"
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_TREE_PROOF"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "LAS_PRIVATE_EXACT_REVIEW=PINNED"


      - name: Install Rust exact canonical pin
        shell: bash
        run: |
          set -euo pipefail
          if ! rustup toolchain install 1.98.1 --profile minimal >"$RUNNER_TEMP/rustup-private.log" 2>&1; then
            echo "LAS_RUST_TOOLCHAIN=BLOCKED"
            exit 1
          fi
          if ! rustup component add --toolchain 1.98.1 rustfmt clippy >>"$RUNNER_TEMP/rustup-private.log" 2>&1; then
            echo "LAS_RUST_COMPONENTS=BLOCKED"
            exit 1
          fi
          echo "LAS_RUST_TOOLCHAIN=PINNED"
      - name: Install native Ada Root FFI prerequisites for all-feature build
        shell: bash
        run: |
          set -euo pipefail
          # The exact private build.rs requires gprbuild for root-ffi; never
          # misclassify absent Ada compiler as a Clippy source warning.
          if ! sudo apt-get update -qq >"$RUNNER_TEMP/ada-apt-private.log" 2>&1; then
            echo "LAS_ADA_FFI_ENV=BLOCKED_PACKAGE_INDEX"
            exit 1
          fi
          if ! sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gnat-13 gprbuild >>"$RUNNER_TEMP/ada-apt-private.log" 2>&1; then
            echo "LAS_ADA_FFI_ENV=BLOCKED_INSTALL"
            exit 1
          fi
          command -v gprbuild >/dev/null
          command -v gnatmake >/dev/null
          gnatmake -v >"$RUNNER_TEMP/gnat-version-private.log" 2>&1
          gprbuild --version >"$RUNNER_TEMP/gprbuild-version-private.log" 2>&1
          dpkg-query -W gnat-13 gprbuild >"$RUNNER_TEMP/ada-package-versions-private.log" 2>&1
          echo "LAS_ADA_FFI_ENV=PINNED_OS_FAMILY_GNAT13_GPRBUILD"
      - name: Canonical Rust format validation
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          if ! timeout --signal=TERM --kill-after=5s 180s cargo +1.98.1 fmt --all -- --check >"$RUNNER_TEMP/rustfmt-private.log" 2>&1; then
            echo "LAS_RUST_FMT=FAIL_OR_INCOMPLETE"
            exit 1
          fi
          echo "LAS_RUST_FMT=PASS"
      - name: Canonical all-features compilation warning deny
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          # Temporary diagnostic instrument: forwards GPRBUILD arguments and exit
          # unchanged, but retains source-owned GNAT build output only in runner
          # ephemeral temp; not an acceptance-mode command.
          cat >"$RUNNER_TEMP/opaque-gprbuild-logger.sh" <<'SH'
          #!/usr/bin/env bash
          exec /usr/bin/gprbuild "$@" >"$RUNNER_TEMP/private-gprbuild-native.log" 2>&1
          SH
          chmod 700 "$RUNNER_TEMP/opaque-gprbuild-logger.sh"
          set +e
          timeout --signal=TERM --kill-after=10s 900s env RUSTFLAGS=-Dwarnings GPRBUILD="$RUNNER_TEMP/opaque-gprbuild-logger.sh" cargo +1.98.1 check --locked --all-targets --all-features --message-format=json >"$RUNNER_TEMP/rust-check-private.jsonl" 2>"$RUNNER_TEMP/rust-check-private.stderr"
          rc=$?
          set -e
          if [[ "$rc" -ne 0 ]]; then
            python3 -I -B - "$RUNNER_TEMP/rust-check-private.jsonl" "$RUNNER_TEMP/rust-check-private.stderr" "$rc" <<'PY'
          import collections, hashlib, json, pathlib, re, sys
          raw = pathlib.Path(sys.argv[1]).read_bytes()
          err = pathlib.Path(sys.argv[2]).read_bytes()
          codes = collections.Counter()
          errors = 0
          for line in raw.splitlines():
              try:
                  item = json.loads(line)
              except (UnicodeError, ValueError):
                  continue
              if item.get("reason") != "compiler-message":
                  continue
              diagnostic = item.get("message") or {}
              if diagnostic.get("level") != "error":
                  continue
              errors += 1
              value = diagnostic.get("code")
              code = value.get("code") if isinstance(value, dict) else None
              codes[code if isinstance(code,str) and re.fullmatch(r"(?:E[0-9]{4}|clippy::[a-z0-9_]{2,64}|[a-z0-9_]{2,64})",code) else "UNCLASSIFIED_ERROR"] += 1
          safe_vocab = ("unexpected","argument","option","clippy","feature","manifest","cargo","rustc","warning","error","failed","toolchain","component","install","file","path","source","package","compile","compilation","unrecognized","unknown","invalid","lockfile","config","target","flag","workspace","not","found","subcommand","override","unstable","environment","returned","exit","dependency","permission","parse","link","duplicate","run","no","such","requires","variable","missing","build","script","gnat","gprbuild","ada")
          words = set(re.findall(r"[a-z_][a-z0-9_-]*",err.decode("utf-8","replace").lower()))
          print("LAS_RUST_ALLFEATURES_CHECK_RC="+sys.argv[3])
          print("LAS_RUST_ALLFEATURES_CHECK_DIAGNOSTIC_ERROR_COUNT="+str(errors))
          print("LAS_RUST_ALLFEATURES_CHECK_DIAGNOSTIC_IDS="+",".join(f"{k}:{v}" for k,v in sorted(codes.items())))
          print("LAS_RUST_ALLFEATURES_CHECK_STDERR_VOCAB="+",".join(x for x in safe_vocab if x in words))
          print("LAS_RUST_ALLFEATURES_CHECK_STDERR_BYTES="+str(len(err)))
          print("LAS_RUST_ALLFEATURES_CHECK_DIAGNOSTIC_SHA256="+hashlib.sha256(raw+b"\\0"+err).hexdigest())
          # Redact every private symbol, filename, path and quoted string.
          # Public output may contain ONLY these fixed generic diagnostics.
          public_words = set(("error failed warning compilation compile build compiler compiler-error command exit status not found no such file directory project archive missing source unit declaration package function procedure operator type mode unused never referenced imported name primitive library static gprbuild gnat ada gcc cargo environment run returned panic panicked during aborted cannot could may should require requires with from was is in at on for before after declared dependency ignored line syntax invalid unexpected expected conflicting duplicate specified unsupported no matching target missing object dependency invocation using access denied detected fatal errors warnings as treated"))
          public_words.update(("uninitialized","initialized","elaboration","elaborate","visibility","unresolved","mismatch","discriminant","conversion","constraint","invalid","unknown","unbound","multiple","duplicate","expression","lvalue","nonstatic","type","interface","body","spec","predefined","standard","actual","formal","parameters","precondition","accessibility","cannot","use","kind","referenced","bind","binding","unrecognized","success","warning","error","out","of","range","read","write","expected","found"))
          interesting = ("error", "warning", "failed", "panicked", "gprbuild", "gnat", "compilation")
          shown = 0
          for original_line in err.decode("utf-8","replace").splitlines():
              words = re.findall(r"[a-z][a-z-]*", original_line.lower())
              if not words or not any(w in words for w in interesting):
                  continue
              sanitized = [w if w in public_words else "REDACTED" for w in words]
              collapsed = []
              for term in sanitized:
                  if not collapsed or term != "REDACTED" or collapsed[-1] != "REDACTED":
                      collapsed.append(term)
              print("LAS_RUST_ALLFEATURES_REDACTED_CLASS_" + str(shown) + "=" + " ".join(collapsed[:55]))
              shown += 1
              if shown >= 12:
                  break
          print("LAS_RUST_ALLFEATURES_REDACTED_LINE_COUNT=" + str(shown))
          native_log = pathlib.Path(sys.argv[2]).with_name("private-gprbuild-native.log")
          if native_log.is_file():
              native_text = native_log.read_bytes().decode("utf-8", "replace")
              print("LAS_RUST_ADA_NATIVE_LOG_BYTES=" + str(len(native_text.encode("utf-8"))))
              print("LAS_RUST_ADA_NATIVE_ERROR_COUNT=" + str(len(re.findall(r"(?i)\berror\b", native_text))))
              print("LAS_RUST_ADA_NATIVE_WARNING_COUNT=" + str(len(re.findall(r"(?i)\bwarning\b", native_text))))
              shown_native = 0
              for line in native_text.splitlines():
                  tokens = re.findall(r"[a-z][a-z-]*", line.lower())
                  if not any(t in tokens for t in ("error","warning","failed","fatal","cannot","expected")):
                      continue
                  safe = [w if w in public_words else "REDACTED" for w in tokens]
                  compact = []
                  for word in safe:
                      if word != "REDACTED" or not compact or compact[-1] != "REDACTED":
                          compact.append(word)
                  print("LAS_RUST_ADA_REDACTED_CLASS_" + str(shown_native) + "=" + " ".join(compact[:60]))
                  shown_native += 1
                  if shown_native >= 15:
                      break
              print("LAS_RUST_ADA_REDACTED_LINE_COUNT=" + str(shown_native))
              # Opaque on-host source-file index, not the private path/name.
              # Compare indices only against the independently authenticated
              # private Git tree in the owner's private control plane.
              ada_files = sorted(
                  p for p in pathlib.Path("src").rglob("*")
                  if p.is_file() and p.suffix.lower() in (".adb", ".ads", ".gpr")
              )
              index = {p.name.lower(): i for i,p in enumerate(ada_files)}
              print("LAS_RUST_ADA_SOURCE_INDEX_CENSUS=" + str(len(ada_files)))
              emitted = set()
              for line in native_text.splitlines():
                  match = re.search(r"(?i)([a-z0-9_.-]+\.(?:adb|ads|gpr)):(\d+)(?::(\d+))?", line)
                  if not match:
                      continue
                  file_index = index.get(match.group(1).lower())
                  if file_index is None:
                      continue
                  entry = (file_index, int(match.group(2)), int(match.group(3) or 0))
                  if entry in emitted:
                      continue
                  emitted.add(entry)
                  if len(emitted) <= 16:
                      print("LAS_RUST_ADA_SOURCE_LOCATION=" + ":".join(str(x) for x in entry))
              print("LAS_RUST_ADA_SOURCE_LOCATION_COUNT=" + str(len(emitted)))

          else:
              print("LAS_RUST_ADA_NATIVE_LOG=MISSING")


          PY
            echo "LAS_RUST_ALLFEATURES_CHECK=FAIL_OR_INCOMPLETE"
            exit 1
          fi
          echo "LAS_RUST_ALLFEATURES_CHECK=PASS"
      - name: Canonical all-features Clippy warnings denied
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          set +e
          timeout --signal=TERM --kill-after=10s 900s env RUSTFLAGS=-Dwarnings cargo +1.98.1 clippy --locked --all-targets --all-features --message-format=json -- -D warnings >"$RUNNER_TEMP/clippy-allfeatures-private.jsonl" 2>"$RUNNER_TEMP/clippy-allfeatures-private.stderr"
          rc=$?
          set -e
          if [[ "$rc" -ne 0 ]]; then
            python3 -I -B - "$RUNNER_TEMP/clippy-allfeatures-private.jsonl" "$RUNNER_TEMP/clippy-allfeatures-private.stderr" "$rc" <<'PY'
          import collections, hashlib, json, pathlib, re, sys
          raw = pathlib.Path(sys.argv[1]).read_bytes()
          err = pathlib.Path(sys.argv[2]).read_bytes()
          codes = collections.Counter()
          total = 0
          for line in raw.splitlines():
              try:
                  obj = json.loads(line)
              except (ValueError, UnicodeError):
                  continue
              if obj.get("reason") != "compiler-message":
                  continue
              diagnostic = obj.get("message") or {}
              if diagnostic.get("level") != "error":
                  continue
              total += 1
              code = diagnostic.get("code")
              code = code.get("code") if isinstance(code, dict) else None
              if isinstance(code, str) and re.fullmatch(r"(?:E[0-9]{4}|clippy::[a-z_0-9]{2,64}|[a-z_0-9]{2,64})", code):
                  codes[code] += 1
              else:
                  codes["UNCLASSIFIED_ERROR"] += 1
          print("LAS_RUST_ALLFEATURES_CLIPPY_RC=" + sys.argv[3])
          print("LAS_RUST_ALLFEATURES_DIAGNOSTIC_ERROR_COUNT=" + str(total))
          print("LAS_RUST_ALLFEATURES_DIAGNOSTIC_IDS=" + ",".join(f"{k}:{v}" for k,v in sorted(codes.items())))
          print("LAS_RUST_ALLFEATURES_DIAGNOSTIC_STDERR_BYTES=" + str(len(err)))
          # Only predefined generic vocabulary, compiler IDs, counts and hashes
          # can cross the public log boundary. Never print original stderr.
          allowed = ("unexpected","argument","option","clippy","feature","manifest","cargo","rustc","warning","error","failed","toolchain","component","install","file","path","source","package","compile","compilation","unrecognized","unknown","invalid","lockfile","config","target","flag","workspace","not","found","subcommand","override","unstable","profiles","environment","returned","exit","dependency","permission","parse","link","duplicate","session","run","no","such","requires","removed","operation","variable","multiple","supported","command","message-format","json","builder","working","directory")
          wordset = set(re.findall(r"[a-z_][a-z0-9_-]*", err.decode("utf-8", "replace").lower()))
          tokens = [w for w in allowed if w in wordset]
          print("LAS_RUST_ALLFEATURES_STDERR_VOCAB=" + ",".join(tokens))
          print("LAS_RUST_ALLFEATURES_STDERR_LINES=" + str(len(err.splitlines())))

          print("LAS_RUST_ALLFEATURES_DIAGNOSTIC_SHA256=" + hashlib.sha256(raw + b"\\0" + err).hexdigest())
          PY
            echo "LAS_RUST_ALLFEATURES_CLIPPY=FAIL_OR_INCOMPLETE"
            exit 1
          fi
          echo "LAS_RUST_ALLFEATURES_CLIPPY=PASS"
      - name: Canonical all-features native Rust tests and source-owned strict suite evidence
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          log="$RUNNER_TEMP/rust-test-private.log"
          if ! timeout --signal=TERM --kill-after=10s 900s env RUSTFLAGS=-Dwarnings cargo +1.98.1 test --locked --all-targets --all-features -- --test-threads=1 >"$log" 2>&1; then
            echo "LAS_RUST_ALLFEATURES_TESTS=FAIL_OR_INCOMPLETE"
            exit 1
          fi
          if ! python3 -I -B tools/verification/canonical_rust_suite_policy.py --mode suite "$log" >"$RUNNER_TEMP/rust-evidence-private.log" 2>&1; then
            echo "LAS_RUST_TEST_NONVACUITY=FAIL"
            exit 1
          fi
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "LAS_RUST_ALLFEATURES_TESTS=PASS"
          echo "LAS_RUST_TEST_NONVACUITY=PASS"
          echo "LAS_NATIVE_RUST_ALLFEATURES_SCOPE=PASS"

name: Frozen private exact source native Rust all-features validation
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/opaque-exact-current-native-rust-allfeatures-20261109.yml"
permissions:
  contents: read
concurrency:
  group: opaque-native-rust-allfeatures-exact-source
  cancel-in-progress: false
env:
  EXPECTED_PRIVATE_REF_PROOF: 9e72c1a4537779a8dce3666299c00c3b625f2c234a16d60c151cea4c9d4a6525
  EXPECTED_PRIVATE_HEAD_PROOF: 0ca2a0057461a7bb63c52603a2c83fd726c6b045ccf4ba699e90e47c9197c340
  EXPECTED_PRIVATE_TREE_PROOF: 9e2bbf22fc4e9f6d72fe71b06a8755186b7a953260d2e2c66ad3bfd3292de4ec
jobs:
  rust-allfeatures:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Read exact private revision with masked identity
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          if [[ -z "$PRIVATE_REPOSITORY" || -z "$PRIVATE_TOKEN" ]]; then
            echo "LAS_PRIVATE_SOURCE_ACCESS=BLOCKED"
            exit 1
          fi
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          root="$GITHUB_WORKSPACE/target"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          if ! git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$RUNNER_TEMP/opaque-heads" 2>"$RUNNER_TEMP/opaque-git-error"; then
            echo "LAS_PRIVATE_SOURCE_ACCESS=BLOCKED"
            exit 1
          fi
          matched_ref=""
          matched_sha=""
          while read -r sha ref; do
            ref_proof="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$ref_proof" == "$EXPECTED_PRIVATE_REF_PROOF" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
              matched_sha="$sha"
            fi
          done <"$RUNNER_TEMP/opaque-heads"
          rm -f "$RUNNER_TEMP/opaque-heads"
          test -n "$matched_ref"
          test -n "$matched_sha"
          echo "::add-mask::$matched_ref"
          echo "::add-mask::$matched_sha"
          test "$(printf '%s' "$matched_sha" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_HEAD_PROOF"
          if ! git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref" >/dev/null 2>"$RUNNER_TEMP/opaque-git-error"; then
            echo "LAS_PRIVATE_FETCH=BLOCKED"
            exit 1
          fi
          actual="$(git rev-parse FETCH_HEAD)"
          echo "::add-mask::$actual"
          test "$(printf '%s' "$actual" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_HEAD_PROOF"
          git checkout -q --detach "$actual" 2>"$RUNNER_TEMP/opaque-git-error"
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_TREE_PROOF"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "LAS_PRIVATE_EXACT_REVIEW=PINNED"


      - name: Install Rust exact canonical pin
        shell: bash
        run: |
          set -euo pipefail
          if ! rustup toolchain install 1.98.1 --profile minimal >"$RUNNER_TEMP/rustup-private.log" 2>&1; then
            echo "LAS_RUST_TOOLCHAIN=BLOCKED"
            exit 1
          fi
          if ! rustup component add --toolchain 1.98.1 rustfmt clippy >>"$RUNNER_TEMP/rustup-private.log" 2>&1; then
            echo "LAS_RUST_COMPONENTS=BLOCKED"
            exit 1
          fi
          echo "LAS_RUST_TOOLCHAIN=PINNED"
      - name: Install canonical source-pinned Ada and SPARK toolchain via Alire
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          ALR_ZIP="$RUNNER_TEMP/alr.zip"
          ALR_PREFIX="$RUNNER_TEMP/las-alr"
          ALR_WS="$RUNNER_TEMP/las-alire-proof-workspace"
          if ! curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --connect-timeout 25 --max-time 300 --silent --show-error --output "$ALR_ZIP" "https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip" >"$RUNNER_TEMP/alire-download-private.log" 2>&1; then
            echo "LAS_ALIRE_DOWNLOAD=BLOCKED"
            exit 1
          fi
          echo "09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  $ALR_ZIP" | sha256sum --check --strict >/dev/null
          mkdir -p "$ALR_PREFIX" "$ALR_WS"
          unzip -q "$ALR_ZIP" -d "$ALR_PREFIX"
          export PATH="$ALR_PREFIX/bin:$PATH"
          echo "LAS_ALIRE_2_1_1_PINNED=PASS"
          if ! alr -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1 >"$RUNNER_TEMP/alire-toolchain-private.log" 2>&1; then
            echo "LAS_ADA_SOURCE_PINNED_TOOLCHAIN=BLOCKED"
            exit 1
          fi
          if ! ( cd "$ALR_WS" &&
                 alr -n init --in-place --no-skel --lib las_verify_toolchain &&
                 alr with gnatprove=16.1.0 &&
                 alr exec -- gnatmake --version &&
                 alr exec -- gprbuild --version &&
                 alr exec -- gnatprove --version ) >"$RUNNER_TEMP/alire-proof-workspace-private.log" 2>&1; then
            echo "LAS_ADA_SPARK_PROOF_WORKSPACE=BLOCKED"
            exit 1
          fi
          cat >"$RUNNER_TEMP/gprbuild-via-alire" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$RUNNER_TEMP/las-alire-proof-workspace"
          exec "$RUNNER_TEMP/las-alr/bin/alr" exec -- gprbuild "$@"
          SH
          chmod 0755 "$RUNNER_TEMP/gprbuild-via-alire"
          printf 'GPRBUILD=%s\n' "$RUNNER_TEMP/gprbuild-via-alire" >>"$GITHUB_ENV"
          echo "LAS_ADA_GNAT16_GPRBUILD26_GNATPROVE16=PINNED"
      - name: Canonical Rust format validation
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          if ! timeout --signal=TERM --kill-after=5s 180s cargo +1.98.1 fmt --all -- --check >"$RUNNER_TEMP/rustfmt-private.log" 2>&1; then
            echo "LAS_RUST_FMT=FAIL_OR_INCOMPLETE"
            exit 1
          fi
          echo "LAS_RUST_FMT=PASS"
      - name: Canonical all-features compilation warning deny
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          if ! timeout --signal=TERM --kill-after=10s 900s env RUSTFLAGS=-Dwarnings cargo +1.98.1 check --locked --all-targets --all-features >"$RUNNER_TEMP/rust-check-private.log" 2>&1; then
            echo "LAS_RUST_ALLFEATURES_CHECK=FAIL_OR_INCOMPLETE"
            exit 1
          fi
          echo "LAS_RUST_ALLFEATURES_CHECK=PASS"
      - name: Canonical all-features Clippy warnings denied
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          if ! timeout --signal=TERM --kill-after=10s 900s env RUSTFLAGS=-Dwarnings cargo +1.98.1 clippy --locked --all-targets --all-features -- -D warnings >"$RUNNER_TEMP/clippy-allfeatures-private.log" 2>&1; then
            echo "LAS_RUST_ALLFEATURES_CLIPPY=FAIL_OR_INCOMPLETE"
            exit 1
          fi
          echo "LAS_RUST_ALLFEATURES_CLIPPY=PASS"
      - name: Canonical all-features native Rust tests and source-owned strict suite evidence
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          log="$RUNNER_TEMP/rust-test-private.log"
          if ! timeout --signal=TERM --kill-after=10s 900s env RUSTFLAGS=-Dwarnings cargo +1.98.1 test --locked --all-targets --all-features -- --test-threads=1 >"$log" 2>&1; then
            echo "LAS_RUST_ALLFEATURES_TESTS=FAIL_OR_INCOMPLETE"
            exit 1
          fi
          if ! python3 -I -B tools/verification/canonical_rust_suite_policy.py --mode suite "$log" >"$RUNNER_TEMP/rust-evidence-private.log" 2>&1; then
            echo "LAS_RUST_TEST_NONVACUITY=FAIL"
            exit 1
          fi
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "LAS_RUST_ALLFEATURES_TESTS=PASS"
          echo "LAS_RUST_TEST_NONVACUITY=PASS"
          echo "LAS_NATIVE_RUST_ALLFEATURES_SCOPE=PASS"

      - name: Source-owned release default library tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          log="$RUNNER_TEMP/rust-release-default-private.log"
          if ! timeout --signal=TERM --kill-after=10s 1200s env RUSTFLAGS=-Dwarnings cargo +1.98.1 test --locked --release --lib -- --test-threads=1 >"$log" 2>&1; then
            echo "LAS_RUST_RELEASE_DEFAULT_LIB=FAIL_OR_INCOMPLETE"
            exit 1
          fi
          if ! python3 -I -B tools/verification/canonical_rust_suite_policy.py --mode suite "$log" >"$RUNNER_TEMP/rust-release-default-evidence-private.log" 2>&1; then
            echo "LAS_RUST_RELEASE_DEFAULT_LIB=NONVACUITY_FAIL"
            exit 1
          fi
          echo "LAS_RUST_RELEASE_DEFAULT_LIB=PASS"

      - name: Source-owned release all-feature library tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          log="$RUNNER_TEMP/rust-release-allfeatures-private.log"
          if ! timeout --signal=TERM --kill-after=10s 1200s env RUSTFLAGS=-Dwarnings cargo +1.98.1 test --locked --release --all-features --lib -- --test-threads=1 >"$log" 2>&1; then
            echo "LAS_RUST_RELEASE_ALLFEATURES_LIB=FAIL_OR_INCOMPLETE"
            exit 1
          fi
          if ! python3 -I -B tools/verification/canonical_rust_suite_policy.py --mode suite "$log" >"$RUNNER_TEMP/rust-release-allfeatures-evidence-private.log" 2>&1; then
            echo "LAS_RUST_RELEASE_ALLFEATURES_LIB=NONVACUITY_FAIL"
            exit 1
          fi
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "LAS_RUST_RELEASE_ALLFEATURES_LIB=PASS"
          echo "LAS_NATIVE_RUST_RELEASE_LIBRARIES_SCOPE=PASS"

      - name: Independent release-mode declared measurement execution
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          target="$(python3 -I -B tools/verification/canonical_rust_suite_policy.py --mode target)"
          test -n "$target"
          log="$RUNNER_TEMP/rust-release-measurement-private.log"
          if ! timeout --signal=TERM --kill-after=10s 1200s env RUSTFLAGS=-Dwarnings cargo +1.98.1 test --locked --release --all-features --lib "$target" -- --exact --ignored --test-threads=1 --nocapture >"$log" 2>&1; then
            echo "LAS_RUST_RELEASE_MEASUREMENT=FAIL_OR_INCOMPLETE"
            exit 1
          fi
          if ! python3 -I -B tools/verification/canonical_rust_suite_policy.py --mode release-measurement "$log" >"$RUNNER_TEMP/rust-release-measurement-evidence-private.log" 2>&1; then
            echo "LAS_RUST_RELEASE_MEASUREMENT=NONVACUITY_FAIL"
            exit 1
          fi
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "LAS_RUST_RELEASE_MEASUREMENT=PASS"


      - name: Original Root FFI memory and p95 native performance acceptance
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          for kind in layout p95; do
            if [[ "$kind" == layout ]]; then
              target="effect_fabric::root_ffi_benchmark::root_adapter_memory_layout_baseline_is_reported"
              extra=()
            else
              target="effect_fabric::root_ffi_benchmark::full_root_adapter_p95_is_within_twenty_milliseconds"
              extra=(--release)
            fi
            log="$RUNNER_TEMP/root-native-${kind}-private.log"
            if ! timeout --signal=TERM --kill-after=10s 1200s env RUSTFLAGS=-Dwarnings \
                 cargo +1.98.1 test --locked "${extra[@]}" --features root-ffi "$target" \
                 -- --exact --test-threads=1 --nocapture >"$log" 2>&1; then
              echo "LAS_ROOT_PERF_${kind}=FAIL_OR_INCOMPLETE"
              exit 1
            fi
            if ! python3 -I -B tools/verification/canonical_rust_test_evidence.py "$log" --expected-test "$target" >"$RUNNER_TEMP/root-native-canonical-${kind}-private.log" 2>&1; then
              echo "LAS_ROOT_NATIVE_TEST=SOURCE_OWNED_NONVACUITY_REJECT"
              exit 1
            fi
            echo "LAS_ROOT_NATIVE_${kind^^}=PASS"
          done
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "LAS_ROOT_P95_NATIVE_CHECK=PASS"

      - name: Original optimized Effect Fabric benchmark with strict sample census
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          if ! rustfmt +1.98.1 --edition 2024 --check \
            src/effect_fabric/fake_actuator.rs bench/effect_fabric_benchmark.rs \
            >"$RUNNER_TEMP/effect-bench-format-private.log" 2>&1; then
            echo "LAS_EFFECT_FABRIC_FORMAT=FAIL"
            exit 1
          fi
          echo "LAS_EFFECT_FABRIC_FORMAT=PASS"
          if ! rustc +1.98.1 --edition=2024 -D warnings -C opt-level=3 \
            -C overflow-checks=yes -C codegen-units=1 -C strip=symbols \
            bench/effect_fabric_benchmark.rs -o "$RUNNER_TEMP/effect-fabric-benchmark" \
            >"$RUNNER_TEMP/effect-bench-compile-private.log" 2>&1; then
            echo "LAS_EFFECT_FABRIC_COMPILE=FAIL"
            exit 1
          fi
          echo "LAS_EFFECT_FABRIC_COMPILE=PASS"
          if ! timeout --signal=TERM --kill-after=10s 180s env \
               LAS_BENCH_RECORDS=4096 LAS_BENCH_SAMPLES=9 LAS_BENCH_WARMUP=2 \
               /usr/bin/time -v "$RUNNER_TEMP/effect-fabric-benchmark" \
               >"$RUNNER_TEMP/effect-bench-native-private.log" 2>&1; then
            echo "LAS_EFFECT_FABRIC_BENCH=FAIL_OR_INCOMPLETE"
            exit 1
          fi
          python3 -I -B - "$RUNNER_TEMP/effect-bench-native-private.log" <<'PY'
          import pathlib,re,sys
          raw=pathlib.Path(sys.argv[1]).read_text(encoding="utf-8",errors="replace")
          if len(re.findall(r"(?m)^LAS_BENCH_CONFIG\trecords=4096\tsamples=9\twarmup=2$",raw))!=1:
              raise SystemExit("LAS_EFFECT_FABRIC_BENCH=CONFIG_MISMATCH")
          rows=re.findall(r"(?m)^LAS_BENCH\t([a-z_]+)\trecords=4096\tsamples=9\twarmup=2\tmin_ns_per_record=(\d+)\tmedian_ns_per_record=(\d+)\tp95_ns_per_record=(\d+)\tmax_ns_per_record=(\d+)$",raw)
          if len(rows)!=3 or {row[0] for row in rows}!={"clean_single_shot","lost_ack_replay_safe","crash_recovery"}:
              raise SystemExit("LAS_EFFECT_FABRIC_BENCH=VACUOUS_OR_INCOMPLETE")
          for _,minimum,median,p95,maximum in rows:
              a,b,c,d=map(int,(minimum,median,p95,maximum))
              if not (0<=a<=b<=c<=d):
                  raise SystemExit("LAS_EFFECT_FABRIC_BENCH=BAD_ORDER")
          PY
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "LAS_EFFECT_FABRIC_NATIVE_BENCH=EXECUTED_WITH_CENSUS"

name: Private changed formal gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject superseded changed-formal gate
        shell: bash
        run: |
          set -euo pipefail
          echo "LAS_PRIVATE_CHANGED_FORMAL_GATE=RETIRED"
          echo "This gate is bound to historical base/head proofs. Current assurance is bound to the repaired 202-profile candidate and exact closure evidence."
          exit 1

name: Exact formatted retired archive gate 20261017-04

on:
  push:
    branches:
      - "verify/retired-archive-binding-20261017-01"
    paths:
      - ".github/workflows/exact-private-retired-archive-binding-20261017-04.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REF_HASH: cb93309da47e6ca805ecd50d3fd0916da5227714d343a32d5f181ebbbc02fe45
  EXPECTED_PRIVATE_HEAD_PROOF: 7148c29d97ca11b7092d3984becf0af7fdef21fd532a1da63bdf40e64f245508
  EXPECTED_PRIVATE_TREE_PROOF: 099c5516e7e05949ea31470246b9d4e9293adc2876b01a09e5f3c3a030315981

jobs:
  exact-private-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Install exact toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null
          ALR_ZIP="$RUNNER_TEMP/alr.zip"; ALR_PREFIX="$RUNNER_TEMP/alr"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --output "$ALR_ZIP" \
            "https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip" >/dev/null 2>&1
          echo "09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  $ALR_ZIP" | sha256sum --check --strict >/dev/null
          mkdir -p "$ALR_PREFIX"; unzip -q "$ALR_ZIP" -d "$ALR_PREFIX"; export PATH="$ALR_PREFIX/bin:$PATH"
          alr -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1 >/dev/null
          ALR_WS="$RUNNER_TEMP/alire-workspace"; mkdir -p "$ALR_WS"
          (cd "$ALR_WS" && alr -n init --in-place --no-skel --lib las_archive_gate >/dev/null)
          GPRBUILD_WRAPPER="$RUNNER_TEMP/gprbuild-wrapper"
          cat > "$GPRBUILD_WRAPPER" <<EOF_GPR
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$ALR_WS"
          exec "$ALR_PREFIX/bin/alr" exec -- gprbuild "\$@"
          EOF_GPR
          chmod 0755 "$GPRBUILD_WRAPPER"
          printf 'GPRBUILD=%s\n' "$GPRBUILD_WRAPPER" >> "$GITHUB_ENV"
          echo "LAS_ARCHIVE_FORMATTED_TOOLCHAINS=PASS"

      - name: Recover exact formatted private revision opaquely
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"; test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"; echo "::add-mask::$PRIVATE_TOKEN"
          root="$RUNNER_TEMP/private-target"; mkdir "$root"; cd "$root"; git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"; echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          ref=""; head=""
          while read -r sha name; do
            if [[ "$(printf '%s' "$name" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then test -z "$ref"; ref="$name"; head="$sha"; fi
          done <"$refs"
          rm -f "$refs"; test -n "$ref"; test -n "$head"
          echo "::add-mask::$ref"; echo "::add-mask::$head"
          test "$(printf '%s' "$head" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_HEAD_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$ref"
          test "$(git rev-parse FETCH_HEAD)" = "$head"; git checkout -q --detach "$head"
          tree="$(git rev-parse 'HEAD^{tree}')"; echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_TREE_PROOF"
          test -z "$(git status --porcelain)"
          echo "LAS_ARCHIVE_FORMATTED_EXACT_RECOVERY=PASS"

      - name: Run exact formatted source-free Rust gate
        shell: bash
        run: |
          set -euo pipefail; cd "$RUNNER_TEMP/private-target"
          run_stage() {
            stage="$1"; shift
            log="$RUNNER_TEMP/formatted-${stage}.private.log"
            set +e; "$@" >"$log" 2>&1; rc=$?; set -e
            if [[ $rc -ne 0 ]]; then
              echo "LAS_ARCHIVE_FORMATTED_STAGE=$stage"
              echo "LAS_ARCHIVE_FORMATTED_RC=$rc"
              echo "LAS_ARCHIVE_FORMATTED_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
              exit "$rc"
            fi
            rm -f "$log"
            echo "LAS_ARCHIVE_FORMATTED_${stage}=PASS"
          }
          run_stage fmt cargo +1.98.1 fmt --all -- --check
          run_stage default_check env RUSTFLAGS=-Dwarnings cargo +1.98.1 check --locked --all-targets
          run_stage joint_check env RUSTFLAGS=-Dwarnings GPRBUILD="$GPRBUILD" cargo +1.98.1 check --locked --all-targets --features root-ffi,linux-peer-credentials
          run_stage joint_clippy env GPRBUILD="$GPRBUILD" cargo +1.98.1 clippy --locked --all-targets --features root-ffi,linux-peer-credentials -- -D warnings
          run_stage joint_tests env RUSTFLAGS=-Dwarnings GPRBUILD="$GPRBUILD" cargo +1.98.1 test --locked --lib --features root-ffi,linux-peer-credentials -- --test-threads=1
          run_stage all_feature_tests env RUSTFLAGS=-Dwarnings GPRBUILD="$GPRBUILD" cargo +1.98.1 test --locked --lib --all-features -- --test-threads=1
          test -z "$(git status --porcelain)"
          echo "LAS_ARCHIVE_FORMATTED_EXACT_PRIVATE=PASS"

name: Candidate3 exact 202 reconciler 20261016

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-candidate3-terminal-attestation-20261016.yml"
      - ".github/workflows/private-candidate3-closure-20261016.yml"
      - ".github/workflows/private-candidate3-reconciler-20261016.yml"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Candidate3 exact resumable TLC continuation 20261016"
      - "Candidate3 durable terminal attestation 20261016"
      - "Candidate3 exact 202 TLC closure 20261016"
    types: [completed]
  schedule:
    - cron: "31 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: candidate3-exact-202-reconciler-20261016
  cancel-in-progress: false

env:
  ORIGINAL_RUN_ID: "38829095332"
  EXPECTED_ORIGINAL_PUBLIC_HEAD: 55471ace6dd056674830ea7764ed6d088faacaa1
  EXPECTED_ORIGINAL_BRANCH: verify/candidate3-tlc-20261016
  ORIGINAL_WORKFLOW_PATH: .github/workflows/private-candidate3-tlc-20261016.yml
  EXPECTED_ORIGINAL_WORKFLOW_BLOB: e019bd29322d7cbac67df7e0b4366000018311a3
  RUNNER_REF: verify/candidate3-resumable-tlc-20261016
  RUNNER_SHA: 43bf26bf734f7b29aa5c8f32c6d2201c4020de7b
  WRAPPER_WORKFLOW: private-assurance-slow-tlc-continuation.yml
  WRAPPER_PATH: .github/workflows/private-assurance-slow-tlc-continuation.yml
  WRAPPER_BLOB: 3dc98da64be77f6e9e93bfb98ffda30c90f75894
  SLICE_PATH: .github/workflows/_private-candidate3-resumable-tlc-slice-20261016.yml
  SLICE_BLOB: 8c2d62cf3ef50b1d36ccbf337e38322b76900230
  ATTEST_WORKFLOW: private-candidate3-terminal-attestation-20261016.yml
  ATTEST_PATH: .github/workflows/private-candidate3-terminal-attestation-20261016.yml
  ATTEST_BLOB: 21d41c8100bdc5f66c241208d51d8420e735563e
  CLOSURE_WORKFLOW: private-candidate3-closure-20261016.yml
  CLOSURE_PATH: .github/workflows/private-candidate3-closure-20261016.yml
  CLOSURE_BLOB: 6eb26b20d04701e20936e2c3db6bc959649fb6e4
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 269a9a8c7afae986f8065e93745c9017f848292a118b2b9d006d007cbdb6b1f8
  EXPECTED_PRIVATE_TREE_PROOF: 6998e8e80e6c8fb86fbac5e4c512af441f827b4536aa5448dfed6aa14568468e
  EXPECTED_VERIFIER_BLOB: 62e3e6dc0fad5dddc7fb0a453a3cd681d911e590
  EXPECTED_TLC_MAP_SHA256: da7bb51d531d0e5e5e6994c80be8f254a110cb8181e6121e3a557fdff9428cee
  EXPECTED_REPLACEMENTS: "28 29 36 39 109 114 155 156 167 171"
  REGISTRY_PATH: LAS_CANDIDATE3_TERMINAL_ATTESTATIONS_20261016.json
  REGISTRY_SCHEMA: las-candidate3-terminal-registry-v1
  RESULT_PATH: LAS_CANDIDATE3_202_TLC_RESULT_20261016.json

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Drive exact Candidate3 closure without weakening proof semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,re,urllib.error,urllib.parse,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; api=f'https://api.github.com/repos/{repo}'
          original_id=int(os.environ['ORIGINAL_RUN_ID']); replacement_order=[int(x) for x in os.environ['EXPECTED_REPLACEMENTS'].split()]; replacement_set=set(replacement_order)
          runner_ref=os.environ['RUNNER_REF']; runner_sha=os.environ['RUNNER_SHA']; wrapper=os.environ['WRAPPER_PATH']; slice_path=os.environ['SLICE_PATH']
          def request(url,method='GET',payload=None):
              data=None if payload is None else json.dumps(payload,separators=(',',':')).encode()
              q=urllib.request.Request(url,data=data,method=method,headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'candidate3-202-reconciler',**({'Content-Type':'application/json'} if data else {})})
              with urllib.request.urlopen(q,timeout=60) as r: raw=r.read()
              return None if not raw else json.loads(raw)
          def get(url):
              v=request(url)
              if not isinstance(v,dict): raise SystemExit(f'non-object response: {url}')
              return v
          def contents(path,ref='main',optional=False):
              try: m=get(f"{api}/contents/{urllib.parse.quote(path,safe='/')}?ref={urllib.parse.quote(ref,safe='')}")
              except urllib.error.HTTPError as e:
                  if optional and e.code==404: return None
                  raise
              if m.get('type')!='file' or m.get('encoding')!='base64': raise SystemExit(f'bad contents: {path}@{ref}')
              return m,base64.b64decode(m['content'].replace('\n',''),validate=True)
          def assert_blob(path,ref,blob):
              m,_=contents(path,ref)
              if m.get('sha')!=blob: raise SystemExit(f'workflow blob drift: {path}@{ref}')
          def jobs(rid):
              out=[]
              for page in range(1,5):
                  d=get(f'{api}/actions/runs/{rid}/jobs?filter=latest&per_page=100&page={page}'); b=d.get('jobs')
                  if not isinstance(b,list): raise SystemExit('malformed jobs')
                  out.extend(b)
                  if len(b)<100: break
              return out
          def runs(workflow,status=None,branch=None,pages=5):
              out=[]
              for p in range(1,pages+1):
                  params={'per_page':'100','page':str(p)}
                  if status: params['status']=status
                  if branch: params['branch']=branch
                  d=get(f"{api}/actions/workflows/{urllib.parse.quote(workflow,safe='')}/runs?{urllib.parse.urlencode(params)}"); b=d.get('workflow_runs')
                  if not isinstance(b,list): raise SystemExit(f'malformed workflow runs: {workflow}')
                  out.extend(b)
                  if len(b)<100: break
              return out
          def active(workflow,branch=None):
              total=0
              for status in ('queued','in_progress'):
                  params={'per_page':'1','status':status}
                  if branch: params['branch']=branch
                  d=get(f"{api}/actions/workflows/{urllib.parse.quote(workflow,safe='')}/runs?{urllib.parse.urlencode(params)}")
                  if not isinstance(d.get('total_count'),int): raise SystemExit('active count malformed')
                  total+=d['total_count']
              return total
          def dispatch(workflow,ref='main',inputs=None):
              payload={'ref':ref}
              if inputs is not None: payload['inputs']=inputs
              request(f"{api}/actions/workflows/{urllib.parse.quote(workflow,safe='')}/dispatches",method='POST',payload=payload)

          assert_blob(os.environ['ORIGINAL_WORKFLOW_PATH'],os.environ['EXPECTED_ORIGINAL_PUBLIC_HEAD'],os.environ['EXPECTED_ORIGINAL_WORKFLOW_BLOB'])
          source=get(f'{api}/actions/runs/{original_id}')
          for k,v in {'head_sha':os.environ['EXPECTED_ORIGINAL_PUBLIC_HEAD'],'head_branch':os.environ['EXPECTED_ORIGINAL_BRANCH'],'path':os.environ['ORIGINAL_WORKFLOW_PATH'],'event':'push','run_attempt':1,'status':'completed'}.items():
              if source.get(k)!=v: raise SystemExit(f'original provenance mismatch: {k}')
          indexed={}
          for j in jobs(original_id):
              m=re.fullmatch(r'tlc \(([0-9]+)\)',j.get('name',''))
              if m: indexed[int(m.group(1))]=j
          if set(indexed)!=set(range(202)): raise SystemExit('original coverage drift')
          direct={i for i,j in indexed.items() if j.get('conclusion')=='success'}
          cancelled={i for i,j in indexed.items() if j.get('conclusion')=='cancelled'}
          other={i:j.get('conclusion') for i,j in indexed.items() if j.get('conclusion') not in {'success','cancelled'}}
          if len(direct)!=192 or cancelled!=replacement_set or other: raise SystemExit(f'original result-set drift: direct={len(direct)} cancelled={sorted(cancelled)} other={other}')
          print('LAS_CANDIDATE3_RECONCILER_SOURCE_SET=PASS')

          ref=get(f"{api}/git/ref/heads/{urllib.parse.quote(runner_ref,safe='')}")
          if ref.get('object',{}).get('sha')!=runner_sha: raise SystemExit('continuation ref drift')
          assert_blob(wrapper,runner_sha,os.environ['WRAPPER_BLOB']); assert_blob(slice_path,runner_sha,os.environ['SLICE_BLOB'])
          assert_blob(os.environ['ATTEST_PATH'],'main',os.environ['ATTEST_BLOB'])
          assert_blob(os.environ['CLOSURE_PATH'],'main',os.environ['CLOSURE_BLOB'])
          print('LAS_CANDIDATE3_RECONCILER_RUNNER_BINDINGS=PASS')

          registry_value=contents(os.environ['REGISTRY_PATH'],'main',optional=True)
          profiles={}
          if registry_value is not None:
              registry=json.loads(registry_value[1].decode('utf-8'))
              fixed={'schema':os.environ['REGISTRY_SCHEMA'],'original_run_id':original_id,'private_snapshot_proof':os.environ['EXPECTED_PRIVATE_SNAPSHOT_PROOF'],'private_tree_proof':os.environ['EXPECTED_PRIVATE_TREE_PROOF'],'canonical_verifier_blob':os.environ['EXPECTED_VERIFIER_BLOB'],'tlc_map_sha256':os.environ['EXPECTED_TLC_MAP_SHA256'],'runner_sha':runner_sha,'wrapper_workflow_blob':os.environ['WRAPPER_BLOB'],'slice_workflow_blob':os.environ['SLICE_BLOB'],'attestor_workflow_blob':os.environ['ATTEST_BLOB']}
              for k,v in fixed.items():
                  if registry.get(k)!=v: raise SystemExit(f'registry binding mismatch: {k}')
              profiles=registry.get('profiles')
              if not isinstance(profiles,dict): raise SystemExit('registry profiles invalid')
              try: recorded={int(k) for k in profiles}
              except Exception as exc: raise SystemExit('registry contains nonnumeric profile') from exc
              if {str(i) for i in recorded}!=set(profiles) or not recorded.issubset(replacement_set): raise SystemExit('registry profile-set invalid')
              for k,e in profiles.items():
                  if not isinstance(e,dict) or e.get('result')!='PASS': raise SystemExit(f'registry profile {k} is not PASS')
          recorded={int(k) for k in profiles}
          missing=[i for i in replacement_order if i not in recorded]

          if missing and not active(os.environ['ATTEST_WORKFLOW']):
              terminal_by_index={}
              terminal_artifact=re.compile(r'^candidate3-resume-terminal-([0-9]+)-([1-9][0-9]*)$')
              for run in runs(os.environ['WRAPPER_WORKFLOW'],status='success',branch=runner_ref,pages=10):
                  expected={'status':'completed','conclusion':'success','run_attempt':1,'event':'workflow_dispatch','head_branch':runner_ref,'head_sha':runner_sha,'path':wrapper}
                  if any(run.get(k)!=v for k,v in expected.items()): continue
                  refs=run.get('referenced_workflows') or []
                  if len(refs)!=1 or refs[0].get('sha')!=runner_sha or refs[0].get('ref')!=f'refs/heads/{runner_ref}' or refs[0].get('path')!=f'{repo}/{slice_path}@{runner_sha}': continue
                  rjobs=jobs(run['id']); by={j.get('name'):j for j in rjobs}
                  arts=get(f"{api}/actions/runs/{run['id']}/artifacts?per_page=100").get('artifacts')
                  if not isinstance(arts,list): raise SystemExit('artifact list malformed')
                  candidates=[]
                  for artifact in arts:
                      name=artifact.get('name')
                      match=terminal_artifact.fullmatch(name) if isinstance(name,str) else None
                      if match and not artifact.get('expired'):
                          candidates.append((int(match.group(1)),int(match.group(2))))
                  if len(candidates)!=1: continue
                  index,_segment=candidates[0]
                  if index not in missing: continue
                  expected_names={'validate','continuation-generic','continuation-profile39 / slice'} if index==39 else {'validate','continuation-generic / slice','continuation-profile39'}
                  if set(by)!=expected_names or len(rjobs)!=3: continue
                  selected=by['continuation-profile39 / slice' if index==39 else 'continuation-generic / slice']
                  steps={s.get('name'):(s.get('status'),s.get('conclusion')) for s in selected.get('steps',[])}
                  if selected.get('status')!='completed' or selected.get('conclusion')!='success': continue
                  if steps.get('Write terminal public-safe attestation')!=('completed','success') or steps.get('Upload terminal public-safe attestation')!=('completed','success'): continue
                  terminal_by_index[index]=max(terminal_by_index.get(index,0),int(run['id']))
              for index in missing:
                  rid=terminal_by_index.get(index)
                  if rid:
                      dispatch(os.environ['ATTEST_WORKFLOW'],'main',{'terminal_run_id':str(rid)})
                      print(f'LAS_CANDIDATE3_RECONCILER_ATTEST_DISPATCH={index}:{rid}')
                      raise SystemExit(0)

          if missing:
              if active(os.environ['ATTEST_WORKFLOW']):
                  print('LAS_CANDIDATE3_RECONCILER_ATTEST_ACTIVE=1'); raise SystemExit(0)
              running=active(os.environ['WRAPPER_WORKFLOW'],runner_ref)
              if running:
                  print(f'LAS_CANDIDATE3_RECONCILER_CONTINUATIONS_ACTIVE={running}'); raise SystemExit(0)
              raise SystemExit(f'Candidate3 continuation stalled without terminal evidence for profiles {missing}')

          print('LAS_CANDIDATE3_RECONCILER_TERMINAL_SET=PASS')
          result=contents(os.environ['RESULT_PATH'],'main',optional=True)
          if result is not None:
              data=json.loads(result[1].decode('utf-8'))
              if data.get('schema')=='las-candidate3-exact-202-tlc-closure-v1' and data.get('source_run_id')==original_id and data.get('direct_success_count')==192 and data.get('replacement_count')==10 and data.get('tlc_profile_count')==202 and data.get('result')=='PASS' and data.get('promotion_marker')=='LAS_CANDIDATE3_202_TLC_RESULT=PASS':
                  print('LAS_CANDIDATE3_RECONCILER_CLOSURE=ALREADY_PASS'); raise SystemExit(0)
              raise SystemExit('conflicting Candidate3 closure result exists')
          if active(os.environ['CLOSURE_WORKFLOW']):
              print('LAS_CANDIDATE3_RECONCILER_CLOSURE_ACTIVE=1'); raise SystemExit(0)
          dispatch(os.environ['CLOSURE_WORKFLOW'],'main')
          print('LAS_CANDIDATE3_RECONCILER_CLOSURE_DISPATCH=PASS')
          PY

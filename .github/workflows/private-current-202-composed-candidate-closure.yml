name: Prove exact current 202 composed candidate closure

on:
  push:
    branches:
      - verify/current-202-source-201-closure-20261015
    paths:
      - ".github/workflows/private-current-202-composed-candidate-closure.yml"
      - "RUN_CURRENT_202_COMPOSED_CANDIDATE_CLOSURE"

permissions:
  contents: read
  actions: read

env:
  DEFAULT_SOURCE_201_PROOF_RUN_ID: "38644713223"
  DEFAULT_PROFILE39_PROOF_RUN_ID: "38644963256"
  DEFAULT_PROFILE39_MODE: single
  SOURCE_GATE_PATH: .github/workflows/private-current-202-source-201-closure.yml
  SOURCE_GATE_BLOB: 5a415522fe55472400831eda88410842b1519921
  PROFILE39_SINGLE_GATE_PATH: .github/workflows/private-current-202-profile39-single-segment-closure.yml
  PROFILE39_SINGLE_GATE_BLOB: 3b8784a2e594197c2b6d88838b37a420ba182cde
  PROFILE39_LINEAGE_GATE_PATH: .github/workflows/private-current-202-profile39-lineage-audit.yml
  PROFILE39_LINEAGE_GATE_BLOB: 1af4215891f440790a69d6ccef32104bb2197dc9
  TARGET_REF_HASH: 28a52175bfc55f4f8b2b0f4312cd2616a65a7082555149f4382746e2254e1b26
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 1b139dc7920e82d5f9bdd2a68c072ad88bc0049d5ef1377380899164da5f93f9
  EXPECTED_PRIVATE_TREE_PROOF: 7fb364587ed7c9f76d8fd9f69cb4a4d58e576a44a1e653d019c8114ccb65353f
  EXPECTED_VERIFIER_BLOB: 62e3e6dc0fad5dddc7fb0a453a3cd681d911e590
  EXPECTED_TLC_MAP_SHA256: da7bb51d531d0e5e5e6994c80be8f254a110cb8181e6121e3a557fdff9428cee

jobs:
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout composition shell
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact proof inputs
        id: request
        shell: bash
        run: |
          set -euo pipefail
          source_run="$DEFAULT_SOURCE_201_PROOF_RUN_ID"
          profile_run="$DEFAULT_PROFILE39_PROOF_RUN_ID"
          mode="$DEFAULT_PROFILE39_MODE"
          if [[ -f RUN_CURRENT_202_COMPOSED_CANDIDATE_CLOSURE ]]; then
            mapfile -t values < <(tr -d '\r' < RUN_CURRENT_202_COMPOSED_CANDIDATE_CLOSURE | sed '/^[[:space:]]*$/d')
            test "${#values[@]}" -eq 3
            source_run="${values[0]}"
            profile_run="${values[1]}"
            mode="${values[2]}"
          fi
          [[ "$source_run" =~ ^[1-9][0-9]*$ ]]
          [[ "$profile_run" =~ ^[1-9][0-9]*$ ]]
          [[ "$mode" = "single" || "$mode" = "lineage" ]]
          echo "source_run_id=$source_run" >>"$GITHUB_OUTPUT"
          echo "profile_run_id=$profile_run" >>"$GITHUB_OUTPUT"
          echo "profile_mode=$mode" >>"$GITHUB_OUTPUT"
          echo "LAS_CURRENT_202_COMPOSED_REQUEST=PASS"

      - name: Revalidate exact frozen private candidate
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          root="$RUNNER_TEMP/private-composed-closure"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          refs="$RUNNER_TEMP/private-composed-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          matched_sha=""
          while read -r sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
              matched_sha="$sha"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          test -n "$matched_sha"
          echo "::add-mask::$matched_ref"
          echo "::add-mask::$matched_sha"
          test "$(printf '%s' "$matched_sha" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$matched_sha"
          git checkout -q --detach "$matched_sha"
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_TREE_PROOF"
          test "$(git hash-object tools/verify_codespaces_all.sh)" = "$EXPECTED_VERIFIER_BLOB"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "LAS_CURRENT_202_COMPOSED_PRIVATE_BINDING=PASS"
          unset PRIVATE_TOKEN PRIVATE_REPOSITORY auth matched_ref matched_sha tree

      - name: Compose exact proof legs without impersonating canonical verifier
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_PROOF_RUN_ID: ${{ steps.request.outputs.source_run_id }}
          PROFILE39_PROOF_RUN_ID: ${{ steps.request.outputs.profile_run_id }}
          PROFILE39_MODE: ${{ steps.request.outputs.profile_mode }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          api = f"https://api.github.com/repos/{repo}"
          source_run_id = int(os.environ["SOURCE_PROOF_RUN_ID"])
          profile_run_id = int(os.environ["PROFILE39_PROOF_RUN_ID"])
          mode = os.environ["PROFILE39_MODE"]

          ansi = re.compile(r"\x1b\[[0-9;]*m")
          stamp = re.compile(r"^\d{4}-\d{2}-\d{2}T\S+Z\s+(.*)$")

          def request_json(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          def request_text(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  return response.read().decode("utf-8", errors="replace")

          def exact_lines(text):
              lines = set()
              for raw in text.splitlines():
                  match = stamp.match(raw)
                  if match:
                      lines.add(ansi.sub("", match.group(1)))
              return lines

          def verify_gate(run_id, expected_path, expected_blob, expected_job, expected_step, markers):
              run = request_json(f"{api}/actions/runs/{run_id}")
              if int(run.get("id", 0)) != run_id:
                  raise SystemExit(f"gate {run_id}: id mismatch")
              if run.get("path") != expected_path:
                  raise SystemExit(f"gate {run_id}: workflow path mismatch")
              if run.get("run_attempt") != 1:
                  raise SystemExit(f"gate {run_id}: unexpected run attempt")
              if run.get("status") != "completed" or run.get("conclusion") != "success":
                  raise SystemExit(f"gate {run_id}: proof run is not successful")
              head = run.get("head_sha", "")
              if not re.fullmatch(r"[0-9a-f]{40}", head):
                  raise SystemExit(f"gate {run_id}: invalid head SHA")
              encoded = urllib.parse.quote(expected_path, safe="/")
              content = request_json(f"{api}/contents/{encoded}?ref={head}")
              if content.get("sha") != expected_blob:
                  raise SystemExit(f"gate {run_id}: proof workflow blob drift")

              jobs = request_json(f"{api}/actions/runs/{run_id}/jobs?filter=latest&per_page=100").get("jobs", [])
              if len(jobs) != 1 or jobs[0].get("name") != expected_job:
                  raise SystemExit(f"gate {run_id}: proof job cardinality/name mismatch")
              job = jobs[0]
              if job.get("status") != "completed" or job.get("conclusion") != "success":
                  raise SystemExit(f"gate {run_id}: proof job not successful")
              steps = {s.get("name"): (s.get("status"), s.get("conclusion")) for s in job.get("steps", [])}
              if steps.get(expected_step) != ("completed", "success"):
                  raise SystemExit(f"gate {run_id}: terminal proof step not successful")
              lines = exact_lines(request_text(f"{api}/actions/jobs/{job['id']}/logs"))
              missing = sorted(set(markers) - lines)
              if missing:
                  raise SystemExit(f"gate {run_id}: missing proof markers: {missing!r}")
              return head

          source_head = verify_gate(
              source_run_id,
              os.environ["SOURCE_GATE_PATH"],
              os.environ["SOURCE_GATE_BLOB"],
              "prove-source-201",
              "Prove exact direct 201-profile leg and visible profile-39 failure",
              (
                  "LAS_CURRENT_202_SOURCE_201_PRE_TLC=PASS",
                  "LAS_CURRENT_202_SOURCE_201_DIRECT_SUCCESS_COUNT=201",
                  "LAS_CURRENT_202_SOURCE_201_SUBSTITUTE_INDEX=39",
                  "LAS_CURRENT_202_SOURCE_201_PROFILE39_DIRECT_FAILURE_VISIBLE=PASS",
                  "LAS_CURRENT_202_SOURCE_201_RESULT=PASS",
              ),
          )

          if mode == "single":
              profile_head = verify_gate(
                  profile_run_id,
                  os.environ["PROFILE39_SINGLE_GATE_PATH"],
                  os.environ["PROFILE39_SINGLE_GATE_BLOB"],
                  "prove-profile39-single-segment",
                  "Prove initial segment is terminal PASS without continuation",
                  ("LAS_CURRENT_202_PROFILE39_SINGLE_SEGMENT_RESULT=PASS",),
              )
          elif mode == "lineage":
              profile_head = verify_gate(
                  profile_run_id,
                  os.environ["PROFILE39_LINEAGE_GATE_PATH"],
                  os.environ["PROFILE39_LINEAGE_GATE_BLOB"],
                  "audit",
                  "Prove complete immutable workflow lineage",
                  (
                      "LAS_CURRENT_202_PROFILE39_LINEAGE_WORKFLOW_IDENTITY=PASS",
                      "LAS_CURRENT_202_PROFILE39_LINEAGE_PROVENANCE=PASS",
                      "LAS_CURRENT_202_PROFILE39_LINEAGE_RESULT=PASS",
                  ),
              )
          else:
              raise SystemExit("unsupported profile-39 proof mode")

          print(f"LAS_CURRENT_202_COMPOSED_SOURCE_GATE_HEAD={source_head}")
          print(f"LAS_CURRENT_202_COMPOSED_PROFILE39_GATE_HEAD={profile_head}")
          print(f"LAS_CURRENT_202_COMPOSED_PROFILE39_MODE={mode}")
          print(f"LAS_CURRENT_202_COMPOSED_TLC_MAP_SHA256={os.environ['EXPECTED_TLC_MAP_SHA256']}")
          print("LAS_CURRENT_202_COMPOSED_SCOPE=PRE_TLC_PLUS_201_DIRECT_PLUS_EXACT_PROFILE39")
          print("LAS_CURRENT_202_COMPOSED_CANDIDATE_RESULT=PASS")
          PY

name: Opaque retired-owner four-candidate gate matrix 20261012

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/opaque-linux-retired-anchor-disambiguation-matrix-20261012.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        fifth: [FIRST, SECOND]
        eleventh: [FIRST, SECOND]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Recover exact live private head opaquely
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
          TARGET_REF_HASH: 12246190df640013d9ee426d2a340387c6d22d0e8241135d6a20dcf1fe5a2bc0
          EXPECTED_HEAD_PROOF: c1b3b06dc372f212fd256e328c9a0dad282c1b2a44e179879061c15a0a19c99b
          EXPECTED_TREE_PROOF: 96dd6f1b2d519fe01e22647efa8d4f32f6e53f5badb00b199e9133246e0fc501
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"; test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"; echo "::add-mask::$PRIVATE_TOKEN"
          root="$RUNNER_TEMP/private-target"; mkdir "$root"; cd "$root"; git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"; echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/private-heads"; git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""; head=""
          while read -r candidate_sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then test -z "$matched_ref"; matched_ref="$ref"; head="$candidate_sha"; fi
          done <"$refs"
          rm -f "$refs"; test -n "$matched_ref"; test -n "$head"
          echo "::add-mask::$matched_ref"; echo "::add-mask::$head"
          test "$(printf '%s' "$head" | sha256sum | awk '{print $1}')" = "$EXPECTED_HEAD_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$head"; git checkout -q --detach "$head"
          tree="$(git rev-parse 'HEAD^{tree}')"; echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_TREE_PROOF"
          test -z "$(git status --porcelain)"
          echo "LAS_FOUR_${{ matrix.fifth }}_${{ matrix.eleventh }}_RECOVERY=PASS"

      - name: Install pinned Rust and Ada toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null
          test "$(rustc +1.98.1 --version | awk '{print $2}')" = "1.98.1"
          archive="$RUNNER_TEMP/alr.zip"; prefix="$RUNNER_TEMP/alr"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --output "$archive" "https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip" >/dev/null 2>&1
          echo "09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  $archive" | sha256sum --check --strict >/dev/null
          mkdir -p "$prefix"; unzip -q "$archive" -d "$prefix"
          "$prefix/bin/alr" -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1 >/dev/null
          workspace="$RUNNER_TEMP/root-production-toolchain"; mkdir -p "$workspace"; cd "$workspace"
          "$prefix/bin/alr" -n init --in-place --no-skel --lib root_production_toolchain >/dev/null
          gpr_wrapper="$RUNNER_TEMP/gprbuild-wrapper"
          printf '#!/usr/bin/env bash\nset -euo pipefail\ncd %q\nexec %q exec -- gprbuild "$@"\n' "$workspace" "$prefix/bin/alr" >"$gpr_wrapper"
          chmod +x "$gpr_wrapper"; "$gpr_wrapper" --version >/dev/null
          echo "GPRBUILD=$gpr_wrapper" >>"$GITHUB_ENV"
          echo "LAS_FOUR_${{ matrix.fifth }}_${{ matrix.eleventh }}_TOOLCHAINS=PASS"

      - name: Materialize exact ambiguity candidate opaquely
        shell: bash
        env:
          FIFTH: ${{ matrix.fifth }}
          ELEVENTH: ${{ matrix.eleventh }}
          ORIGINAL_HELPER_PATH_HASH: 3bd0f3b2ae73ca0acd5d1e08b47720c6cc80569d4b87901c2e1fc0b69f7504e2
          EXPECTED_TRANSFORM_SHA256: d97bb8c1f38b8ceeb9a5814e984947822b76cb2dcf681ead65443ab02c4e8e58
          EXPECTED_PATH_HASH_1: 680761d41ae8315a6bf67b2df5250c8b4ebc93b434b7de42be032b743c37b90a
          EXPECTED_PATH_HASH_2: 736cc80e53ddc8c5287113b778e1a8fb5f3973b1b5092cdf665c982b07ce8b6d
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          python3 - "$RUNNER_TEMP" <<'PY'
          import ast, base64, gzip, hashlib, os, pathlib, subprocess, sys
          tmp=pathlib.Path(sys.argv[1]); choices={5:os.environ['FIFTH'],11:os.environ['ELEVENTH']}; label=f"{choices[5]}_{choices[11]}"
          tracked=[p.decode() for p in subprocess.check_output(['git','ls-files','-z']).split(b'\0') if p]
          matches=[p for p in tracked if hashlib.sha256(p.encode()).hexdigest()==os.environ['ORIGINAL_HELPER_PATH_HASH']]
          if len(matches)!=1: raise SystemExit(70)
          tree=ast.parse(pathlib.Path(matches[0]).read_text(encoding='utf-8')); vals={}
          for n in tree.body:
              if isinstance(n,ast.Assign) and len(n.targets)==1 and isinstance(n.targets[0],ast.Name) and isinstance(n.value,ast.Constant): vals[n.targets[0].id]=n.value.value
          payload=vals.get('PAYLOAD'); expected=vals.get('EXPECTED')
          if not isinstance(payload,str) or not isinstance(expected,str): raise SystemExit(71)
          data=gzip.decompress(base64.b64decode(payload)); digest=hashlib.sha256(data).hexdigest()
          if digest!=expected or digest!=os.environ['EXPECTED_TRANSFORM_SHA256']: raise SystemExit(72)
          state={'count':0,'replace':0}
          def selected_replace(obj,old,new,choice):
              first=obj.find(old); second=obj.find(old,first+len(old)); third=obj.find(old,second+len(old))
              if first<0 or second<0 or third>=0: raise SystemExit(75)
              pos=first if choice=='FIRST' else second
              return obj[:pos]+new+obj[pos+len(old):]
          def las_count(obj,*args):
              state['count']+=1; ordinal=state['count']; actual=obj.count(*args)
              if ordinal in choices:
                  if actual!=2: raise SystemExit(73)
                  return 1
              return actual
          def las_replace(obj,*args):
              state['replace']+=1; ordinal=state['replace']; old=args[0] if args else None; new=args[1] if len(args)>1 else None
              if ordinal in choices:
                  if len(args)<2 or not isinstance(obj,str) or not isinstance(old,str) or not isinstance(new,str) or obj.count(old)!=2: raise SystemExit(74)
                  return selected_replace(obj,old,new,choices[ordinal])
              return obj.replace(*args)
          class T(ast.NodeTransformer):
              def visit_Call(self,node):
                  self.generic_visit(node)
                  if node.lineno==6 and isinstance(node.func,ast.Attribute) and node.func.attr=='count': return ast.copy_location(ast.Call(ast.Name('las_count',ast.Load()),[node.func.value,*node.args],node.keywords),node)
                  if node.lineno==9 and isinstance(node.func,ast.Attribute) and node.func.attr=='replace': return ast.copy_location(ast.Call(ast.Name('las_replace',ast.Load()),[node.func.value,*node.args],node.keywords),node)
                  return node
          parsed=ast.parse(data.decode('utf-8'),filename='<opaque-transform>'); inst=T().visit(parsed); ast.fix_missing_locations(inst)
          ns={'__name__':'__main__','__file__':str(tmp/'opaque-transform.py'),'las_count':las_count,'las_replace':las_replace}
          rc=0
          try: exec(compile(inst,'<opaque-transform>','exec'),ns,ns)
          except SystemExit as e: rc=e.code if isinstance(e.code,int) else 1
          print(f'LAS_FOUR_{label}_TRANSFORM_RC={rc}')
          print(f'LAS_FOUR_{label}_COUNT_CALLS={state["count"]}')
          print(f'LAS_FOUR_{label}_REPLACE_CALLS={state["replace"]}')
          if rc!=0 or state['count']!=11 or state['replace']!=11: raise SystemExit(77)
          PY
          cargo +1.98.1 fmt --all
          changed="$RUNNER_TEMP/changed"; git diff --name-only -z >"$changed"
          python3 - "$changed" <<'PY'
          import hashlib, os, subprocess, sys
          label=f"{os.environ['FIFTH']}_{os.environ['ELEVENTH']}"; paths=[p for p in open(sys.argv[1],'rb').read().split(b'\0') if p]
          hashes=sorted(hashlib.sha256(p).hexdigest() for p in paths); expected=sorted([os.environ['EXPECTED_PATH_HASH_1'],os.environ['EXPECTED_PATH_HASH_2']])
          blobs=[]
          for p in paths:
              blob=subprocess.check_output(['git','hash-object','--',p.decode()],text=True).strip(); blobs.append(hashlib.sha256(blob.encode()).hexdigest())
          print(f'LAS_FOUR_{label}_CHANGED_COUNT={len(paths)}')
          print(f'LAS_FOUR_{label}_EXPECTED_CHANGESET=' + ('1' if hashes==expected else '0'))
          print(f'LAS_FOUR_{label}_BLOBSET_PROOF='+hashlib.sha256('\n'.join(sorted(blobs)).encode()).hexdigest())
          if hashes!=expected: raise SystemExit(78)
          PY
          rm -f "$changed"; git diff --check
          echo "LAS_FOUR_${{ matrix.fifth }}_${{ matrix.eleventh }}_MATERIALIZATION=PASS"

      - name: Run full transformed candidate gates
        shell: bash
        env:
          FIFTH: ${{ matrix.fifth }}
          ELEVENTH: ${{ matrix.eleventh }}
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"; label="${FIFTH}_${ELEVENTH}"; failures=0
          run_gate() {
            gate="$1"; shift; log="$RUNNER_TEMP/${label}-${gate}.private.log"
            set +e; "$@" >"$log" 2>&1; rc=$?; set -e
            echo "LAS_FOUR_${label}_${gate}_RC=$rc"
            echo "LAS_FOUR_${label}_${gate}_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
            rm -f "$log"; if [[ "$rc" -ne 0 ]]; then failures=$((failures+1)); fi
          }
          run_gate TRUST_CONTRACT python3 tools/verification/root_trust_input_contract.py
          run_gate FORMAT cargo +1.98.1 fmt --all -- --check
          run_gate DEFAULT_CHECK cargo +1.98.1 check --locked --all-targets
          run_gate LINUX_CHECK cargo +1.98.1 check --locked --all-targets --features linux-peer-credentials
          run_gate PRODUCTION_CHECK cargo +1.98.1 check --locked --all-targets --features "root-ffi linux-peer-credentials"
          run_gate PRODUCTION_CLIPPY cargo +1.98.1 clippy --locked --all-targets --features "root-ffi linux-peer-credentials" -- -D warnings
          run_gate RETIRED_BOUND_TEST cargo +1.98.1 test --locked --lib --features linux-peer-credentials root_supervisor_linux_retired_bound_archive -- --test-threads=1
          run_gate RETIRED_OWNER_TEST cargo +1.98.1 test --locked --lib --features "root-ffi linux-peer-credentials" retired_projection_tests -- --test-threads=1
          run_gate RETIRED_SINK_TEST cargo +1.98.1 test --locked --lib --features linux-peer-credentials root_supervisor_linux_retired_owner_projection -- --test-threads=1
          run_gate PRODUCTION_LIB_TEST cargo +1.98.1 test --locked --lib --features "root-ffi linux-peer-credentials" -- --test-threads=1
          run_gate RELEASE_CHECK cargo +1.98.1 check --release --locked --all-targets --features "root-ffi linux-peer-credentials"
          echo "LAS_FOUR_${label}_FAILURE_COUNT=$failures"
          if [[ "$failures" -eq 0 ]]; then echo "LAS_FOUR_${label}_GATE_MATRIX=PASS"; else echo "LAS_FOUR_${label}_GATE_MATRIX=FAIL"; fi
          test "$failures" -eq 0

name: Candidate3 exact resumable TLC slice 20261016

on:
  workflow_call:
    inputs:
      index:
        required: true
        type: number
      segment:
        required: true
        type: number
      resume_run_id:
        required: false
        type: string
        default: ""
      resume_artifact:
        required: false
        type: string
        default: ""
      mode:
        required: true
        type: string
    secrets:
      LAS_PRIVATE_REPOSITORY:
        required: true
      LAS_PRIVATE_READ_TOKEN:
        required: true

permissions:
  contents: read
  actions: write

env:
  TARGET_REF_HASH: a5f3dd87c6174b2ec1aafe984e6a5722b8cf90562d8ff21cb5e7b12f271466c2
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 269a9a8c7afae986f8065e93745c9017f848292a118b2b9d006d007cbdb6b1f8
  EXPECTED_PRIVATE_TREE_PROOF: 6998e8e80e6c8fb86fbac5e4c512af441f827b4536aa5448dfed6aa14568468e
  EXPECTED_VERIFIER_BLOB: 62e3e6dc0fad5dddc7fb0a453a3cd681d911e590
  EXPECTED_TLC_PROFILE_COUNT: "202"
  EXPECTED_TLC_MAP_SHA256: da7bb51d531d0e5e5e6994c80be8f254a110cb8181e6121e3a557fdff9428cee
  EXPECTED_TLA_JAR_SHA1: bee4a54f3ee3d4afc347c3240ec2d9e93b075104
  ORIGINAL_RUN_ID: "38829095332"
  EXPECTED_ORIGINAL_PUBLIC_HEAD: 55471ace6dd056674830ea7764ed6d088faacaa1
  EXPECTED_ORIGINAL_BRANCH: verify/candidate3-tlc-20261016
  ORIGINAL_WORKFLOW_PATH: .github/workflows/private-candidate3-tlc-20261016.yml
  EXPECTED_ORIGINAL_WORKFLOW_BLOB: e019bd29322d7cbac67df7e0b4366000018311a3
  PRE_TLC_RUN_ID: "38828110294"
  EXPECTED_PRE_TLC_PUBLIC_HEAD: 9c99ebb14e302ef8862f1117d765e7a4edafb198
  PRE_TLC_WORKFLOW_PATH: .github/workflows/private-candidate3-pre-tlc-20261016.yml
  EXPECTED_PRE_TLC_WORKFLOW_BLOB: c124c1120e6e1b9bf49115db2d7f8fd149acb580
  CONTINUATION_REF: verify/candidate3-resumable-tlc-20261016
  CHECKPOINT_SCHEMA: candidate3-periodic-barrier-v1
  WORKER_MODE: auto
  JAVA_TOOL_OPTIONS: -Xmx5g

jobs:
  slice:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      TARGET_INDEX: ${{ inputs.index }}
      SEGMENT: ${{ inputs.segment }}
      RESUME_RUN_ID: ${{ inputs.resume_run_id }}
      RESUME_ARTIFACT: ${{ inputs.resume_artifact }}
      MODE: ${{ inputs.mode }}
    steps:
      - name: Validate immutable continuation request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$CONTINUATION_REF"
          [[ "$TARGET_INDEX" =~ ^[0-9]+$ ]]
          [[ "$SEGMENT" =~ ^[0-9]+$ ]]
          test "$TARGET_INDEX" -ge 0
          test "$TARGET_INDEX" -lt "$EXPECTED_TLC_PROFILE_COUNT"
          test "$SEGMENT" -ge 1
          test "$WORKER_MODE" = auto

          case "$MODE" in
            generic)
              test "$TARGET_INDEX" -ne 39
              dispatch_workflow=private-assurance-slow-tlc-continuation.yml
              slice_seconds=14400
              min_free_kb=50331648
              ;;
            profile39)
              test "$TARGET_INDEX" -eq 39
              dispatch_workflow=private-repaired-202-tlc39-continuation.yml
              slice_seconds=7200
              min_free_kb=54525952
              ;;
            *) echo "unsupported continuation mode" >&2; exit 1 ;;
          esac
          printf 'DISPATCH_WORKFLOW=%s\nSLICE_SECONDS=%s\nCHECKPOINT_GRACE_SECONDS=1200\nINITIAL_MIN_FREE_KB=67108864\nMIN_FREE_KB=%s\n' \
            "$dispatch_workflow" "$slice_seconds" "$min_free_kb" >>"$GITHUB_ENV"

          if [[ "$SEGMENT" -eq 1 ]]; then
            test -z "$RESUME_RUN_ID"; test -z "$RESUME_ARTIFACT"
          else
            [[ "$RESUME_RUN_ID" =~ ^[0-9]+$ ]]
            test "$RESUME_ARTIFACT" = "candidate3-resume-state-${TARGET_INDEX}-$((SEGMENT - 1))"
          fi

          ref_json="$RUNNER_TEMP/continuation-ref.json"
          curl --proto '=https' --tlsv1.2 --fail-with-body -sS \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/$CONTINUATION_REF" >"$ref_json"
          continuation_sha="$(python3 - "$ref_json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1],encoding='utf-8'))['object']['sha'])
          PY
          )"
          rm -f "$ref_json"
          test "$continuation_sha" = "$GITHUB_SHA"
          echo "LAS_CANDIDATE3_RESUME_REQUEST=PASS"
          echo "LAS_CANDIDATE3_RESUME_REF_BINDING=PASS"
          echo "LAS_CANDIDATE3_RESUME_MODE=$MODE"
          echo "LAS_CANDIDATE3_RESUME_INDEX=$TARGET_INDEX"
          echo "LAS_CANDIDATE3_RESUME_SEGMENT=$SEGMENT"

      - name: Bind original cancelled matrix job and pre-TLC evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api_get() {
            curl --proto '=https' --tlsv1.2 --fail-with-body -sS \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" "$1"
          }

          api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$ORIGINAL_RUN_ID" >"$RUNNER_TEMP/original-run.json"
          python3 - "$RUNNER_TEMP/original-run.json" "$EXPECTED_ORIGINAL_PUBLIC_HEAD" "$EXPECTED_ORIGINAL_BRANCH" "$ORIGINAL_WORKFLOW_PATH" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d['head_sha']==sys.argv[2] and d['head_branch']==sys.argv[3] and d['path']==sys.argv[4]
          assert d['event']=='push' and d['run_attempt']==1 and d['status'] in {'in_progress','completed'}
          PY

          api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/$ORIGINAL_WORKFLOW_PATH?ref=$EXPECTED_ORIGINAL_PUBLIC_HEAD" >"$RUNNER_TEMP/original-workflow.json"
          test "$(python3 - "$RUNNER_TEMP/original-workflow.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1],encoding='utf-8'))['sha'])
          PY
          )" = "$EXPECTED_ORIGINAL_WORKFLOW_BLOB"

          for page in 1 2 3; do
            api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$ORIGINAL_RUN_ID/jobs?per_page=100&page=$page" >"$RUNNER_TEMP/original-jobs-$page.json"
          done
          python3 - "$TARGET_INDEX" "$RUNNER_TEMP/original-jobs-1.json" "$RUNNER_TEMP/original-jobs-2.json" "$RUNNER_TEMP/original-jobs-3.json" <<'PY'
          import json,sys
          idx=int(sys.argv[1]); jobs=[]
          for p in sys.argv[2:]: jobs.extend(json.load(open(p,encoding='utf-8'))['jobs'])
          bind=[j for j in jobs if j['name']=='bind-pre-tlc']
          assert len(bind)==1 and bind[0]['conclusion']=='success'
          target=[j for j in jobs if j['name']==f'tlc ({idx})']
          assert len(target)==1
          j=target[0]
          assert j['status']=='completed' and j['conclusion']=='cancelled'
          s={x['name']:x for x in j.get('steps',[])}
          assert s['Recover exact frozen private candidate']['conclusion']=='success'
          assert s['Run exact canonical TLC profile']['conclusion']=='cancelled'
          PY

          api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$PRE_TLC_RUN_ID" >"$RUNNER_TEMP/pre-tlc-run.json"
          python3 - "$RUNNER_TEMP/pre-tlc-run.json" "$EXPECTED_PRE_TLC_PUBLIC_HEAD" "$PRE_TLC_WORKFLOW_PATH" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d['head_sha']==sys.argv[2] and d['path']==sys.argv[3]
          assert d['event']=='push' and d['run_attempt']==1 and d['status']=='completed' and d['conclusion']=='success'
          PY
          api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/$PRE_TLC_WORKFLOW_PATH?ref=$EXPECTED_PRE_TLC_PUBLIC_HEAD" >"$RUNNER_TEMP/pre-tlc-workflow.json"
          test "$(python3 - "$RUNNER_TEMP/pre-tlc-workflow.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1],encoding='utf-8'))['sha'])
          PY
          )" = "$EXPECTED_PRE_TLC_WORKFLOW_BLOB"
          rm -f "$RUNNER_TEMP"/original-run.json "$RUNNER_TEMP"/original-workflow.json "$RUNNER_TEMP"/original-jobs-*.json "$RUNNER_TEMP"/pre-tlc-run.json "$RUNNER_TEMP"/pre-tlc-workflow.json
          echo "LAS_CANDIDATE3_RESUME_ORIGINAL_CANCELLATION=PASS"
          echo "LAS_CANDIDATE3_RESUME_PRE_TLC_BINDING=PASS"

      - name: Reclaim runner storage for exhaustive TLC
        shell: bash
        run: |
          set -euo pipefail
          before_kb="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          echo "LAS_CANDIDATE3_RESUME_FREE_KB_BEFORE=$before_kb"
          for path in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/az /opt/hostedtoolcache/CodeQL; do
            [[ ! -e "$path" ]] || sudo rm -rf "$path"
          done
          sudo apt-get clean
          docker system prune --all --force >/dev/null 2>&1 || true
          after_kb="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          echo "LAS_CANDIDATE3_RESUME_FREE_KB_AFTER=$after_kb"
          test "$after_kb" -ge "$INITIAL_MIN_FREE_KB"

      - name: Recover exact frozen private candidate
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"; test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"; echo "::add-mask::$PRIVATE_TOKEN"
          ROOT="$GITHUB_WORKSPACE/target"; mkdir "$ROOT"; cd "$ROOT"; git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"; echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""; matched_sha=""
          while read -r sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"; matched_ref="$ref"; matched_sha="$sha"
            fi
          done <"$refs"
          rm -f "$refs"; test -n "$matched_ref"; test -n "$matched_sha"
          echo "::add-mask::$matched_ref"; echo "::add-mask::$matched_sha"
          test "$(printf '%s' "$matched_sha" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          actual="$(git rev-parse FETCH_HEAD)"; echo "::add-mask::$actual"; test "$actual" = "$matched_sha"
          test "$(printf '%s' "$actual" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          git checkout -q --detach "$actual"
          tree="$(git rev-parse 'HEAD^{tree}')"; echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_TREE_PROOF"
          test "$(git hash-object tools/verify_codespaces_all.sh)" = "$EXPECTED_VERIFIER_BLOB"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "LAS_CANDIDATE3_RESUME_RECOVERY=PASS"
          unset PRIVATE_TOKEN auth matched_ref matched_sha actual tree

      - name: Bind exact canonical map and selected positive profile
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/target"; cd "$ROOT"; map_py="$RUNNER_TEMP/tlc-map.py"
          python3 - tools/verify_codespaces_all.sh "$map_py" <<'PY'
          from pathlib import Path
          import sys
          src=Path(sys.argv[1]).read_text(encoding='utf-8')
          mh='python3 - "$ROOT" > "$TLC_MAP" <<\'PY\'\n'; me='\nPY\n\nrun_tlc_profile() {'
          if src.count(mh)!=1 or src.count(me)!=1: raise SystemExit('canonical map anchors are not unique')
          if src.count('local args=(-workers auto -lncheck final -fp 0)')!=1: raise SystemExit('canonical TLC argument contract changed')
          if src.count('java -XX:+UseParallelGC -jar "$TLA_JAR" "${args[@]}"')!=1: raise SystemExit('canonical TLC JVM contract changed')
          Path(sys.argv[2]).write_text(src[src.index(mh)+len(mh):src.index(me,src.index(mh)+len(mh))]+'\n',encoding='utf-8')
          PY
          map="$RUNNER_TEMP/tlc-map.tsv"; map_err="$RUNNER_TEMP/tlc-map.private.err"
          if ! python3 "$map_py" "$ROOT" >"$map" 2>"$map_err"; then
            echo "LAS_CANDIDATE3_RESUME_MAP_ERROR_SHA256=$(sha256sum "$map_err" | awk '{print $1}')"; rm -f "$map_err"; exit 1
          fi
          rm -f "$map_err"
          test "$(wc -l <"$map" | tr -d ' ')" = "$EXPECTED_TLC_PROFILE_COUNT"
          test "$(sha256sum "$map" | awk '{print $1}')" = "$EXPECTED_TLC_MAP_SHA256"
          line="$(sed -n "$((TARGET_INDEX + 1))p" "$map")"; test -n "$line"
          IFS=$'\t' read -r cfg tla deadlock expectation <<<"$line"
          test -n "$cfg"; test -n "$tla"; [[ "$deadlock" = 0 || "$deadlock" = 1 ]]; test -z "$expectation"
          profile_binding="$(printf '%s\0%s\0%s\0%s' "$cfg" "$tla" "$deadlock" "$expectation" | sha256sum | awk '{print $1}')"
          echo "PROFILE_BINDING_SHA256=$profile_binding" >>"$GITHUB_ENV"
          echo "LAS_CANDIDATE3_RESUME_PROFILE_BINDING=$profile_binding"
          echo "LAS_CANDIDATE3_RESUME_CANONICAL_ARGS=PASS"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Download prior authenticated encrypted checkpoint
        if: inputs.resume_run_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.resume_artifact }}
          path: ${{ runner.temp }}/resume
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run_id }}

      - name: Authenticate and restore prior checkpoint
        if: inputs.resume_run_id != ''
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_TOKEN"; echo "::add-mask::$PRIVATE_TOKEN"
          enc="$RUNNER_TEMP/resume/checkpoint.tar.gz.enc"; mac_file="$RUNNER_TEMP/resume/checkpoint.tar.gz.enc.hmac"
          test -s "$enc"; test -s "$mac_file"
          java_fp="$(java -version 2>&1 | sha256sum | awk '{print $1}')"; nproc_fp="$(nproc)"
          export LAS_CHECKPOINT_SECRET LAS_CHECKPOINT_MAC_KEY
          context="$(printf '%s\0%s\0%s\0%s\0%s\0%s\0%s\0%s\0%s\0%s\0%s\0%s' \
            "$CHECKPOINT_SCHEMA" "$GITHUB_SHA" "$WORKER_MODE" "$nproc_fp" "$java_fp" "$MODE" \
            "$EXPECTED_PRIVATE_SNAPSHOT_PROOF" "$EXPECTED_PRIVATE_TREE_PROOF" "$EXPECTED_VERIFIER_BLOB" \
            "$EXPECTED_TLC_MAP_SHA256" "$TARGET_INDEX" "$PROFILE_BINDING_SHA256" | sha256sum | awk '{print $1}')"
          LAS_CHECKPOINT_SECRET="$(printf '%s\0%s\0enc' "$PRIVATE_TOKEN" "$context" | sha256sum | awk '{print $1}')"
          LAS_CHECKPOINT_MAC_KEY="$(printf '%s\0%s\0mac' "$PRIVATE_TOKEN" "$context" | sha256sum | awk '{print $1}')"
          expected_mac="$(tr -d '[:space:]' <"$mac_file")"
          actual_mac="$(openssl dgst -sha256 -mac HMAC -macopt "hexkey:$LAS_CHECKPOINT_MAC_KEY" "$enc" | awk '{print $NF}')"
          test -n "$expected_mac"; test "$actual_mac" = "$expected_mac"
          list="$RUNNER_TEMP/checkpoint-paths"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -pass env:LAS_CHECKPOINT_SECRET -in "$enc" | tar -tzf - >"$list"
          python3 - "$list" <<'PY'
          from pathlib import PurePosixPath
          import sys
          for raw in open(sys.argv[1],encoding='utf-8',errors='strict'):
              raw=raw.rstrip('\n')
              if not raw or raw.startswith('/') or '\\' in raw: raise SystemExit('unsafe archive path')
              p=PurePosixPath(raw.rstrip('/'))
              if not p.parts or p.parts[0]!='tlc-meta' or '..' in p.parts: raise SystemExit('unsafe archive path')
          PY
          rm -f "$list"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -pass env:LAS_CHECKPOINT_SECRET -in "$enc" | \
            tar --no-same-owner --no-same-permissions -xzf - -C "$RUNNER_TEMP"
          manifest="$RUNNER_TEMP/tlc-meta/las-resume-manifest.txt"; test -s "$manifest"
          for kv in \
            "schema=$CHECKPOINT_SCHEMA" "runner=$GITHUB_SHA" "worker_mode=$WORKER_MODE" "nproc=$nproc_fp" "java=$java_fp" \
            "mode=$MODE" "producer_run=$RESUME_RUN_ID" "original_run=$ORIGINAL_RUN_ID" \
            "snapshot=$EXPECTED_PRIVATE_SNAPSHOT_PROOF" "tree=$EXPECTED_PRIVATE_TREE_PROOF" "verifier=$EXPECTED_VERIFIER_BLOB" \
            "map=$EXPECTED_TLC_MAP_SHA256" "index=$TARGET_INDEX" "profile=$PROFILE_BINDING_SHA256" "segment=$((SEGMENT - 1))"; do
            grep -Fqx "$kv" "$manifest"
          done
          rm -f "$manifest"
          echo "LAS_CANDIDATE3_RESUME_CHECKPOINT_AUTH=PASS"
          unset PRIVATE_TOKEN LAS_CHECKPOINT_SECRET LAS_CHECKPOINT_MAC_KEY context expected_mac actual_mac java_fp nproc_fp

      - name: Run exact canonical TLC slice with resumable checkpoint barrier
        id: tlc
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/target"; cd "$ROOT"
          TLA_JAR="$RUNNER_TEMP/tla2tools.jar"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --output "$TLA_JAR" \
            "https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar" >/dev/null 2>&1
          echo "$EXPECTED_TLA_JAR_SHA1  $TLA_JAR" | sha1sum --check --strict >/dev/null
          map="$RUNNER_TEMP/tlc-map.tsv"; test -s "$map"
          test "$(wc -l <"$map" | tr -d ' ')" = "$EXPECTED_TLC_PROFILE_COUNT"
          test "$(sha256sum "$map" | awk '{print $1}')" = "$EXPECTED_TLC_MAP_SHA256"
          line="$(sed -n "$((TARGET_INDEX + 1))p" "$map")"; IFS=$'\t' read -r cfg tla deadlock expectation <<<"$line"
          test -n "$cfg"; test -n "$tla"; test -z "$expectation"
          test "$(printf '%s\0%s\0%s\0%s' "$cfg" "$tla" "$deadlock" "$expectation" | sha256sum | awk '{print $1}')" = "$PROFILE_BINDING_SHA256"
          cfg_dir="$(dirname "$cfg")"; cfg_base="$(basename "$cfg")"; tla_base="$(basename "$tla")"
          log="$RUNNER_TEMP/private-tlc.log"; meta="$RUNNER_TEMP/tlc-meta"; mkdir -p "$meta"
          args=(-workers auto -lncheck final -fp 0 -checkpoint 5 -metadir "$meta")
          if [[ -n "$RESUME_RUN_ID" ]]; then
            mapfile -t recover_dirs < <(find "$meta" -type f -name vars.chkpt -printf '%h\n' | sort -u)
            test "${#recover_dirs[@]}" -eq 1; recover_dir="${recover_dirs[0]}"; test -f "$recover_dir/queue.chkpt"
            args+=(-recover "$recover_dir"); echo "LAS_CANDIDATE3_RESUME_RECOVER_DIR=PASS"
          fi
          [[ "$deadlock" != 1 ]] || args+=(-deadlock)
          args+=(-config "$cfg_base" "$tla_base")

          set +e
          (cd "$cfg_dir"; exec java -XX:+UseParallelGC -jar "$TLA_JAR" "${args[@]}") >"$log" 2>&1 &
          tlc_pid=$!
          set -e
          tlc_running() { local s; s="$(ps -o stat= -p "$tlc_pid" 2>/dev/null | awk 'NR==1{print $1}')"; [[ -n "$s" && "$s" != Z* ]]; }
          started="$(date +%s)"; deadline="$((started + SLICE_SECONDS))"; slice_cut=0; barrier_failed=0; cut_reason=none
          while tlc_running; do
            now="$(date +%s)"; free_kb="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2{print $4}')"
            if (( now >= deadline || free_kb <= MIN_FREE_KB )); then
              if (( free_kb <= MIN_FREE_KB )); then cut_reason=storage; else cut_reason=time; fi
              ends_before="$(grep -cF 'Checkpointing completed at (' "$log" 2>/dev/null || true)"
              target_ends="$((ends_before + 1))"; grace_deadline="$((now + CHECKPOINT_GRACE_SECONDS))"
              echo "LAS_CANDIDATE3_RESUME_BARRIER_REQUESTED=1"; echo "LAS_CANDIDATE3_RESUME_BARRIER_REASON=$cut_reason"
              while tlc_running; do
                ends_now="$(grep -cF 'Checkpointing completed at (' "$log" 2>/dev/null || true)"
                if (( ends_now >= target_ends )); then
                  slice_cut=1; echo "LAS_CANDIDATE3_RESUME_BARRIER_COMPLETE=1"; kill -TERM "$tlc_pid" 2>/dev/null || true
                  for _ in $(seq 1 10); do tlc_running || break; sleep 2; done
                  tlc_running && kill -KILL "$tlc_pid" 2>/dev/null || true
                  break
                fi
                now="$(date +%s)"
                if (( now >= grace_deadline )); then barrier_failed=1; echo "LAS_CANDIDATE3_RESUME_BARRIER_TIMEOUT=1"; kill -KILL "$tlc_pid" 2>/dev/null || true; break; fi
                sleep 5
              done
              break
            fi
            sleep 15
          done
          set +e; wait "$tlc_pid"; rc=$?; set -e
          echo "LAS_CANDIDATE3_RESUME_RC=$rc"; echo "LAS_CANDIDATE3_RESUME_CUT_REASON=$cut_reason"
          echo "LAS_CANDIDATE3_RESUME_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
          test -z "$(git status --porcelain --untracked-files=no)"
          severe='Invariant .* is violated|Property .* is violated|Temporal propert(y|ies).*violat|liveness.*violat|Deadlock reached|Parsing or semantic analysis failed|parse error|semantic error|(checkpoint|recover).*(error|fail|exception)|(error|fail|exception).*(checkpoint|recover)|fingerprint.*collision|collision.*fingerprint|OutOfMemoryError|Cannot allocate memory|No space left on device|Disk quota exceeded|Exception in thread|java\.lang\.|java\.io\.|java\.nio\.|TLC threw an unexpected exception|TLC Bug|AssertionError|An error occurred while running TLC'
          if grep -Eiq "$severe" "$log"; then rm -f "$log"; echo "status=fail" >>"$GITHUB_OUTPUT"; echo "LAS_CANDIDATE3_RESUME_RESULT=FAIL_CLOSED"; exit 1; fi
          if (( barrier_failed )); then rm -f "$log"; echo "status=fail" >>"$GITHUB_OUTPUT"; echo "LAS_CANDIDATE3_RESUME_RESULT=FAIL_BARRIER"; exit 1; fi
          if [[ "$rc" -eq 0 ]]; then rm -f "$log"; echo "status=pass" >>"$GITHUB_OUTPUT"; echo "LAS_CANDIDATE3_RESUME_RESULT=PASS"; exit 0; fi
          if (( slice_cut )) && [[ "$rc" -eq 137 || "$rc" -eq 143 ]]; then
            mapfile -t checkpoint_dirs < <(find "$meta" -type f -name vars.chkpt -printf '%h\n' | sort -u)
            test "${#checkpoint_dirs[@]}" -eq 1; test -f "${checkpoint_dirs[0]}/queue.chkpt"
            rm -f "$log"; echo "status=slice" >>"$GITHUB_OUTPUT"; echo "LAS_CANDIDATE3_RESUME_RESULT=SLICE_CHECKPOINT"; exit 0
          fi
          rm -f "$log"; echo "status=fail" >>"$GITHUB_OUTPUT"; echo "LAS_CANDIDATE3_RESUME_RESULT=FAIL"; exit 1

      - name: Seal authenticated encrypted checkpoint
        if: steps.tlc.outputs.status == 'slice'
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_TOKEN"; echo "::add-mask::$PRIVATE_TOKEN"; meta="$RUNNER_TEMP/tlc-meta"
          mapfile -t checkpoint_dirs < <(find "$meta" -type f -name vars.chkpt -printf '%h\n' | sort -u)
          test "${#checkpoint_dirs[@]}" -eq 1; test -f "${checkpoint_dirs[0]}/queue.chkpt"
          test -z "$(find "$meta" ! -type f ! -type d -print -quit)"
          java_fp="$(java -version 2>&1 | sha256sum | awk '{print $1}')"; nproc_fp="$(nproc)"
          printf 'schema=%s\nrunner=%s\nworker_mode=%s\nnproc=%s\njava=%s\nmode=%s\nproducer_run=%s\noriginal_run=%s\nsnapshot=%s\ntree=%s\nverifier=%s\nmap=%s\nindex=%s\nprofile=%s\nsegment=%s\n' \
            "$CHECKPOINT_SCHEMA" "$GITHUB_SHA" "$WORKER_MODE" "$nproc_fp" "$java_fp" "$MODE" "$GITHUB_RUN_ID" "$ORIGINAL_RUN_ID" \
            "$EXPECTED_PRIVATE_SNAPSHOT_PROOF" "$EXPECTED_PRIVATE_TREE_PROOF" "$EXPECTED_VERIFIER_BLOB" "$EXPECTED_TLC_MAP_SHA256" \
            "$TARGET_INDEX" "$PROFILE_BINDING_SHA256" "$SEGMENT" >"$meta/las-resume-manifest.txt"
          export LAS_CHECKPOINT_SECRET LAS_CHECKPOINT_MAC_KEY
          context="$(printf '%s\0%s\0%s\0%s\0%s\0%s\0%s\0%s\0%s\0%s\0%s\0%s' \
            "$CHECKPOINT_SCHEMA" "$GITHUB_SHA" "$WORKER_MODE" "$nproc_fp" "$java_fp" "$MODE" \
            "$EXPECTED_PRIVATE_SNAPSHOT_PROOF" "$EXPECTED_PRIVATE_TREE_PROOF" "$EXPECTED_VERIFIER_BLOB" \
            "$EXPECTED_TLC_MAP_SHA256" "$TARGET_INDEX" "$PROFILE_BINDING_SHA256" | sha256sum | awk '{print $1}')"
          LAS_CHECKPOINT_SECRET="$(printf '%s\0%s\0enc' "$PRIVATE_TOKEN" "$context" | sha256sum | awk '{print $1}')"
          LAS_CHECKPOINT_MAC_KEY="$(printf '%s\0%s\0mac' "$PRIVATE_TOKEN" "$context" | sha256sum | awk '{print $1}')"
          tar -C "$RUNNER_TEMP" -cf - tlc-meta | gzip -1 | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -salt -pass env:LAS_CHECKPOINT_SECRET -out "$RUNNER_TEMP/checkpoint.tar.gz.enc"
          openssl dgst -sha256 -mac HMAC -macopt "hexkey:$LAS_CHECKPOINT_MAC_KEY" "$RUNNER_TEMP/checkpoint.tar.gz.enc" | awk '{print $NF}' >"$RUNNER_TEMP/checkpoint.tar.gz.enc.hmac"
          test -s "$RUNNER_TEMP/checkpoint.tar.gz.enc"; test -s "$RUNNER_TEMP/checkpoint.tar.gz.enc.hmac"
          echo "LAS_CANDIDATE3_RESUME_CHECKPOINT_BYTES=$(stat -c '%s' "$RUNNER_TEMP/checkpoint.tar.gz.enc")"
          unset PRIVATE_TOKEN LAS_CHECKPOINT_SECRET LAS_CHECKPOINT_MAC_KEY context java_fp nproc_fp

      - name: Upload authenticated encrypted checkpoint
        if: steps.tlc.outputs.status == 'slice'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate3-resume-state-${{ inputs.index }}-${{ inputs.segment }}
          path: |
            ${{ runner.temp }}/checkpoint.tar.gz.enc
            ${{ runner.temp }}/checkpoint.tar.gz.enc.hmac
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Dispatch next exact slice
        if: steps.tlc.outputs.status == 'slice'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          next="$((SEGMENT + 1))"; artifact="candidate3-resume-state-${TARGET_INDEX}-${SEGMENT}"
          ref_json="$RUNNER_TEMP/continuation-ref.json"
          curl --proto '=https' --tlsv1.2 --fail-with-body -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/$CONTINUATION_REF" >"$ref_json"
          test "$(python3 - "$ref_json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1],encoding='utf-8'))['object']['sha'])
          PY
          )" = "$GITHUB_SHA"
          rm -f "$ref_json"
          payload="$(python3 - "$CONTINUATION_REF" "$TARGET_INDEX" "$next" "$GITHUB_RUN_ID" "$artifact" <<'PY'
          import json,sys
          print(json.dumps({'ref':sys.argv[1],'inputs':{'index':sys.argv[2],'segment':sys.argv[3],'resume_run_id':sys.argv[4],'resume_artifact':sys.argv[5]}}))
          PY
          )"
          curl --proto '=https' --tlsv1.2 --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$DISPATCH_WORKFLOW/dispatches" -d "$payload"
          echo "LAS_CANDIDATE3_RESUME_NEXT_SEGMENT=$next"; echo "LAS_CANDIDATE3_RESUME_DISPATCH=PASS"

      - name: Write terminal public-safe attestation
        if: steps.tlc.outputs.status == 'pass'
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/candidate3-terminal-attestation.txt"
          printf 'schema=candidate3-resumable-terminal-v1\nrunner=%s\nproducer_run=%s\noriginal_run=%s\nsnapshot=%s\ntree=%s\nverifier=%s\nmap=%s\nindex=%s\nprofile=%s\nsegment=%s\nmode=%s\nresult=PASS\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$ORIGINAL_RUN_ID" "$EXPECTED_PRIVATE_SNAPSHOT_PROOF" "$EXPECTED_PRIVATE_TREE_PROOF" "$EXPECTED_VERIFIER_BLOB" \
            "$EXPECTED_TLC_MAP_SHA256" "$TARGET_INDEX" "$PROFILE_BINDING_SHA256" "$SEGMENT" "$MODE" >"$out"
          test -s "$out"
          echo "LAS_CANDIDATE3_RESUME_TERMINAL_SHA256=$(sha256sum "$out" | awk '{print $1}')"
          echo "LAS_CANDIDATE3_RESUME_TERMINAL=PASS"

      - name: Upload terminal public-safe attestation
        if: steps.tlc.outputs.status == 'pass'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate3-resume-terminal-${{ inputs.index }}-${{ inputs.segment }}
          path: ${{ runner.temp }}/candidate3-terminal-attestation.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

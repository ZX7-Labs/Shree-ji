name: Opaque current-lineage retired reclaim anchor diagnostic 20261017

on:
  push:
    branches:
      - "verify/reconciled-baseline-repair-v3-bd95-20261017"
    paths:
      - ".github/workflows/opaque-retired-reclaim-anchor-diagnostic-20261017.yml"

permissions:
  contents: read

env:
  BASE_REF_HASH: 060aa23045ded14f2e9984282456adce3cd5fa94bd92f21f4eeacae5d41abff2
  BASE_SNAPSHOT_PROOF: bd4d73399dc34da2586900c270f6b33f2a1049e934472301f5546ad9973cc49e
  EFFECT_REF_HASH: 57902b32c7dba883a89cd5a6e47dea395ab8a06b111c3dcdcd0487d67f010f58
  EFFECT_SNAPSHOT_PROOF: 31cc9ba5b1d624a59d0bffb3ec563073178973d1d57aede5d876c428cabade96
  M1_BLOB: bb4f6e5c803b7c64ea27e605659cf998fc942cc2
  M2_BLOB: 6fb90f15a1194d596f420ebee9f0ed3e4ae2b112
  M3_BLOB: 67746f8a4776b872b3878f6861eb3bb7658a9fbd
  M4_BLOB: 13820e643e7d76cd087293429f6856183f4d9b07
  M5_BLOB: ace99b29dcf1ab6041d602247158f07ab13d41eb
  COMPLETE_BLOB: a35184cb70d931c34194e96192b208b8484b7ec9
  OWNER_BLOB: 507c32cf7cebfa15b8ae77351ee74b4fed4c2782
  CURRENT_RECLAIM_BLOB: ec01cef22533b33e3be9a8d07a65569e1bf8a14b
  RECLAIM_SOURCE_BLOB: 82631c7e5fe87e7bb08baea527cc585e3537b486

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Reconstruct through owner and identify exact current-lineage reclaim anchor
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY" && test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"; echo "::add-mask::$PRIVATE_TOKEN"
          root="$RUNNER_TEMP/private"; mkdir "$root"; cd "$root"; git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"; echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/refs"; git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          base_ref=; base_sha=; effect_ref=; effect_sha=
          while read -r sha ref; do
            h="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$h" = "$BASE_REF_HASH" ]]; then test -z "$base_ref"; base_ref="$ref"; base_sha="$sha"; fi
            if [[ "$h" = "$EFFECT_REF_HASH" ]]; then test -z "$effect_ref"; effect_ref="$ref"; effect_sha="$sha"; fi
          done <"$refs"
          rm -f "$refs"
          test -n "$base_ref" && test -n "$effect_ref" && test -n "$base_sha" && test -n "$effect_sha"
          test "$(printf '%s' "$base_sha" | sha256sum | awk '{print $1}')" = "$BASE_SNAPSHOT_PROOF"
          test "$(printf '%s' "$effect_sha" | sha256sum | awk '{print $1}')" = "$EFFECT_SNAPSHOT_PROOF"
          echo "::add-mask::$base_ref"; echo "::add-mask::$effect_ref"; echo "::add-mask::$base_sha"; echo "::add-mask::$effect_sha"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=384 origin "$base_ref" "$effect_ref"
          git checkout -q -B verify-reclaim-anchor "$base_sha"
          for pair in \
            "$M1_BLOB:m1.py" "$M2_BLOB:m2.py" "$M3_BLOB:m3.py" "$M4_BLOB:m4.py" "$M5_BLOB:m5.py" \
            "$COMPLETE_BLOB:complete.py" "$OWNER_BLOB:owner.py" "$CURRENT_RECLAIM_BLOB:reclaim.py"; do
            blob="${pair%%:*}"; name="${pair##*:}"
            git cat-file blob "$blob" >"$RUNNER_TEMP/$name"
            test "$(git hash-object "$RUNNER_TEMP/$name")" = "$blob"
          done
          test "$(git cat-file -t "$RECLAIM_SOURCE_BLOB")" = blob
          echo "LAS_RECLAIM_ANCHOR_RECOVERY=PASS"
          python3 tools/verification/private_reconciled_baseline_repair.py >/dev/null 2>&1
          python3 tools/verification/private_reconciled_baseline_visibility_repair.py >/dev/null 2>&1
          python3 tools/verification/private_reconciled_baseline_clippy_contract_repair.py >/dev/null 2>&1
          python3 "$RUNNER_TEMP/m1.py" >/dev/null 2>&1
          python3 "$RUNNER_TEMP/m2.py" >/dev/null 2>&1
          python3 "$RUNNER_TEMP/m3.py" >/dev/null 2>&1
          python3 "$RUNNER_TEMP/m4.py" >/dev/null 2>&1
          python3 "$RUNNER_TEMP/m5.py" >/dev/null 2>&1
          python3 "$RUNNER_TEMP/complete.py" >/dev/null 2>&1
          python3 "$RUNNER_TEMP/owner.py" >/dev/null 2>&1
          echo "LAS_RECLAIM_ANCHOR_OWNER_BASE=PASS"
          python3 - "$RUNNER_TEMP/reclaim.py" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          old='''def one(path: str, old: str, new: str) -> None:\n    p = Path(path)\n    text = p.read_text(encoding="utf-8")\n    if text.count(old) != 1:\n        raise SystemExit(f"{path}: current-lineage reclaim anchor mismatch")\n    p.write_text(text.replace(old, new, 1), encoding="utf-8")\n'''
          new='''_stage = 0\ndef one(path: str, old: str, new: str) -> None:\n    global _stage\n    _stage += 1\n    p = Path(path)\n    text = p.read_text(encoding="utf-8")\n    if text.count(old) != 1:\n        raise SystemExit(40 + _stage)\n    p.write_text(text.replace(old, new, 1), encoding="utf-8")\n'''
          if s.count(old) != 1: raise SystemExit('diagnostic patcher shape mismatch')
          p.write_text(s.replace(old,new,1))
          PY
          set +e
          python3 "$RUNNER_TEMP/reclaim.py" >/dev/null 2>&1
          rc=$?
          set -e
          if [[ "$rc" -ne 0 ]]; then echo "LAS_RECLAIM_MATCHED_OWNER_ANCHORS=FAIL_RC_${rc}"; exit "$rc"; fi
          echo "LAS_RECLAIM_MATCHED_OWNER_APPLY=PASS"
          test "$(git hash-object src/effect_fabric/root_supervisor_linux_production_runtime/facade/retired_archive_reclaim.rs)" = "$RECLAIM_SOURCE_BLOB"
          git diff --check
          mapfile -t changed < <(git status --porcelain=v1 --untracked-files=all | sed 's/^...//' | LC_ALL=C sort)
          expected=(
            src/effect_fabric/root_supervisor_linux_production_runtime/facade.rs
            src/effect_fabric/root_supervisor_linux_production_runtime/facade/retired_archive.rs
            src/effect_fabric/root_supervisor_linux_production_runtime/facade/retired_archive_binding.rs
            src/effect_fabric/root_supervisor_linux_production_runtime/facade/retired_archive_receipt_binding.rs
            src/effect_fabric/root_supervisor_linux_production_runtime/facade/retired_archive_reclaim.rs
          )
          printf '%s\n' "${changed[@]}" >"$RUNNER_TEMP/changed"
          printf '%s\n' "${expected[@]}" | LC_ALL=C sort >"$RUNNER_TEMP/expected"
          cmp --silent "$RUNNER_TEMP/expected" "$RUNNER_TEMP/changed"
          echo "LAS_RECLAIM_MATCHED_OWNER_ANCHORS=PASS"

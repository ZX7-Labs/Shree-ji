name: Private assurance TLC39 opaque diagnostic (retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject superseded TLC39 diagnostic
        shell: bash
        run: |
          set -euo pipefail
          echo "LAS_ASSURANCE_TLC39_DIAGNOSTIC=RETIRED"
          echo "This diagnostic is bound to a superseded private snapshot. TLC39 assurance now runs only through the frozen repaired-202 continuation runner."
          exit 1

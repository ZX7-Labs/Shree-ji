name: Exact private TLC two-case native smoke (quarantine only)

on:
  push:
    branches:
      - quarantine/tlc-expected-negative-audit-repair-20261031
    paths:
      - .github/workflows/quarantine-two-case-tlc-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_BRANCH_PROOF: 0a9d756901b297941bbaf17509c374fcbbbf6e38862e10a80ec265fc97ce52df
      EXPECTED_PRIVATE_COMMIT_PROOF: 1adce8a16b15daa5022b11634ffccb7c21785e6ccb449a6055acf2e2d5514e43
      EXPECTED_PRIVATE_TEST_RUNNER_SHA256: 529de5130fd7f8cb9331fb535e8c762ec75afae6143fbe879c3917bd926495df
    steps:
      - name: Read exact public source without retaining credentials
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Recover exact private commit and pinned TLC jar via existing public trust code
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_READ_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          workflow=.github/workflows/assurance-all-tlc-audit-022.yml
          out="$(mktemp -d "$RUNNER_TEMP/las-smoke-setup.XXXXXXXX")"
          chmod 700 "$out"
          ruby -ryaml - "$workflow" "$out" <<'RUBY'
          workflow, out = ARGV
          steps = YAML.safe_load_file(workflow, aliases: false).fetch('jobs').fetch('tlc-full-audit').fetch('steps')
          raise 'setup sequence changed' unless steps.length == 3
          steps[0..1].each_with_index do |step, i|
            code = step.fetch('run')
            raise 'empty step code' unless code.is_a?(String) && !code.strip.empty?
            File.write(File.join(out, "setup#{i}.sh"), code)
          end
          RUBY
          bash -n "$out/setup0.sh"
          bash -n "$out/setup1.sh"
          bash "$out/setup0.sh"
          unset PRIVATE_REPOSITORY PRIVATE_READ_TOKEN
          bash "$out/setup1.sh"
          rm -rf -- "$out"
          echo 'LAS_NATIVE_TLC_SMOKE=SOURCE_AND_TOOL_PINNED'
      - name: Execute one expected-negative and one complete-positive native TLC profile
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: -Xmx5g
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/private-source"
          cd "$root"
          logs="$(mktemp -d "$RUNNER_TEMP/tlc-two-case.XXXXXXXX")"
          chmod 700 "$logs"
          trap 'rm -rf -- "$logs"' EXIT
          if ! python3 -I -B - "$root" "$logs" <<'PY'
          import contextlib, io, os, pathlib, sys
          root, logs = map(pathlib.Path, sys.argv[1:3])
          source = (root / 'tools/verify_codespaces_all.sh').read_text(encoding='utf-8')
          marker = """if ! python3 - "$ROOT" > "$TLC_MAP.pending" <<'PY'\n"""
          closing = "\nPY\nthen"
          if source.count(marker) != 1:
              raise SystemExit(2)
          tail = source.split(marker, 1)[1]
          if tail.count(closing) != 1:
              raise SystemExit(2)
          capture = io.StringIO()
          sys.argv = ['canonical', str(root)]
          with contextlib.redirect_stdout(capture):
              exec(compile(tail.split(closing, 1)[0], '<exact-canonical-map>', 'exec'),
                   {'__name__': '__main__'})
          rows = [line.split('\t', 3) for line in capture.getvalue().splitlines()]
          if len(rows) != 207 or any(len(row) != 4 for row in rows):
              raise SystemExit(2)
          negatives = [row for row in rows if row[3] and row[0].endswith('Negative.cfg')]
          positives = [row for row in rows if not row[3] and not row[0].endswith('Negative.cfg')]
          if len(negatives) != 12 or len(positives) != 195:
              raise SystemExit(2)
          for row in rows:
              for name in row[:2]:
                  p = pathlib.PurePosixPath(name)
                  if p.is_absolute() or not name.startswith('spec/') or '..' in p.parts:
                      raise SystemExit(2)
                  if not (root / name).is_file() or (root / name).is_symlink():
                      raise SystemExit(2)
          # Select only two *historically scoped* native-smoke positive candidates,
          # already represented by non-sensitive path digests in the pinned public
          # two-profile research workflow. A prior 1.7.2 run is NOT 1.7.4 proof.
          # Never print profile paths/digests to the public runner log.
          import hashlib, re
          public_source = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / '.github/workflows/assurance-tlc-two-profile-021.yml'
          old_controller = public_source.read_text(encoding='utf-8')
          if old_controller.count('wanted=(') != 1:
              raise SystemExit(2)
          old_wanted_block = old_controller.split('wanted=(', 1)[1].split(')', 1)[0]
          old_wanted = re.findall(r"'([0-9a-f]{64})'", old_wanted_block)
          if len(old_wanted) != 2 or len(set(old_wanted)) != 2:
              raise SystemExit(2)
          previously_scoped = [row for row in positives
                               if hashlib.sha256(row[0].encode()).hexdigest() in old_wanted]
          if len(previously_scoped) != 2:
              raise SystemExit(2)
          sizekey = lambda row: (os.stat(root / row[1]).st_size, row[0])
          choices = [min(negatives, key=sizekey), min(previously_scoped, key=sizekey)]
          output = logs / 'chosen.tsv'
          fd = os.open(output, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(fd, 'w', encoding='utf-8') as f:
              for row in choices:
                  f.write('\t'.join(row) + '\n')
          print('LAS_NATIVE_TLC_SMOKE=EXACT_TWO_CASE_PLAN')
          PY
          then
            echo 'LAS_NATIVE_TLC_SMOKE=FAIL:PRIVATE_CASE_PLAN'; exit 1
          fi
          archive="$RUNNER_TEMP/las-tlc-tools.jar"
          idx=0
          while IFS=$'\t' read -r cfg model deadlock expectation; do
            if [[ -z "$cfg" || -z "$model" || ! "$deadlock" =~ ^[01]$ ]]; then
              echo 'LAS_NATIVE_TLC_SMOKE=FAIL:INVALID_CASE'; exit 1
            fi
            if ! git -c core.fsmonitor=false ls-files --error-unmatch "$cfg" "$model" >/dev/null 2>&1; then
              echo 'LAS_NATIVE_TLC_SMOKE=FAIL:UNTRACKED'; exit 1
            fi
            args=(-workers auto -lncheck final -fp 0)
            if [[ "$deadlock" == "1" ]]; then args+=(-deadlock); fi
            args+=(-config "$(basename "$cfg")" "$(basename "$model")")
            if (cd "$(dirname "$cfg")" && timeout --signal=TERM --kill-after=15s 4m \
                 java -XX:+UseParallelGC -jar "$archive" "${args[@]}") > "$logs/tlc_$idx" 2>&1; then
              java_rc=0
            else
              java_rc=$?
            fi
            if (( java_rc == 124 || java_rc == 137 || java_rc == 143 )); then
              echo 'LAS_NATIVE_TLC_SMOKE=INCOMPLETE:RESOURCE_BOUND'; exit 1
            fi
            if ! python3 -I -B tools/verification/canonical_tlc_result_evidence.py \
                "$logs/tlc_$idx" "$java_rc" 0 --expectation "$expectation" \
                > "$logs/result_$idx" 2>&1; then
              echo 'LAS_NATIVE_TLC_SMOKE=FAIL:MODEL_OR_RECEIPT'; exit 1
            fi
            if (( idx == 0 )); then
              [[ -n "$expectation" ]] || { echo 'LAS_NATIVE_TLC_SMOKE=FAIL:NEGATIVE_MISSING'; exit 1; }
              echo 'LAS_NATIVE_TLC_SMOKE=EXPECTED_NEGATIVE_MATCHED'
            else
              [[ -z "$expectation" ]] || { echo 'LAS_NATIVE_TLC_SMOKE=FAIL:POSITIVE_MISMATCH'; exit 1; }
              echo 'LAS_NATIVE_TLC_SMOKE=POSITIVE_COMPLETE'
            fi
            idx=$((idx + 1))
          done < "$logs/chosen.tsv"
          if (( idx != 2 )); then
            echo 'LAS_NATIVE_TLC_SMOKE=FAIL:NONVACUITY'; exit 1
          fi
          if [[ -n "$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all)" ]]; then
            echo 'LAS_NATIVE_TLC_SMOKE=FAIL:SOURCE_DRIFT'; exit 1
          fi
          echo 'LAS_NATIVE_TLC_SMOKE=SCOPED_TWO_CASE_PASS_NOT_RELEASE_APPROVAL'

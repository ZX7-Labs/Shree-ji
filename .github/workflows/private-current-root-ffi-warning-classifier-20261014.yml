name: Private current Root FFI cfg overlay proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-current-root-ffi-warning-classifier-20261014.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REF_HASH: 28a52175bfc55f4f8b2b0f4312cd2616a65a7082555149f4382746e2254e1b26
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 10b93b9415f901b8023e844fb7fb497a80da7606755c9c8b9a407378ae272276

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Install exact Rust and Ada build toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null
          ALR_ZIP="$RUNNER_TEMP/alr.zip"
          ALR_PREFIX="$RUNNER_TEMP/alr"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "$ALR_ZIP" \
            "https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip" \
            >/dev/null 2>&1
          echo "09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  $ALR_ZIP" \
            | sha256sum --check --strict >/dev/null
          mkdir -p "$ALR_PREFIX"
          unzip -q "$ALR_ZIP" -d "$ALR_PREFIX"
          export PATH="$ALR_PREFIX/bin:$PATH"
          echo "$ALR_PREFIX/bin" >> "$GITHUB_PATH"
          alr -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1 >/dev/null
          ALR_WS="$RUNNER_TEMP/alire-workspace"
          mkdir -p "$ALR_WS"
          (cd "$ALR_WS" && alr -n init --in-place --no-skel --lib las_verify_toolchain >/dev/null)
          GPRBUILD_WRAPPER="$RUNNER_TEMP/gprbuild-via-alire"
          cat > "$GPRBUILD_WRAPPER" <<EOF_GPR
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$ALR_WS"
          exec "$ALR_PREFIX/bin/alr" exec -- gprbuild "\$@"
          EOF_GPR
          chmod 0755 "$GPRBUILD_WRAPPER"
          echo "GPRBUILD=$GPRBUILD_WRAPPER" >> "$GITHUB_ENV"

      - name: Recover exact private snapshot opaquely
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          mkdir target
          cd target
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin > "$refs"
          matched_ref=""
          matched_sha=""
          while read -r candidate_sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
              matched_sha="$candidate_sha"
            fi
          done < "$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          test -n "$matched_sha"
          echo "::add-mask::$matched_ref"
          echo "::add-mask::$matched_sha"
          test "$(printf '%s' "$matched_sha" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$matched_sha"
          git checkout -q --detach "$matched_sha"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "LAS_ROOT_FFI_OVERLAY_SNAPSHOT=PASS"

      - name: Apply exact cfg-only repair ephemerally
        shell: bash
        run: |
          set -euo pipefail
          cd target
          python3 <<'PY'
          from pathlib import Path

          joint = '''    #[cfg(any(
              test,
              all(
                  feature = "root-ffi",
                  feature = "linux-peer-credentials",
                  target_os = "linux"
              )
          ))]'''

          dispatch = Path("src/effect_fabric/dispatch_commit.rs")
          text = dispatch.read_text(encoding="utf-8")

          needle = "impl RootGrantLivenessBinding {\n    fn new("
          if text.count(needle) != 1:
              raise SystemExit("RootGrantLivenessBinding::new anchor mismatch")
          text = text.replace(
              needle,
              "impl RootGrantLivenessBinding {\n" + joint + "\n    fn new(",
              1,
          )

          needle = "\n    fn build(\n"
          if text.count(needle) != 1:
              raise SystemExit("RootDispatchEnvelope::build anchor mismatch")
          text = text.replace(needle, "\n" + joint + "\n    fn build(\n", 1)

          needle = '    #[cfg(feature = "root-ffi")]\n    #[expect('
          if text.count(needle) != 1:
              raise SystemExit("liveness constructor cfg anchor mismatch")
          text = text.replace(needle, joint + "\n    #[expect(", 1)
          dispatch.write_text(text, encoding="utf-8")

          ffi = Path("src/effect_fabric/root_ffi.rs")
          text = ffi.read_text(encoding="utf-8")
          ffi_joint = '''#[cfg(any(
              test,
              all(feature = "linux-peer-credentials", target_os = "linux")
          ))]'''

          replacements = [
              (
                  "#[derive(Debug)]\npub(super) struct AuthenticatedRootBoundary",
                  ffi_joint + "\n#[derive(Debug)]\npub(super) struct AuthenticatedRootBoundary",
              ),
              (
                  "#[derive(Debug)]\nstruct BoundarySeal",
                  ffi_joint + "\n#[derive(Debug)]\nstruct BoundarySeal",
              ),
              (
                  "impl AuthenticatedRootBoundary {",
                  ffi_joint + "\nimpl AuthenticatedRootBoundary {",
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"Root FFI overlay anchor mismatch: {old[:32]}")
              text = text.replace(old, new, 1)
          ffi.write_text(text, encoding="utf-8")
          PY

          cargo +1.98.1 fmt --all
          git diff --check
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "2"
          echo "LAS_ROOT_FFI_CFG_OVERLAY_APPLIED=PASS"

      - name: Prove strict Root FFI check and Clippy
        shell: bash
        run: |
          set -euo pipefail
          cd target
          check_log="$RUNNER_TEMP/root-ffi-overlay-check.private.log"
          clippy_log="$RUNNER_TEMP/root-ffi-overlay-clippy.private.log"
          env RUSTFLAGS=-Dwarnings GPRBUILD="$GPRBUILD" \
            cargo +1.98.1 check --locked --features root-ffi --all-targets \
            >"$check_log" 2>&1
          env RUSTFLAGS=-Dwarnings GPRBUILD="$GPRBUILD" \
            cargo +1.98.1 clippy --locked --features root-ffi --all-targets -- -D warnings \
            >"$clippy_log" 2>&1
          rm -f "$check_log" "$clippy_log"
          echo "LAS_ROOT_FFI_OVERLAY_STRICT_STATIC=PASS"

      - name: Prove Root FFI tests and adapter gates
        shell: bash
        run: |
          set -euo pipefail
          cd target
          test_log="$RUNNER_TEMP/root-ffi-overlay-tests.private.log"
          memory_log="$RUNNER_TEMP/root-ffi-overlay-memory.private.log"
          p95_log="$RUNNER_TEMP/root-ffi-overlay-p95.private.log"
          env RUSTFLAGS=-Dwarnings GPRBUILD="$GPRBUILD" \
            cargo +1.98.1 test --locked --features root-ffi --all-targets -- --test-threads=1 \
            >"$test_log" 2>&1
          env RUSTFLAGS=-Dwarnings GPRBUILD="$GPRBUILD" \
            cargo +1.98.1 test --locked --features root-ffi root_adapter_memory_layout_baseline_is_reported \
            -- --exact --nocapture >"$memory_log" 2>&1
          env RUSTFLAGS=-Dwarnings GPRBUILD="$GPRBUILD" \
            cargo +1.98.1 test --locked --features root-ffi full_root_adapter_p95_is_within_twenty_milliseconds \
            -- --exact --nocapture --test-threads=1 >"$p95_log" 2>&1
          rm -f "$test_log" "$memory_log" "$p95_log"
          echo "LAS_ROOT_FFI_OVERLAY_RUNTIME=PASS"

      - name: Prove Linux joint production cfg remains strict
        shell: bash
        run: |
          set -euo pipefail
          cd target
          check_log="$RUNNER_TEMP/root-ffi-overlay-all-check.private.log"
          clippy_log="$RUNNER_TEMP/root-ffi-overlay-all-clippy.private.log"
          env RUSTFLAGS=-Dwarnings GPRBUILD="$GPRBUILD" \
            cargo +1.98.1 check --locked --all-features --all-targets \
            >"$check_log" 2>&1
          env RUSTFLAGS=-Dwarnings GPRBUILD="$GPRBUILD" \
            cargo +1.98.1 clippy --locked --all-features --all-targets -- -D warnings \
            >"$clippy_log" 2>&1
          rm -f "$check_log" "$clippy_log"
          echo "LAS_ROOT_FFI_OVERLAY_JOINT_PRODUCTION=PASS"
          echo "LAS_ROOT_FFI_CFG_OVERLAY_RESULT=PASS"

name: Private current Root FFI guarded cfg repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-current-root-ffi-warning-classifier-20261014.yml"

permissions:
  contents: read

env:
  TARGET_REF_HASH: 28a52175bfc55f4f8b2b0f4312cd2616a65a7082555149f4382746e2254e1b26
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 10b93b9415f901b8023e844fb7fb497a80da7606755c9c8b9a407378ae272276
  EXPECTED_VERIFIER_BLOB: 62e3e6dc0fad5dddc7fb0a453a3cd681d911e590

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Install exact Rust and Ada build toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null
          ALR_ZIP="$RUNNER_TEMP/alr.zip"
          ALR_PREFIX="$RUNNER_TEMP/alr"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "$ALR_ZIP" \
            "https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip" \
            >/dev/null 2>&1
          echo "09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  $ALR_ZIP" \
            | sha256sum --check --strict >/dev/null
          mkdir -p "$ALR_PREFIX"
          unzip -q "$ALR_ZIP" -d "$ALR_PREFIX"
          export PATH="$ALR_PREFIX/bin:$PATH"
          echo "$ALR_PREFIX/bin" >> "$GITHUB_PATH"
          alr -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1 >/dev/null
          ALR_WS="$RUNNER_TEMP/alire-workspace"
          mkdir -p "$ALR_WS"
          (cd "$ALR_WS" && alr -n init --in-place --no-skel --lib las_verify_toolchain >/dev/null)
          GPRBUILD_WRAPPER="$RUNNER_TEMP/gprbuild-via-alire"
          cat > "$GPRBUILD_WRAPPER" <<EOF_GPR
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$ALR_WS"
          exec "$ALR_PREFIX/bin/alr" exec -- gprbuild "\$@"
          EOF_GPR
          chmod 0755 "$GPRBUILD_WRAPPER"
          echo "GPRBUILD=$GPRBUILD_WRAPPER" >> "$GITHUB_ENV"

      - name: Recover exact private target with guarded write credential
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_WRITE_TOKEN: ${{ secrets.LAS_PRIVATE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_WRITE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_WRITE_TOKEN"

          root="$RUNNER_TEMP/private-target"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_WRITE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"

          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin > "$refs"
          matched_ref=""
          matched_sha=""
          while read -r sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
              matched_sha="$sha"
            fi
          done < "$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          test -n "$matched_sha"
          echo "::add-mask::$matched_ref"
          echo "::add-mask::$matched_sha"
          test "$(printf '%s' "$matched_sha" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"

          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$matched_sha"
          git checkout -q -B repair-target FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$matched_sha"
          test "$(git hash-object tools/verify_codespaces_all.sh)" = "$EXPECTED_VERIFIER_BLOB"
          test -z "$(git status --porcelain --untracked-files=no)"

          printf '%s' "$matched_ref" > "$RUNNER_TEMP/target-ref"
          printf '%s' "$matched_sha" > "$RUNNER_TEMP/target-start-sha"
          printf '%s' "$auth" > "$RUNNER_TEMP/private-auth"
          chmod 600 "$RUNNER_TEMP/target-ref" "$RUNNER_TEMP/target-start-sha" "$RUNNER_TEMP/private-auth"
          echo "LAS_ROOT_FFI_REPAIR_RECOVERY=PASS"

      - name: Apply exact proven cfg repair
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          python3 <<'PY'
          from pathlib import Path

          dispatch_joint = '''    #[cfg(any(
              test,
              all(
                  feature = "root-ffi",
                  feature = "linux-peer-credentials",
                  target_os = "linux"
              )
          ))]'''
          dispatch = Path("src/effect_fabric/dispatch_commit.rs")
          text = dispatch.read_text(encoding="utf-8")
          replacements = [
              ("impl RootGrantLivenessBinding {\n    fn new(", "impl RootGrantLivenessBinding {\n" + dispatch_joint + "\n    fn new("),
              ("\n    fn build(\n", "\n" + dispatch_joint + "\n    fn build(\n"),
              ('    #[cfg(feature = "root-ffi")]\n    #[expect(', dispatch_joint + "\n    #[expect("),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit("dispatch cfg anchor mismatch")
              text = text.replace(old, new, 1)
          dispatch.write_text(text, encoding="utf-8")

          ffi = Path("src/effect_fabric/root_ffi.rs")
          text = ffi.read_text(encoding="utf-8")
          boundary_cfg = '''#[cfg(any(
              test,
              all(feature = "linux-peer-credentials", target_os = "linux")
          ))]'''
          for old, new in [
              ("#[derive(Debug)]\npub(super) struct AuthenticatedRootBoundary", boundary_cfg + "\n#[derive(Debug)]\npub(super) struct AuthenticatedRootBoundary"),
              ("#[derive(Debug)]\nstruct BoundarySeal", boundary_cfg + "\n#[derive(Debug)]\nstruct BoundarySeal"),
              ("impl AuthenticatedRootBoundary {", boundary_cfg + "\nimpl AuthenticatedRootBoundary {"),
          ]:
              if text.count(old) != 1:
                  raise SystemExit("Root boundary cfg anchor mismatch")
              text = text.replace(old, new, 1)

          old_cfg = '    #[cfg(any(test, all(feature = "linux-peer-credentials", target_os = "linux")))]\n'
          joint_cfg = '    #[cfg(all(feature = "linux-peer-credentials", target_os = "linux"))]\n'
          for symbol in ("las_root_install_delegation_parent", "las_root_delegate_channel_grant"):
              old = old_cfg + f"    fn {symbol}("
              new = joint_cfg + f"    fn {symbol}("
              if text.count(old) != 1:
                  raise SystemExit(f"delegation cfg anchor mismatch: {symbol}")
              text = text.replace(old, new, 1)
          ffi.write_text(text, encoding="utf-8")
          PY

          cargo +1.98.1 fmt --all
          cargo +1.98.1 fmt --all -- --check
          git diff --check
          test "$(git diff --name-only | sort)" = $'src/effect_fabric/dispatch_commit.rs\nsrc/effect_fabric/root_ffi.rs'
          echo "LAS_ROOT_FFI_REPAIR_PATCH=PASS"

      - name: Reprove exact repair slice before write
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          root_check="$RUNNER_TEMP/root-check.private.log"
          root_clippy="$RUNNER_TEMP/root-clippy.private.log"
          root_tests="$RUNNER_TEMP/root-tests.private.log"
          memory="$RUNNER_TEMP/root-memory.private.log"
          p95="$RUNNER_TEMP/root-p95.private.log"
          linux_check="$RUNNER_TEMP/linux-check.private.log"
          all_check="$RUNNER_TEMP/all-check.private.log"
          all_clippy="$RUNNER_TEMP/all-clippy.private.log"
          all_tests="$RUNNER_TEMP/all-tests.private.log"
          all_release="$RUNNER_TEMP/all-release.private.log"

          env RUSTFLAGS=-Dwarnings GPRBUILD="$GPRBUILD" \
            cargo +1.98.1 check --locked --features root-ffi --all-targets >"$root_check" 2>&1
          GPRBUILD="$GPRBUILD" \
            cargo +1.98.1 clippy --locked --features root-ffi --all-targets -- -D warnings >"$root_clippy" 2>&1
          env RUSTFLAGS=-Dwarnings GPRBUILD="$GPRBUILD" \
            cargo +1.98.1 test --locked --features root-ffi --all-targets -- --test-threads=1 >"$root_tests" 2>&1
          env RUSTFLAGS=-Dwarnings GPRBUILD="$GPRBUILD" \
            cargo +1.98.1 test --locked --features root-ffi \
            effect_fabric::root_ffi_benchmark::root_adapter_memory_layout_baseline_is_reported \
            -- --exact --test-threads=1 --nocapture >"$memory" 2>&1
          env RUSTFLAGS=-Dwarnings GPRBUILD="$GPRBUILD" \
            cargo +1.98.1 test --locked --release --features root-ffi \
            effect_fabric::root_ffi_benchmark::full_root_adapter_p95_is_within_twenty_milliseconds \
            -- --exact --test-threads=1 --nocapture >"$p95" 2>&1
          env RUSTFLAGS=-Dwarnings cargo +1.98.1 check --locked --features linux-peer-credentials --all-targets >"$linux_check" 2>&1
          env RUSTFLAGS=-Dwarnings GPRBUILD="$GPRBUILD" \
            cargo +1.98.1 check --locked --all-features --all-targets >"$all_check" 2>&1
          GPRBUILD="$GPRBUILD" \
            cargo +1.98.1 clippy --locked --all-features --all-targets -- -D warnings >"$all_clippy" 2>&1
          env RUSTFLAGS=-Dwarnings GPRBUILD="$GPRBUILD" \
            cargo +1.98.1 test --locked --all-features --all-targets -- --test-threads=1 >"$all_tests" 2>&1
          env RUSTFLAGS=-Dwarnings GPRBUILD="$GPRBUILD" \
            cargo +1.98.1 test --locked --release --all-features --lib -- --test-threads=1 >"$all_release" 2>&1

          rm -f "$root_check" "$root_clippy" "$root_tests" "$memory" "$p95" \
            "$linux_check" "$all_check" "$all_clippy" "$all_tests" "$all_release"
          cargo +1.98.1 fmt --all -- --check
          git diff --check
          test "$(git diff --name-only | sort)" = $'src/effect_fabric/dispatch_commit.rs\nsrc/effect_fabric/root_ffi.rs'
          test "$(git hash-object tools/verify_codespaces_all.sh)" = "$EXPECTED_VERIFIER_BLOB"
          echo "LAS_ROOT_FFI_REPAIR_REPROOF=PASS"

      - name: Commit once and fast-forward exact private ref
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          target_ref="$(cat "$RUNNER_TEMP/target-ref")"
          start_sha="$(cat "$RUNNER_TEMP/target-start-sha")"
          auth="$(cat "$RUNNER_TEMP/private-auth")"
          remote_sha="$(git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote origin "$target_ref" | awk '{print $1}')"
          echo "::add-mask::$remote_sha"
          test "$remote_sha" = "$start_sha"
          test "$(git rev-parse HEAD)" = "$start_sha"

          git add src/effect_fabric/dispatch_commit.rs src/effect_fabric/root_ffi.rs
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = $'src/effect_fabric/dispatch_commit.rs\nsrc/effect_fabric/root_ffi.rs'
          test -z "$(git diff --name-only)"

          git config user.name "LAS Verification Integrator"
          git config user.email "las-verification@users.noreply.github.com"
          git commit -q -m "Align Root FFI cfg ownership"
          new_sha="$(git rev-parse HEAD)"
          echo "::add-mask::$new_sha"
          test "$(git rev-parse HEAD^)" = "$start_sha"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | sort)" = $'src/effect_fabric/dispatch_commit.rs\nsrc/effect_fabric/root_ffi.rs'
          test "$(git hash-object tools/verify_codespaces_all.sh)" = "$EXPECTED_VERIFIER_BLOB"

          git -c http.extraHeader="AUTHORIZATION: basic $auth" push -q origin HEAD:"$target_ref"
          published_sha="$(git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote origin "$target_ref" | awk '{print $1}')"
          echo "::add-mask::$published_sha"
          test "$published_sha" = "$new_sha"
          proof="$(printf '%s' "$new_sha" | sha256sum | awk '{print $1}')"
          rm -f "$RUNNER_TEMP/private-auth" "$RUNNER_TEMP/target-ref" "$RUNNER_TEMP/target-start-sha"
          echo "LAS_ROOT_FFI_REPAIR_RESULT=PASS"
          echo "LAS_ROOT_FFI_REPAIR_COMMIT_PROOF=$proof"

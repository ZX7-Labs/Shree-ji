name: Private current Root FFI post-overlay classifier

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-current-root-ffi-warning-classifier-20261014.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REF_HASH: 28a52175bfc55f4f8b2b0f4312cd2616a65a7082555149f4382746e2254e1b26
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 10b93b9415f901b8023e844fb7fb497a80da7606755c9c8b9a407378ae272276

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Install exact Rust and Ada build toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null
          ALR_ZIP="$RUNNER_TEMP/alr.zip"
          ALR_PREFIX="$RUNNER_TEMP/alr"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "$ALR_ZIP" \
            "https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip" \
            >/dev/null 2>&1
          echo "09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  $ALR_ZIP" \
            | sha256sum --check --strict >/dev/null
          mkdir -p "$ALR_PREFIX"
          unzip -q "$ALR_ZIP" -d "$ALR_PREFIX"
          export PATH="$ALR_PREFIX/bin:$PATH"
          echo "$ALR_PREFIX/bin" >> "$GITHUB_PATH"
          alr -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1 >/dev/null
          ALR_WS="$RUNNER_TEMP/alire-workspace"
          mkdir -p "$ALR_WS"
          (cd "$ALR_WS" && alr -n init --in-place --no-skel --lib las_verify_toolchain >/dev/null)
          GPRBUILD_WRAPPER="$RUNNER_TEMP/gprbuild-via-alire"
          cat > "$GPRBUILD_WRAPPER" <<EOF_GPR
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$ALR_WS"
          exec "$ALR_PREFIX/bin/alr" exec -- gprbuild "\$@"
          EOF_GPR
          chmod 0755 "$GPRBUILD_WRAPPER"
          echo "GPRBUILD=$GPRBUILD_WRAPPER" >> "$GITHUB_ENV"

      - name: Recover exact private snapshot opaquely
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          mkdir target
          cd target
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin > "$refs"
          matched_ref=""
          matched_sha=""
          while read -r candidate_sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
              matched_sha="$candidate_sha"
            fi
          done < "$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          test -n "$matched_sha"
          echo "::add-mask::$matched_ref"
          echo "::add-mask::$matched_sha"
          test "$(printf '%s' "$matched_sha" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$matched_sha"
          git checkout -q --detach "$matched_sha"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "LAS_ROOT_FFI_OVERLAY_SNAPSHOT=PASS"

      - name: Apply exact cfg-only repair ephemerally
        shell: bash
        run: |
          set -euo pipefail
          cd target
          python3 <<'PY'
          from pathlib import Path

          joint = '''    #[cfg(any(
              test,
              all(
                  feature = "root-ffi",
                  feature = "linux-peer-credentials",
                  target_os = "linux"
              )
          ))]'''

          dispatch = Path("src/effect_fabric/dispatch_commit.rs")
          text = dispatch.read_text(encoding="utf-8")
          replacements = [
              (
                  "impl RootGrantLivenessBinding {\n    fn new(",
                  "impl RootGrantLivenessBinding {\n" + joint + "\n    fn new(",
              ),
              ("\n    fn build(\n", "\n" + joint + "\n    fn build(\n"),
              (
                  '    #[cfg(feature = "root-ffi")]\n    #[expect(',
                  joint + "\n    #[expect(",
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"dispatch overlay anchor mismatch: {old[:40]}")
              text = text.replace(old, new, 1)
          dispatch.write_text(text, encoding="utf-8")

          ffi = Path("src/effect_fabric/root_ffi.rs")
          text = ffi.read_text(encoding="utf-8")
          ffi_joint = '''#[cfg(any(
              test,
              all(feature = "linux-peer-credentials", target_os = "linux")
          ))]'''
          replacements = [
              (
                  "#[derive(Debug)]\npub(super) struct AuthenticatedRootBoundary",
                  ffi_joint + "\n#[derive(Debug)]\npub(super) struct AuthenticatedRootBoundary",
              ),
              (
                  "#[derive(Debug)]\nstruct BoundarySeal",
                  ffi_joint + "\n#[derive(Debug)]\nstruct BoundarySeal",
              ),
              (
                  "impl AuthenticatedRootBoundary {",
                  ffi_joint + "\nimpl AuthenticatedRootBoundary {",
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"ffi overlay anchor mismatch: {old[:40]}")
              text = text.replace(old, new, 1)
          ffi.write_text(text, encoding="utf-8")
          PY
          cargo +1.98.1 fmt --all
          git diff --check
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "2"
          echo "LAS_ROOT_FFI_CFG_OVERLAY_APPLIED=PASS"

      - name: Classify post-overlay strict check and Clippy
        shell: bash
        run: |
          set -euo pipefail
          cd target

          classify() {
            label="$1"
            mode="$2"
            json="$RUNNER_TEMP/${label}.jsonl"
            stderr="$RUNNER_TEMP/${label}.stderr"
            set +e
            if [[ "$mode" = "check" ]]; then
              env RUSTFLAGS=-Dwarnings GPRBUILD="$GPRBUILD" \
                cargo +1.98.1 check --locked --features root-ffi --all-targets --message-format=json \
                >"$json" 2>"$stderr"
            else
              env RUSTFLAGS=-Dwarnings GPRBUILD="$GPRBUILD" \
                cargo +1.98.1 clippy --locked --features root-ffi --all-targets --message-format=json -- -D warnings \
                >"$json" 2>"$stderr"
            fi
            rc=$?
            set -e
            echo "LAS_ROOT_FFI_${label}_RC=$rc"
            python3 - "$label" "$json" <<'PY'
          import collections, hashlib, json, sys
          label, path = sys.argv[1], sys.argv[2]
          codes = collections.Counter()
          owners = collections.Counter()
          total = 0
          for raw in open(path, encoding="utf-8", errors="replace"):
              try:
                  obj = json.loads(raw)
              except Exception:
                  continue
              if obj.get("reason") != "compiler-message":
                  continue
              msg = obj.get("message") or {}
              if msg.get("level") != "error":
                  continue
              code = (msg.get("code") or {}).get("code") or "NO_CODE"
              primary = [s for s in (msg.get("spans") or []) if s.get("is_primary")]
              owner = str(primary[0].get("file_name") or "NO_SPAN") if primary else "NO_SPAN"
              codes[code] += 1
              owners[(code, hashlib.sha256(owner.encode()).hexdigest())] += 1
              total += 1
          print(f"LAS_ROOT_FFI_{label}_ERROR_COUNT={total}")
          for code, count in sorted(codes.items()):
              print(f"LAS_ROOT_FFI_{label}_ERROR_CODE={code}:{count}")
          for (code, owner), count in sorted(owners.items()):
              print(f"LAS_ROOT_FFI_{label}_OWNER={code}:{owner}:{count}")
          PY
            rm -f "$json" "$stderr"
          }

          classify OVERLAY_CHECK check
          classify OVERLAY_CLIPPY clippy
          test -z "$(git status --porcelain --untracked-files=no | grep -v '^ M src/effect_fabric/dispatch_commit.rs$' | grep -v '^ M src/effect_fabric/root_ffi.rs$' || true)"
          echo "LAS_ROOT_FFI_POST_OVERLAY_CLASSIFICATION=PASS"

name: Private TLC94 semantic differential (retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject obsolete TLC94 differential
        shell: bash
        run: |
          set -euo pipefail
          echo "LAS_TLC94_DIFF=RETIRED"
          echo "This differential is bound to historical 129-profile base/candidate proofs and is not part of the repaired current 202-profile closure."
          exit 1

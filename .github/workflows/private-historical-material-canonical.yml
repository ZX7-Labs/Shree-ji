name: Private historical material canonical exact

on:
  push:
    branches: [main]
    paths:
      - "RUN_HISTORICAL_MATERIAL_CANONICAL"

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject historical candidate execution on current control plane
        shell: bash
        run: |
          set -euo pipefail
          echo "LAS_HISTORICAL_MATERIAL_CANONICAL=RETIRED"
          echo "The prior executable workflow remains recoverable from Git history; current main must not spend assurance compute on a superseded private candidate."
          exit 1

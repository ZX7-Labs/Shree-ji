name: Exact private SPARK Root formal proof (quarantine only)

on:
  push:
    branches:
      - quarantine/assurance-scoped-native-bridge-20261031
    paths:
      - .github/workflows/assurance-root-spark-proof-020.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fixed-private-root-spark-proof-020
  cancel-in-progress: false

jobs:
  root-spark-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # Only non-sensitive one-way proofs appear in the PUBLIC shell.
      TARGET_BRANCH_PROOF: 0a9d756901b297941bbaf17509c374fcbbbf6e38862e10a80ec265fc97ce52df
      EXPECTED_PRIVATE_COMMIT_PROOF: 1adce8a16b15daa5022b11634ffccb7c21785e6ccb449a6055acf2e2d5514e43
      EXPECTED_PRIVATE_TEST_RUNNER_SHA256: 529de5130fd7f8cb9331fb535e8c762ec75afae6143fbe879c3917bd926495df
    steps:
      - name: Recover one privately pinned source revision
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_READ_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$PRIVATE_REPOSITORY" || -z "$PRIVATE_READ_TOKEN" ]]; then
            echo 'LAS_BRIDGE=FAIL:ACCESS'; exit 1
          fi
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_READ_TOKEN"
          private="$RUNNER_TEMP/private-source"
          mkdir -m 700 "$private"
          cd "$private"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          authorization="$(printf 'x-access-token:%s' "$PRIVATE_READ_TOKEN" | base64 -w0)"
          echo "::add-mask::$authorization"
          all_refs="$RUNNER_TEMP/private-heads"
          git -c core.fsmonitor=false -c http.extraHeader="AUTHORIZATION: basic $authorization" \
            ls-remote --heads origin > "$all_refs" 2> "$RUNNER_TEMP/secret-fetch-error"
          match=''
          while read -r _sha candidate; do
            candidate_proof="$(printf '%s' "$candidate" | sha256sum | awk '{print $1}')"
            if [[ "$candidate_proof" == "$TARGET_BRANCH_PROOF" ]]; then
              [[ -z "$match" ]] || { echo 'LAS_BRIDGE=FAIL:AMBIGUOUS_REF'; exit 1; }
              match="$candidate"
            fi
          done < "$all_refs"
          rm -f "$all_refs" "$RUNNER_TEMP/secret-fetch-error"
          [[ -n "$match" ]] || { echo 'LAS_BRIDGE=FAIL:TARGET'; exit 1; }
          echo "::add-mask::$match"
          git -c core.fsmonitor=false -c http.extraHeader="AUTHORIZATION: basic $authorization" \
            fetch -q --depth=1 origin "$match" > /dev/null 2> "$RUNNER_TEMP/secret-fetch-error"
          rm -f "$RUNNER_TEMP/secret-fetch-error"
          unset authorization PRIVATE_READ_TOKEN PRIVATE_REPOSITORY
          git -c core.fsmonitor=false checkout -q --detach FETCH_HEAD
          actual="$(git -c core.fsmonitor=false rev-parse --verify HEAD)"
          echo "::add-mask::$actual"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          if [[ "$proof" != "$EXPECTED_PRIVATE_COMMIT_PROOF" ]]; then
            echo 'LAS_BRIDGE=FAIL:SOURCE_PROOF'; exit 1
          fi
          if [[ -n "$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all)" ]]; then
            echo 'LAS_BRIDGE=FAIL:DIRTY'; exit 1
          fi
          test_runner='tools/verification/run_bridge_native_suite.sh'
          if ! printf '%s  %s\n' "$EXPECTED_PRIVATE_TEST_RUNNER_SHA256" "$test_runner" |
               sha256sum --check --strict >/dev/null 2>&1; then
            echo 'LAS_BRIDGE=FAIL:RUNNER_SOURCE'; exit 1
          fi
          echo "LAS_PRIVATE_SOURCE_PROOF=$proof"
          echo 'LAS_BRIDGE=EXACT_SOURCE_READY'

      - name: Install checksum-pinned Alire and exact GNAT build toolchain
        shell: bash
        run: |
          set -euo pipefail
          logs="$(mktemp -d "$RUNNER_TEMP/las-ada-toolchain.XXXXXXXX")"
          chmod 700 "$logs"
          archive="$logs/alr.zip"
          if ! curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
               --output "$archive" \
               'https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip' >"$logs/download.log" 2>&1; then
            echo 'LAS_ROOT_FFI=FAIL:ALIRE_DOWNLOAD'; exit 1
          fi
          if ! printf '%s  %s\n' '09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7' "$archive" | sha256sum --check --strict >"$logs/hash.log" 2>&1; then
            echo 'LAS_ROOT_FFI=FAIL:ALIRE_HASH'; exit 1
          fi
          mkdir -p "$RUNNER_TEMP/alr"
          if ! unzip -q "$archive" -d "$RUNNER_TEMP/alr" >"$logs/unzip.log" 2>&1; then
            echo 'LAS_ROOT_FFI=FAIL:ALIRE_UNPACK'; exit 1
          fi
          export PATH="$RUNNER_TEMP/alr/bin:$PATH"
          if ! alr -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1 >"$logs/gnat.log" 2>&1; then
            echo 'LAS_ROOT_FFI=FAIL:GNAT_INSTALL'; exit 1
          fi
          workspace="$RUNNER_TEMP/las-root-ffi-alire-ws"
          mkdir -p "$workspace"
          if ! (cd "$workspace" && alr -n init --in-place --no-skel --lib las_root_ffi_native) >"$logs/init.log" 2>&1; then
            echo 'LAS_ROOT_FFI=FAIL:GNAT_INIT'; exit 1
          fi
          if ! (cd "$workspace" && alr exec -- gprbuild --version) >"$logs/version.log" 2>&1; then
            echo 'LAS_ROOT_FFI=FAIL:GNAT_TOOL'; exit 1
          fi
          wrapper="$RUNNER_TEMP/las-gprbuild-via-alire"
          printf '#!/usr/bin/env bash\nset -euo pipefail\ncd "%s"\nexec "%s" exec -- gprbuild "$@"\n' \
            "$workspace" "$RUNNER_TEMP/alr/bin/alr" > "$wrapper"
          chmod 0755 "$wrapper"
          printf 'GPRBUILD=%s\n' "$wrapper" >> "$GITHUB_ENV"
          rm -rf -- "$logs"
          echo 'LAS_ROOT_FFI=PINNED_GNAT_READY'

      - name: Install pinned SPARK Pro prover
        shell: bash
        run: |
          set -euo pipefail
          workspace="$RUNNER_TEMP/las-root-ffi-alire-ws"
          cd "$workspace"
          log="$RUNNER_TEMP/las-spark-toolchain-private.log"
          if ! "$RUNNER_TEMP/alr/bin/alr" -n with gnatprove=16.1.0 > "$log" 2>&1; then
            echo 'LAS_ROOT_SPARK=FAIL:GNATPROVE_INSTALL'; exit 1
          fi
          if ! "$RUNNER_TEMP/alr/bin/alr" exec -- gnatprove --version >> "$log" 2>&1; then
            echo 'LAS_ROOT_SPARK=FAIL:GNATPROVE_VERSION'; exit 1
          fi
          echo 'LAS_ROOT_SPARK=PINNED_PROVER_READY'

      - name: Compile Root and prove 4 exact generic capacity instances
        shell: bash
        run: |
          set -euo pipefail
          private="$RUNNER_TEMP/private-source"
          workspace="$RUNNER_TEMP/las-root-ffi-alire-ws"
          proof_dir="$RUNNER_TEMP/las-spark-proof-instances"
          mkdir -p "$proof_dir/obj"
          log="$RUNNER_TEMP/las-spark-private-proof.log"
          cd "$workspace"
          if ! "$RUNNER_TEMP/alr/bin/alr" exec -- gnatmake -c -gnatc -gnat2022 -gnatf \
               -I"$private/src/root_authority" \
               "$private/src/root_authority/root_authority.adb" > "$log" 2>&1; then
            echo 'LAS_ROOT_SPARK=FAIL:COMPILE_CHECK'; exit 1
          fi
          cat > "$proof_dir/root_authority_proof_instances.ads" <<'EOF'
          pragma SPARK_Mode (On);
          with Root_Authority;
          package Root_Authority_Proof_Instances is
             package Capacity_1   is new Root_Authority (Max_Grants => 1);
             package Capacity_2   is new Root_Authority (Max_Grants => 2);
             package Capacity_16  is new Root_Authority (Max_Grants => 16);
             package Capacity_256 is new Root_Authority (Max_Grants => 256);
          end Root_Authority_Proof_Instances;
          EOF
          cat > "$proof_dir/root_authority_proof.gpr" <<EOF
          project Root_Authority_Proof is
             for Source_Dirs use
               ("$private/src/root_authority", "$proof_dir");
             for Object_Dir use "$proof_dir/obj";
             package Compiler is
                for Default_Switches ("Ada") use ("-gnat2022");
             end Compiler;
          end Root_Authority_Proof;
          EOF
          if ! "$RUNNER_TEMP/alr/bin/alr" exec -- gnatprove \
               -P"$proof_dir/root_authority_proof.gpr" \
               -U --mode=all --level=4 --proof=progressive:all \
               --checks-as-errors=on --proof-warnings=on --report=statistics \
               --warnings=error --pedantic -j2 > "$log" 2>&1; then
            echo 'LAS_ROOT_SPARK=FAIL:PROOF'; exit 1
          fi
          if ! "$RUNNER_TEMP/alr/bin/alr" exec -- gprbuild -p \
               -P"$private/src/root_authority/root_authority_ffi.gpr" \
               -XROOT_FFI_BUILD_DIR="$RUNNER_TEMP/las-root-spark-ffi" > "$log" 2>&1; then
            echo 'LAS_ROOT_SPARK=FAIL:LINK'; exit 1
          fi
          cd "$private"
          if [[ -n "$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all)" ]]; then
            echo 'LAS_ROOT_SPARK=FAIL:SOURCE_DRIFT'; exit 1
          fi
          echo 'LAS_ROOT_SPARK=FOUR_CAPACITY_FORMAL_PROFILE_SCOPED_PASS_NOT_PRODUCTION_ACCEPTANCE'

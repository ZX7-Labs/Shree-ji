name: Root private Rustfmt exact tracked file ordinal diagnostic

on:
  push:
    branches:
      - quarantine/las-root-current-native-20261101
    paths:
      - .github/workflows/quarantine-las-root-format-exact-ordinal-diagnostic-20261101.yml

permissions:
  contents: read

jobs:
  exact-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    env:
      TARGET_BRANCH_PROOF: d31656acc6e595be8918c2984e1c588b94126ebdc2253abb9d09b7f668679fa7
      EXPECTED_PRIVATE_COMMIT_PROOF: 30fa0cae170e92a27e870faeba74ab469e25955c390b4cc391eea85c2b32af6f
      EXPECTED_PRIVATE_RUNNER_BLOB_PROOF: d4df90336770cf5275996ccf750325a091b071a86a708799281845dc0eb5c74f
    steps:
      - name: Recover one privately pinned source revision
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_READ_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$PRIVATE_REPOSITORY" || -z "$PRIVATE_READ_TOKEN" ]]; then
            echo 'LAS_BRIDGE=FAIL:ACCESS'; exit 1
          fi
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_READ_TOKEN"
          private="$RUNNER_TEMP/private-source"
          mkdir -m 700 "$private"
          cd "$private"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          authorization="$(printf 'x-access-token:%s' "$PRIVATE_READ_TOKEN" | base64 -w0)"
          echo "::add-mask::$authorization"
          all_refs="$RUNNER_TEMP/private-heads"
          git -c core.fsmonitor=false -c http.extraHeader="AUTHORIZATION: basic $authorization" \
            ls-remote --heads origin > "$all_refs" 2> "$RUNNER_TEMP/secret-fetch-error"
          match=''
          while read -r _sha candidate; do
            candidate_proof="$(printf '%s' "$candidate" | sha256sum | awk '{print $1}')"
            if [[ "$candidate_proof" == "$TARGET_BRANCH_PROOF" ]]; then
              [[ -z "$match" ]] || { echo 'LAS_BRIDGE=FAIL:AMBIGUOUS_REF'; exit 1; }
              match="$candidate"
            fi
          done < "$all_refs"
          rm -f "$all_refs" "$RUNNER_TEMP/secret-fetch-error"
          [[ -n "$match" ]] || { echo 'LAS_BRIDGE=FAIL:TARGET'; exit 1; }
          echo "::add-mask::$match"
          git -c core.fsmonitor=false -c http.extraHeader="AUTHORIZATION: basic $authorization" \
            fetch -q --depth=1 origin "$match" > /dev/null 2> "$RUNNER_TEMP/secret-fetch-error"
          rm -f "$RUNNER_TEMP/secret-fetch-error"
          unset authorization PRIVATE_READ_TOKEN PRIVATE_REPOSITORY
          git -c core.fsmonitor=false checkout -q --detach FETCH_HEAD
          actual="$(git -c core.fsmonitor=false rev-parse --verify HEAD)"
          echo "::add-mask::$actual"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          if [[ "$proof" != "$EXPECTED_PRIVATE_COMMIT_PROOF" ]]; then
            echo 'LAS_BRIDGE=FAIL:SOURCE_PROOF'; exit 1
          fi
          if [[ -n "$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all)" ]]; then
            echo 'LAS_BRIDGE=FAIL:DIRTY'; exit 1
          fi
          test_runner='tools/verification/run_bridge_native_suite.sh'
          runner_blob="$(git -c core.fsmonitor=false hash-object "$test_runner")"
          runner_proof="$(printf '%s' "$runner_blob" | sha256sum | awk '{print $1}')"
          if [[ "$runner_proof" != "$EXPECTED_PRIVATE_RUNNER_BLOB_PROOF" ]]; then
            echo 'LAS_BRIDGE=FAIL:RUNNER_SOURCE'; exit 1
          fi
          echo "LAS_PRIVATE_SOURCE_PROOF=$proof"
          echo 'LAS_BRIDGE=EXACT_SOURCE_READY'

      - name: Identify exact Rustfmt-only drift by opaque tracked file and line
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-source"
          logs="$(mktemp -d "$RUNNER_TEMP/las-rustfmt.XXXXXXXX")"
          chmod 700 "$logs"
          trap 'rm -rf -- "$logs"' EXIT
          set +e
          cargo +1.98.1 fmt --all -- --check > "$logs/fmt.private" 2>&1
          code=$?
          set -e
          python3 -I -B - "$logs/fmt.private" "$code" "$PWD" <<'PY_FMT'
          import pathlib,re,subprocess,sys
          log=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8',errors='replace')
          code=int(sys.argv[2]);root=pathlib.Path(sys.argv[3]).resolve()
          source=subprocess.check_output(['git','-c','core.fsmonitor=false','ls-files','-z'])
          files=sorted(x.decode('utf-8') for x in source.split(b'\0') if x)
          ids={x:i+1 for i,x in enumerate(files)}
          results=set()
          for path,line in re.findall(r'(?m)^Diff in (.*?):([0-9]+):',log):
              candidate=pathlib.Path(path)
              if not candidate.is_absolute():
                  candidate=root / candidate
              candidate=candidate.resolve(strict=False)
              if not candidate.is_relative_to(root):raise SystemExit(1)
              name=candidate.relative_to(root).as_posix()
              if name not in ids:raise SystemExit(1)
              results.add((ids[name],min(int(line),100000)))
          if code==0 and results:raise SystemExit(1)
          if code!=0 and not results:raise SystemExit(1)
          print('LAS_ROOT_FMT=PASS' if code==0 else 'LAS_ROOT_FMT=DIAGNOSTIC_ONLY_NOT_PASS')
          print('LAS_ROOT_FMT=CHANGED_FILES:'+str(len({i for i,_ in results})))
          for idx,linenumber in sorted(results)[:16]:
              print('LAS_ROOT_FMT=LOCATION:'+str(idx)+':'+str(linenumber))
          PY_FMT
          [[ -z "$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all)" ]] || {
            echo 'LAS_ROOT_FMT=FAIL:SOURCE_DRIFT'; exit 1
          }
          echo 'LAS_ROOT_FMT=SOURCE_NATIVE_DIAG_COMPLETE_NOT_RELEASE'

      - name: Scrub private checkout and temporary diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$RUNNER_TEMP/private-source"
          rm -f -- "$RUNNER_TEMP/private-heads" "$RUNNER_TEMP/secret-fetch-error"
          echo 'LAS_RUST_INTEGRATION=EPHEMERAL_CLEANUP'

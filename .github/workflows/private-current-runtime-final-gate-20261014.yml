name: Private current runtime final gate

on:
  push:
    paths:
      - ".github/workflows/private-current-runtime-final-gate-20261014.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_REF_HASH: d071db074e8d0ca6b51599592e452ac4a4461046531f19dabe48ca8c6c4dcf6c
      EXPECTED_TARGET_PROOF: 10b93b9415f901b8023e844fb7fb497a80da7606755c9c8b9a407378ae272276
    steps:
      - name: Checkout public shell
        uses: actions/checkout@v4

      - name: Recover exact private final snapshot
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY" && test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"; echo "::add-mask::$PRIVATE_TOKEN"
          root="$RUNNER_TEMP/private-runtime-final"; mkdir "$root"; cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin > "$refs"
          target_ref=""; target_sha=""
          while read -r sha ref; do
            h="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$h" == "$TARGET_REF_HASH" ]]; then target_ref="$ref"; target_sha="$sha"; fi
          done < "$refs"
          rm -f "$refs"
          test -n "$target_ref" && test -n "$target_sha"
          echo "::add-mask::$target_ref"; echo "::add-mask::$target_sha"
          test "$(printf '%s' "$target_sha" | sha256sum | awk '{print $1}')" = "$EXPECTED_TARGET_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$target_ref"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$target_sha"
          test -z "$(git status --porcelain)"
          echo "LAS_RUNTIME_FINAL_RECOVERY=PASS"

      - name: Install pinned toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null
          ALR_ZIP="$RUNNER_TEMP/alr.zip"
          ALR_PREFIX="$RUNNER_TEMP/alr"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --output "$ALR_ZIP" \
            "https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip" >/dev/null 2>&1
          echo "09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  $ALR_ZIP" | sha256sum --check --strict >/dev/null
          mkdir -p "$ALR_PREFIX"; unzip -q "$ALR_ZIP" -d "$ALR_PREFIX"
          echo "$ALR_PREFIX/bin" >> "$GITHUB_PATH"
          export PATH="$ALR_PREFIX/bin:$PATH"
          alr -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1 >/dev/null
          ALR_WS="$RUNNER_TEMP/alire-runtime-final"
          mkdir -p "$ALR_WS"
          (cd "$ALR_WS" && alr -n init --in-place --no-skel --lib las_runtime_final >/dev/null)
          cat > "$RUNNER_TEMP/gprbuild-wrapper" <<EOF_GPR
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$ALR_WS"
          exec alr exec -- gprbuild "\$@"
          EOF_GPR
          chmod 0755 "$RUNNER_TEMP/gprbuild-wrapper"
          echo "LAS_RUNTIME_FINAL_TOOLCHAINS=PASS"

      - name: Strict static and compile gates
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-runtime-final"
          export GPRBUILD="$RUNNER_TEMP/gprbuild-wrapper"
          cargo +1.98.1 fmt --all -- --check
          RUSTFLAGS='-D warnings' cargo +1.98.1 check --all-targets --features 'linux-peer-credentials root-ffi'
          cargo +1.98.1 clippy --all-targets --features 'linux-peer-credentials root-ffi' -- -D warnings
          git diff --check
          test -z "$(git status --porcelain)"
          echo "LAS_RUNTIME_FINAL_STATIC=PASS"

      - name: Full all-target verification
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-runtime-final"
          export GPRBUILD="$RUNNER_TEMP/gprbuild-wrapper"
          cargo +1.98.1 test --all-targets --features 'linux-peer-credentials root-ffi'
          cargo +1.98.1 test --release --lib --features 'linux-peer-credentials root-ffi' root_supervisor_linux_runtime::
          cargo +1.98.1 fmt --all -- --check
          git diff --check
          test -z "$(git status --porcelain)"
          echo "LAS_RUNTIME_FINAL_FULL=PASS"

      - name: Recheck immutable exact snapshot
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-runtime-final"
          actual="$(git rev-parse HEAD)"
          echo "::add-mask::$actual"
          test "$(printf '%s' "$actual" | sha256sum | awk '{print $1}')" = "$EXPECTED_TARGET_PROOF"
          test -z "$(git status --porcelain)"
          echo "LAS_RUNTIME_FINAL_EXACT=PASS"

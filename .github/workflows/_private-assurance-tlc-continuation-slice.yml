name: Private assurance resumable TLC slice

on:
  workflow_call:
    inputs:
      index:
        required: true
        type: number
      segment:
        required: true
        type: number
      resume_run_id:
        required: false
        type: string
        default: ""
      resume_artifact:
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject default-branch legacy reusable slice
        shell: bash
        run: |
          set -euo pipefail
          echo "LAS_DEFAULT_BRANCH_LEGACY_REUSABLE_TLC_SLICE=RETIRED"
          echo "Canonical generic computation is bound to the frozen current-202-tlc-continuation-v4-runner reusable workflow blob; callers must not use the default-branch historical 203-profile slice."
          exit 1

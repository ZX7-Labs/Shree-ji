name: Private current-202 TLC28 v5 storage repair slice

on:
  workflow_call:
    inputs:
      index:
        required: true
        type: number
      segment:
        required: true
        type: number
      resume_run_id:
        required: true
        type: string
      resume_artifact:
        required: true
        type: string
      resume_generation:
        required: true
        type: string
    secrets:
      LAS_PRIVATE_REPOSITORY:
        required: true
      LAS_PRIVATE_READ_TOKEN:
        required: true

permissions:
  contents: read
  actions: write

env:
  TARGET_REF_HASH: 28a52175bfc55f4f8b2b0f4312cd2616a65a7082555149f4382746e2254e1b26
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 1b139dc7920e82d5f9bdd2a68c072ad88bc0049d5ef1377380899164da5f93f9
  EXPECTED_PRIVATE_TREE_PROOF: 7fb364587ed7c9f76d8fd9f69cb4a4d58e576a44a1e653d019c8114ccb65353f
  EXPECTED_VERIFIER_BLOB: 62e3e6dc0fad5dddc7fb0a453a3cd681d911e590
  EXPECTED_TLC_PROFILE_COUNT: "202"
  EXPECTED_TLC_MAP_SHA256: da7bb51d531d0e5e5e6994c80be8f254a110cb8181e6121e3a557fdff9428cee
  EXPECTED_TLA_JAR_SHA1: bee4a54f3ee3d4afc347c3240ec2d9e93b075104
  EXPECTED_PROFILE_BINDING_SHA256: 8d281f3bc8b39b1f8ee88d692d7548a137af9194c9cce39acf675374ca36ee65
  EXPECTED_JAVA_FINGERPRINT: 3c5fc3a0a04ae9bdc453367fd84cbb268fa5dd467c674685f1db682c705b0ad4
  TARGET_INDEX: "28"
  TLC_WORKERS: "4"
  CHECKPOINT_SCHEMA: "current-202-periodic-barrier-v5-storage-repair-exp1"
  LEGACY_CHECKPOINT_SCHEMA: "current-202-periodic-barrier-v4"
  LEGACY_RUNNER_REF: "current-202-tlc-continuation-v4-runner"
  LEGACY_RUNNER_SHA: "3d37edb1debc9a4dd32da51ec3164840dbc4b252"
  LEGACY_WRAPPER_PATH: ".github/workflows/private-assurance-slow-tlc-continuation.yml"
  LEGACY_SLICE_PATH: ".github/workflows/_private-assurance-tlc-continuation-slice.yml"
  LINEAGE_RUN_ID: "38889300529"
  LINEAGE_SEGMENT: "13"
  LINEAGE_ARTIFACT: "current-202-v4-state-28-13"
  CONTINUATION_REF: "current-202-tlc28-v5-storage-repair-experiment"
  SLICE_SECONDS: "16800"
  CHECKPOINT_GRACE_SECONDS: "900"
  INITIAL_MIN_FREE_KB: "67108864"
  MIN_FREE_KB: "50331648"
  JAVA_TOOL_OPTIONS: -Xmx5g

jobs:
  slice:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      REQUESTED_INDEX: ${{ inputs.index }}
      SEGMENT: ${{ inputs.segment }}
      RESUME_RUN_ID: ${{ inputs.resume_run_id }}
      RESUME_ARTIFACT: ${{ inputs.resume_artifact }}
      RESUME_GENERATION: ${{ inputs.resume_generation }}
    steps:
      - name: Validate exact v5 continuation request
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$CONTINUATION_REF"
          test "$REQUESTED_INDEX" = "$TARGET_INDEX"
          test "$TLC_WORKERS" -eq 4
          test "$SEGMENT" -ge 14
          test "$SLICE_SECONDS" -eq 16800
          test "$CHECKPOINT_GRACE_SECONDS" -eq 900
          test "$INITIAL_MIN_FREE_KB" -gt "$MIN_FREE_KB"
          test "$MIN_FREE_KB" -eq 50331648
          [[ "$RESUME_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          case "$RESUME_GENERATION" in
            v4)
              test "$SEGMENT" -eq 14
              test "$RESUME_RUN_ID" = "$LINEAGE_RUN_ID"
              test "$RESUME_ARTIFACT" = "$LINEAGE_ARTIFACT"
              ;;
            v5)
              test "$SEGMENT" -ge 15
              test "$RESUME_ARTIFACT" = "current-202-v5-exp1-state-${TARGET_INDEX}-$((SEGMENT - 1))"
              ;;
            *)
              exit 1
              ;;
          esac
          echo "LAS_CURRENT_202_V5_REQUEST=PASS"
          echo "LAS_CURRENT_202_V5_SCHEMA=$CHECKPOINT_SCHEMA"
          echo "LAS_CURRENT_202_V5_WORKERS=$TLC_WORKERS"
          echo "LAS_CURRENT_202_V5_RESUME_GENERATION=$RESUME_GENERATION"

      - name: Reclaim runner storage for exhaustive TLC
        shell: bash
        run: |
          set -euo pipefail
          before_kb="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          echo "LAS_CURRENT_202_V5_FREE_KB_BEFORE=$before_kb"
          for path in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/az /opt/hostedtoolcache/CodeQL; do
            [[ ! -e "$path" ]] || sudo rm -rf "$path"
          done
          sudo apt-get clean
          docker system prune --all --force >/dev/null 2>&1 || true
          after_kb="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          echo "LAS_CURRENT_202_V5_FREE_KB_AFTER=$after_kb"
          test "$after_kb" -ge "$INITIAL_MIN_FREE_KB"

      - name: Recover exact frozen private candidate
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          ROOT="$GITHUB_WORKSPACE/target"
          mkdir "$ROOT"
          cd "$ROOT"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          while read -r sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          echo "::add-mask::$matched_ref"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          actual="$(git rev-parse FETCH_HEAD)"
          echo "::add-mask::$actual"
          test "$(printf '%s' "$actual" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          git checkout -q --detach "$actual"
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_TREE_PROOF"
          test "$(git hash-object tools/verify_codespaces_all.sh)" = "$EXPECTED_VERIFIER_BLOB"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "LAS_CURRENT_202_V5_RECOVERY=PASS"
          unset PRIVATE_TOKEN auth matched_ref actual tree

      - name: Bind exact canonical map and profile 28
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/target"
          cd "$ROOT"
          map_py="$RUNNER_TEMP/tlc-map.py"
          python3 - tools/verify_codespaces_all.sh "$map_py" <<'PY'
          from pathlib import Path
          import sys
          src = Path(sys.argv[1]).read_text(encoding="utf-8")
          mh = 'python3 - "$ROOT" > "$TLC_MAP" <<\'PY\'\n'
          me = '\nPY\n\nrun_tlc_profile() {'
          if src.count(mh) != 1 or src.count(me) != 1:
              raise SystemExit("canonical map anchors not unique")
          start = src.index(mh) + len(mh)
          end = src.index(me, start)
          Path(sys.argv[2]).write_text(src[start:end] + "\n", encoding="utf-8")
          PY
          map="$RUNNER_TEMP/tlc-map.tsv"
          map_err="$RUNNER_TEMP/tlc-map.private.err"
          if ! python3 "$map_py" "$ROOT" >"$map" 2>"$map_err"; then
            echo "LAS_CURRENT_202_V5_MAP_ERROR_SHA256=$(sha256sum "$map_err" | awk '{print $1}')"
            rm -f "$map_err"
            exit 1
          fi
          rm -f "$map_err"
          test "$(wc -l <"$map" | tr -d ' ')" = "$EXPECTED_TLC_PROFILE_COUNT"
          test "$(sha256sum "$map" | awk '{print $1}')" = "$EXPECTED_TLC_MAP_SHA256"
          line="$(sed -n "$((TARGET_INDEX + 1))p" "$map")"
          test -n "$line"
          IFS=$'\t' read -r cfg tla deadlock expectation <<<"$line"
          test -n "$cfg"
          test -n "$tla"
          test -z "$expectation"
          test "$cfg" != "spec/defence_evolution/CandidateAssuranceEvidenceCase.cfg"
          profile_binding="$(printf '%s\0%s\0%s\0%s' "$cfg" "$tla" "$deadlock" "$expectation" | sha256sum | awk '{print $1}')"
          test "$profile_binding" = "$EXPECTED_PROFILE_BINDING_SHA256"
          echo "PROFILE_BINDING_SHA256=$profile_binding" >>"$GITHUB_ENV"
          echo "LAS_CURRENT_202_V5_BINDING=PASS"
          test -z "$(git status --porcelain --untracked-files=no)"
          unset line cfg tla deadlock expectation profile_binding

      - name: Verify legacy v4 producer identity
        if: inputs.resume_generation == 'v4'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          run_json="$RUNNER_TEMP/legacy-run.json"
          artifacts_json="$RUNNER_TEMP/legacy-artifacts.json"
          curl --proto '=https' --tlsv1.2 --fail-with-body -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api/actions/runs/$RESUME_RUN_ID" >"$run_json"
          python3 - "$run_json" "$GITHUB_REPOSITORY" "$LEGACY_RUNNER_REF" "$LEGACY_RUNNER_SHA" "$LEGACY_WRAPPER_PATH" "$LEGACY_SLICE_PATH" <<'PY'
          import json, sys
          path, repository, runner_ref, runner_sha, wrapper_path, slice_path = sys.argv[1:]
          data = json.load(open(path, encoding="utf-8"))
          expected = {
              "status": "completed",
              "conclusion": "success",
              "run_attempt": 1,
              "event": "workflow_dispatch",
              "head_branch": runner_ref,
              "head_sha": runner_sha,
              "path": wrapper_path,
          }
          for key, value in expected.items():
              if data.get(key) != value:
                  raise SystemExit(f"unexpected legacy producer {key}")
          refs = data.get("referenced_workflows") or []
          if len(refs) != 1:
              raise SystemExit("legacy producer reusable workflow binding is not exact")
          ref = refs[0]
          if ref.get("sha") != runner_sha or ref.get("ref") != f"refs/heads/{runner_ref}":
              raise SystemExit("legacy producer reusable workflow revision is not exact")
          if ref.get("path") != f"{repository}/{slice_path}@{runner_sha}":
              raise SystemExit("legacy producer reusable workflow path is not exact")
          PY
          curl --proto '=https' --tlsv1.2 --fail-with-body -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api/actions/runs/$RESUME_RUN_ID/artifacts?per_page=100" >"$artifacts_json"
          python3 - "$artifacts_json" "$RESUME_ARTIFACT" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          name = sys.argv[2]
          matches = [a for a in data.get("artifacts", []) if a.get("name") == name and not a.get("expired")]
          if len(matches) != 1:
              raise SystemExit("legacy source artifact is missing, expired, or ambiguous")
          if int(matches[0].get("size_in_bytes") or 0) < 16_000_000_000:
              raise SystemExit("legacy source artifact is unexpectedly small")
          PY
          rm -f "$run_json" "$artifacts_json"
          echo "LAS_CURRENT_202_V5_LEGACY_PRODUCER=PASS"

      - name: Download prior authenticated encrypted checkpoint
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.resume_artifact }}
          path: ${{ runner.temp }}/resume
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run_id }}

      - name: Authenticate, restore, and reclaim checkpoint transport
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_TOKEN"
          enc="$RUNNER_TEMP/resume/checkpoint.tar.gz.enc"
          mac_file="$RUNNER_TEMP/resume/checkpoint.tar.gz.enc.hmac"
          test -s "$enc"
          test -s "$mac_file"
          java_fp="$(java -version 2>&1 | sha256sum | awk '{print $1}')"
          echo "LAS_CURRENT_202_V5_JAVA_FINGERPRINT=$java_fp"
          test "$java_fp" = "$EXPECTED_JAVA_FINGERPRINT"

          case "$RESUME_GENERATION" in
            v4)
              source_schema="$LEGACY_CHECKPOINT_SCHEMA"
              source_runner="$LEGACY_RUNNER_SHA"
              source_segment="$LINEAGE_SEGMENT"
              ;;
            v5)
              source_schema="$CHECKPOINT_SCHEMA"
              source_runner="$GITHUB_SHA"
              source_segment="$((SEGMENT - 1))"
              ;;
            *)
              exit 1
              ;;
          esac

          export LAS_CHECKPOINT_SECRET LAS_CHECKPOINT_MAC_KEY
          if [[ "$RESUME_GENERATION" = "v4" ]]; then
            context="$(printf '%s\0%s\0%s\0%s\0%s\0%s\0%s\0%s\0%s\0%s' \
              "$source_schema" "$source_runner" "$TLC_WORKERS" "$java_fp" \
              "$EXPECTED_PRIVATE_SNAPSHOT_PROOF" "$EXPECTED_PRIVATE_TREE_PROOF" \
              "$EXPECTED_VERIFIER_BLOB" "$EXPECTED_TLC_MAP_SHA256" "$TARGET_INDEX" \
              "$PROFILE_BINDING_SHA256" | sha256sum | awk '{print $1}')"
          else
            context="$(printf '%s\0%s\0%s\0%s\0%s\0%s\0%s\0%s\0%s\0%s\0%s\0%s\0%s' \
              "$source_schema" "$source_runner" "$TLC_WORKERS" "$java_fp" \
              "$EXPECTED_PRIVATE_SNAPSHOT_PROOF" "$EXPECTED_PRIVATE_TREE_PROOF" \
              "$EXPECTED_VERIFIER_BLOB" "$EXPECTED_TLC_MAP_SHA256" "$TARGET_INDEX" \
              "$PROFILE_BINDING_SHA256" "$LEGACY_RUNNER_SHA" "$LINEAGE_RUN_ID" "$LINEAGE_SEGMENT" | \
              sha256sum | awk '{print $1}')"
          fi
          LAS_CHECKPOINT_SECRET="$(printf '%s\0%s\0enc' "$PRIVATE_TOKEN" "$context" | sha256sum | awk '{print $1}')"
          LAS_CHECKPOINT_MAC_KEY="$(printf '%s\0%s\0mac' "$PRIVATE_TOKEN" "$context" | sha256sum | awk '{print $1}')"
          expected_mac="$(tr -d '[:space:]' <"$mac_file")"
          actual_mac="$(openssl dgst -sha256 -mac HMAC -macopt "hexkey:$LAS_CHECKPOINT_MAC_KEY" "$enc" | awk '{print $NF}')"
          test -n "$expected_mac"
          test "$actual_mac" = "$expected_mac"
          echo "LAS_CURRENT_202_V5_CHECKPOINT_AUTH=PASS"

          list="$RUNNER_TEMP/checkpoint-paths"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 \
            -pass env:LAS_CHECKPOINT_SECRET -in "$enc" | tar -tzf - >"$list"
          python3 - "$list" <<'PY'
          from pathlib import PurePosixPath
          import sys
          for raw in open(sys.argv[1], encoding="utf-8", errors="strict"):
              raw = raw.rstrip("\n")
              if not raw or raw.startswith("/") or "\\" in raw:
                  raise SystemExit("unsafe archive path")
              path = PurePosixPath(raw.rstrip("/"))
              if not path.parts or path.parts[0] != "tlc-meta" or ".." in path.parts:
                  raise SystemExit("unsafe archive path")
          PY
          rm -f "$list"

          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 \
            -pass env:LAS_CHECKPOINT_SECRET -in "$enc" | \
            tar --no-same-owner --no-same-permissions -xzf - -C "$RUNNER_TEMP"

          manifest="$RUNNER_TEMP/tlc-meta/las-resume-manifest.txt"
          test -s "$manifest"
          grep -qx "schema=$source_schema" "$manifest"
          grep -qx "runner=$source_runner" "$manifest"
          grep -qx "workers=$TLC_WORKERS" "$manifest"
          grep -qx "java=$java_fp" "$manifest"
          grep -qx "producer_run=$RESUME_RUN_ID" "$manifest"
          grep -qx "snapshot=$EXPECTED_PRIVATE_SNAPSHOT_PROOF" "$manifest"
          grep -qx "tree=$EXPECTED_PRIVATE_TREE_PROOF" "$manifest"
          grep -qx "verifier=$EXPECTED_VERIFIER_BLOB" "$manifest"
          grep -qx "map=$EXPECTED_TLC_MAP_SHA256" "$manifest"
          grep -qx "index=$TARGET_INDEX" "$manifest"
          grep -qx "profile=$PROFILE_BINDING_SHA256" "$manifest"
          grep -qx "segment=$source_segment" "$manifest"
          if [[ "$RESUME_GENERATION" = "v5" ]]; then
            grep -qx "lineage_runner=$LEGACY_RUNNER_SHA" "$manifest"
            grep -qx "lineage_run=$LINEAGE_RUN_ID" "$manifest"
            grep -qx "lineage_segment=$LINEAGE_SEGMENT" "$manifest"
          fi
          rm -f "$manifest"

          transport_kb="$(du -sk "$RUNNER_TEMP/resume" | awk '{print $1}')"
          free_before_cleanup="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          echo "LAS_CURRENT_202_V5_TRANSPORT_KB=$transport_kb"
          echo "LAS_CURRENT_202_V5_FREE_KB_PRE_CLEANUP=$free_before_cleanup"
          test "$transport_kb" -ge 16000000
          rm -rf "$RUNNER_TEMP/resume"
          test ! -e "$RUNNER_TEMP/resume"
          free_after_cleanup="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          reclaimed_kb="$((free_after_cleanup - free_before_cleanup))"
          echo "LAS_CURRENT_202_V5_FREE_KB_POST_CLEANUP=$free_after_cleanup"
          echo "LAS_CURRENT_202_V5_RECLAIMED_KB=$reclaimed_kb"
          test "$free_after_cleanup" -gt "$free_before_cleanup"
          test "$free_after_cleanup" -gt "$MIN_FREE_KB"
          echo "LAS_CURRENT_202_V5_TRANSPORT_RECLAIM=PASS"

          unset PRIVATE_TOKEN LAS_CHECKPOINT_SECRET LAS_CHECKPOINT_MAC_KEY
          unset context expected_mac actual_mac java_fp source_schema source_runner source_segment
          unset transport_kb free_before_cleanup free_after_cleanup reclaimed_kb

      - name: Run exact canonical TLC slice
        id: tlc
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/target"
          cd "$ROOT"
          TLA_JAR="$RUNNER_TEMP/tla2tools.jar"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --output "$TLA_JAR" \
            "https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar" >/dev/null 2>&1
          echo "$EXPECTED_TLA_JAR_SHA1  $TLA_JAR" | sha1sum --check --strict >/dev/null
          map="$RUNNER_TEMP/tlc-map.tsv"
          test -s "$map"
          test "$(wc -l <"$map" | tr -d ' ')" = "$EXPECTED_TLC_PROFILE_COUNT"
          test "$(sha256sum "$map" | awk '{print $1}')" = "$EXPECTED_TLC_MAP_SHA256"
          line="$(sed -n "$((TARGET_INDEX + 1))p" "$map")"
          IFS=$'\t' read -r cfg tla deadlock expectation <<<"$line"
          test -n "$cfg"; test -n "$tla"; test -z "$expectation"
          test "$(printf '%s\0%s\0%s\0%s' "$cfg" "$tla" "$deadlock" "$expectation" | sha256sum | awk '{print $1}')" = "$PROFILE_BINDING_SHA256"
          cfg_dir="$(dirname "$cfg")"
          cfg_base="$(basename "$cfg")"
          tla_base="$(basename "$tla")"
          log="$RUNNER_TEMP/private-tlc.log"
          meta="$RUNNER_TEMP/tlc-meta"
          mkdir -p "$meta"
          args=(-workers "$TLC_WORKERS" -lncheck final -fp 0 -checkpoint 5 -metadir "$meta")
          mapfile -t recover_dirs < <(find "$meta" -type f -name 'vars.chkpt' -printf '%h\n' | sort -u)
          test "${#recover_dirs[@]}" -eq 1
          recover_dir="${recover_dirs[0]}"
          test -f "$recover_dir/queue.chkpt"
          args+=(-recover "$recover_dir")
          echo "LAS_CURRENT_202_V5_RECOVER_DIR=PASS"
          [[ "$deadlock" != "1" ]] || args+=(-deadlock)
          args+=(-config "$cfg_base" "$tla_base")
          start_free_kb="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          echo "LAS_CURRENT_202_V5_TLC_START_FREE_KB=$start_free_kb"
          test "$start_free_kb" -gt "$MIN_FREE_KB"

          set +e
          (cd "$cfg_dir"; exec java -XX:+UseParallelGC -jar "$TLA_JAR" "${args[@]}") >"$log" 2>&1 &
          tlc_pid=$!
          set -e
          tlc_running() {
            local stat
            stat="$(ps -o stat= -p "$tlc_pid" 2>/dev/null | awk 'NR==1 {print $1}')"
            [[ -n "$stat" && "$stat" != Z* ]]
          }
          started="$(date +%s)"
          deadline="$((started + SLICE_SECONDS))"
          slice_cut=0
          barrier_failed=0
          cut_reason="none"
          while tlc_running; do
            now="$(date +%s)"
            free_kb="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
            if (( now >= deadline || free_kb <= MIN_FREE_KB )); then
              if (( free_kb <= MIN_FREE_KB )); then cut_reason="storage"; else cut_reason="time"; fi
              ends_before="$(grep -cF 'Checkpointing completed at (' "$log" 2>/dev/null || true)"
              target_ends="$((ends_before + 1))"
              grace_deadline="$((now + CHECKPOINT_GRACE_SECONDS))"
              echo "LAS_CURRENT_202_V5_BARRIER_REQUESTED=1"
              echo "LAS_CURRENT_202_V5_BARRIER_REASON=$cut_reason"
              while tlc_running; do
                ends_now="$(grep -cF 'Checkpointing completed at (' "$log" 2>/dev/null || true)"
                if (( ends_now >= target_ends )); then
                  slice_cut=1
                  echo "LAS_CURRENT_202_V5_BARRIER_COMPLETE=1"
                  kill -TERM "$tlc_pid" 2>/dev/null || true
                  term_deadline="$(( $(date +%s) + 30 ))"
                  while tlc_running && (( $(date +%s) < term_deadline )); do sleep 1; done
                  if tlc_running; then kill -KILL "$tlc_pid" 2>/dev/null || true; fi
                  break
                fi
                now="$(date +%s)"
                if (( now >= grace_deadline )); then
                  barrier_failed=1
                  echo "LAS_CURRENT_202_V5_BARRIER_TIMEOUT=1"
                  kill -KILL "$tlc_pid" 2>/dev/null || true
                  break
                fi
                sleep 5
              done
              break
            fi
            sleep 15
          done
          set +e
          wait "$tlc_pid"
          rc=$?
          set -e

          metrics="$(python3 - "$log" <<'PY'
          import re, sys
          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          matches = re.findall(r'([0-9,]+) states generated.*?, ([0-9,]+) distinct states found.*?, ([0-9,]+) states left on queue', text)
          if matches:
              g, d, q = matches[-1]
              print(g.replace(',', ''), d.replace(',', ''), q.replace(',', ''))
          else:
              print('0 0 0')
          PY
          )"
          read -r generated distinct queued <<<"$metrics"
          echo "LAS_CURRENT_202_V5_INDEX=$TARGET_INDEX"
          echo "LAS_CURRENT_202_V5_SEGMENT=$SEGMENT"
          echo "LAS_CURRENT_202_V5_GENERATED=$generated"
          echo "LAS_CURRENT_202_V5_DISTINCT=$distinct"
          echo "LAS_CURRENT_202_V5_QUEUE=$queued"
          echo "LAS_CURRENT_202_V5_RC=$rc"
          echo "LAS_CURRENT_202_V5_CUT_REASON=$cut_reason"
          echo "LAS_CURRENT_202_V5_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
          test -z "$(git status --porcelain --untracked-files=no)"
          severe='Invariant .* is violated|Property .* is violated|Temporal propert(y|ies).*violat|liveness.*violat|Deadlock reached|Parsing or semantic analysis failed|parse error|semantic error|(checkpoint|recover).*(error|fail|exception)|(error|fail|exception).*(checkpoint|recover)|fingerprint.*collision|collision.*fingerprint|OutOfMemoryError|Cannot allocate memory|No space left on device|Disk quota exceeded|Exception in thread|java\.lang\.|java\.io\.|java\.nio\.|TLC threw an unexpected exception|TLC Bug|AssertionError|An error occurred while running TLC'
          if grep -Eiq "$severe" "$log"; then
            rm -f "$log"
            echo "status=fail" >>"$GITHUB_OUTPUT"
            echo "LAS_CURRENT_202_V5_RESULT=FAIL_CLOSED"
            exit 1
          fi
          if (( barrier_failed )); then
            rm -f "$log"
            echo "status=fail" >>"$GITHUB_OUTPUT"
            echo "LAS_CURRENT_202_V5_RESULT=FAIL_BARRIER"
            exit 1
          fi
          if [[ "$rc" -eq 0 ]]; then
            rm -f "$log"
            echo "status=pass" >>"$GITHUB_OUTPUT"
            echo "LAS_CURRENT_202_V5_RESULT=PASS"
            exit 0
          fi
          if (( slice_cut )) && [[ "$rc" -eq 137 || "$rc" -eq 143 ]]; then
            mapfile -t checkpoint_dirs < <(find "$meta" -type f -name 'vars.chkpt' -printf '%h\n' | sort -u)
            test "${#checkpoint_dirs[@]}" -eq 1
            test -f "${checkpoint_dirs[0]}/queue.chkpt"
            rm -f "$log"
            echo "status=slice" >>"$GITHUB_OUTPUT"
            echo "LAS_CURRENT_202_V5_RESULT=SLICE_CHECKPOINT"
            exit 0
          fi
          rm -f "$log"
          echo "status=fail" >>"$GITHUB_OUTPUT"
          echo "LAS_CURRENT_202_V5_RESULT=FAIL"
          exit 1

      - name: Seal authenticated encrypted v5 checkpoint
        if: steps.tlc.outputs.status == 'slice'
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_TOKEN"
          meta="$RUNNER_TEMP/tlc-meta"
          mapfile -t checkpoint_dirs < <(find "$meta" -type f -name 'vars.chkpt' -printf '%h\n' | sort -u)
          test "${#checkpoint_dirs[@]}" -eq 1
          test -f "${checkpoint_dirs[0]}/queue.chkpt"
          test -z "$(find "$meta" ! -type f ! -type d -print -quit)"
          java_fp="$(java -version 2>&1 | sha256sum | awk '{print $1}')"
          test "$java_fp" = "$EXPECTED_JAVA_FINGERPRINT"
          printf 'schema=%s\nrunner=%s\nworkers=%s\njava=%s\nproducer_run=%s\nsnapshot=%s\ntree=%s\nverifier=%s\nmap=%s\nindex=%s\nprofile=%s\nsegment=%s\nlineage_runner=%s\nlineage_run=%s\nlineage_segment=%s\n' \
            "$CHECKPOINT_SCHEMA" "$GITHUB_SHA" "$TLC_WORKERS" "$java_fp" "$GITHUB_RUN_ID" \
            "$EXPECTED_PRIVATE_SNAPSHOT_PROOF" "$EXPECTED_PRIVATE_TREE_PROOF" "$EXPECTED_VERIFIER_BLOB" \
            "$EXPECTED_TLC_MAP_SHA256" "$TARGET_INDEX" "$PROFILE_BINDING_SHA256" "$SEGMENT" \
            "$LEGACY_RUNNER_SHA" "$LINEAGE_RUN_ID" "$LINEAGE_SEGMENT" \
            >"$meta/las-resume-manifest.txt"

          export LAS_CHECKPOINT_SECRET LAS_CHECKPOINT_MAC_KEY
          context="$(printf '%s\0%s\0%s\0%s\0%s\0%s\0%s\0%s\0%s\0%s\0%s\0%s\0%s' \
            "$CHECKPOINT_SCHEMA" "$GITHUB_SHA" "$TLC_WORKERS" "$java_fp" \
            "$EXPECTED_PRIVATE_SNAPSHOT_PROOF" "$EXPECTED_PRIVATE_TREE_PROOF" \
            "$EXPECTED_VERIFIER_BLOB" "$EXPECTED_TLC_MAP_SHA256" "$TARGET_INDEX" \
            "$PROFILE_BINDING_SHA256" "$LEGACY_RUNNER_SHA" "$LINEAGE_RUN_ID" "$LINEAGE_SEGMENT" | \
            sha256sum | awk '{print $1}')"
          LAS_CHECKPOINT_SECRET="$(printf '%s\0%s\0enc' "$PRIVATE_TOKEN" "$context" | sha256sum | awk '{print $1}')"
          LAS_CHECKPOINT_MAC_KEY="$(printf '%s\0%s\0mac' "$PRIVATE_TOKEN" "$context" | sha256sum | awk '{print $1}')"
          tar -C "$RUNNER_TEMP" -cf - tlc-meta | gzip -1 | \
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -salt \
              -pass env:LAS_CHECKPOINT_SECRET -out "$RUNNER_TEMP/checkpoint.tar.gz.enc"
          openssl dgst -sha256 -mac HMAC -macopt "hexkey:$LAS_CHECKPOINT_MAC_KEY" \
            "$RUNNER_TEMP/checkpoint.tar.gz.enc" | awk '{print $NF}' >"$RUNNER_TEMP/checkpoint.tar.gz.enc.hmac"
          test -s "$RUNNER_TEMP/checkpoint.tar.gz.enc"
          test -s "$RUNNER_TEMP/checkpoint.tar.gz.enc.hmac"
          echo "LAS_CURRENT_202_V5_CHECKPOINT_BYTES=$(stat -c '%s' "$RUNNER_TEMP/checkpoint.tar.gz.enc")"
          unset PRIVATE_TOKEN LAS_CHECKPOINT_SECRET LAS_CHECKPOINT_MAC_KEY context java_fp

      - name: Upload authenticated encrypted v5 checkpoint
        if: steps.tlc.outputs.status == 'slice'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-202-v5-exp1-state-${{ inputs.index }}-${{ inputs.segment }}
          path: |
            ${{ runner.temp }}/checkpoint.tar.gz.enc
            ${{ runner.temp }}/checkpoint.tar.gz.enc.hmac
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Dispatch next exact v5 slice
        if: steps.tlc.outputs.status == 'slice'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          next="$((SEGMENT + 1))"
          artifact="current-202-v5-exp1-state-${TARGET_INDEX}-${SEGMENT}"
          ref_json="$RUNNER_TEMP/continuation-ref.json"
          curl --proto '=https' --tlsv1.2 --fail-with-body -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/$CONTINUATION_REF" >"$ref_json"
          continuation_sha="$(python3 - "$ref_json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              print(json.load(handle)["object"]["sha"])
          PY
          )"
          rm -f "$ref_json"
          test "$continuation_sha" = "$GITHUB_SHA"
          payload="$(python3 - "$CONTINUATION_REF" "$TARGET_INDEX" "$next" "$GITHUB_RUN_ID" "$artifact" <<'PY'
          import json, sys
          ref, index, segment, run_id, artifact = sys.argv[1:]
          print(json.dumps({"ref": ref, "inputs": {
              "index": index,
              "segment": segment,
              "resume_run_id": run_id,
              "resume_artifact": artifact,
          }}))
          PY
          )"
          curl --proto '=https' --tlsv1.2 --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/private-assurance-slow-tlc-continuation.yml/dispatches" \
            -d "$payload" >/dev/null
          echo "LAS_CURRENT_202_V5_NEXT_SEGMENT=$next"

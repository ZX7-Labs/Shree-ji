name: Quarantine sensor Linux error-code-only verifier
on:
  push:
    branches: [quarantine/tlc-expected-negative-audit-repair-20261031]
    paths: [.github/workflows/quarantine-sensor-linux-compile-codes.yml]
permissions:
  contents: read
jobs:
  compiler-codes:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      TARGET_BRANCH_PROOF: 68abd16178b43f10ddcb403e178fcb9225e6fb3605cf409708b581cae59a552b
      EXPECTED_PRIVATE_COMMIT_PROOF: 8d520f5e27145c8ccfc82eade256d9cf0cf187e1dee14c39bde722f514a77342
      EXPECTED_PRIVATE_TEST_RUNNER_SHA256: 529de5130fd7f8cb9331fb535e8c762ec75afae6143fbe879c3917bd926495df
    steps:
      - name: Recover one privately pinned source revision
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_READ_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$PRIVATE_REPOSITORY" || -z "$PRIVATE_READ_TOKEN" ]]; then
            echo 'LAS_BRIDGE=FAIL:ACCESS'; exit 1
          fi
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_READ_TOKEN"
          private="$RUNNER_TEMP/private-source"
          mkdir -m 700 "$private"
          cd "$private"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          authorization="$(printf 'x-access-token:%s' "$PRIVATE_READ_TOKEN" | base64 -w0)"
          echo "::add-mask::$authorization"
          all_refs="$RUNNER_TEMP/private-heads"
          git -c core.fsmonitor=false -c http.extraHeader="AUTHORIZATION: basic $authorization" \
            ls-remote --heads origin > "$all_refs" 2> "$RUNNER_TEMP/secret-fetch-error"
          match=''
          while read -r _sha candidate; do
            candidate_proof="$(printf '%s' "$candidate" | sha256sum | awk '{print $1}')"
            if [[ "$candidate_proof" == "$TARGET_BRANCH_PROOF" ]]; then
              [[ -z "$match" ]] || { echo 'LAS_BRIDGE=FAIL:AMBIGUOUS_REF'; exit 1; }
              match="$candidate"
            fi
          done < "$all_refs"
          rm -f "$all_refs" "$RUNNER_TEMP/secret-fetch-error"
          [[ -n "$match" ]] || { echo 'LAS_BRIDGE=FAIL:TARGET'; exit 1; }
          echo "::add-mask::$match"
          git -c core.fsmonitor=false -c http.extraHeader="AUTHORIZATION: basic $authorization" \
            fetch -q --depth=1 origin "$match" > /dev/null 2> "$RUNNER_TEMP/secret-fetch-error"
          rm -f "$RUNNER_TEMP/secret-fetch-error"
          unset authorization PRIVATE_READ_TOKEN PRIVATE_REPOSITORY
          git -c core.fsmonitor=false checkout -q --detach FETCH_HEAD
          actual="$(git -c core.fsmonitor=false rev-parse --verify HEAD)"
          echo "::add-mask::$actual"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          if [[ "$proof" != "$EXPECTED_PRIVATE_COMMIT_PROOF" ]]; then
            echo 'LAS_BRIDGE=FAIL:SOURCE_PROOF'; exit 1
          fi
          if [[ -n "$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all)" ]]; then
            echo 'LAS_BRIDGE=FAIL:DIRTY'; exit 1
          fi
          test_runner='tools/verification/run_bridge_native_suite.sh'
          if ! printf '%s  %s\n' "$EXPECTED_PRIVATE_TEST_RUNNER_SHA256" "$test_runner" |
               sha256sum --check --strict >/dev/null 2>&1; then
            echo 'LAS_BRIDGE=FAIL:RUNNER_SOURCE'; exit 1
          fi
          echo "LAS_PRIVATE_SOURCE_PROOF=$proof"
          echo 'LAS_BRIDGE=EXACT_SOURCE_READY'

      - name: Compile Linux feature and emit ONLY codes, no private diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-source"
          result="$(mktemp -d "$RUNNER_TEMP/las-private-compiler-codes.XXXXXXXX")"
          chmod 700 "$result"
          trap 'rm -rf -- "$result"' EXIT
          if ! rustup toolchain install 1.98.1 --profile minimal >"$result/tool" 2>&1; then
            echo 'LAS_SENSOR_LINUX=FAIL:TOOLCHAIN'; exit 1
          fi
          set +e
          RUSTFLAGS=-Dwarnings cargo +1.98.1 check --locked --features linux-peer-credentials --all-targets --message-format=json >"$result/diagnostics" 2>&1
          rc=$?
          set -e
          if (( rc == 0 )); then echo 'LAS_SENSOR_LINUX=PASS'; exit 0; fi
          python3 -I -B - "$result/diagnostics" <<'PY'
          import json,re,sys
          total=0
          own=0
          for line in open(sys.argv[1], encoding='utf-8', errors='replace'):
              try: entry=json.loads(line)
              except (ValueError,TypeError): continue
              if entry.get('reason')!='compiler-message': continue
              msg=entry.get('message') or {}
              if msg.get('level') != 'error': continue
              total+=1
              code=(msg.get('code') or {}).get('code') or 'UNKNOWN'
              if not re.fullmatch(r'E[0-9]{4}|[a-z][a-z0-9_]{0,48}',code): code='UNKNOWN'
              spans=msg.get('spans') or []
              sp=next((s for s in spans if s.get('is_primary')),spans[0] if spans else {})
              # Never expose filenames, error prose, source lines, snippets or spans.
              typ='OWN' if str(sp.get('file_name','')).endswith('/root_supervisor_linux_process_ingress.rs') else 'OTHER'
              if typ=='OWN': own+=1
              if total<=20:
                  number=sp.get('line_start',0)
                  number=number if isinstance(number,int) and 0<=number<20000 else 0
                  print('LAS_SENSOR_LINUX_ERROR='+code+':'+typ+':'+str(number))
          print('LAS_SENSOR_LINUX_ERROR_COUNT='+str(total))
          print('LAS_SENSOR_LINUX_OWN_COUNT='+str(own))
          if total==0: sys.exit(2)
          PY
          echo 'LAS_SENSOR_LINUX=FAIL:NON_ZERO_SOURCE_CHECK'

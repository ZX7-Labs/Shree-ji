name: Root source-pinned resource positive TLC and five negative models
on:
  push:
    branches:
      - quarantine/las-root-current-native-20261101
    paths:
      - .github/workflows/quarantine-las-root-external-tlc-five-negative-20261101.yml
permissions:
  contents: read
jobs:
  source-pinned-two-tlc:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_BRANCH_PROOF: 22d4f9b18226c448f8f8d1d4201f3dcf591915431c4fcdc72b860bfd1863eb0f
      EXPECTED_PRIVATE_COMMIT_PROOF: ccc9858694e1ae3296b3677dfb68d26e447d40379cb7cadf35fa37f2a688440b
      EXPECTED_PRIVATE_RUNNER_BLOB_PROOF: d4df90336770cf5275996ccf750325a091b071a86a708799281845dc0eb5c74f
    steps:
      - name: Recover exact read-only private source without publishing code
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_READ_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$PRIVATE_REPOSITORY" || -z "$PRIVATE_READ_TOKEN" ]]; then
            echo 'LAS_NATIVE_BRIDGE=FAIL:ACCESS'; exit 1
          fi
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_READ_TOKEN"
          private="$RUNNER_TEMP/private-source"
          mkdir -m 700 "$private"
          cd "$private"
          git init -q
          git remote add origin "https://github.com/$PRIVATE_REPOSITORY.git"
          authorization="$(printf 'x-access-token:%s' "$PRIVATE_READ_TOKEN" | base64 -w0)"
          echo "::add-mask::$authorization"
          all_refs="$RUNNER_TEMP/private-heads"
          git -c core.fsmonitor=false -c http.extraHeader="AUTHORIZATION: basic $authorization" ls-remote --heads origin > "$all_refs" 2> "$RUNNER_TEMP/secret-fetch-error" || {
            echo 'LAS_NATIVE_BRIDGE=FAIL:READ'; exit 1
          }
          match=''
          while read -r _sha candidate; do
            candidate_proof="$(printf '%s' "$candidate" | sha256sum | awk '{print $1}')"
            if [[ "$candidate_proof" == "$TARGET_BRANCH_PROOF" ]]; then
              [[ -z "$match" ]] || { echo 'LAS_NATIVE_BRIDGE=FAIL:AMBIGUOUS_REF'; exit 1; }
              match="$candidate"
            fi
          done < "$all_refs"
          rm -f "$all_refs" "$RUNNER_TEMP/secret-fetch-error"
          [[ -n "$match" ]] || { echo 'LAS_NATIVE_BRIDGE=FAIL:TARGET'; exit 1; }
          echo "::add-mask::$match"
          git -c core.fsmonitor=false -c http.extraHeader="AUTHORIZATION: basic $authorization" fetch -q --depth=1 origin "$match" > /dev/null 2> "$RUNNER_TEMP/secret-fetch-error" || {
            echo 'LAS_NATIVE_BRIDGE=FAIL:FETCH'; exit 1
          }
          rm -f "$RUNNER_TEMP/secret-fetch-error"
          unset authorization PRIVATE_READ_TOKEN PRIVATE_REPOSITORY
          git -c core.fsmonitor=false checkout -q --detach FETCH_HEAD
          actual="$(git -c core.fsmonitor=false rev-parse --verify HEAD)"
          echo "::add-mask::$actual"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          [[ "$proof" == "$EXPECTED_PRIVATE_COMMIT_PROOF" ]] || {
            echo 'LAS_NATIVE_BRIDGE=FAIL:SOURCE_PIN'; exit 1
          }
          [[ -z "$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all)" ]] || {
            echo 'LAS_NATIVE_BRIDGE=FAIL:DIRTY'; exit 1
          }
          script='tools/verification/run_bridge_native_suite.sh'
          [[ -f "$script" && ! -L "$script" ]] || {
            echo 'LAS_NATIVE_BRIDGE=FAIL:RUNNER_MISSING'; exit 1
          }
          blob="$(git -c core.fsmonitor=false hash-object "$script")"
          blob_proof="$(printf '%s' "$blob" | sha256sum | awk '{print $1}')"
          [[ "$blob_proof" == "$EXPECTED_PRIVATE_RUNNER_BLOB_PROOF" ]] || {
            echo 'LAS_NATIVE_BRIDGE=FAIL:RUNNER_PIN'; exit 1
          }
          echo "LAS_NATIVE_BRIDGE=SOURCE_PINNED:$proof"

      - name: Check two exact Root base capability models with TLC 1.7.4
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: -Xmx5g
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-source"
          private="$(mktemp -d "$RUNNER_TEMP/las-root-tlc.XXXXXXXX")"
          chmod 700 "$private"
          jar="$private/tla2tools.jar"
          if ! curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
                  --output "$jar" \
                  "https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar" \
                  > "$private/fetch.private" 2>&1; then
            echo 'LAS_ROOT_TLC=FAIL:TOOL_FETCH'; exit 1
          fi
          printf 'bee4a54f3ee3d4afc347c3240ec2d9e93b075104  %s\n' "$jar" |
            sha1sum --check --strict > "$private/jarcheck.private" 2>&1 || {
            echo 'LAS_ROOT_TLC=FAIL:TOOL_PIN'; exit 1
          }
          python3 -I -B - "$private/models.private" <<'PY_CENSUS' || {
          import pathlib,sys
          base="RootExternalEffectProviderFence"
          root=pathlib.Path("spec/root_authority")
          model=root/(base+".tla")
          cfg=root/(base+".cfg")
          if not all(p.is_file() and not p.is_symlink() for p in (model,cfg)):raise SystemExit(1)
          a=model.read_text(encoding="utf-8")
          b=cfg.read_text(encoding="utf-8")
          if a.count("MODULE "+base)!=1 or "ExternalEffect(r) ==" not in a:raise SystemExit(1)
          invariants=("TypeOK","AtMostOneExternalEffect","PhysicalRequiresDurableArm",
             "PhysicalRequiresOwnedFence","PhysicalRequiresRootLiveAtEdge",
             "PhysicalCountAndOwnerAgree","SensorEvidenceNotActorClaim",
             "SettlementRequiresIndependentSensor","LedgerOwnerDoesNotChange")
          if "SPECIFICATION Spec" not in b or any(("    "+q) not in b for q in invariants):raise SystemExit(1)
          if "CHECK_DEADLOCK FALSE" not in b:raise SystemExit(1)
          pathlib.Path(sys.argv[1]).write_text(base+"|"+base+"\n",encoding="utf-8")
          PY_CENSUS
            echo 'LAS_ROOT_TLC=FAIL:SOURCE_CENSUS'; exit 1
          }
          count=0
          while IFS='|' read -r modelstem cfgstem; do
            count=$((count+1))
            [[ "$count" -le 1 && "$modelstem" =~ ^[A-Za-z_][A-Za-z0-9_]*$ && "$cfgstem" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || {
              echo 'LAS_ROOT_TLC=FAIL:MODEL_ID'; exit 1
            }
            model="spec/root_authority/$modelstem.tla"
            cfg="spec/root_authority/$cfgstem.cfg"
            logfile="$private/profile-$count.private"
            if java -XX:+UseParallelGC -jar "$jar" -workers 2 -fp 0 \
                -config "$cfg" "$model" >"$logfile" 2>&1; then
              java_rc=0
            else
              java_rc=$?
            fi
            if ! python3 -I -B tools/verification/canonical_tlc_result_evidence.py \
                "$logfile" "$java_rc" 0 >"$private/classifier-$count.private" 2>&1; then
              echo "LAS_ROOT_TLC=FAIL:PROFILE_$count"; exit 1
            fi
            echo "LAS_ROOT_TLC=PROFILE_${count}_PASS"
          done < "$private/models.private"
          [[ "$count" -eq 1 ]] || { echo 'LAS_ROOT_TLC=FAIL:COUNT'; exit 1; }
          # Deliberately unsafe model copies exist only under runner-private temp.
          python3 -I -B -m unittest discover -s tools/experiments/root_external_tla_negative -p 'test_*.py' -q >"$private/mutation-unit.private" 2>&1 || {
            echo 'LAS_ROOT_TLC_NEGATIVE=FAIL:UNIT_TESTS'; exit 1
          }
          grep -Eq '^Ran 5 tests in ' "$private/mutation-unit.private" || {
            echo 'LAS_ROOT_TLC_NEGATIVE=FAIL:VACUOUS_UNIT_TESTS'; exit 1
          }
          controls="$private/external-negative-models"
          mkdir -m 700 "$controls"
          python3 -I -B tools/experiments/root_external_tla_negative/tla_negative_controls.py \
              --source spec/root_authority/RootExternalEffectProviderFence.tla \
              --out "$controls" > "$private/generate.private" 2>&1 || {
            echo 'LAS_ROOT_TLC_NEGATIVE=FAIL:GENERATOR'; exit 1
          }
          n=0
          while IFS='|' read -r model invariant; do
            n=$((n+1))
            case "$model|$invariant" in
              'RootExternalEffectProviderFenceUnsafe1|AtMostOneExternalEffect' | \
              'RootExternalEffectProviderFenceUnsafe2|PhysicalRequiresDurableArm' | \
              'RootExternalEffectProviderFenceUnsafe3|PhysicalRequiresRootLiveAtEdge' | \
              'RootExternalEffectProviderFenceUnsafe4|SettlementRequiresIndependentSensor' | \
              'RootExternalEffectProviderFenceUnsafe5|PhysicalRequiresOwnedFence') ;;
              *) echo 'LAS_ROOT_TLC_NEGATIVE=FAIL:MODEL_CENSUS'; exit 1 ;;
            esac
            [[ "$n" -le 5 && -f "$controls/$model.tla" && -f "$controls/$model.cfg" ]] || {
              echo 'LAS_ROOT_TLC_NEGATIVE=FAIL:SOURCE_CENSUS'; exit 1
            }
            if java -XX:+UseParallelGC -jar "$jar" -workers 2 -fp 0 \
              -config "$controls/$model.cfg" "$controls/$model.tla" \
              >"$controls/negative-$n.private" 2>&1; then
              checker_rc=0
            else
              checker_rc=$?
            fi
            if ! python3 -I -B tools/verification/canonical_tlc_result_evidence.py \
              "$controls/negative-$n.private" "$checker_rc" 0 \
              --expectation "^Invariant $invariant is violated" \
              > "$controls/negative-classified-$n.private" 2>&1; then
              echo "LAS_ROOT_TLC_NEGATIVE=FAIL:CONTROL_$n"; exit 1
            fi
            echo "LAS_ROOT_TLC_NEGATIVE=CONTROL_${n}_EXPECTED_COUNTEREXAMPLE"
          done < "$controls/manifest.tsv"
          [[ "$n" -eq 5 ]] || { echo 'LAS_ROOT_TLC_NEGATIVE=FAIL:COUNT'; exit 1; }
          echo 'LAS_ROOT_TLC_NEGATIVE=FIVE_COUNTEREXAMPLES_NOT_PRODUCT_RELEASE'
          [[ -z "$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all)" ]] || {
            echo 'LAS_ROOT_TLC=FAIL:SOURCE_DRIFT'; exit 1
          }
          echo 'LAS_ROOT_TLC=SCOPED_EXTERNAL_EFFECT_FENCE_PROFILE_PASS_NOT_HARDWARE_OR_RELEASE'

      - name: Scrub private source and TLC traces
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$RUNNER_TEMP/private-source"
          find "$RUNNER_TEMP" -maxdepth 1 -name 'las-root-tlc.*' -type d -exec rm -rf -- {} +
          rm -f -- "$RUNNER_TEMP/private-heads" "$RUNNER_TEMP/secret-fetch-error"
          echo 'LAS_ROOT_TLC=EPHEMERAL_CLEANUP'

name: Private opaque broad canonical matrix (retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject obsolete broad canonical matrix
        shell: bash
        run: |
          set -euo pipefail
          echo "LAS_OPAQUE_BROAD_CANONICAL_MATRIX=RETIRED"
          echo "This workflow is bound to a superseded private snapshot. Current assurance is bound to the repaired 202-profile candidate and frozen continuation runners."
          exit 1

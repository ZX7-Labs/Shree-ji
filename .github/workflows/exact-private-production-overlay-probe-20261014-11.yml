name: Exact private production overlay probe 11

on:
  push:
    paths:
      - ".github/workflows/exact-private-production-overlay-probe-20261014-11.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      TARGET_REF_HASH: 28a52175bfc55f4f8b2b0f4312cd2616a65a7082555149f4382746e2254e1b26
      EXPECTED_TARGET_PROOF: 74fc0f762eeac47cc19fb58a768b975fd1aeec239d73a269aaf26cd1c6a3d760
      SOURCE_REF_HASH: b04a74ff0e7f1b30935fd6807d8b17506c697daf0b895f7f778729cdfdcf3946
      PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
      PRIVATE_READ_TOKEN: ${{ secrets.LAS_PRIVATE_WRITE_TOKEN }}
    steps:
      - name: Checkout public control shell
        uses: actions/checkout@v4

      - name: Recover exact target and historical source
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_READ_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_READ_TOKEN"

          root="$RUNNER_TEMP/private-overlay"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_READ_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"

          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin > "$refs"
          target_ref=""
          target_sha=""
          source_ref=""
          source_sha=""
          while read -r sha ref; do
            h="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$h" == "$TARGET_REF_HASH" ]]; then
              test -z "$target_ref"
              target_ref="$ref"
              target_sha="$sha"
            fi
            if [[ "$h" == "$SOURCE_REF_HASH" ]]; then
              test -z "$source_ref"
              source_ref="$ref"
              source_sha="$sha"
            fi
          done < "$refs"
          rm -f "$refs"

          test -n "$target_ref"
          test -n "$target_sha"
          test -n "$source_ref"
          test -n "$source_sha"
          echo "::add-mask::$target_ref"
          echo "::add-mask::$target_sha"
          echo "::add-mask::$source_ref"
          echo "::add-mask::$source_sha"

          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$target_ref"
          git checkout -q -B target FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$target_sha"
          target_proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          test "$target_proof" = "$EXPECTED_TARGET_PROOF"

          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$source_ref"
          actual_source="$(git rev-parse FETCH_HEAD)"
          test "$actual_source" = "$source_sha"
          source_proof="$(printf '%s' "$actual_source" | sha256sum | awk '{print $1}')"
          printf '%s' "$source_sha" > "$RUNNER_TEMP/source-sha"
          chmod 600 "$RUNNER_TEMP/source-sha"
          echo "LAS_PRODUCTION_OVERLAY_TARGET_RECOVERY=PASS"
          echo "LAS_PRODUCTION_OVERLAY_SOURCE_PROOF=$source_proof"

      - name: Overlay mature production owner without push
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-overlay"
          source_sha="$(cat "$RUNNER_TEMP/source-sha")"
          echo "::add-mask::$source_sha"

          files=(
            src/effect_fabric/root_supervisor_linux_process_ingress.rs
            src/effect_fabric/root_supervisor_linux_production_bootstrap.rs
            src/effect_fabric/root_supervisor_linux_socket_activation.rs
            src/effect_fabric/root_supervisor_linux_production_resources.rs
            src/effect_fabric/root_supervisor_linux_production_process.rs
            src/effect_fabric/root_supervisor_linux_production_launch.rs
            src/effect_fabric/root_supervisor_linux_production_startup.rs
            src/effect_fabric/root_supervisor_linux_production_runtime.rs
          )
          for path in "${files[@]}"; do
            git show "${source_sha}:${path}" > "$path"
          done

          python3 - <<'PY'
          from pathlib import Path

          lib = Path("src/lib.rs")
          text = lib.read_text()

          production_block = '''    // Choose the concrete Ada-backed Root implementation only after Effect Fabric can be
              // prepared, then enter through the joint epoch coordinator. Raw paths/listeners and
              // peer-policy construction remain outside this authority-bearing assembly layer.
              #[cfg(all(
                  feature = "root-ffi",
                  feature = "linux-peer-credentials",
                  target_os = "linux"
              ))]
              mod root_supervisor_linux_production_bootstrap;

              // Acquire one exact named systemd activation bundle at process startup: two listeners
              // plus the manifest/control/guarded journals. Raw inherited FDs and activation environment
              // metadata terminate at this adapter before any Root authority is established.
              #[cfg(all(
                  feature = "root-ffi",
                  feature = "linux-peer-credentials",
                  target_os = "linux"
              ))]
              #[allow(unsafe_code)]
              mod root_supervisor_linux_socket_activation;

              // Narrow manager-opened journal descriptors into three non-aliased Linux durable stores.
              // Per-file flags/owner/mode/length/locking and stable-storage semantics remain owned by
              // linux_root_control_durable_slot_store; this layer only composes exact production roles.
              #[cfg(all(
                  feature = "root-ffi",
                  feature = "linux-peer-credentials",
                  target_os = "linux"
              ))]
              mod root_supervisor_linux_production_resources;

              // Consume the concrete Root/effect service together with already-sealed Linux ingress
              // owners, then publish the two role-specific listeners only through the fair process
              // ingress boundary. Every post-Root failure preserves exact service/listener ownership.
              #[cfg(all(
                  feature = "root-ffi",
                  feature = "linux-peer-credentials",
                  target_os = "linux"
              ))]
              mod root_supervisor_linux_production_process;

              // Keep exact Root-start and sealed Linux ingress ownership together across the first
              // post-Open authority transition. Activation failure returns both owners; successful
              // activation can only continue through the existing service-adoption/publication seam.
              #[cfg(all(
                  feature = "root-ffi",
                  feature = "linux-peer-credentials",
                  target_os = "linux"
              ))]
              mod root_supervisor_linux_production_launch;

              // Compose exact named activation resources, concrete durable stores and already-sealed
              // ingress authority through fresh/recovery Root startup to one pre-activation launch owner.
              // This internal coordinator still publishes nothing and creates no deployment policy.
              #[cfg(all(
                  feature = "root-ffi",
                  feature = "linux-peer-credentials",
                  target_os = "linux"
              ))]
              mod root_supervisor_linux_production_startup;

          '''
          production_block = production_block.replace("              ", "    ")

          process_block = '''    // Make both published privileged listeners nonblocking and alternate first priority
              // without exposing the underlying deployment as an alternate accept path.
              #[cfg(all(feature = "linux-peer-credentials", target_os = "linux"))]
              mod root_supervisor_linux_process_ingress;

              // Consume the concrete published process into the bounded cooperative runtime and make
              // peer-local recovery, drain, epoch-rotation and supervisor-fault policy structural
              // before an executable process loop is permitted to own it.
              #[cfg(all(
                  feature = "root-ffi",
                  feature = "linux-peer-credentials",
                  target_os = "linux"
              ))]
              mod root_supervisor_linux_production_runtime;

          '''
          process_block = process_block.replace("              ", "    ")

          if "mod root_supervisor_linux_production_bootstrap;" in text:
              raise SystemExit("production modules already present")
          if "mod root_supervisor_linux_process_ingress;" in text:
              raise SystemExit("process ingress already present")

          anchor1 = '''    // Graceful rotation consumes a quiescent active epoch, retires both durable
          '''
          if text.count(anchor1) != 1:
              raise SystemExit(f"production insertion anchor count={text.count(anchor1)}")
          text = text.replace(anchor1, production_block + anchor1, 1)

          anchor2 = '''    // Keep the safe executor core independently compilable/testable from the Ada FFI.
          '''
          if text.count(anchor2) != 1:
              raise SystemExit(f"runtime insertion anchor count={text.count(anchor2)}")
          text = text.replace(anchor2, process_block + anchor2, 1)
          lib.write_text(text)
          PY

          git diff --check
          echo "LAS_PRODUCTION_OVERLAY_APPLIED=PASS"

      - name: Compile overlay on exact current target
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-overlay"
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt >/dev/null
          cargo +1.98.1 fmt --all
          cargo +1.98.1 fmt --all -- --check
          RUSTFLAGS='-D warnings' cargo +1.98.1 check --all-targets --features 'root-ffi linux-peer-credentials'
          echo "LAS_PRODUCTION_OVERLAY_COMPILE=PASS"

      - name: Prove diagnostic made no private commit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-overlay"
          head_proof="$(git rev-parse HEAD | sha256sum | awk '{print $1}')"
          test "$head_proof" = "$EXPECTED_TARGET_PROOF"
          echo "LAS_PRODUCTION_OVERLAY_NO_PRIVATE_PUSH=PASS"

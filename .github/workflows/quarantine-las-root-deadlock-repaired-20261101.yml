name: Root checked TLC seven family differentials and reviewed control
on:
  push:
    branches:
      - quarantine/las-root-current-native-20261101
    paths:
      - .github/workflows/quarantine-las-root-deadlock-repaired-20261101.yml
permissions:
  contents: read
jobs:
  source-pinned-two-tlc:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TARGET_BRANCH_PROOF: 71efec232d63226dcd97ca929e43320b86377f91bb67fc72cfb5ca3986e14e7a
      EXPECTED_PRIVATE_COMMIT_PROOF: d7fcdeb4956e0c78eba63323c62fef824ae11bfaf3f3ef9510e3674ff4ef1ca9
      EXPECTED_PRIVATE_RUNNER_BLOB_PROOF: d4df90336770cf5275996ccf750325a091b071a86a708799281845dc0eb5c74f
    steps:
      - name: Recover exact read-only private source without publishing code
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_READ_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$PRIVATE_REPOSITORY" || -z "$PRIVATE_READ_TOKEN" ]]; then
            echo 'LAS_NATIVE_BRIDGE=FAIL:ACCESS'; exit 1
          fi
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_READ_TOKEN"
          private="$RUNNER_TEMP/private-source"
          mkdir -m 700 "$private"
          cd "$private"
          git init -q
          git remote add origin "https://github.com/$PRIVATE_REPOSITORY.git"
          authorization="$(printf 'x-access-token:%s' "$PRIVATE_READ_TOKEN" | base64 -w0)"
          echo "::add-mask::$authorization"
          all_refs="$RUNNER_TEMP/private-heads"
          git -c core.fsmonitor=false -c http.extraHeader="AUTHORIZATION: basic $authorization" ls-remote --heads origin > "$all_refs" 2> "$RUNNER_TEMP/secret-fetch-error" || {
            echo 'LAS_NATIVE_BRIDGE=FAIL:READ'; exit 1
          }
          match=''
          while read -r _sha candidate; do
            candidate_proof="$(printf '%s' "$candidate" | sha256sum | awk '{print $1}')"
            if [[ "$candidate_proof" == "$TARGET_BRANCH_PROOF" ]]; then
              [[ -z "$match" ]] || { echo 'LAS_NATIVE_BRIDGE=FAIL:AMBIGUOUS_REF'; exit 1; }
              match="$candidate"
            fi
          done < "$all_refs"
          rm -f "$all_refs" "$RUNNER_TEMP/secret-fetch-error"
          [[ -n "$match" ]] || { echo 'LAS_NATIVE_BRIDGE=FAIL:TARGET'; exit 1; }
          echo "::add-mask::$match"
          git -c core.fsmonitor=false -c http.extraHeader="AUTHORIZATION: basic $authorization" fetch -q --depth=1 origin "$match" > /dev/null 2> "$RUNNER_TEMP/secret-fetch-error" || {
            echo 'LAS_NATIVE_BRIDGE=FAIL:FETCH'; exit 1
          }
          rm -f "$RUNNER_TEMP/secret-fetch-error"
          unset authorization PRIVATE_READ_TOKEN PRIVATE_REPOSITORY
          git -c core.fsmonitor=false checkout -q --detach FETCH_HEAD
          actual="$(git -c core.fsmonitor=false rev-parse --verify HEAD)"
          echo "::add-mask::$actual"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          [[ "$proof" == "$EXPECTED_PRIVATE_COMMIT_PROOF" ]] || {
            echo 'LAS_NATIVE_BRIDGE=FAIL:SOURCE_PIN'; exit 1
          }
          [[ -z "$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all)" ]] || {
            echo 'LAS_NATIVE_BRIDGE=FAIL:DIRTY'; exit 1
          }
          script='tools/verification/run_bridge_native_suite.sh'
          [[ -f "$script" && ! -L "$script" ]] || {
            echo 'LAS_NATIVE_BRIDGE=FAIL:RUNNER_MISSING'; exit 1
          }
          blob="$(git -c core.fsmonitor=false hash-object "$script")"
          blob_proof="$(printf '%s' "$blob" | sha256sum | awk '{print $1}')"
          [[ "$blob_proof" == "$EXPECTED_PRIVATE_RUNNER_BLOB_PROOF" ]] || {
            echo 'LAS_NATIVE_BRIDGE=FAIL:RUNNER_PIN'; exit 1
          }
          echo "LAS_NATIVE_BRIDGE=SOURCE_PINNED:$proof"

      - name: Execute eight strict unreviewed deadlock differentials under private TLC
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-source"
          private="$(mktemp -d "$RUNNER_TEMP/las-root-diff.XXXXXXXX")"
          chmod 700 "$private"
          jar="$private/tla2tools.jar"
          if ! curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
                  --output "$jar" \
                  "https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar" \
                  > "$private/fetch.private" 2>&1; then
            echo 'LAS_DEADLOCK_SCOPE=FAIL:TOOL_FETCH'; exit 1
          fi
          printf 'bee4a54f3ee3d4afc347c3240ec2d9e93b075104  %s\n' "$jar" |
            sha1sum --check --strict > "$private/jarcheck.private" 2>&1 || {
            echo 'LAS_DEADLOCK_SCOPE=FAIL:TOOL_PIN'; exit 1
          }
          work="tools/verification/deadlock_differential"
          if ! python3 -I -B -m unittest discover -s "$work" -p 'test_*.py' -q > "$private/unit-normal.private" 2>&1; then
            echo 'LAS_DEADLOCK_SCOPE=FAIL:NORMAL_UNIT'; exit 1
          fi
          grep -Eq '^Ran 22 tests in ' "$private/unit-normal.private" || {
            echo 'LAS_DEADLOCK_SCOPE=FAIL:NORMAL_VACUOUS'; exit 1
          }
          if ! python3 -O -I -B -m unittest discover -s "$work" -p 'test_*.py' -q > "$private/unit-optimized.private" 2>&1; then
            echo 'LAS_DEADLOCK_SCOPE=FAIL:OPTIMIZED_UNIT'; exit 1
          fi
          grep -Eq '^Ran 22 tests in ' "$private/unit-optimized.private" || {
            echo 'LAS_DEADLOCK_SCOPE=FAIL:OPTIMIZED_VACUOUS'; exit 1
          }
          if ! python3 -I -B "$work/run_classifier_mutations.py" > "$private/mutants.private" 2>&1; then
            echo 'LAS_DEADLOCK_SCOPE=FAIL:UNSOUND_MUTANT_SURVIVED'; exit 1
          fi
          grep -Fq '"killed": true' "$private/mutants.private" &&
          grep -Fq '"total": 6' "$private/mutants.private" || {
            echo 'LAS_DEADLOCK_SCOPE=FAIL:MUTATION_VACUOUS'; exit 1
          }
          mkdir -m700 "$private/differentials"
          if ! python3 -E -s -B "$work/run_differential.py" \
                --source "$PWD" --work "$private/differentials" --jar "$jar" --seconds 70 \
                > "$private/summary.private" 2>&1; then
            echo 'LAS_DEADLOCK_SCOPE=FAIL:INCOMPLETE_DIAGNOSTIC'; exit 1
          fi
          python3 -I -B - "$private/summary.private" <<'PY_REDACTED' || {
          import json,pathlib,sys
          rows=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8').splitlines()
          if len(rows)!=1:raise SystemExit(1)
          x=json.loads(rows[0])
          allowed={'DEADLOCK_COUNTEREXAMPLE','CHECKED_NO_DEADLOCK_IN_BOUNDED_PROFILE',
                   'TIMEOUT_OR_INTERRUPTED','JVM_OR_SYSTEM_FAULT','OTHER_FAILURE_OR_INCOMPLETE'}
          counts=x.get('counts')
          entries=x.get('rows')
          if (x.get('cases')!=8 or type(counts)!=dict or set(counts)!=allowed or
                  type(entries)!=list or len(entries)!=8 or
                  any(type(v)!=int or v<0 for v in counts.values()) or
                  sum(counts.values())!=8):raise SystemExit(1)
          if ({z.get('family_index') for z in entries}!=set(range(1,9)) or
                  len({z.get('git_ordinal') for z in entries})!=8 or
                  any(type(z.get('git_ordinal'))!=int or z['git_ordinal']<=0 or
                      z.get('outcome') not in allowed for z in entries)):raise SystemExit(1)
          scope=[z.get('proof_scope') for z in entries]
          if (scope.count('UNREVIEWED') != 7 or
                  scope.count('REVIEWED_CONTROL') != 1 or
                  any(z.get('family_index')==4 and z.get('proof_scope')!='REVIEWED_CONTROL'
                      for z in entries)):
              raise SystemExit(1)
          for key in sorted(allowed):
              print('LAS_DEADLOCK_SCOPE_'+key+'='+str(counts[key]))
          if sum(counts[k] for k in
                  ('TIMEOUT_OR_INTERRUPTED','JVM_OR_SYSTEM_FAULT',
                   'OTHER_FAILURE_OR_INCOMPLETE'))!=0:
              raise SystemExit(2)
          PY_REDACTED
            echo 'LAS_DEADLOCK_SCOPE=FAIL:INCONCLUSIVE_OR_INVALID_RECEIPT'; exit 1
          }
          [[ -z "$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all)" ]] || {
            echo 'LAS_DEADLOCK_SCOPE=FAIL:SOURCE_DRIFT'; exit 1
          }
          echo 'LAS_DEADLOCK_SCOPE=SEVEN_UNREVIEWED_PLUS_ONE_CONTROL_SAMPLED_NOT_RELEASE'

      - name: Scrub private source and TLC traces
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$RUNNER_TEMP/private-source"
          find "$RUNNER_TEMP" -maxdepth 1 -name 'las-root-diff.*' -type d -exec rm -rf -- {} +
          rm -f -- "$RUNNER_TEMP/private-heads" "$RUNNER_TEMP/secret-fetch-error"
          echo 'LAS_ROOT_TLC=EPHEMERAL_CLEANUP'

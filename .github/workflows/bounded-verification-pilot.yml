name: Bounded exact-source verification pilot
on: workflow_dispatch
permissions:
  contents: read
jobs:
  profile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 52
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        index: [0, 20, 22]
    steps:
      - name: Checkout trusted controller
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Authenticate candidate and independently approved plans
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          export GIT_TERMINAL_PROMPT=0
          [[ "$PRIVATE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"

          root="$(mktemp -d "$RUNNER_TEMP/las-canonical.XXXXXXXX")"
          printf 'LAS_CANONICAL_ROOT=%s\n' "$root" >> "$GITHUB_ENV"
          source_ref_proof="6cf31d40422994d906540daad891b997e563a7686a3713dcbf93a426b00a2cfe"
          plan_ref_proof="76df16845527a3e5eedaec84918e7071251f1d91fab3743fbd507da5f3c57571"
          mapfile -t pins < RUN_PRIVATE_FORMAL.txt
          keys=(SOURCE_PROOF PLAN_COMMIT_PROOF LEGACY_PLAN_SHA256 NATIVE_PLAN_SHA256 VERIFIER_SHA256)
          test "${#pins[@]}" -eq 6
          digests=()
          for i in "${!keys[@]}"; do
            [[ "${pins[$i]}" =~ ^${keys[$i]}=([0-9a-f]{64})$ ]]
            digests+=("${BASH_REMATCH[1]}")
          done
          [[ "${pins[5]}" =~ ^SIGNATURE=([A-Za-z0-9+/]{512})$ ]]
          printf '%s' "${BASH_REMATCH[1]}" | base64 -d > "$root/signature"
          cat > "$root/public.pem" <<'KEY'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA33msPFNQC0BqoiocsFU0
          NPbJCnMZVr4j/XacnK0XSA9hrGV5cuJIQsr1nFiBB/8/RVjzq4pJxOoKRER12KbV
          WuXADjJQQY5R89qU4VCDXdGdIDI4LVx9cQn07Eeajq+F16JgsfbPbkchjq3eFh8j
          Q/SeROZ/3yxAiWmrfEnoAOoAOgUjOPT2h//TkklGJc0+wWnz0u84iVsAyL8Pp4f/
          WX1SgvRnvKdJbaCguKxY/sMvmJOXkmV++PvB1UPhUYH/Q88LrUhJGd/mTTvnToQ4
          Fax25YMdPyxVrxcdTHCN+LuoZXC8WHKvV/HH9eFTusuEdnfDAHtHR/WeXesiaqfl
          aKqGXYfxveVqtq2DhZc9e5/wjtVWU1AmNrC34ssjUcPOGWbiZu0WWPnGg2gvDIY5
          9IDqN3vygvnY8shdNXg4dwgrZ6h27UbNL15+pQO4/oXmeaRRxTONZxv6pmaq8UBi
          rhVeOjRzSV84xY5vQuvJTYOYObzBsHDWO5JeheJdvkYzAgMBAAE=
          -----END PUBLIC KEY-----
          KEY
          printf '%s\n' LAS_CANONICAL_REQUEST_V1 "$source_ref_proof" "$plan_ref_proof" "${digests[@]}" | \
            openssl dgst -sha256 -verify "$root/public.pem" -signature "$root/signature" >/dev/null

          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          remote="https://github.com/$PRIVATE_REPOSITORY.git"
          git -c "http.extraHeader=AUTHORIZATION: basic $auth" ls-remote --heads "$remote" > "$root/refs" 2>/dev/null
          get_ref() {
            local ref_proof="$1" commit_proof="$2" sha ref proof match=""
            while read -r sha ref; do
              proof="$(printf '%s' "$ref" | sha256sum)"
              if [[ "${proof%% *}" == "$ref_proof" ]]; then
                test -z "$match" || return 1
                proof="$(printf '%s' "$sha" | sha256sum)"
                test "${proof%% *}" = "$commit_proof" || return 1
                match="$sha $ref"
              fi
            done < "$root/refs"
            test -n "$match" || return 1
            printf '%s\n' "$match"
          }
          matched_source="$(get_ref "$source_ref_proof" "${digests[0]}")"
          matched_plan="$(get_ref "$plan_ref_proof" "${digests[1]}")"
          read -r source_commit source_ref <<< "$matched_source"
          read -r plan_commit plan_ref <<< "$matched_plan"
          for value in "$source_commit" "$source_ref" "$plan_commit" "$plan_ref"; do
            echo "::add-mask::$value"
          done
          echo "::add-mask::${source_ref#refs/heads/}"
          src="$root/source"
          git init --quiet "$src"
          git -C "$src" -c "http.extraHeader=AUTHORIZATION: basic $auth" \
            fetch --quiet --depth=1 "$remote" "$source_commit" "$plan_commit" >/dev/null 2>&1
          matched_harness="$(get_ref '7b578704ad705a531e8a133d20f2339b03f1397dcf053874c4c0d6c0489bb1a6' 'c8b32a9b35ceaced12d8ffb5dffc92ccc091e6d9b531a6adef65d5a4a05b7c3a')"
          read -r harness_commit _ <<< "$matched_harness"
          git -C "$src" -c "http.extraHeader=AUTHORIZATION: basic $auth" \
            fetch --quiet --depth=1 "$remote" "$harness_commit" >/dev/null 2>&1
          unset auth PRIVATE_TOKEN PRIVATE_REPOSITORY remote
          export HARNESS_COMMIT="$harness_commit"
          python3 -I - "$src" "$root" <<'PY'
          import hashlib, os, pathlib, subprocess, sys
          src, root = map(pathlib.Path, sys.argv[1:])
          def git(*args):
              return subprocess.check_output(['git', '-C', str(src), *args], stderr=subprocess.DEVNULL)
          tree = git('ls-tree', '-rz', os.environ['HARNESS_COMMIT'])
          entries = [entry.split(b'\t', 1) for entry in tree.split(b'\0') if entry.startswith((b'100644 blob ', b'100755 blob '))]
          for pin, alias in [('b15deec0f7d4c0bd54d0ca6e3110d5aa255992a3cfca095ae49cd5353eff1852', 'runner.py'), ('5b000b0f6a7cea6d065760529cd687119c8c9c78a3a9c88a7a60eef1208a2077', 'controls.py')]:
              (oid, path), = [(mode.split()[2], path) for mode, path in entries if hashlib.sha256(mode.split()[2]).hexdigest() == pin]
              name = pathlib.Path(path.decode('utf8')).name
              data = git('cat-file', 'blob', oid.decode('ascii'))
              with (root / name).open('xb') as output:
                  output.write(data)
              (root / alias).symlink_to(name)
          PY
          git -C "$src" show "$plan_commit:approval/legacy.json" > "$root/legacy.json" 2>/dev/null
          git -C "$src" show "$plan_commit:approval/native.json" > "$root/native.json" 2>/dev/null
          printf '%s  %s\n' "${digests[2]}" "$root/legacy.json" "${digests[3]}" "$root/native.json" | \
            sha256sum --check --strict --status
          git -C "$src" switch --quiet --create "${source_ref#refs/heads/}" "$source_commit" >/dev/null 2>&1
          test "$(git -C "$src" rev-parse HEAD)" = "$source_commit"
          printf '%s  %s\n' "${digests[4]}" "$src/tools/verification/native_must_run.py" | sha256sum --check --strict --status
          test -z "$(git -C "$src" status --porcelain --untracked-files=all)"
          printf 'LAS_MUST_RUN_APPROVED_SHA256=%s\nLAS_NATIVE_MUST_RUN_APPROVED_SHA256=%s\nLAS_NATIVE_VERIFIER_APPROVED_SHA256=%s\nLAS_CANONICAL_SOURCE_PROOF=%s\n' \
            "${digests[2]}" "${digests[3]}" "${digests[4]}" "${digests[0]}" >> "$GITHUB_ENV"
          test "${digests[0]}" = 5d4ae6e366783b97fef7fa4270d694a469f502279721f4d6be8fd668f5acf6a2
          echo "LAS_FORMAL_INPUTS=PASS"

      - name: Execute and validate one bounded profile
        shell: bash
        env:
          PROFILE_INDEX: ${{ matrix.index }}
        run: |
          set -euo pipefail
          umask 077
          root="$LAS_CANONICAL_ROOT"
          exec 3>&1 >"$root/pilot.log" 2>&1
          python3 -I -B "$root/controls.py"
          python3 -O -I -B "$root/controls.py"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 -sS -o "$root/tool.jar" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          java="$(readlink -f "$(command -v java)")"
          java_sha="$(sha256sum "$java" | cut -d' ' -f1)"
          version_sha="$(env LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC JAVA_TOOL_OPTIONS=-Xmx5g "$java" -version 2>&1 | sha256sum | cut -d' ' -f1)"
          source="$(git -C "$root/source" rev-parse HEAD)"
          python3 -I -B "$root/runner.py" --root "$root/source" --source "$source" \
            --java "$java" --java-sha256 "$java_sha" --java-version-sha256 "$version_sha" \
            --jar "$root/tool.jar" --index "$PROFILE_INDEX" --timeout-seconds 2700 --output "$root/result"
          python3 -I - "$root/result/receipt.json" "$source" "$PROFILE_INDEX" >&3 <<'PY'
          import hashlib, json, pathlib, sys
          path, source, index = sys.argv[1:]
          raw = pathlib.Path(path).read_bytes()
          receipt = json.loads(raw)
          if receipt['accepted'] is not True or receipt['source_sha'] != source or receipt['index'] != int(index):
              raise SystemExit(1)
          summary = {'index': int(index), 'source_proof': hashlib.sha256(source.encode('ascii')).hexdigest(),
                     'receipt_sha256': hashlib.sha256(raw).hexdigest(), 'accepted': True,
                     'java_rc': receipt['java_rc'], 'classifier_rc': receipt['classifier_rc']}
          if type(summary['java_rc']) is not int or summary['java_rc'] not in (0, 12) or summary['classifier_rc'] != 0:
              raise SystemExit(1)
          print('LAS_SCOPED_RECEIPT=' + json.dumps(summary, sort_keys=True))
          PY
          echo LAS_SINGLE_PROFILE=PASS >&3
      - name: Seal private pilot evidence
        if: always() && env.LAS_CANONICAL_ROOT != ''
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$LAS_CANONICAL_ROOT" == "$RUNNER_TEMP"/las-canonical.* ]]
          test -f "$LAS_CANONICAL_ROOT/pilot.log"
          cat > "$LAS_CANONICAL_ROOT/recipient.pem" <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIIEPTCCAqWgAwIBAgIUBXMGXR4r0E6CbMWniw5CpDbxWvMwDQYJKoZIhvcNAQEL
          BQAwLjEsMCoGA1UEAwwjTEFTIHRlbXBvcmFyeSBkaWFnbm9zdGljcyByZWNpcGll
          bnQwHhcNMjYxMTE3MDMwNzI1WhcNMjYxMTI3MDMwNzI1WjAuMSwwKgYDVQQDDCNM
          QVMgdGVtcG9yYXJ5IGRpYWdub3N0aWNzIHJlY2lwaWVudDCCAaIwDQYJKoZIhvcN
          AQEBBQADggGPADCCAYoCggGBAJ/62QOsjwYV3Z18d7NiaKqqhBLhdB55G+LHWbxL
          xYHQNfTx+2vDl1ZfAaMhSoQ7JVXWrNTgH9zBOeOATiqtF/Y8+69QRsRb79SBsvg4
          JK2yLRZu/VjeH1pGP8dQvLfyq6o1gM6An2SSFmezn3UofMcfJ8UynEVWlZ6RA3rz
          Cg8RfZl+TvMysDrhazIpnzUKQ+3v2iKJiYFqaQAv8bZZ0EOlOf3Z41fHSL3GJ+yx
          vQIE+YG3GNywoA8ogGU7G1tjcTJd+q91GnSxA3LmfY0CnD1yQ21E/MdLbczx5ui6
          q0LPfMghEMC7xqUW/9IMHie05Pem9PH7eNYlMzsELiIDnmD2k2/4/EjiDWQvUZfG
          oxo/k85fGL2EKMBtbbbvDJhnoS02dgh+iK5bKv3iHLN8wOG7L0oT7FzSIJgK1MS6
          gUPbzHUqSWy+M9m8trF09LgJK/u6C8MAe62d9y/qP2gLrkmr+0DJ2TxgaH+DB8Xw
          csJfhb0v2M2ehWG4pZpItL+ZvwIDAQABo1MwUTAdBgNVHQ4EFgQUB7Cxs6Kc38pD
          rNBJRosJVh55GicwHwYDVR0jBBgwFoAUB7Cxs6Kc38pDrNBJRosJVh55GicwDwYD
          VR0TAQH/BAUwAwEB/zANBgkqhkiG9w0BAQsFAAOCAYEANCloHFvc4EK032xz1vpv
          TKzNZTCJ+xJPR1VllI7WMwlLdnSN8sJubu/IFTXWKnxiBs7GyeqYHzjq80Afe9OV
          Yh3btMy4FbDnXh94xHqEXt1J446MFSi/oTa8BmyzLIhRsCudQBhMPq4JGk3q2g6/
          sb3XzYduoiZ/0gXmxvW0eUnhUl9JeMz5uv/7y32ZHjSR8XmhAYPNDAmD0T8qzUpZ
          jH5ERo5/jMmipaYPfUmAYvZdwmfx/stYXYUgIfJyM+5TKSI9zlRlgJy+XHJ5ar+H
          6aRmuJqPPOa4TlRBS/TUXt1lmCKdslMWF8SN3KMnRXNmI0fG/Z/yUYWwcAjI2x+B
          CD+PDT2vSy4KLW0o1PsJ7CGOD9aAQaQMX/FAsmdB6ambGNkC47xAMf4wlo0CQ2ln
          T92mBOV8wMvg6fKSox+TPLSQmIQIFBIXc7QN0ZrrOXW3J4+PegLTsjZfYBL8ZNQo
          pKyR6J5/kzm2G0KX3+GkdfZPzQiZKem5Q0LSrVI7BDaq
          -----END CERTIFICATE-----
          CERT
          cd "$LAS_CANONICAL_ROOT"
          files=(pilot.log)
          if [[ -d result ]]; then files+=(result); fi
          tar -czf - -- "${files[@]}" | \
            openssl cms -encrypt -binary -aes-256-cbc -outform DER \
              -out "$RUNNER_TEMP/pilot.cms" "$LAS_CANONICAL_ROOT/recipient.pem"

      - name: Save ciphertext log
        if: always() && env.LAS_CANONICAL_ROOT != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-pilot-${{ matrix.index }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pilot.cms
          if-no-files-found: error
          retention-days: 30

      - name: Remove private checkout and diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${LAS_CANONICAL_ROOT:-}" == "$RUNNER_TEMP"/las-canonical.* ]]; then
            sudo -n rm -rf -- "$LAS_CANONICAL_ROOT"
          fi

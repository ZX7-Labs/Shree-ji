name: Root direct canonical two configurations with deadlock checks reenabled
on:
  push:
    branches:
      - quarantine/las-root-current-native-20261101
    paths:
      - .github/workflows/quarantine-las-root-restored-deadlock-two-20261101.yml
permissions:
  contents: read
jobs:
  source-pinned-two-tlc:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TARGET_BRANCH_PROOF: 6fd5bf08661e8d1e480c6d5d48dce712e62bbc7032ca7809b3ecf3a99b7329f1
      EXPECTED_PRIVATE_COMMIT_PROOF: 4fb317409af63f03f65a322076312db6225dd2933f25a22c32b5f9fbc9125896
      EXPECTED_PRIVATE_RUNNER_BLOB_PROOF: d4df90336770cf5275996ccf750325a091b071a86a708799281845dc0eb5c74f
    steps:
      - name: Recover exact read-only private source without publishing code
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_READ_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$PRIVATE_REPOSITORY" || -z "$PRIVATE_READ_TOKEN" ]]; then
            echo 'LAS_NATIVE_BRIDGE=FAIL:ACCESS'; exit 1
          fi
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_READ_TOKEN"
          private="$RUNNER_TEMP/private-source"
          mkdir -m 700 "$private"
          cd "$private"
          git init -q
          git remote add origin "https://github.com/$PRIVATE_REPOSITORY.git"
          authorization="$(printf 'x-access-token:%s' "$PRIVATE_READ_TOKEN" | base64 -w0)"
          echo "::add-mask::$authorization"
          all_refs="$RUNNER_TEMP/private-heads"
          git -c core.fsmonitor=false -c http.extraHeader="AUTHORIZATION: basic $authorization" ls-remote --heads origin > "$all_refs" 2> "$RUNNER_TEMP/secret-fetch-error" || {
            echo 'LAS_NATIVE_BRIDGE=FAIL:READ'; exit 1
          }
          match=''
          while read -r _sha candidate; do
            candidate_proof="$(printf '%s' "$candidate" | sha256sum | awk '{print $1}')"
            if [[ "$candidate_proof" == "$TARGET_BRANCH_PROOF" ]]; then
              [[ -z "$match" ]] || { echo 'LAS_NATIVE_BRIDGE=FAIL:AMBIGUOUS_REF'; exit 1; }
              match="$candidate"
            fi
          done < "$all_refs"
          rm -f "$all_refs" "$RUNNER_TEMP/secret-fetch-error"
          [[ -n "$match" ]] || { echo 'LAS_NATIVE_BRIDGE=FAIL:TARGET'; exit 1; }
          echo "::add-mask::$match"
          git -c core.fsmonitor=false -c http.extraHeader="AUTHORIZATION: basic $authorization" fetch -q --depth=1 origin "$match" > /dev/null 2> "$RUNNER_TEMP/secret-fetch-error" || {
            echo 'LAS_NATIVE_BRIDGE=FAIL:FETCH'; exit 1
          }
          rm -f "$RUNNER_TEMP/secret-fetch-error"
          unset authorization PRIVATE_READ_TOKEN PRIVATE_REPOSITORY
          git -c core.fsmonitor=false checkout -q --detach FETCH_HEAD
          actual="$(git -c core.fsmonitor=false rev-parse --verify HEAD)"
          echo "::add-mask::$actual"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          [[ "$proof" == "$EXPECTED_PRIVATE_COMMIT_PROOF" ]] || {
            echo 'LAS_NATIVE_BRIDGE=FAIL:SOURCE_PIN'; exit 1
          }
          [[ -z "$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all)" ]] || {
            echo 'LAS_NATIVE_BRIDGE=FAIL:DIRTY'; exit 1
          }
          script='tools/verification/run_bridge_native_suite.sh'
          [[ -f "$script" && ! -L "$script" ]] || {
            echo 'LAS_NATIVE_BRIDGE=FAIL:RUNNER_MISSING'; exit 1
          }
          blob="$(git -c core.fsmonitor=false hash-object "$script")"
          blob_proof="$(printf '%s' "$blob" | sha256sum | awk '{print $1}')"
          [[ "$blob_proof" == "$EXPECTED_PRIVATE_RUNNER_BLOB_PROOF" ]] || {
            echo 'LAS_NATIVE_BRIDGE=FAIL:RUNNER_PIN'; exit 1
          }
          echo "LAS_NATIVE_BRIDGE=SOURCE_PINNED:$proof"

      - name: Verify exactly two restored source-owned deadlock checking profiles
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-source"
          private="$(mktemp -d "$RUNNER_TEMP/las-root-diff.XXXXXXXX")"
          chmod 700 "$private"
          jar="$private/tla2tools.jar"
          if ! curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
                  --output "$jar" \
                  "https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar" \
                  > "$private/fetch.private" 2>&1; then
            echo 'LAS_DEADLOCK_RESTORED=FAIL:PINNED_TLC_FETCH'; exit 1
          fi
          printf 'bee4a54f3ee3d4afc347c3240ec2d9e93b075104  %s\n' "$jar" |
            sha1sum --check --strict > "$private/jarcheck.private" 2>&1 || {
            echo 'LAS_DEADLOCK_RESTORED=FAIL:PINNED_TLC_CHECKSUM'; exit 1
          }
          work="tools/verification/deadlock_restoration"
          for mode in normal optimized; do
            flags=()
            [[ "$mode" == normal ]] || flags=(-O)
            if ! python3 "${flags[@]}" -I -B -m unittest discover -s "$work" -p 'test_*.py' -q > "$private/$mode.private" 2>&1; then
              echo 'LAS_DEADLOCK_RESTORED=FAIL:TESTS'; exit 1
            fi
            grep -Eq '^Ran 14 tests in ' "$private/$mode.private" || {
              echo 'LAS_DEADLOCK_RESTORED=FAIL:VACUOUS_UNIT_CENSUS'; exit 1
            }
            grep -Fxq 'OK' "$private/$mode.private" || {
              echo 'LAS_DEADLOCK_RESTORED=FAIL:UNIT_RESULT'; exit 1
            }
          done
          mkdir -m700 "$private/models"
          if ! python3 -I -B "$work/check_restored_deadlocks.py" \
                --source "$PWD" --jar "$jar" --work "$private/models" \
                > "$private/verdict.private" 2>&1; then
            echo 'LAS_DEADLOCK_RESTORED=FAIL:NATIVE_CHECKER'; exit 1
          fi
          grep -Fxq 'LAS_DEADLOCK_RESTORED=2_BOUNDED_CHECKS_PASS_NOT_GLOBAL_OR_RELEASE' \
               "$private/verdict.private" || {
            echo 'LAS_DEADLOCK_RESTORED=FAIL:RESULT_NOT_EXACT'; exit 1
          }
          [[ -z "$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all)" ]] || {
            echo 'LAS_DEADLOCK_RESTORED=FAIL:SOURCE_DRIFT'; exit 1
          }
          echo 'LAS_DEADLOCK_RESTORED=2_BOUNDED_CHECKS_PASS_NOT_GLOBAL_OR_RELEASE'

      - name: Scrub private source and TLC traces
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$RUNNER_TEMP/private-source"
          find "$RUNNER_TEMP" -maxdepth 1 -name 'las-root-diff.*' -type d -exec rm -rf -- {} +
          rm -f -- "$RUNNER_TEMP/private-heads" "$RUNNER_TEMP/secret-fetch-error"
          echo 'LAS_ROOT_TLC=EPHEMERAL_CLEANUP'

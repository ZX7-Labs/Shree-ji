name: Pinned TLC174 public synthetic checkpoint recovery probe
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/opaque-tlc174-synthetic-checkpoint-recovery-probe-20261109.yml"
permissions:
  contents: read
concurrency:
  group: pinned-tlc174-public-checkpoint-probe
  cancel-in-progress: false
jobs:
  public-synthetic-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Download checksum-pinned original TLC 1.7.4 Java binary
        shell: bash
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/tla2tools.jar"
          if ! curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 --output "$jar" "https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar" >"$RUNNER_TEMP/jar-fetch.log" 2>&1; then
            rm -f "$jar"
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 --output "$jar" "https://sourceforge.net/projects/tlaplus.mirror/files/v1.7.4/tla2tools.jar/download" >"$RUNNER_TEMP/jar-fallback.log" 2>&1
          fi
          echo "bee4a54f3ee3d4afc347c3240ec2d9e93b075104  $jar" | sha1sum --strict --check >/dev/null
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $jar" | sha256sum --strict --check >/dev/null
          echo "LAS_SYNTH_TLC174_JAR=PASS"

      - name: Create a real JMX checkpoint and compare recovered full graph to independent baseline
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/synthetic-jmx-recovery"
          mkdir -p "$root/original" "$root/direct" "$root/state"
          cd "$root/original"
          cat > ResumeProbe.tla <<'TLA'
          ---------------- MODULE ResumeProbe ----------------
          EXTENDS Integers
          VARIABLE x
          Init == x = 0
          Next == /\ x < 20000000
                  /\ x' = x + 1
          Spec == Init /\ [][Next]_x
          TypeOK == x \in 0..20000000
          ====================================================
          TLA
          cat > ResumeProbe.cfg <<'CFG'
          SPECIFICATION Spec
          INVARIANT TypeOK
          CHECK_DEADLOCK FALSE
          CFG
          cp ResumeProbe.tla ResumeProbe.cfg "$root/direct/"
          cmp ResumeProbe.tla "$root/direct/ResumeProbe.tla"
          cmp ResumeProbe.cfg "$root/direct/ResumeProbe.cfg"
          # Local Attach API avoids exposing any network JMX management port.
          cat > "$root/TriggerCheckpoint.java" <<'JAVA'
          import com.sun.tools.attach.VirtualMachine;
          import javax.management.MBeanServerConnection;
          import javax.management.ObjectName;
          import javax.management.remote.JMXConnector;
          import javax.management.remote.JMXConnectorFactory;
          import javax.management.remote.JMXServiceURL;
          public final class TriggerCheckpoint {
              public static void main(String[] args) throws Exception {
                  VirtualMachine vm = VirtualMachine.attach(args[0]);
                  String url;
                  try {
                      url = vm.getAgentProperties().getProperty(
                              "com.sun.management.jmxremote.localConnectorAddress");
                      if (url == null) url = vm.startLocalManagementAgent();
                  } finally {
                      vm.detach();
                  }
                  try (JMXConnector conn = JMXConnectorFactory.connect(new JMXServiceURL(url))) {
                      MBeanServerConnection server = conn.getMBeanServerConnection();
                      ObjectName name = new ObjectName("tlc2.tool:type=ModelChecker");
                      if (!server.isRegistered(name)) {
                          throw new IllegalStateException("ModelChecker MBean not yet registered");
                      }
                      server.invoke(name, "checkpoint", new Object[0], new String[0]);
                  }
                  System.out.println("LAS_SYNTH_JMX_CHECKPOINT_REQUEST=PASS");
              }
          }
          JAVA
          javac --add-modules jdk.attach "$root/TriggerCheckpoint.java"
          java -XX:+UseParallelGC -Xmx1536m -jar "$RUNNER_TEMP/tla2tools.jar" \
            -workers 1 -fp 0 -lncheck final -checkpoint 1 \
            -metadir "$root/state" -config ResumeProbe.cfg ResumeProbe >"$root/interrupt.log" 2>&1 &
          pid=$!
          alive=1
          trap 'if kill -0 "$pid" 2>/dev/null; then kill -TERM "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; fi' EXIT
          trigger_ok=0
          for attempt in $(seq 1 20); do
            if ! kill -0 "$pid" 2>/dev/null; then
              break
            fi
            if timeout 9s java --add-modules jdk.attach -cp "$root" TriggerCheckpoint "$pid" >"$root/jmx.log" 2>&1; then
              trigger_ok=1
              break
            fi
            sleep 1
          done
          if [[ "$trigger_ok" -ne 1 ]]; then
            echo "LAS_SYNTH_JMX_TRIGGER=INCOMPLETE"
            sed -n '1,28p' "$root/jmx.log" || true
            tail -n 15 "$root/interrupt.log" || true
            exit 1
          fi
          checkpoint_ok=0
          for attempt in $(seq 1 105); do
            if grep -Eiq 'checkpoint.*(complete|finished|writ|successful|done)' "$root/interrupt.log" && \
                [[ "$(find "$root/state" -type f | wc -l)" -gt 1 ]]; then
              checkpoint_ok=1
              break
            fi
            sleep 1
          done
          if [[ "$checkpoint_ok" -ne 1 ]]; then
            echo "LAS_SYNTH_CHECKPOINT=INCOMPLETE"
            find "$root/state" -maxdepth 2 -type f -printf '%f %s bytes\n' | head -n 20
            grep -i 'checkpoint' "$root/interrupt.log" | tail -n 8 || true
            exit 1
          fi
          test "$(grep -F 'LAS_SYNTH_JMX_CHECKPOINT_REQUEST=PASS' "$root/jmx.log" | wc -l)" -eq 1
          kill -TERM "$pid" 2>/dev/null || true
          set +e
          wait "$pid"
          interrupt_rc=$?
          set -e
          trap - EXIT
          if [[ "$interrupt_rc" -eq 0 ]]; then
            echo "LAS_SYNTH_INTERRUPTED=INCONCLUSIVE_FINISHED"
            exit 1
          fi
          checkpointdir="$(find "$root/state" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          if [[ -z "$checkpointdir" || ! -d "$checkpointdir" ]]; then
            echo "LAS_SYNTH_CHECKPOINT_DIRECTORY=MISSING"
            exit 1
          fi
          echo "LAS_SYNTH_JMX_CHECKPOINT=CREATED"
          cd "$root/original"
          set +e
          timeout --signal=TERM --kill-after=5s 100s \
            java -XX:+UseParallelGC -Xmx1536m -jar "$RUNNER_TEMP/tla2tools.jar" \
            -workers 1 -fp 0 -lncheck final -checkpoint 1 \
            -recover "$checkpointdir" -config ResumeProbe.cfg ResumeProbe >"$root/recover.log" 2>&1
          recover_rc=$?
          set -e
          if [[ "$recover_rc" -ne 0 ]]; then
            echo "LAS_SYNTH_RESUME=INCOMPLETE_RC_$recover_rc"
            tail -n 40 "$root/recover.log"
            exit 1
          fi
          cd "$root/direct"
          timeout --signal=TERM --kill-after=5s 100s \
            java -XX:+UseParallelGC -Xmx1536m -jar "$RUNNER_TEMP/tla2tools.jar" \
            -workers 1 -fp 0 -lncheck final -config ResumeProbe.cfg ResumeProbe >"$root/direct.log" 2>&1
          python3 - "$root/recover.log" "$root/direct.log" <<'PY'
          import re, sys
          from pathlib import Path
          results = []
          for fn in sys.argv[1:]:
              log = Path(fn).read_text(errors="replace")
              if "Model checking completed. No error has been found." not in log or "Finished in " not in log:
                  raise SystemExit("TLC completion marker missing")
              matches = re.findall(r"([0-9,]+) states generated,\s*([0-9,]+) distinct states found,\s*([0-9,]+) states left on queue", log)
              if not matches:
                  raise SystemExit("terminal state counters missing")
              generated, distinct, queue = (int(s.replace(",", "")) for s in matches[-1])
              if distinct != 20000001 or queue != 0 or generated < distinct:
                  raise SystemExit("incomplete or unexpected graph")
              results.append((generated, distinct, queue))
          if results[0] != results[1]:
              raise SystemExit("resumed/direct terminal counters disagree")
          print("LAS_SYNTH_COMPLETE_GRAPH=20000001")
          print("LAS_SYNTH_RECOVERY_EQUIVALENCE=PASS")
          PY

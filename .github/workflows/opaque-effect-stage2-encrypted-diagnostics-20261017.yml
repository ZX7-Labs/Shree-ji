name: Opaque retired effect stage3 encrypted diagnostics 20261017

on:
  push:
    branches:
      - "verify/reconciled-baseline-repair-v3-bd95-20261017"
    paths:
      - ".github/workflows/opaque-effect-stage2-encrypted-diagnostics-20261017.yml"

permissions:
  contents: read

env:
  BASE_REF_HASH: 060aa23045ded14f2e9984282456adce3cd5fa94bd92f21f4eeacae5d41abff2
  BASE_SNAPSHOT_PROOF: bd4d73399dc34da2586900c270f6b33f2a1049e934472301f5546ad9973cc49e
  BASE_TREE_PROOF: 93bcdc3d05cc578589d0600beb22d21dda366b5cd9fd81cc31f4f487d9e35981
  EXPECTED_GREEN_BASELINE_TREE: ffc6621866ec4353d070d74746e0a2de8a9a9d20
  EFFECT_REF_HASH: 57902b32c7dba883a89cd5a6e47dea395ab8a06b111c3dcdcd0487d67f010f58
  EFFECT_SNAPSHOT_PROOF: a7a261a6bcfd853332fccc548b03030f8255338d133c26a0bbcefc2c0b78a611
  EFFECT_TREE_PROOF: 8c31aef6a04a5b1c1b2a3c555abf393c8327bcf700a7bc2adfede624b133784a
  EFFECT_OWNER_BLOB: bb4f6e5c803b7c64ea27e605659cf998fc942cc2
  EFFECT_SEMANTIC_BLOB: 6fb90f15a1194d596f420ebee9f0ed3e4ae2b112
  EFFECT_RECOVERY_BLOB: 67746f8a4776b872b3878f6861eb3bb7658a9fbd
  EFFECT_BORROW_BLOB: 039db692cf34f1b967896b14d8c30f3bb2a070ad
  EFFECT_HARNESS_BLOB: 8881d312f2f679f1c53f60402d05ea83e7e89a15
  BRIDGE_CERT_DER_B64: 

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Recover exact private inputs
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY" && test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"; echo "::add-mask::$PRIVATE_TOKEN"
          root="$RUNNER_TEMP/private"; mkdir "$root"; cd "$root"; git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"; echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/refs"; git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          base_ref=; base_sha=; effect_ref=; effect_sha=
          while read -r sha ref; do
            h="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$h" = "$BASE_REF_HASH" ]]; then base_ref="$ref"; base_sha="$sha"; fi
            if [[ "$h" = "$EFFECT_REF_HASH" ]]; then effect_ref="$ref"; effect_sha="$sha"; fi
          done <"$refs"
          rm -f "$refs"; test -n "$base_ref" && test -n "$effect_ref"
          echo "::add-mask::$base_ref"; echo "::add-mask::$effect_ref"; echo "::add-mask::$base_sha"; echo "::add-mask::$effect_sha"
          test "$(printf '%s' "$base_sha" | sha256sum | awk '{print $1}')" = "$BASE_SNAPSHOT_PROOF"
          test "$(printf '%s' "$effect_sha" | sha256sum | awk '{print $1}')" = "$EFFECT_SNAPSHOT_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=96 origin "$base_ref" "$effect_ref"
          git checkout -q -B verify-baseline-target "$base_sha"
          test "$(printf '%s' "$(git rev-parse 'HEAD^{tree}')" | sha256sum | awk '{print $1}')" = "$BASE_TREE_PROOF"
          test "$(printf '%s' "$(git rev-parse "$effect_sha^{tree}")" | sha256sum | awk '{print $1}')" = "$EFFECT_TREE_PROOF"
          git cat-file blob "$EFFECT_OWNER_BLOB" >"$RUNNER_TEMP/effect-owner.py"
          git cat-file blob "$EFFECT_SEMANTIC_BLOB" >"$RUNNER_TEMP/effect-semantic.py"
          git cat-file blob "$EFFECT_RECOVERY_BLOB" >"$RUNNER_TEMP/effect-recovery.py"
          git cat-file blob "$EFFECT_BORROW_BLOB" >"$RUNNER_TEMP/effect-borrow.py"
          git cat-file blob "$EFFECT_HARNESS_BLOB" >"$RUNNER_TEMP/effect-stage3.sh"
          chmod 0700 "$RUNNER_TEMP/effect-stage3.sh"
          printf 'WORK_ROOT=%s\nBASE_SHA=%s\n' "$root" "$base_sha" >>"$GITHUB_ENV"

      - name: Install exact toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null
          archive="$RUNNER_TEMP/alr.zip"; prefix="$RUNNER_TEMP/alr"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --silent --show-error --output "$archive" "https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip"
          echo "09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  $archive" | sha256sum --check --strict >/dev/null
          mkdir -p "$prefix"; unzip -q "$archive" -d "$prefix"; export PATH="$prefix/bin:$PATH"
          alr -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1 >/dev/null
          workspace="$RUNNER_TEMP/alr-work"; mkdir -p "$workspace"; cd "$workspace"
          alr -n init --in-place --no-skel --lib effect_diag >/dev/null
          alr_path="$(command -v alr)"; wrapper="$RUNNER_TEMP/gprbuild-via-alire"
          printf '%s\n' '#!/usr/bin/env bash' 'set -euo pipefail' "cd \"$workspace\"" "exec \"$alr_path\" exec -- gprbuild \"\$@\"" >"$wrapper"
          chmod 0755 "$wrapper"; printf 'GPRBUILD=%s\n' "$wrapper" >>"$GITHUB_ENV"

      - name: Reproduce stage3 failure and encrypt diagnostics
        shell: bash
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          cd "$WORK_ROOT"
          python3 tools/verification/private_reconciled_baseline_repair.py
          python3 tools/verification/private_reconciled_baseline_visibility_repair.py
          python3 tools/verification/private_reconciled_baseline_clippy_contract_repair.py
          cargo +1.98.1 fmt --all; git add src
          test "$(git write-tree)" = "$EXPECTED_GREEN_BASELINE_TREE"
          git config user.name "LAS Ephemeral Verification Canonicalizer"; git config user.email "las-ephemeral-verifier@users.noreply.github.com"
          git commit -q -m "Ephemeral exact verified green baseline"
          effect_root="$RUNNER_TEMP/effect-work"; git worktree add -q -b verify-effect-target "$effect_root" HEAD; cd "$effect_root"
          mkdir -p tools/verification
          install -m 0644 "$RUNNER_TEMP/effect-owner.py" tools/verification/private_retired_effect_owner_adapter_materialize.py
          install -m 0644 "$RUNNER_TEMP/effect-semantic.py" tools/verification/private_retired_effect_schema_semantic_repair.py
          install -m 0644 "$RUNNER_TEMP/effect-recovery.py" tools/verification/private_retired_effect_recovery_congruence_hardening.py
          install -m 0644 "$RUNNER_TEMP/effect-borrow.py" tools/verification/private_retired_effect_archive_borrow_repair.py
          git add tools/verification; git commit -q -m "Ephemeral retired effect stage3 verifier overlay"
          package="$RUNNER_TEMP/package"; mkdir -p "$package"
          set +e
          LAS_EFFECT_BASE_SHA="$(git rev-parse HEAD)" LAS_EFFECT_PACKAGE_DIR="$package/candidate" LAS_EFFECT_EXPECTED_BRANCH=verify-effect-target bash "$RUNNER_TEMP/effect-stage3.sh" >"$package/effect-verification.log" 2>&1
          rc=$?
          set -e
          printf '{"exit_code":%s}\n' "$rc" >"$package/verdict.json"
          tarball="$RUNNER_TEMP/effect-diagnostics.tar.gz"; tar -C "$package" -czf "$tarball" .
          printf '%s' "$BRIDGE_CERT_DER_B64" | base64 -d >"$RUNNER_TEMP/cert.der"
          openssl x509 -inform DER -in "$RUNNER_TEMP/cert.der" -out "$RUNNER_TEMP/cert.pem"
          openssl cms -encrypt -binary -aes256 -outform DER -recip "$RUNNER_TEMP/cert.pem" -in "$tarball" -out "$RUNNER_TEMP/effect-diagnostics.p7m"
          echo "LAS_EFFECT_STAGE3_DIAGNOSTIC_CIPHERTEXT_SHA256=$(sha256sum "$RUNNER_TEMP/effect-diagnostics.p7m" | awk '{print $1}')"
          if [[ "$rc" -eq 0 ]]; then echo "LAS_EFFECT_STAGE3_DIAGNOSTIC_RESULT=PASS"; else echo "LAS_EFFECT_STAGE3_DIAGNOSTIC_RESULT=FAIL"; fi
          exit "$rc"

      - name: Upload encrypted diagnostics only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opaque-effect-stage3-encrypted-diagnostics-20261017
          path: ${{ runner.temp }}/effect-diagnostics.p7m
          if-no-files-found: error
          retention-days: 1

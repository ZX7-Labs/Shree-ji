name: Exact private scoped native evidence (research only)

on:
  push:
    branches:
      - quarantine/assurance-scoped-native-bridge-20261031
    paths:
      - .github/workflows/assurance-scoped-native-proof-017.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fixed-private-native-proof-017
  cancel-in-progress: false

jobs:
  native-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      # Only non-sensitive one-way proofs appear in the PUBLIC shell.
      TARGET_BRANCH_PROOF: 774cc535bc480e300fe6c1835c654bbebf47345db1fb7240a37ba017dcf396f6
      EXPECTED_PRIVATE_COMMIT_PROOF: ccfa6613eb0ec294a2077279b41bbd55dade31d8e774f5972791e8e444172880
      EXPECTED_PRIVATE_TEST_RUNNER_SHA256: 529de5130fd7f8cb9331fb535e8c762ec75afae6143fbe879c3917bd926495df
    steps:
      - name: Recover one privately pinned source revision
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_READ_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$PRIVATE_REPOSITORY" || -z "$PRIVATE_READ_TOKEN" ]]; then
            echo 'LAS_BRIDGE=FAIL:ACCESS'; exit 1
          fi
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_READ_TOKEN"
          private="$RUNNER_TEMP/private-source"
          mkdir -m 700 "$private"
          cd "$private"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          authorization="$(printf 'x-access-token:%s' "$PRIVATE_READ_TOKEN" | base64 -w0)"
          echo "::add-mask::$authorization"
          all_refs="$RUNNER_TEMP/private-heads"
          git -c core.fsmonitor=false -c http.extraHeader="AUTHORIZATION: basic $authorization" \
            ls-remote --heads origin > "$all_refs" 2> "$RUNNER_TEMP/secret-fetch-error"
          match=''
          while read -r _sha candidate; do
            candidate_proof="$(printf '%s' "$candidate" | sha256sum | awk '{print $1}')"
            if [[ "$candidate_proof" == "$TARGET_BRANCH_PROOF" ]]; then
              [[ -z "$match" ]] || { echo 'LAS_BRIDGE=FAIL:AMBIGUOUS_REF'; exit 1; }
              match="$candidate"
            fi
          done < "$all_refs"
          rm -f "$all_refs" "$RUNNER_TEMP/secret-fetch-error"
          [[ -n "$match" ]] || { echo 'LAS_BRIDGE=FAIL:TARGET'; exit 1; }
          echo "::add-mask::$match"
          git -c core.fsmonitor=false -c http.extraHeader="AUTHORIZATION: basic $authorization" \
            fetch -q --depth=1 origin "$match" > /dev/null 2> "$RUNNER_TEMP/secret-fetch-error"
          rm -f "$RUNNER_TEMP/secret-fetch-error"
          unset authorization PRIVATE_READ_TOKEN PRIVATE_REPOSITORY
          git -c core.fsmonitor=false checkout -q --detach FETCH_HEAD
          actual="$(git -c core.fsmonitor=false rev-parse --verify HEAD)"
          echo "::add-mask::$actual"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          if [[ "$proof" != "$EXPECTED_PRIVATE_COMMIT_PROOF" ]]; then
            echo 'LAS_BRIDGE=FAIL:SOURCE_PROOF'; exit 1
          fi
          if [[ -n "$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all)" ]]; then
            echo 'LAS_BRIDGE=FAIL:DIRTY'; exit 1
          fi
          test_runner='tools/verification/run_bridge_native_suite.sh'
          if ! printf '%s  %s\n' "$EXPECTED_PRIVATE_TEST_RUNNER_SHA256" "$test_runner" |
               sha256sum --check --strict >/dev/null 2>&1; then
            echo 'LAS_BRIDGE=FAIL:RUNNER_SOURCE'; exit 1
          fi
          echo "LAS_PRIVATE_SOURCE_PROOF=$proof"
          echo 'LAS_BRIDGE=EXACT_SOURCE_READY'

      - name: Run exact native checks without access to private checkout token
        shell: bash
        run: |
          set -euo pipefail
          private="$RUNNER_TEMP/private-source"
          log="$RUNNER_TEMP/private-native-receipt"
          # Raw private test output is NEVER written to public GitHub Actions logs.
          if ! bash "$private/tools/verification/run_bridge_native_suite.sh" "$private" > "$log" 2>&1; then
            # Emit ONLY a known synthetic status code, never raw private test stderr.
            safe="$(grep -m1 -E '^LAS_NATIVE_SCOPED=FAIL:(ARGUMENT|ENV|CHECKOUT|SOURCE|WORKFLOW|SOURCE_SET|STAGE_[0-9]+|COUNT_[0-9]+|IDENTITIES_[0-9]+|REVISION_DRIFT)$' "$log" || true)"
            if [[ -n "$safe" ]]; then echo "$safe"; fi
            echo 'LAS_BRIDGE=FAIL:NATIVE'; exit 1
          fi
          grep -Fxq 'LAS_NATIVE_SCOPED=PASS' "$log" || { echo 'LAS_BRIDGE=FAIL:NATIVE_MARKER'; exit 1; }
          grep -Fxq 'LAS_NATIVE_STAGES=12' "$log" || { echo 'LAS_BRIDGE=FAIL:STAGES'; exit 1; }
          grep -Fxq 'LAS_NATIVE_CASES=240' "$log" || { echo 'LAS_BRIDGE=FAIL:NONVACUITY'; exit 1; }
          grep -Fxq "LAS_PRIVATE_PROOF=$EXPECTED_PRIVATE_COMMIT_PROOF" "$log" || {
            echo 'LAS_BRIDGE=FAIL:SOURCE_CHANGED'; exit 1
          }
          rm -f "$log"
          echo 'LAS_BRIDGE=SCOPED_NATIVE_PASS_NOT_RELEASE_ACCEPTANCE'

      - name: Run pinned private Rust source gates without private credentials
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-source"
          diagnostics="$RUNNER_TEMP/private-rust-diagnostics"
          mkdir -m 700 "$diagnostics"
          # Only the generic stage/status is public. No private compiler text.
          if ! rustup toolchain install 1.98.1 --profile minimal >"$diagnostics/toolchain" 2>&1 ||
             ! rustup component add --toolchain 1.98.1 rustfmt clippy >>"$diagnostics/toolchain" 2>&1; then
            echo 'LAS_RUST_SCOPE=FAIL:TOOLCHAIN'; exit 1
          fi
          if ! cargo +1.98.1 fmt --all -- --check >"$diagnostics/fmt" 2>&1; then
            echo 'LAS_RUST_SCOPE=FAIL:FORMAT'; exit 1
          fi
          if ! RUSTFLAGS=-Dwarnings cargo +1.98.1 check --locked --all-targets --message-format=json >"$diagnostics/check" 2>&1; then
            # Only opaque file hashes, safe Rust error codes and line numbers
            # leave the private runner. Raw diagnostics remain ephemeral.
            python3 -I -B - "$diagnostics/check" <<'PY'
          import hashlib, json, re, sys
          count = 0
          try:
              with open(sys.argv[1], encoding='utf-8', errors='replace') as source:
                  for raw in source:
                      try:
                          record = json.loads(raw)
                      except (ValueError, TypeError):
                          continue
                      if record.get('reason') != 'compiler-message':
                          continue
                      msg = record.get('message', {})
                      if msg.get('level') != 'error':
                          continue
                      code = (msg.get('code') or {}).get('code') or 'UNKNOWN'
                      if not re.fullmatch(r'(?:E[0-9]{4}|[a-z][a-z0-9_]{0,47})', code):
                          code = 'UNKNOWN'
                      spans = msg.get('spans') or []
                      span = next((v for v in spans if v.get('is_primary')), spans[0] if spans else {})
                      path = str(span.get('file_name', 'UNKNOWN')).replace('\\', '/')
                      # Use only a canonical relative path. Never print it.
                      if path.startswith('/') or '..' in path.split('/'):
                          path = 'UNKNOWN'
                      proof = hashlib.sha256(path.encode()).hexdigest()[:16]
                      line = span.get('line_start', 0)
                      if not isinstance(line, int) or not 0 <= line <= 1000000:
                          line = 0
                      count += 1
                      if count <= 30:
                          print(f'LAS_RUST_OPAQUE_ERROR={code}:{proof}:{line}')
          except OSError:
              pass
          print(f'LAS_RUST_OPAQUE_ERROR_COUNT={count}')
          PY
            echo 'LAS_RUST_SCOPE=FAIL:DEFAULT_CHECK'; exit 1
          fi
          if ! RUSTFLAGS=-Dwarnings cargo +1.98.1 check --locked --features linux-peer-credentials --all-targets >"$diagnostics/linux-check" 2>&1; then
            echo 'LAS_RUST_SCOPE=FAIL:LINUX_CHECK'; exit 1
          fi
          if ! cargo +1.98.1 clippy --locked --all-targets -- -D warnings >"$diagnostics/clippy" 2>&1; then
            echo 'LAS_RUST_SCOPE=FAIL:CLIPPY'; exit 1
          fi
          if ! RUSTFLAGS=-Dwarnings cargo +1.98.1 test --locked --all-targets -- --test-threads=1 >"$diagnostics/tests" 2>&1; then
            echo 'LAS_RUST_SCOPE=FAIL:DEFAULT_TESTS'; exit 1
          fi
          if ! grep -Eq '^test result: ok\. [1-9][0-9]* passed;' "$diagnostics/tests"; then
            echo 'LAS_RUST_SCOPE=FAIL:VACUOUS_TESTS'; exit 1
          fi
          if [[ -n "$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all)" ]]; then
            echo 'LAS_RUST_SCOPE=FAIL:SOURCE_DRIFT'; exit 1
          fi
          rm -rf -- "$diagnostics"
          echo 'LAS_RUST_SCOPE=SCOPED_DEFAULT_RUST_PASS_NOT_RELEASE_ACCEPTANCE'

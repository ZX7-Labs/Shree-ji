name: Private assurance profile39 safety-prefix closure

on:
  push:
    branches: [main]
    paths:
      - "RUN_ASSURANCE_PROFILE39_SAFETY_PREFIX_CLOSURE"

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject obsolete historical profile39 closure
        shell: bash
        run: |
          set -euo pipefail
          echo "LAS_ASSURANCE_PROFILE39_SAFETY_PREFIX_CLOSURE=RETIRED"
          echo "Canonical profile39 evidence is bound to the repaired-202 TLC39 v3 continuation, exact terminal attestation, and repaired 202-profile aggregate closure."
          exit 1

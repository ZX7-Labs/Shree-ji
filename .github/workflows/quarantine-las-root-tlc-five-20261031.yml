name: Quarantine exact Root service five-profile TLC
on:
  push:
    branches:
      - quarantine/las-native-python-98-exact-20261031
    paths:
      - .github/workflows/quarantine-las-root-tlc-five-20261031.yml
permissions:
  contents: read
jobs:
  source-pinned-five-tlc:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_BRANCH_PROOF: 2e7d4bb17d6ca183c895b195861e75f8bfd9de9b031d4b4306a0e7ad836de47e
      EXPECTED_PRIVATE_COMMIT_PROOF: 6a2f0085f0f7fe676155389c9720e431312025b8c237279efd801656c536ce86
      EXPECTED_PRIVATE_RUNNER_BLOB_PROOF: d4df90336770cf5275996ccf750325a091b071a86a708799281845dc0eb5c74f
    steps:
      - name: Recover exact read-only private source without publishing code
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_READ_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$PRIVATE_REPOSITORY" || -z "$PRIVATE_READ_TOKEN" ]]; then
            echo 'LAS_NATIVE_BRIDGE=FAIL:ACCESS'; exit 1
          fi
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_READ_TOKEN"
          private="$RUNNER_TEMP/private-source"
          mkdir -m 700 "$private"
          cd "$private"
          git init -q
          git remote add origin "https://github.com/$PRIVATE_REPOSITORY.git"
          authorization="$(printf 'x-access-token:%s' "$PRIVATE_READ_TOKEN" | base64 -w0)"
          echo "::add-mask::$authorization"
          all_refs="$RUNNER_TEMP/private-heads"
          git -c core.fsmonitor=false -c http.extraHeader="AUTHORIZATION: basic $authorization" ls-remote --heads origin > "$all_refs" 2> "$RUNNER_TEMP/secret-fetch-error" || {
            echo 'LAS_NATIVE_BRIDGE=FAIL:READ'; exit 1
          }
          match=''
          while read -r _sha candidate; do
            candidate_proof="$(printf '%s' "$candidate" | sha256sum | awk '{print $1}')"
            if [[ "$candidate_proof" == "$TARGET_BRANCH_PROOF" ]]; then
              [[ -z "$match" ]] || { echo 'LAS_NATIVE_BRIDGE=FAIL:AMBIGUOUS_REF'; exit 1; }
              match="$candidate"
            fi
          done < "$all_refs"
          rm -f "$all_refs" "$RUNNER_TEMP/secret-fetch-error"
          [[ -n "$match" ]] || { echo 'LAS_NATIVE_BRIDGE=FAIL:TARGET'; exit 1; }
          echo "::add-mask::$match"
          git -c core.fsmonitor=false -c http.extraHeader="AUTHORIZATION: basic $authorization" fetch -q --depth=1 origin "$match" > /dev/null 2> "$RUNNER_TEMP/secret-fetch-error" || {
            echo 'LAS_NATIVE_BRIDGE=FAIL:FETCH'; exit 1
          }
          rm -f "$RUNNER_TEMP/secret-fetch-error"
          unset authorization PRIVATE_READ_TOKEN PRIVATE_REPOSITORY
          git -c core.fsmonitor=false checkout -q --detach FETCH_HEAD
          actual="$(git -c core.fsmonitor=false rev-parse --verify HEAD)"
          echo "::add-mask::$actual"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          [[ "$proof" == "$EXPECTED_PRIVATE_COMMIT_PROOF" ]] || {
            echo 'LAS_NATIVE_BRIDGE=FAIL:SOURCE_PIN'; exit 1
          }
          [[ -z "$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all)" ]] || {
            echo 'LAS_NATIVE_BRIDGE=FAIL:DIRTY'; exit 1
          }
          script='tools/verification/run_bridge_native_suite.sh'
          [[ -f "$script" && ! -L "$script" ]] || {
            echo 'LAS_NATIVE_BRIDGE=FAIL:RUNNER_MISSING'; exit 1
          }
          blob="$(git -c core.fsmonitor=false hash-object "$script")"
          blob_proof="$(printf '%s' "$blob" | sha256sum | awk '{print $1}')"
          [[ "$blob_proof" == "$EXPECTED_PRIVATE_RUNNER_BLOB_PROOF" ]] || {
            echo 'LAS_NATIVE_BRIDGE=FAIL:RUNNER_PIN'; exit 1
          }
          echo "LAS_NATIVE_BRIDGE=SOURCE_PINNED:$proof"

      - name: Check five exact private Root service models with TLC 1.7.4
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: -Xmx5g
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-source"
          private="$(mktemp -d "$RUNNER_TEMP/las-root-tlc.XXXXXXXX")"
          chmod 700 "$private"
          jar="$private/tla2tools.jar"
          if ! curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
                  --output "$jar" \
                  "https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar" \
                  > "$private/fetch.private" 2>&1; then
            echo 'LAS_ROOT_TLC=FAIL:TOOL_FETCH'; exit 1
          fi
          printf 'bee4a54f3ee3d4afc347c3240ec2d9e93b075104  %s\n' "$jar" |
            sha1sum --check --strict > "$private/jarcheck.private" 2>&1 || {
            echo 'LAS_ROOT_TLC=FAIL:TOOL_PIN'; exit 1
          }
          python3 -I -B - "$private/models.private" <<'PY_CENSUS' || {
          import pathlib,re,sys
          source=pathlib.Path(".github/workflows/root-authority-tlc.yml").read_text(encoding="utf-8")
          tag="      - name: Parse Root Authority specifications"
          fence="      - name: Exhaustively model-check Root Authority profiles"
          if source.count(tag)!=1 or source.count(fence)!=1:raise SystemExit(1)
          sec=source.split(tag,1)[1].split(fence,1)[0]
          names=re.findall(r"(?m)^\s+spec/root_authority/([A-Za-z_][A-Za-z0-9_]*)\.tla\s*$",sec)
          if len(names)!=9 or len(set(names))!=9:raise SystemExit(1)
          chosen=names[1:6]
          for stem in chosen:
              base=pathlib.Path("spec/root_authority")/stem
              for suffix in (".tla",".cfg"):
                  file=base.with_suffix(suffix)
                  if not file.is_file() or file.is_symlink():raise SystemExit(1)
              cfg=base.with_suffix(".cfg").read_text(encoding="utf-8")
              if "SPECIFICATION Spec" not in cfg or "INVARIANTS" not in cfg:raise SystemExit(1)
          pathlib.Path(sys.argv[1]).write_text("\n".join(chosen)+"\n")
          PY_CENSUS
            echo 'LAS_ROOT_TLC=FAIL:SOURCE_CENSUS'; exit 1
          }
          count=0
          while IFS= read -r stem; do
            count=$((count+1))
            [[ "$count" -le 5 && "$stem" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || {
              echo 'LAS_ROOT_TLC=FAIL:MODEL_ID'; exit 1
            }
            model="spec/root_authority/$stem.tla"
            cfg="spec/root_authority/$stem.cfg"
            logfile="$private/profile-$count.private"
            if java -XX:+UseParallelGC -jar "$jar" -workers 2 -fp 0 \
                -config "$cfg" "$model" >"$logfile" 2>&1; then
              java_rc=0
            else
              java_rc=$?
            fi
            if ! python3 -I -B tools/verification/canonical_tlc_result_evidence.py \
                "$logfile" "$java_rc" 0 >"$private/classifier-$count.private" 2>&1; then
              echo "LAS_ROOT_TLC=FAIL:PROFILE_$count"; exit 1
            fi
            echo "LAS_ROOT_TLC=PROFILE_${count}_PASS"
          done < "$private/models.private"
          [[ "$count" -eq 5 ]] || { echo 'LAS_ROOT_TLC=FAIL:COUNT'; exit 1; }
          [[ -z "$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all)" ]] || {
            echo 'LAS_ROOT_TLC=FAIL:SOURCE_DRIFT'; exit 1
          }
          echo 'LAS_ROOT_TLC=SCOPED_FIVE_PROFILE_PASS_NOT_202_OR_RELEASE'

      - name: Scrub private source and TLC traces
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$RUNNER_TEMP/private-source"
          find "$RUNNER_TEMP" -maxdepth 1 -name 'las-root-tlc.*' -type d -exec rm -rf -- {} +
          rm -f -- "$RUNNER_TEMP/private-heads" "$RUNNER_TEMP/secret-fetch-error"
          echo 'LAS_ROOT_TLC=EPHEMERAL_CLEANUP'

name: Rebind current sharded verifier to repaired snapshot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rebind-current-sharded-verify-20261015.yml"

permissions:
  contents: write

jobs:
  rebind:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout public control shell
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2

      - name: Rebind exact snapshot proof and trigger canonical run
        shell: bash
        env:
          OLD_PROOF: 10b93b9415f901b8023e844fb7fb497a80da7606755c9c8b9a407378ae272276
          NEW_PROOF: 1b139dc7920e82d5f9bdd2a68c072ad88bc0049d5ef1377380899164da5f93f9
          EXPECTED_REF_HASH: 28a52175bfc55f4f8b2b0f4312cd2616a65a7082555149f4382746e2254e1b26
          EXPECTED_VERIFIER_BLOB: 62e3e6dc0fad5dddc7fb0a453a3cd681d911e590
        run: |
          set -euo pipefail
          target=".github/workflows/private-current-sharded-verify.yml"

          git fetch -q origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

          python3 - "$target" "$OLD_PROOF" "$NEW_PROOF" "$EXPECTED_REF_HASH" "$EXPECTED_VERIFIER_BLOB" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          old, new, ref_hash, verifier_blob = sys.argv[2:]
          text = path.read_text(encoding="utf-8")

          old_line = f"  EXPECTED_PRIVATE_SNAPSHOT_PROOF: {old}"
          new_line = f"  EXPECTED_PRIVATE_SNAPSHOT_PROOF: {new}"
          if text.count(old_line) != 1:
              raise SystemExit("old snapshot proof line is not unique")
          if new_line in text:
              raise SystemExit("new snapshot proof already present")
          if text.count(f"  TARGET_REF_HASH: {ref_hash}") != 1:
              raise SystemExit("target ref hash drifted")
          if text.count(f"  EXPECTED_VERIFIER_BLOB: {verifier_blob}") != 1:
              raise SystemExit("canonical verifier blob drifted")
          if text.count('  EXPECTED_TLC_PROFILE_COUNT: "191"') != 1:
              raise SystemExit("profile-count contract drifted")
          if text.count('  TLC_SHARD_COUNT: "191"') != 1:
              raise SystemExit("shard-count contract drifted")
          if text.count("LAS_PRIVATE_READ_TOKEN") != 2:
              raise SystemExit("read-only credential contract drifted")
          if "LAS_PRIVATE_WRITE_TOKEN" in text:
              raise SystemExit("write credential unexpectedly present")

          updated = text.replace(old_line, new_line, 1)
          if updated.count(new_line) != 1 or old_line in updated:
              raise SystemExit("snapshot proof replacement was not exact")
          path.write_text(updated, encoding="utf-8")
          PY

          printf '%s\n' 'REQUEST=repaired-root-ffi-current-exact-canonical-20261015-r1' > RUN_SHARDED_VERIFY

          test "$(git diff --numstat -- "$target" | awk '{print $1 ":" $2}')" = "1:1"
          git diff --check
          git status --short

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target" RUN_SHARDED_VERIFY
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "2"
          git commit -m "Verify repaired private snapshot canonically"

          git fetch -q origin main
          parent="$(git rev-parse HEAD^)"
          test "$parent" = "$(git rev-parse origin/main)"
          git push origin HEAD:main
          echo "LAS_CURRENT_SHARDED_REBIND=PASS"

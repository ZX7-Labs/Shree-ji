name: Private TLC31 opaque diagnostic (retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject obsolete TLC31 diagnostic
        shell: bash
        run: |
          set -euo pipefail
          echo "LAS_DIAG_TLC31=RETIRED"
          echo "This workflow is bound to a historical 129-profile candidate and is not part of the repaired current 202-profile assurance closure."
          exit 1

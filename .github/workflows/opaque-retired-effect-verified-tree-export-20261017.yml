name: Opaque verified retired effect tree export 20261017

on:
  push:
    branches:
      - "verify/reconciled-baseline-repair-v3-bd95-20261017"
    paths:
      - ".github/workflows/opaque-retired-effect-verified-tree-export-20261017.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_REF_HASH: 060aa23045ded14f2e9984282456adce3cd5fa94bd92f21f4eeacae5d41abff2
  BASE_SNAPSHOT_PROOF: bd4d73399dc34da2586900c270f6b33f2a1049e934472301f5546ad9973cc49e
  BASE_TREE_PROOF: 93bcdc3d05cc578589d0600beb22d21dda366b5cd9fd81cc31f4f487d9e35981
  EXPECTED_GREEN_BASELINE_TREE: ffc6621866ec4353d070d74746e0a2de8a9a9d20
  EXPECTED_EFFECT_TREE: 22fc9d344f483f99428698d5e1eb730ebee32c88
  EFFECT_REF_HASH: 57902b32c7dba883a89cd5a6e47dea395ab8a06b111c3dcdcd0487d67f010f58
  M1_BLOB: bb4f6e5c803b7c64ea27e605659cf998fc942cc2
  M2_BLOB: 6fb90f15a1194d596f420ebee9f0ed3e4ae2b112
  M3_BLOB: 67746f8a4776b872b3878f6861eb3bb7658a9fbd
  M4_BLOB: 13820e643e7d76cd087293429f6856183f4d9b07
  M5_BLOB: ace99b29dcf1ab6041d602247158f07ab13d41eb
  RSA_MODULUS_HEX: 
  RSA_EXPONENT: "65537"

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Recover exact private source and immutable materializers
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY" && test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"; echo "::add-mask::$PRIVATE_TOKEN"
          root="$RUNNER_TEMP/private"; mkdir "$root"; cd "$root"; git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"; echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/refs"; git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          base_ref=; base_sha=; effect_ref=
          while read -r sha ref; do
            h="$(printf '%s' "$ref" | sha256sum | awk '{print $1}')"
            if [[ "$h" = "$BASE_REF_HASH" ]]; then test -z "$base_ref"; base_ref="$ref"; base_sha="$sha"; fi
            if [[ "$h" = "$EFFECT_REF_HASH" ]]; then test -z "$effect_ref"; effect_ref="$ref"; fi
          done <"$refs"
          rm -f "$refs"; test -n "$base_ref" && test -n "$effect_ref" && test -n "$base_sha"
          echo "::add-mask::$base_ref"; echo "::add-mask::$effect_ref"; echo "::add-mask::$base_sha"
          test "$(printf '%s' "$base_sha" | sha256sum | awk '{print $1}')" = "$BASE_SNAPSHOT_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=224 origin "$base_ref" "$effect_ref"
          git checkout -q -B verify-baseline-target "$base_sha"
          test "$(printf '%s' "$(git rev-parse 'HEAD^{tree}')" | sha256sum | awk '{print $1}')" = "$BASE_TREE_PROOF"
          for pair in "$M1_BLOB:m1.py" "$M2_BLOB:m2.py" "$M3_BLOB:m3.py" "$M4_BLOB:m4.py" "$M5_BLOB:m5.py"; do
            blob="${pair%%:*}"; name="${pair##*:}"
            git cat-file blob "$blob" >"$RUNNER_TEMP/$name"
            test "$(git hash-object "$RUNNER_TEMP/$name")" = "$blob"
          done
          printf 'WORK_ROOT=%s\n' "$root" >>"$GITHUB_ENV"
          echo "LAS_EFFECT_EXPORT_RECOVERY=PASS"

      - name: Install exact Rust formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt >/dev/null
          echo "LAS_EFFECT_EXPORT_TOOLCHAIN=PASS"

      - name: Reconstruct exact previously verified tree and encrypt source package
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK_ROOT"
          python3 tools/verification/private_reconciled_baseline_repair.py >/dev/null 2>&1
          python3 tools/verification/private_reconciled_baseline_visibility_repair.py >/dev/null 2>&1
          python3 tools/verification/private_reconciled_baseline_clippy_contract_repair.py >/dev/null 2>&1
          cargo +1.98.1 fmt --all >/dev/null 2>&1
          git add src
          test "$(git write-tree)" = "$EXPECTED_GREEN_BASELINE_TREE"
          echo "LAS_EFFECT_EXPORT_BASELINE_TREE=PASS"
          git config user.name "LAS Verified Tree Export Canonicalizer"
          git config user.email "las-verified-tree-export@users.noreply.github.com"
          git commit -q -m "Ephemeral exact verified green baseline"

          work="$RUNNER_TEMP/effect-work"; git worktree add -q -b verify-effect-export "$work" HEAD; cd "$work"
          mkdir -p tools/verification
          install -m 0644 "$RUNNER_TEMP/m1.py" tools/verification/private_retired_effect_owner_adapter_materialize.py
          install -m 0644 "$RUNNER_TEMP/m2.py" tools/verification/private_retired_effect_schema_semantic_repair.py
          install -m 0644 "$RUNNER_TEMP/m3.py" tools/verification/private_retired_effect_recovery_congruence_hardening.py
          install -m 0644 "$RUNNER_TEMP/m4.py" tools/verification/private_retired_effect_archive_borrow_repair.py
          install -m 0644 "$RUNNER_TEMP/m5.py" tools/verification/private_retired_effect_default_feature_test_gate_repair.py
          python3 tools/verification/private_retired_effect_owner_adapter_materialize.py >/dev/null 2>&1
          python3 tools/verification/private_retired_effect_schema_semantic_repair.py >/dev/null 2>&1
          python3 tools/verification/private_retired_effect_recovery_congruence_hardening.py >/dev/null 2>&1
          python3 tools/verification/private_retired_effect_archive_borrow_repair.py >/dev/null 2>&1
          python3 tools/verification/private_retired_effect_default_feature_test_gate_repair.py >/dev/null 2>&1
          cargo +1.98.1 fmt --all >/dev/null 2>&1
          git add src
          tree="$(git write-tree)"
          test "$tree" = "$EXPECTED_EFFECT_TREE"
          echo "LAS_EFFECT_EXPORT_EFFECT_TREE=PASS"

          package="$RUNNER_TEMP/package"; mkdir -p "$package/files"
          git diff --cached --name-only -z HEAD -- src >"$RUNNER_TEMP/paths.z"
          python3 - "$RUNNER_TEMP/paths.z" "$package" "$EXPECTED_GREEN_BASELINE_TREE" "$tree" <<'PY'
          import json, pathlib, subprocess, sys
          paths_file, package, base_tree, candidate_tree = sys.argv[1:]
          paths = [p.decode('utf-8') for p in pathlib.Path(paths_file).read_bytes().split(b'\0') if p]
          if not paths:
              raise SystemExit('verified effect export unexpectedly has no source changes')
          out = pathlib.Path(package)
          entries = []
          for path in sorted(paths):
              if not path.startswith('src/'):
                  raise SystemExit('non-source path in verified effect export')
              src = pathlib.Path(path)
              if not src.is_file():
                  raise SystemExit('verified effect export path is not a regular file')
              dst = out / 'files' / path
              dst.parent.mkdir(parents=True, exist_ok=True)
              dst.write_bytes(src.read_bytes())
              blob = subprocess.check_output(['git','hash-object',path], text=True).strip()
              mode = subprocess.check_output(['git','ls-files','-s','--',path], text=True).split()[0]
              entries.append({'path': path, 'mode': mode, 'blob': blob, 'size': src.stat().st_size})
          manifest = {
              'schema': 'las-verified-retired-effect-tree-export-v1',
              'verified_baseline_tree': base_tree,
              'verified_candidate_tree': candidate_tree,
              'materializer_blobs': [
                  'bb4f6e5c803b7c64ea27e605659cf998fc942cc2',
                  '6fb90f15a1194d596f420ebee9f0ed3e4ae2b112',
                  '67746f8a4776b872b3878f6861eb3bb7658a9fbd',
                  '13820e643e7d76cd087293429f6856183f4d9b07',
                  'ace99b29dcf1ab6041d602247158f07ab13d41eb',
              ],
              'files': entries,
          }
          (out/'manifest.json').write_text(json.dumps(manifest, sort_keys=True, separators=(',',':'))+'\n', encoding='utf-8')
          PY
          tarball="$RUNNER_TEMP/verified-effect.tar.gz"; tar -C "$package" -czf "$tarball" .
          echo "LAS_EFFECT_EXPORT_PACKAGE=PASS"

          python3 - "$RSA_MODULUS_HEX" "$RSA_EXPONENT" "$RUNNER_TEMP/pub.der" <<'PY'
          import pathlib, sys
          n = int(sys.argv[1], 16); e = int(sys.argv[2]); out = pathlib.Path(sys.argv[3])
          def L(n):
              if n < 128: return bytes([n])
              b = n.to_bytes((n.bit_length()+7)//8, 'big'); return bytes([0x80|len(b)])+b
          def T(tag, content): return bytes([tag])+L(len(content))+content
          def I(v):
              b = v.to_bytes((v.bit_length()+7)//8 or 1, 'big')
              if b[0] & 0x80: b = b'\x00'+b
              return T(0x02,b)
          rsa = T(0x30, I(n)+I(e))
          alg = T(0x30, bytes.fromhex('06092a864886f70d010101') + bytes.fromhex('0500'))
          spki = T(0x30, alg + T(0x03, b'\x00'+rsa))
          out.write_bytes(spki)
          PY
          openssl pkey -pubin -inform DER -in "$RUNNER_TEMP/pub.der" -out "$RUNNER_TEMP/pub.pem" >/dev/null 2>&1
          echo "LAS_EFFECT_EXPORT_RSA_PUBLIC_KEY=PASS"
          keymat_hex="$(openssl rand -hex 64)"
          enc_key="${keymat_hex:0:64}"; mac_key="${keymat_hex:64:64}"; iv="$(openssl rand -hex 16)"
          python3 - "$keymat_hex" "$RUNNER_TEMP/keymat.bin" <<'PY'
          import pathlib, sys
          pathlib.Path(sys.argv[2]).write_bytes(bytes.fromhex(sys.argv[1]))
          PY
          openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/pub.pem" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in "$RUNNER_TEMP/keymat.bin" -out "$RUNNER_TEMP/keymat.rsa"
          echo "LAS_EFFECT_EXPORT_KEY_WRAP=PASS"
          openssl enc -aes-256-cbc -K "$enc_key" -iv "$iv" -in "$tarball" -out "$RUNNER_TEMP/candidate.enc"
          echo "LAS_EFFECT_EXPORT_CIPHER=PASS"
          printf '%s' "$iv" >"$RUNNER_TEMP/iv.hex"
          cat "$RUNNER_TEMP/iv.hex" "$RUNNER_TEMP/candidate.enc" | \
            openssl dgst -sha256 -mac HMAC -macopt "hexkey:$mac_key" -binary >"$RUNNER_TEMP/candidate.hmac"
          echo "LAS_EFFECT_EXPORT_HMAC=PASS"
          export_dir="$RUNNER_TEMP/export"; mkdir "$export_dir"
          cp "$RUNNER_TEMP/keymat.rsa" "$RUNNER_TEMP/iv.hex" "$RUNNER_TEMP/candidate.enc" "$RUNNER_TEMP/candidate.hmac" "$export_dir/"
          printf '{"schema":"las-hybrid-envelope-v1","candidate_tree":"%s","rsa_oaep":"sha256","cipher":"aes-256-cbc","mac":"hmac-sha256"}\n' "$tree" >"$export_dir/envelope.json"
          echo "LAS_VERIFIED_EFFECT_EXPORT_TREE=$tree"
          echo "LAS_VERIFIED_EFFECT_EXPORT_CIPHERTEXT_SHA256=$(sha256sum "$RUNNER_TEMP/candidate.enc" | awk '{print $1}')"
          echo "LAS_VERIFIED_EFFECT_TREE_EXPORT=PASS"

      - name: Upload encrypted verified tree package only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: opaque-verified-retired-effect-tree-20261017
          path: ${{ runner.temp }}/export
          if-no-files-found: error
          retention-days: 1

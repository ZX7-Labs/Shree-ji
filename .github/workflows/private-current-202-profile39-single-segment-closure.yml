name: Prove exact current 202 profile-39 single-segment leg

on:
  push:
    branches:
      - verify/current-202-source-201-closure-20261015
    paths:
      - ".github/workflows/private-current-202-profile39-single-segment-closure.yml"
      - "RUN_CURRENT_202_PROFILE39_SINGLE_SEGMENT_CLOSURE"

permissions:
  contents: read
  actions: read

env:
  PROFILE39_RUN_ID: "38624716259"
  EXPECTED_PROFILE39_HEAD: 02e40b7ec7bf9c7bd767aa62e4d1e25989d6a3b4
  EXPECTED_CONTINUATION_WORKFLOW_PATH: .github/workflows/private-repaired-202-tlc39-continuation.yml
  EXPECTED_CONTINUATION_WORKFLOW_BLOB: b0d34658082e9062c9e714cb1125a66385abac83
  TARGET_REF_HASH: 28a52175bfc55f4f8b2b0f4312cd2616a65a7082555149f4382746e2254e1b26
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 1b139dc7920e82d5f9bdd2a68c072ad88bc0049d5ef1377380899164da5f93f9
  EXPECTED_PRIVATE_TREE_PROOF: 7fb364587ed7c9f76d8fd9f69cb4a4d58e576a44a1e653d019c8114ccb65353f
  EXPECTED_VERIFIER_BLOB: 62e3e6dc0fad5dddc7fb0a453a3cd681d911e590

jobs:
  prove-profile39-single-segment:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout public control shell
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate exact frozen private candidate
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"

          root="$RUNNER_TEMP/private-profile39-single"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          refs="$RUNNER_TEMP/private-profile39-single-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          matched_sha=""
          while read -r sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
              matched_sha="$sha"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          test -n "$matched_sha"
          echo "::add-mask::$matched_ref"
          echo "::add-mask::$matched_sha"
          test "$(printf '%s' "$matched_sha" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$matched_sha"
          git checkout -q --detach "$matched_sha"
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_TREE_PROOF"
          test "$(git hash-object tools/verify_codespaces_all.sh)" = "$EXPECTED_VERIFIER_BLOB"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "LAS_CURRENT_202_PROFILE39_SINGLE_PRIVATE_BINDING=PASS"
          unset PRIVATE_TOKEN PRIVATE_REPOSITORY auth matched_ref matched_sha tree

      - name: Bind exact profile-39 workflow revision
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git cat-file -e "$EXPECTED_PROFILE39_HEAD^{commit}"
          actual_blob="$(git rev-parse "$EXPECTED_PROFILE39_HEAD:$EXPECTED_CONTINUATION_WORKFLOW_PATH")"
          test "$actual_blob" = "$EXPECTED_CONTINUATION_WORKFLOW_BLOB"
          echo "LAS_CURRENT_202_PROFILE39_SINGLE_WORKFLOW_BINDING=PASS"

      - name: Prove initial segment is terminal PASS without continuation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          run_json="$RUNNER_TEMP/profile39-run.json"
          jobs_json="$RUNNER_TEMP/profile39-jobs.json"
          workflow_json="$RUNNER_TEMP/profile39-workflow.json"
          log="$RUNNER_TEMP/profile39-job.log"

          curl --proto '=https' --tlsv1.2 --fail-with-body -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api/actions/runs/$PROFILE39_RUN_ID" >"$run_json"

          python3 - "$run_json" "$PROFILE39_RUN_ID" "$EXPECTED_PROFILE39_HEAD" "$EXPECTED_CONTINUATION_WORKFLOW_PATH" <<'PY'
          import json
          import sys

          path, expected_id, expected_head, expected_workflow = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              run = json.load(handle)
          if str(run.get("id")) != expected_id:
              raise SystemExit("profile-39 run id mismatch")
          if run.get("head_sha") != expected_head:
              raise SystemExit("profile-39 run head mismatch")
          if run.get("path") != expected_workflow:
              raise SystemExit("profile-39 workflow path mismatch")
          if run.get("event") != "push":
              raise SystemExit("profile-39 initial run event mismatch")
          if run.get("run_attempt") != 1:
              raise SystemExit("unexpected profile-39 run attempt")
          if run.get("status") != "completed":
              raise SystemExit("profile-39 run is not complete")
          if run.get("conclusion") != "success":
              raise SystemExit("profile-39 run is not successful")
          PY

          encoded_path="$(python3 - "$EXPECTED_CONTINUATION_WORKFLOW_PATH" <<'PY'
          import sys
          import urllib.parse
          print(urllib.parse.quote(sys.argv[1], safe='/'))
          PY
          )"
          curl --proto '=https' --tlsv1.2 --fail-with-body -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api/contents/$encoded_path?ref=$EXPECTED_PROFILE39_HEAD" >"$workflow_json"
          actual_workflow_blob="$(python3 - "$workflow_json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              print(json.load(handle).get("sha", ""))
          PY
          )"
          test "$actual_workflow_blob" = "$EXPECTED_CONTINUATION_WORKFLOW_BLOB"

          curl --proto '=https' --tlsv1.2 --fail-with-body -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api/actions/runs/$PROFILE39_RUN_ID/jobs?filter=latest&per_page=100" >"$jobs_json"

          job_id="$(python3 - "$jobs_json" "$EXPECTED_PROFILE39_HEAD" <<'PY'
          import json
          import sys

          path, expected_head = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              payload = json.load(handle)
          jobs = payload.get("jobs", [])
          if len(jobs) != 1 or jobs[0].get("name") != "slice":
              raise SystemExit("profile-39 run must contain exactly one slice job")
          job = jobs[0]
          if job.get("head_sha") != expected_head:
              raise SystemExit("profile-39 slice head mismatch")
          if job.get("status") != "completed" or job.get("conclusion") != "success":
              raise SystemExit("profile-39 slice job is not successful")

          steps = {step.get("name"): (step.get("status"), step.get("conclusion")) for step in job.get("steps", [])}
          required_success = [
              "Validate exact continuation request",
              "Reclaim runner storage for exhaustive TLC",
              "Recover exact frozen repaired candidate",
              "Bind exact canonical map and profile 39",
              "Run exact canonical TLC39 slice",
          ]
          for name in required_success:
              if steps.get(name) != ("completed", "success"):
                  raise SystemExit(f"required profile-39 step not successful: {name}")

          required_skipped = [
              "Download prior authenticated encrypted checkpoint",
              "Authenticate and restore prior checkpoint",
              "Seal authenticated encrypted checkpoint",
              "Upload authenticated encrypted checkpoint",
              "Dispatch next exact slice",
          ]
          for name in required_skipped:
              if steps.get(name) != ("completed", "skipped"):
                  raise SystemExit(f"single-segment proof unexpectedly used continuation: {name}")

          print(job["id"])
          PY
          )"
          [[ "$job_id" =~ ^[1-9][0-9]*$ ]]

          curl --proto '=https' --tlsv1.2 --fail-with-body -sSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api/actions/jobs/$job_id/logs" >"$log"

          python3 - "$log" <<'PY'
          import re
          import sys

          with open(sys.argv[1], encoding="utf-8", errors="replace") as handle:
              raw = handle.read().splitlines()

          stamp = re.compile(r'^\d{4}-\d{2}-\d{2}T\S+Z (.*)$')
          emitted = []
          for line in raw:
              match = stamp.match(line)
              if match:
                  emitted.append(match.group(1))

          required = {
              "LAS_REPAIRED_202_TLC39_REQUEST=PASS",
              "LAS_REPAIRED_202_TLC39_RECOVERY=PASS",
              "LAS_REPAIRED_202_TLC39_BINDING=PASS",
              "LAS_REPAIRED_202_TLC39_SEGMENT=1",
              "LAS_REPAIRED_202_TLC39_QUEUE=0",
              "LAS_REPAIRED_202_TLC39_RC=0",
              "LAS_REPAIRED_202_TLC39_RESULT=PASS",
          }
          missing = sorted(required.difference(emitted))
          if missing:
              raise SystemExit(f"missing emitted profile-39 markers: {missing!r}")

          forbidden_exact = {
              "LAS_REPAIRED_202_TLC39_CHECKPOINT_AUTH=PASS",
              "LAS_REPAIRED_202_TLC39_RECOVER_DIR=PASS",
              "LAS_REPAIRED_202_TLC39_RESULT=FAIL",
              "LAS_REPAIRED_202_TLC39_RESULT=FAIL_CLOSED",
              "LAS_REPAIRED_202_TLC39_RESULT=SLICE_CHECKPOINT",
          }
          if forbidden_exact.intersection(emitted):
              raise SystemExit("single-segment log contains continuation or non-PASS evidence")
          if any(line.startswith("LAS_REPAIRED_202_TLC39_NEXT_SEGMENT=") for line in emitted):
              raise SystemExit("single-segment log dispatched a continuation segment")
          if any(line.startswith("LAS_REPAIRED_202_TLC39_CHECKPOINT_BYTES=") for line in emitted):
              raise SystemExit("single-segment log sealed a checkpoint")

          log_hashes = [
              line.split("=", 1)[1]
              for line in emitted
              if line.startswith("LAS_REPAIRED_202_TLC39_LOG_SHA256=")
          ]
          if len(log_hashes) != 1 or not re.fullmatch(r"[0-9a-f]{64}", log_hashes[0]):
              raise SystemExit("profile-39 private-log digest marker is missing or ambiguous")
          PY

          echo "LAS_CURRENT_202_PROFILE39_SINGLE_SEGMENT_RESULT=PASS"
          rm -f "$run_json" "$jobs_json" "$workflow_json" "$log"

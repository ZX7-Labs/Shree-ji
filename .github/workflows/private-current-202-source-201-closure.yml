name: Prove exact current 202 source-201 leg

on:
  push:
    branches:
      - verify/current-202-source-201-closure-20261015
    paths:
      - ".github/workflows/private-current-202-source-201-closure.yml"
      - "RUN_CURRENT_202_SOURCE_201_CLOSURE"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: "38623465219"
  EXPECTED_SOURCE_HEAD: b065678bfd50d8ff1ecb5b0eb4e101a579bccbf1
  EXPECTED_SOURCE_WORKFLOW_PATH: .github/workflows/private-current-sharded-verify.yml
  EXPECTED_SOURCE_WORKFLOW_BLOB: 2cd4b0f173aecd8de5e70fc4df999ec3c0a35d9f
  TARGET_REF_HASH: 28a52175bfc55f4f8b2b0f4312cd2616a65a7082555149f4382746e2254e1b26
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 1b139dc7920e82d5f9bdd2a68c072ad88bc0049d5ef1377380899164da5f93f9
  EXPECTED_PRIVATE_TREE_PROOF: 7fb364587ed7c9f76d8fd9f69cb4a4d58e576a44a1e653d019c8114ccb65353f
  EXPECTED_VERIFIER_BLOB: 62e3e6dc0fad5dddc7fb0a453a3cd681d911e590
  EXPECTED_TLC_PROFILE_COUNT: "202"
  SUBSTITUTE_INDEX: "39"

jobs:
  prove-source-201:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout public control shell
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate exact frozen private candidate
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"

          root="$RUNNER_TEMP/private-source-201"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"

          refs="$RUNNER_TEMP/private-source-201-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          matched_sha=""
          while read -r sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
              matched_sha="$sha"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          test -n "$matched_sha"
          echo "::add-mask::$matched_ref"
          echo "::add-mask::$matched_sha"

          test "$(printf '%s' "$matched_sha" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$matched_sha"
          git checkout -q --detach "$matched_sha"

          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_TREE_PROOF"
          test "$(git hash-object tools/verify_codespaces_all.sh)" = "$EXPECTED_VERIFIER_BLOB"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "LAS_CURRENT_202_SOURCE_201_PRIVATE_BINDING=PASS"
          unset PRIVATE_TOKEN PRIVATE_REPOSITORY auth matched_ref matched_sha tree

      - name: Bind exact source workflow revision
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git cat-file -e "$EXPECTED_SOURCE_HEAD^{commit}"
          actual_blob="$(git rev-parse "$EXPECTED_SOURCE_HEAD:$EXPECTED_SOURCE_WORKFLOW_PATH")"
          test "$actual_blob" = "$EXPECTED_SOURCE_WORKFLOW_BLOB"
          echo "LAS_CURRENT_202_SOURCE_201_SOURCE_WORKFLOW=PASS"

      - name: Prove exact direct 201-profile leg and visible profile-39 failure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          run_json="$RUNNER_TEMP/source-run.json"
          jobs_json="$RUNNER_TEMP/source-jobs.json"

          curl --proto '=https' --tlsv1.2 --fail-with-body -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api/actions/runs/$SOURCE_RUN_ID" >"$run_json"

          python3 - "$api" "$SOURCE_RUN_ID" "$jobs_json" "$GH_TOKEN" <<'PY'
          import json
          import sys
          import urllib.request

          api, run_id, out, token = sys.argv[1:]
          jobs = []
          page = 1
          while True:
              req = urllib.request.Request(
                  f"{api}/actions/runs/{run_id}/jobs?filter=latest&per_page=100&page={page}",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  payload = json.load(response)
              batch = payload.get("jobs", [])
              if not isinstance(batch, list):
                  raise SystemExit("jobs payload is not a list")
              jobs.extend(batch)
              if len(batch) < 100:
                  break
              page += 1
              if page > 10:
                  raise SystemExit("unexpected job pagination")

          with open(out, "w", encoding="utf-8") as handle:
              json.dump(jobs, handle, separators=(",", ":"))
          PY

          python3 - \
            "$run_json" "$jobs_json" "$SOURCE_RUN_ID" "$EXPECTED_SOURCE_HEAD" \
            "$EXPECTED_SOURCE_WORKFLOW_PATH" "$EXPECTED_TLC_PROFILE_COUNT" "$SUBSTITUTE_INDEX" <<'PY'
          import json
          import re
          import sys

          (
              run_path,
              jobs_path,
              source_run_id,
              expected_head,
              expected_workflow_path,
              expected_count,
              substitute_index,
          ) = sys.argv[1:]
          expected_count = int(expected_count)
          substitute_index = int(substitute_index)

          with open(run_path, encoding="utf-8") as handle:
              run = json.load(handle)
          with open(jobs_path, encoding="utf-8") as handle:
              jobs = json.load(handle)

          if str(run.get("id")) != source_run_id:
              raise SystemExit("source run id mismatch")
          if run.get("head_sha") != expected_head:
              raise SystemExit("source run head mismatch")
          if run.get("path") != expected_workflow_path:
              raise SystemExit("source workflow path mismatch")
          if run.get("run_attempt") != 1:
              raise SystemExit("unexpected source run attempt")
          if run.get("status") != "completed":
              raise SystemExit("source run is not complete")
          if run.get("conclusion") != "failure":
              raise SystemExit("source run must retain the visible direct profile-39 failure")

          if len(jobs) != expected_count + 1:
              raise SystemExit(f"unexpected source job count: {len(jobs)}")

          pre = [job for job in jobs if job.get("name") == "pre_tlc"]
          if len(pre) != 1:
              raise SystemExit("pre_tlc job cardinality mismatch")
          pre_job = pre[0]
          if pre_job.get("head_sha") != expected_head or pre_job.get("conclusion") != "success":
              raise SystemExit("pre_tlc evidence incomplete")
          pre_steps = {step.get("name"): step.get("conclusion") for step in pre_job.get("steps", [])}
          if pre_steps.get("Checkout exact hidden private revision") != "success":
              raise SystemExit("pre_tlc private binding missing")
          if pre_steps.get("Run exact canonical pre-TLC stage") != "success":
              raise SystemExit("pre_tlc canonical stage missing")

          shard_pattern = re.compile(r"^tlc \((\d+)\)$")
          shards = {}
          unknown = []
          for job in jobs:
              name = job.get("name", "")
              if name == "pre_tlc":
                  continue
              match = shard_pattern.fullmatch(name)
              if not match:
                  unknown.append(name)
                  continue
              index = int(match.group(1))
              if index in shards:
                  raise SystemExit(f"duplicate TLC shard {index}")
              shards[index] = job

          if unknown:
              raise SystemExit(f"unexpected jobs present: {unknown!r}")

          expected_indexes = set(range(expected_count))
          if set(shards) != expected_indexes:
              missing = sorted(expected_indexes - set(shards))
              extra = sorted(set(shards) - expected_indexes)
              raise SystemExit(f"TLC shard set mismatch missing={missing} extra={extra}")

          for index in sorted(shards):
              job = shards[index]
              if job.get("head_sha") != expected_head:
                  raise SystemExit(f"TLC shard {index} head mismatch")
              if job.get("status") != "completed":
                  raise SystemExit(f"TLC shard {index} not completed")
              steps = {step.get("name"): step.get("conclusion") for step in job.get("steps", [])}
              if steps.get("Checkout exact hidden private revision") != "success":
                  raise SystemExit(f"TLC shard {index} private binding missing")

              if index == substitute_index:
                  if job.get("conclusion") != "failure":
                      raise SystemExit("profile-39 direct job is not the expected visible failure")
                  if steps.get("Run canonical TLC shard") != "failure":
                      raise SystemExit("profile-39 canonical TLC step is not the expected failure")
              else:
                  if job.get("conclusion") != "success":
                      raise SystemExit(f"TLC shard {index} not successful")
                  if steps.get("Run canonical TLC shard") != "success":
                      raise SystemExit(f"TLC shard {index} canonical execution missing")

          direct_success = sum(
              1 for index, job in shards.items()
              if index != substitute_index and job.get("conclusion") == "success"
          )
          if direct_success != expected_count - 1:
              raise SystemExit(f"unexpected direct success count: {direct_success}")

          print("LAS_CURRENT_202_SOURCE_201_PRE_TLC=PASS")
          print(f"LAS_CURRENT_202_SOURCE_201_DIRECT_SUCCESS_COUNT={direct_success}")
          print(f"LAS_CURRENT_202_SOURCE_201_SUBSTITUTE_INDEX={substitute_index}")
          print("LAS_CURRENT_202_SOURCE_201_PROFILE39_DIRECT_FAILURE_VISIBLE=PASS")
          print("LAS_CURRENT_202_SOURCE_201_RESULT=PASS")
          PY

          rm -f "$run_json" "$jobs_json"

name: Opaque integrated Linux Rust source gates

on:
  push:
    branches: [main]
    paths:
      - RUN_INTEGRATED_LINUX_RUST_20261112

permissions:
  contents: read

concurrency:
  group: opaque-integrated-linux-rust-current-20261112
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout public controller only
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate opaque exact snapshot request
        shell: bash
        run: |
          set -euo pipefail
          test -s RUN_INTEGRATED_LINUX_RUST_20261112
          ref_hash="$(awk -F= '$1=="TARGET_REF_HASH"{print $2}' RUN_INTEGRATED_LINUX_RUST_20261112)"
          snapshot_hash="$(awk -F= '$1=="EXPECTED_PRIVATE_SNAPSHOT_PROOF"{print $2}' RUN_INTEGRATED_LINUX_RUST_20261112)"
          [[ "$ref_hash" =~ ^[a-f0-9]{64}$ ]]
          [[ "$snapshot_hash" =~ ^[a-f0-9]{64}$ ]]
          echo "REF_PROOF=$ref_hash" >> "$GITHUB_ENV"
          echo "SOURCE_PROOF=$snapshot_hash" >> "$GITHUB_ENV"

      - name: Install pinned open-source Rust tooling
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null 2>&1
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null 2>&1
          test "$(cargo +1.98.1 --version | awk '{print $2}')" = 1.98.1

      - name: Read-only private checkout with exact ancestry and no source output
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          root="$RUNNER_TEMP/private-target"
          mkdir -m 700 "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/$PRIVATE_REPOSITORY.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin > "$RUNNER_TEMP/remote-refs"
          matched_ref=""
          while read -r _sha ref; do
            current="$(printf '%s' "$ref" | sha256sum | cut -d' ' -f1)"
            if [[ "$current" == "$REF_PROOF" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
            fi
          done < "$RUNNER_TEMP/remote-refs"
          rm -f "$RUNNER_TEMP/remote-refs"
          test -n "$matched_ref"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=512 origin "$matched_ref"
          matched_sha=""
          while read -r sha; do
            current="$(printf '%s' "$sha" | sha256sum | cut -d' ' -f1)"
            if [[ "$current" == "$SOURCE_PROOF" ]]; then
              test -z "$matched_sha"
              matched_sha="$sha"
            fi
          done < <(git rev-list --max-count=512 FETCH_HEAD)
          test -n "$matched_sha"
          git merge-base --is-ancestor "$matched_sha" FETCH_HEAD
          git checkout -q --detach "$matched_sha"
          test "$(git rev-parse HEAD | tr -d '\n' | sha256sum | cut -d' ' -f1)" = "$SOURCE_PROOF"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git remote remove origin
          unset PRIVATE_TOKEN auth matched_ref matched_sha
          echo "LAS_NATIVE_SOURCE_REVISION_PROOF=$SOURCE_PROOF"

      - name: Run independent native gates without publishing source or diagnostics
        shell: bash
        env:
          RUSTFLAGS: -Dwarnings
          RUST_BACKTRACE: "0"
        run: |
          set -euo pipefail
          umask 077
          cd "$RUNNER_TEMP/private-target"
          fail=0
          run_gate() {
            local name="$1"
            shift
            local log="$RUNNER_TEMP/native-$name.log"
            local rc
            set +e
            "$@" > "$log" 2>&1
            rc=$?
            set -e
            echo "LAS_NATIVE_${name}_RC=$rc"
            echo "LAS_NATIVE_${name}_LOG_SHA256=$(sha256sum "$log" | cut -d' ' -f1)"
            if [[ "$name" == "FOCUSED_COVERAGE" || "$name" == "FOCUSED_GUARDIAN" || "$name" == "GUARDED_SERVICE" || "$name" == "FULL_LIBRARY" || "$name" == "OPTIMIZED_FOCUSED" ]]; then
              set +e
              python3 - "$log" "$name" <<'PY'
          import hashlib, re, sys
          p, name = sys.argv[1:3]
          s = open(p, encoding="utf-8", errors="replace").read()
          matches = re.findall(r"test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored", s)
          if matches:
              status, passed, failed, ignored = matches[-1]
              print(f"LAS_NATIVE_{name}_RESULT={status};PASSED={passed};FAILED={failed};IGNORED={ignored}")
              if int(passed) + int(failed) == 0:
                  print(f"LAS_NATIVE_{name}_VACUOUS=1")
                  raise SystemExit(2)
          else:
              print(f"LAS_NATIVE_{name}_RESULT=UNOBSERVED")
          for test_name in re.findall(r"^test (.*?) \.\.\. FAILED$", s, flags=re.MULTILINE):
              print("LAS_NATIVE_FAILED_TEST_HASH=" + hashlib.sha256(test_name.encode()).hexdigest())
          PY
              status=$?
              set -e
              if [[ "$status" -ne 0 ]]; then rc=1; fi
            fi
            if [[ "$name" == "CHECK_LINUX" || "$name" == "BUILD_LIBRARY_TESTS" || "$name" == "CLIPPY_LINUX" ]]; then
              python3 - "$log" "$name" <<'PY'
          import hashlib, json, os, sys
          p, name = sys.argv[1:3]
          root=os.path.realpath(os.environ["RUNNER_TEMP"] + "/private-target")
          seen=set()
          for raw in open(p, encoding="utf-8", errors="replace"):
              try: d=json.loads(raw)
              except (ValueError, TypeError): continue
              if d.get("reason") != "compiler-message": continue
              m=d.get("message") or {}
              if m.get("level") != "error": continue
              code=(m.get("code") or {}).get("code") or "NO_CODE"
              spans=[v for v in (m.get("spans") or []) if v.get("is_primary")] or [{}]
              for v in spans:
                  fn=v.get("file_name","")
                  resolved=os.path.realpath(os.path.join(root,fn))
                  rel=os.path.relpath(resolved,root) if resolved.startswith(root+"/") else "OUTSIDE"
                  path_hash=hashlib.sha256(rel.encode()).hexdigest()
                  key=(code,path_hash,v.get("line_start",0))
                  if key not in seen:
                      seen.add(key)
                      print(f"LAS_NATIVE_{name}_COMPILER_ERROR={key[0]}:{key[1]}:{key[2]}")
          PY
            fi
            rm -f "$log"
            if (( rc != 0 )); then fail=1; fi
          }
          run_gate FMT cargo +1.98.1 fmt --all -- --check
          run_gate CHECK_LINUX cargo +1.98.1 check --locked --all-targets --features linux-peer-credentials --message-format=json
          run_gate BUILD_LIBRARY_TESTS cargo +1.98.1 test --locked --lib --features linux-peer-credentials --no-run --message-format=json
          run_gate FOCUSED_COVERAGE cargo +1.98.1 test --locked --lib --features linux-peer-credentials host_action_coverage -- --test-threads=1
          run_gate FOCUSED_GUARDIAN cargo +1.98.1 test --locked --lib --features linux-peer-credentials guardian_coverage_precommit -- --test-threads=1
          run_gate GUARDED_SERVICE cargo +1.98.1 test --locked --lib --features linux-peer-credentials completed_guardian_service -- --test-threads=1
          run_gate FULL_LIBRARY cargo +1.98.1 test --locked --lib --features linux-peer-credentials -- --test-threads=1
          run_gate CLIPPY_LINUX cargo +1.98.1 clippy --locked --all-targets --features linux-peer-credentials --message-format=json -- -D warnings
          run_gate OPTIMIZED_FOCUSED cargo +1.98.1 test --locked --release --lib --features linux-peer-credentials guardian_coverage_precommit -- --test-threads=1
          if (( fail != 0 )); then
            echo "LAS_NATIVE_INTEGRATED_RESULT=FAIL"
            exit 1
          fi
          echo "LAS_NATIVE_INTEGRATED_RESULT=PASS"

            $(run_count private-repaired-202-tlc39-terminal-attestation.yml in_progress) + \
            $(run_count private-repaired-202-tlc39-terminal-attestation.yml queued) + \
            $(run_count private-current-202-compute-closure.yml in_progress) + \
            $(run_count private-current-202-compute-closure.yml queued) \
          ))"
          if (( active_all > 0 )); then
            echo "LAS_CURRENT_202_COORDINATOR_ACTIVE_BEFORE_CLOSURE=$active_all"

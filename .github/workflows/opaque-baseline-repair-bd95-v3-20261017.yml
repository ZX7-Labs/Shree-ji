name: Opaque baseline repair bd95 v3 tree attestation 20261017

on:
  push:
    branches:
      - "verify/reconciled-baseline-repair-v3-bd95-20261017"
    paths:
      - ".github/workflows/opaque-baseline-repair-bd95-v3-20261017.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opaque-baseline-repair-bd95-v3-tree-attest-20261017
  cancel-in-progress: false

env:
  TARGET_REF_HASH: 060aa23045ded14f2e9984282456adce3cd5fa94bd92f21f4eeacae5d41abff2
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: bd4d73399dc34da2586900c270f6b33f2a1049e934472301f5546ad9973cc49e
  EXPECTED_PRIVATE_TREE_PROOF: 93bcdc3d05cc578589d0600beb22d21dda366b5cd9fd81cc31f4f487d9e35981
  STAGE_HARNESS_BLOB: 31f2cf45cb2879e7e3527c411f93a17daa86f311

jobs:
  attest:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Recover exact frozen private repair base
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY" && test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          root="$RUNNER_TEMP/private"; mkdir "$root"; cd "$root"; git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"; echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""; matched_sha=""
          while read -r sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"; matched_ref="$ref"; matched_sha="$sha"
            fi
          done <"$refs"
          rm -f "$refs"; test -n "$matched_ref"; test -n "$matched_sha"
          echo "::add-mask::$matched_ref"; echo "::add-mask::$matched_sha"
          test "$(printf '%s' "$matched_sha" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=64 origin "$matched_ref"
          actual="$(git rev-parse FETCH_HEAD)"; test "$actual" = "$matched_sha"; echo "::add-mask::$actual"
          git checkout -q -B verify-target "$actual"
          tree="$(git rev-parse 'HEAD^{tree}')"; echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_TREE_PROOF"
          git cat-file blob "$STAGE_HARNESS_BLOB" >"$RUNNER_TEMP/private-baseline-repair-v3.sh"
          test "$(git hash-object "$RUNNER_TEMP/private-baseline-repair-v3.sh")" = "$STAGE_HARNESS_BLOB"
          chmod 0700 "$RUNNER_TEMP/private-baseline-repair-v3.sh"
          test -z "$(git status --porcelain --untracked-files=all)"
          printf 'WORK_ROOT=%s\nBASE_SHA=%s\n' "$root" "$actual" >> "$GITHUB_ENV"
          echo "LAS_TREE_ATTEST_BASE_RECOVERY=PASS"

      - name: Install exact build toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null
          archive="$RUNNER_TEMP/alr.zip"; prefix="$RUNNER_TEMP/alr"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --silent --show-error --output "$archive" "https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip"
          echo "09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  $archive" | sha256sum --check --strict >/dev/null
          mkdir -p "$prefix"; unzip -q "$archive" -d "$prefix"; export PATH="$prefix/bin:$PATH"; echo "$prefix/bin" >> "$GITHUB_PATH"
          alr -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1 >/dev/null
          workspace="$RUNNER_TEMP/alr-work"; mkdir -p "$workspace"; cd "$workspace"
          alr -n init --in-place --no-skel --lib baseline_repair_tree_attest >/dev/null
          alr_path="$(command -v alr)"; wrapper="$RUNNER_TEMP/gprbuild-via-alire"
          cat > "$wrapper" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$workspace"
          exec "$alr_path" exec -- gprbuild "\$@"
          EOF
          chmod 0755 "$wrapper"; printf 'GPRBUILD=%s\n' "$wrapper" >> "$GITHUB_ENV"
          echo "LAS_TREE_ATTEST_TOOLCHAINS=PASS"

      - name: Reproduce verified candidate and attest tree hash only
        shell: bash
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/package"; log="$RUNNER_TEMP/private-attest.log"; mkdir -p "$package"; cd "$WORK_ROOT"
          set +e
          LAS_BASELINE_REPAIR_BASE_SHA="$BASE_SHA" LAS_BASELINE_REPAIR_PACKAGE_DIR="$package" LAS_BASELINE_REPAIR_EXPECTED_BRANCH=verify-target bash "$RUNNER_TEMP/private-baseline-repair-v3.sh" >"$log" 2>&1
          rc=$?
          set -e
          if [[ "$rc" -ne 0 ]]; then
            rm -rf "$package" "$log"
            echo "LAS_TREE_ATTEST_RESULT=FAIL"
            exit "$rc"
          fi
          candidate_tree="$(git rev-parse 'HEAD^{tree}')"
          manifest_tree="$(python3 - "$package/manifest.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as handle:
              print(json.load(handle)['candidate_tree'])
          PY
          )"
          test "$candidate_tree" = "$manifest_tree"
          echo "LAS_VERIFIED_BASELINE_CANDIDATE_TREE=$candidate_tree"
          echo "LAS_TREE_ATTEST_RESULT=PASS"
          rm -rf "$package" "$log"

name: Public runner - pinned private Root Reality Rust candidate (quarantine)

on:
  push:
    branches:
      - quarantine/exact-private-root-reality-20261102
    paths:
      - .github/workflows/las-exact-private-root-reality-20261102.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: las-exact-pr58-scope-20261102
  cancel-in-progress: false

jobs:
  native-root-reality-slice:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Only SHA-256 of the private ref and commit are public. No private source or SHA committed here.
      PRIVATE_REF_PROOF: 1671d9b05c80e96a488aca0a636e527c4f33026d0eeb7af146d962a2e5d2620d
      EXPECTED_PRIVATE_COMMIT_PROOF: b53896bf17f938615d8ae9018d7efbcd4b3df5961099253edc6e3510e1c6a6fc
    steps:
      - name: Resolve and fetch exactly one pinned private read-only source revision
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY" && test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          mkdir -m 0700 private-target
          cd private-target
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          ref_file="$RUNNER_TEMP/las-private-refs"
          fetch_log="$RUNNER_TEMP/las-private-fetch.log"
          # Neither ls-remote output nor fetch errors are printed publicly.
          git -c "http.extraHeader=AUTHORIZATION: basic $auth" \
            ls-remote --heads origin > "$ref_file" 2> "$fetch_log" || {
              echo 'LAS_PUBLIC_PRIVATE_REF_RESOLUTION=FAIL'; exit 1;
            }
          matched_ref=''
          match_count=0
          while read -r oid ref; do
            digest="$(printf '%s' "$ref" | sha256sum | cut -d' ' -f1)"
            if [[ "$digest" == "$PRIVATE_REF_PROOF" ]]; then
              matched_ref="$ref"
              match_count=$((match_count + 1))
            fi
          done < "$ref_file"
          test "$match_count" -eq 1 || { echo 'LAS_PUBLIC_REF_PROOF=FAIL'; exit 1; }
          expected_oid="$(awk -v ref="$matched_ref" '$2==ref {print $1}' "$ref_file")"
          expected_proof="$(printf '%s' "$expected_oid" | sha256sum | cut -d' ' -f1)"
          test "$expected_proof" = "$EXPECTED_PRIVATE_COMMIT_PROOF" || {
            echo 'LAS_PUBLIC_PRIVATE_HEAD_MOVED=BLOCKED'; exit 1;
          }
          echo "::add-mask::$expected_oid"
          git -c "http.extraHeader=AUTHORIZATION: basic $auth" \
            fetch -q --depth=1 origin "$matched_ref" > "$fetch_log" 2>&1 || {
              echo 'LAS_PUBLIC_PRIVATE_FETCH=FAIL'; exit 1;
            }
          git checkout -q --detach FETCH_HEAD > "$fetch_log" 2>&1 || {
            echo 'LAS_PUBLIC_PRIVATE_DETACH=FAIL'; exit 1;
          }
          actual="$(git rev-parse HEAD)"
          echo "::add-mask::$actual"
          actual_proof="$(printf '%s' "$actual" | sha256sum | cut -d' ' -f1)"
          test "$actual_proof" = "$EXPECTED_PRIVATE_COMMIT_PROOF" || {
            echo 'LAS_PUBLIC_PRIVATE_REVISION_MISMATCH=FAIL'; exit 1;
          }
          test -z "$(git status --porcelain --untracked-files=no)"
          rm -f "$ref_file" "$fetch_log"
          unset PRIVATE_TOKEN auth expected_oid actual matched_ref
          echo 'LAS_PUBLIC_PRIVATE_EXACT_SOURCE=PASS'
          echo "LAS_PUBLIC_PRIVATE_COMMIT_PROOF=$actual_proof"

      - name: Install pinned Rust, rustfmt, clippy
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null 2>&1 || {
            echo 'LAS_PUBLIC_RUST_TOOLCHAIN_INSTALL=FAIL'; exit 1;
          }
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null 2>&1 || {
            echo 'LAS_PUBLIC_RUST_COMPONENTS=FAIL'; exit 1;
          }
          test "$(rustc +1.98.1 --version | awk '{print $2}')" = '1.98.1'
          echo 'LAS_PUBLIC_RUST_TOOLCHAIN=PASS'

      - name: Install checksum-pinned Ada GPRBuild for Root FFI
        shell: bash
        run: |
          set -euo pipefail
          ALR_ZIP="$RUNNER_TEMP/las-alire-2.1.1.zip"
          mkdir -p "$RUNNER_TEMP/las-alire"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "$ALR_ZIP" \
            'https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip' >/dev/null 2>&1 || {
              echo 'LAS_PUBLIC_ADA_TOOLCHAIN_DOWNLOAD=FAIL'; exit 1;
            }
          echo '09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7  '"$ALR_ZIP" | sha256sum --check --strict >/dev/null || {
            echo 'LAS_PUBLIC_ADA_TOOLCHAIN_CHECKSUM=FAIL'; exit 1;
          }
          unzip -q "$ALR_ZIP" -d "$RUNNER_TEMP/las-alire"
          export PATH="$RUNNER_TEMP/las-alire/bin:$PATH"
          alr -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1 >/dev/null 2>&1 || {
            echo 'LAS_PUBLIC_ADA_TOOLCHAIN_INSTALL=FAIL'; exit 1;
          }
          mkdir -p "$RUNNER_TEMP/las-root-ffi-workspace"
          (cd "$RUNNER_TEMP/las-root-ffi-workspace" && alr -n init --in-place --no-skel --lib las_root_ffi_smoke >/dev/null 2>&1) || {
            echo 'LAS_PUBLIC_ADA_WORKSPACE_INIT=FAIL'; exit 1;
          }
          cat > "$RUNNER_TEMP/las-gprbuild-wrapper" <<'EOF_GPR'
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$RUNNER_TEMP/las-root-ffi-workspace"
          exec "$RUNNER_TEMP/las-alire/bin/alr" exec -- gprbuild "$@"
          EOF_GPR
          chmod 0700 "$RUNNER_TEMP/las-gprbuild-wrapper"
          echo 'LAS_PUBLIC_ADA_TOOLCHAIN=PASS'

      - name: Execute exact revision native Rust tests and compile gates
        shell: bash
        run: |
          set -euo pipefail
          cd private-target
          overall=0
          # Retain private errors only in runner.temp; never print compiler excerpts.
          run_gate() {
            local marker="$1"
            shift
            local log="$RUNNER_TEMP/las-private-$marker.log"
            set +e
            "$@" >"$log" 2>&1
            local rc=$?
            set -e
            echo "LAS_PUBLIC_${marker}_RC=$rc"
            echo "LAS_PUBLIC_${marker}_LOG_SHA256=$(sha256sum "$log" | cut -d' ' -f1)"
            if [[ "$rc" -ne 0 ]]; then overall=1; fi
          }
          run_gate FMT cargo +1.98.1 fmt --all -- --check
          run_gate CHECK_DEFAULT env RUSTFLAGS=-Dwarnings cargo +1.98.1 check --locked --lib
          run_gate CHECK_ALL_FEATURES env RUSTFLAGS=-Dwarnings GPRBUILD="$RUNNER_TEMP/las-gprbuild-wrapper" cargo +1.98.1 check --locked --lib --all-features
          run_gate TEST_DEFAULT env RUSTFLAGS=-Dwarnings cargo +1.98.1 test --locked --lib -- --test-threads=1
          run_gate CLIPPY_DEFAULT env RUSTFLAGS=-Dwarnings cargo +1.98.1 clippy --locked --lib -- -D warnings
          test -z "$(git status --porcelain --untracked-files=no)" || {
            echo 'LAS_PUBLIC_PRIVATE_TRACKED_TREE=FAIL'; exit 1;
          }
          [[ "$overall" == 0 ]] || { echo 'LAS_PUBLIC_SCOPED_RUST_GATES=FAIL'; exit 1; }
          echo 'LAS_PUBLIC_SCOPED_RUST_GATES=PASS'

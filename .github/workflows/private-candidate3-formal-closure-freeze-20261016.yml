name: Candidate3 formal closure freeze preflight 20261016

on:
  push:
    branches:
      - verify/candidate3-formal-closure-20261016
    paths:
      - RUN_CANDIDATE3_FORMAL_CLOSURE_20261016

permissions:
  contents: read
  actions: read

env:
  CLOSURE_REF: verify/candidate3-formal-closure-20261016
  RESUME_REF: verify/candidate3-resumable-tlc-20261016
  CLOSURE_WORKFLOW_PATH: .github/workflows/private-candidate3-formal-closure-20261016.yml
  FREEZE_WORKFLOW_PATH: .github/workflows/private-candidate3-formal-closure-freeze-20261016.yml
  ANCHOR_PATH: CANDIDATE3_FORMAL_CLOSURE_ANCHOR_20261016
  TRIGGER_PATH: RUN_CANDIDATE3_FORMAL_CLOSURE_20261016
  ORIGINAL_RUN_ID: "38829095332"
  EXPECTED_ORIGINAL_HEAD: 55471ace6dd056674830ea7764ed6d088faacaa1
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 269a9a8c7afae986f8065e93745c9017f848292a118b2b9d006d007cbdb6b1f8
  EXPECTED_PRIVATE_TREE_PROOF: 6998e8e80e6c8fb86fbac5e4c512af441f827b4536aa5448dfed6aa14568468e
  EXPECTED_VERIFIER_BLOB: 62e3e6dc0fad5dddc7fb0a453a3cd681d911e590
  EXPECTED_TLC_MAP_SHA256: da7bb51d531d0e5e5e6994c80be8f254a110cb8181e6121e3a557fdff9428cee

jobs:
  freeze-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify exact engine-anchor-trigger chain and immutable workflow blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF_NAME" = "$CLOSURE_REF"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]

          api_get() {
            curl --proto '=https' --tlsv1.2 --fail-with-body -sS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" "$1"
          }

          ref_json="$RUNNER_TEMP/closure-ref.json"
          api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/$CLOSURE_REF" >"$ref_json"
          current_ref_sha="$(python3 - "$ref_json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1],encoding='utf-8'))['object']['sha'])
          PY
          )"
          rm -f "$ref_json"
          test "$current_ref_sha" = "$GITHUB_SHA"

          current_json="$RUNNER_TEMP/current-commit.json"
          api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" >"$current_json"
          anchor_sha="$(python3 - "$current_json" "$TRIGGER_PATH" <<'PY'
          import json,sys
          c=json.load(open(sys.argv[1],encoding='utf-8'))
          assert len(c['parents'])==1
          assert len(c['files'])==1
          f=c['files'][0]
          assert f['filename']==sys.argv[2] and f['status']=='added'
          print(c['parents'][0]['sha'])
          PY
          )"
          [[ "$anchor_sha" =~ ^[0-9a-f]{40}$ ]]

          anchor_commit_json="$RUNNER_TEMP/anchor-commit.json"
          api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$anchor_sha" >"$anchor_commit_json"
          engine_sha="$(python3 - "$anchor_commit_json" "$ANCHOR_PATH" <<'PY'
          import json,sys
          c=json.load(open(sys.argv[1],encoding='utf-8'))
          assert len(c['parents'])==1
          assert len(c['files'])==1
          f=c['files'][0]
          assert f['filename']==sys.argv[2] and f['status']=='added'
          print(c['parents'][0]['sha'])
          PY
          )"
          [[ "$engine_sha" =~ ^[0-9a-f]{40}$ ]]

          api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/$ANCHOR_PATH?ref=$anchor_sha" >"$RUNNER_TEMP/anchor-file.json"
          api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/$TRIGGER_PATH?ref=$GITHUB_SHA" >"$RUNNER_TEMP/trigger-file.json"

          python3 - "$RUNNER_TEMP/anchor-file.json" "$RUNNER_TEMP/trigger-file.json" "$engine_sha" "$anchor_sha" <<'PY' >"$RUNNER_TEMP/freeze-values.env"
          import base64,json,os,sys
          def text(path):
              d=json.load(open(path,encoding='utf-8'))
              return base64.b64decode(d['content']).decode('utf-8')
          def parse(raw):
              out={}
              for line in raw.splitlines():
                  assert line and '=' in line
                  k,v=line.split('=',1)
                  assert k not in out
                  out[k]=v
              return out
          a=parse(text(sys.argv[1])); t=parse(text(sys.argv[2]))
          akeys={'schema','engine_parent','closure_workflow_blob','freeze_workflow_blob','resume_runner','original_run','original_head','snapshot','tree','verifier','map'}
          tkeys={'schema','anchor','engine_parent','resume_runner','original_run','snapshot','tree','verifier','map','request'}
          assert set(a)==akeys and set(t)==tkeys
          assert a['schema']=='candidate3-formal-closure-anchor-v1'
          assert t['schema']=='candidate3-formal-closure-trigger-v1'
          assert a['engine_parent']==sys.argv[3]
          assert t['anchor']==sys.argv[4]
          assert t['engine_parent']==sys.argv[3]
          assert a['resume_runner']==t['resume_runner']
          assert a['original_run']==t['original_run']==os.environ['ORIGINAL_RUN_ID']
          assert a['original_head']==os.environ['EXPECTED_ORIGINAL_HEAD']
          assert a['snapshot']==t['snapshot']==os.environ['EXPECTED_PRIVATE_SNAPSHOT_PROOF']
          assert a['tree']==t['tree']==os.environ['EXPECTED_PRIVATE_TREE_PROOF']
          assert a['verifier']==t['verifier']==os.environ['EXPECTED_VERIFIER_BLOB']
          assert a['map']==t['map']==os.environ['EXPECTED_TLC_MAP_SHA256']
          assert t['request']=='verify'
          for k in ('engine_parent','closure_workflow_blob','freeze_workflow_blob','resume_runner'):
              v=a[k]
              assert len(v)==40 and all(ch in '0123456789abcdef' for ch in v)
          print('ENGINE_SHA='+a['engine_parent'])
          print('CLOSURE_BLOB='+a['closure_workflow_blob'])
          print('FREEZE_BLOB='+a['freeze_workflow_blob'])
          print('RESUME_RUNNER_SHA='+a['resume_runner'])
          PY
          set -a
          source "$RUNNER_TEMP/freeze-values.env"
          set +a
          rm -f "$RUNNER_TEMP/freeze-values.env"
          test "$ENGINE_SHA" = "$engine_sha"

          api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/$CLOSURE_WORKFLOW_PATH?ref=$ENGINE_SHA" >"$RUNNER_TEMP/closure-engine.json"
          api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/$CLOSURE_WORKFLOW_PATH?ref=$GITHUB_SHA" >"$RUNNER_TEMP/closure-current.json"
          api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/$FREEZE_WORKFLOW_PATH?ref=$ENGINE_SHA" >"$RUNNER_TEMP/freeze-engine.json"
          api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/$FREEZE_WORKFLOW_PATH?ref=$GITHUB_SHA" >"$RUNNER_TEMP/freeze-current.json"
          python3 - "$RUNNER_TEMP/closure-engine.json" "$RUNNER_TEMP/closure-current.json" "$RUNNER_TEMP/freeze-engine.json" "$RUNNER_TEMP/freeze-current.json" "$CLOSURE_BLOB" "$FREEZE_BLOB" <<'PY'
          import json,sys
          ce,cc,fe,fc=[json.load(open(p,encoding='utf-8')) for p in sys.argv[1:5]]
          assert ce['sha']==cc['sha']==sys.argv[5]
          assert fe['sha']==fc['sha']==sys.argv[6]
          PY

          resume_ref_json="$RUNNER_TEMP/resume-ref.json"
          api_get "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/$RESUME_REF" >"$resume_ref_json"
          actual_resume_sha="$(python3 - "$resume_ref_json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1],encoding='utf-8'))['object']['sha'])
          PY
          )"
          test "$actual_resume_sha" = "$RESUME_RUNNER_SHA"

          rm -f "$RUNNER_TEMP"/*.json
          echo "LAS_CANDIDATE3_CLOSURE_ENGINE_SHA=$ENGINE_SHA"
          echo "LAS_CANDIDATE3_CLOSURE_RESUME_RUNNER=$RESUME_RUNNER_SHA"
          echo "LAS_CANDIDATE3_CLOSURE_FREEZE_PREFLIGHT=PASS"

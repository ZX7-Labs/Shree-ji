name: Opaque retired-owner closure promotion 20261012

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/opaque-linux-retired-closure-promotion-20261012.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opaque-retired-owner-closure-promotion
  cancel-in-progress: false

env:
  TARGET_REF_HASH: 12246190df640013d9ee426d2a340387c6d22d0e8241135d6a20dcf1fe5a2bc0
  EXPECTED_HEAD_PROOF: c1b3b06dc372f212fd256e328c9a0dad282c1b2a44e179879061c15a0a19c99b
  EXPECTED_TREE_PROOF: 96dd6f1b2d519fe01e22647efa8d4f32f6e53f5badb00b199e9133246e0fc501
  ORIGINAL_HELPER_PATH_HASH: 3bd0f3b2ae73ca0acd5d1e08b47720c6cc80569d4b87901c2e1fc0b69f7504e2
  EXPECTED_TRANSFORM_SHA256: d97bb8c1f38b8ceeb9a5814e984947822b76cb2dcf681ead65443ab02c4e8e58
  EXPECTED_PATH_HASH_1: 680761d41ae8315a6bf67b2df5250c8b4ebc93b434b7de42be032b743c37b90a
  EXPECTED_PATH_HASH_2: 736cc80e53ddc8c5287113b778e1a8fb5f3973b1b5092cdf665c982b07ce8b6d
  EXPECTED_REPAIRED_BLOBSET_PROOF: a067be3181e555721127676a465c7c4cfbab7985f71e229e100b35a63967d2e8
  EXPECTED_FINAL_BLOBSET_PROOF: 4f0447924825c9cc473d633f762bf844ecd79dc0bdce4d7606121e3633a3c289
  V3_CONTROL_COMMIT: 97204b4b750d3313a97f9181482d2c1bf17a5f4f
  V3_CONTROL_BLOB: 807712a142925beba4c3b6101929e7b1da73815c
  RUSTFLAGS: -Dwarnings

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Recover exact private revision with write lease
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_WRITE_TOKEN: ${{ secrets.LAS_PRIVATE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"; test -n "$PRIVATE_WRITE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"; echo "::add-mask::$PRIVATE_WRITE_TOKEN"
          root="$RUNNER_TEMP/private-target"; mkdir "$root"; cd "$root"; git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_WRITE_TOKEN" | base64 -w0)"; echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/private-heads"; git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""; head=""
          while read -r candidate_sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"; matched_ref="$ref"; head="$candidate_sha"
            fi
          done <"$refs"
          rm -f "$refs"; test -n "$matched_ref"; test -n "$head"
          echo "::add-mask::$matched_ref"; echo "::add-mask::$head"
          test "$(printf '%s' "$head" | sha256sum | awk '{print $1}')" = "$EXPECTED_HEAD_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$head"; git checkout -q -B promotion-target "$head"
          tree="$(git rev-parse 'HEAD^{tree}')"; echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_TREE_PROOF"
          test -z "$(git status --porcelain)"
          printf '%s' "$matched_ref" >"$RUNNER_TEMP/private-ref"
          printf '%s' "$head" >"$RUNNER_TEMP/private-start-sha"
          printf '%s' "$auth" >"$RUNNER_TEMP/private-auth"
          chmod 600 "$RUNNER_TEMP/private-ref" "$RUNNER_TEMP/private-start-sha" "$RUNNER_TEMP/private-auth"
          echo "LAS_PROMOTION_RECOVERY=PASS"

      - name: Pin verified v3 control and replay toolchain setup
        shell: bash
        run: |
          set -euo pipefail
          control="$RUNNER_TEMP/v3-control.yml"
          url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${V3_CONTROL_COMMIT}/.github/workflows/opaque-linux-retired-closure-candidate-v3-20261012.yml"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --output "$control" "$url"
          python3 - "$control" "$V3_CONTROL_BLOB" <<'PY'
          import hashlib,pathlib,sys
          p=pathlib.Path(sys.argv[1]); data=p.read_bytes(); expected=sys.argv[2]
          actual=hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
          if actual!=expected: raise SystemExit(60)
          PY
          cat >"$RUNNER_TEMP/replay-v3-step.py" <<'PY'
          import pathlib,sys
          src=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8').splitlines(keepends=True)
          name=sys.argv[2]; out=pathlib.Path(sys.argv[3]); marker='- name: '+name
          starts=[i for i,x in enumerate(src) if x.strip()==marker]
          if len(starts)!=1: raise SystemExit(61)
          start=starts[0]; step_indent=len(src[start])-len(src[start].lstrip()); run=None
          for i in range(start+1,len(src)):
              s=src[i].strip(); indent=len(src[i])-len(src[i].lstrip())
              if s and indent<=step_indent: break
              if s=='run: |': run=i; break
          if run is None: raise SystemExit(62)
          run_indent=len(src[run])-len(src[run].lstrip()); body=[]
          for i in range(run+1,len(src)):
              s=src[i].strip(); indent=len(src[i])-len(src[i].lstrip())
              if s and indent<=step_indent: break
              if not s: body.append('\n'); continue
              if indent<=run_indent: raise SystemExit(63)
              body.append(src[i][run_indent+2:])
          if not body: raise SystemExit(64)
          out.write_text(''.join(body),encoding='utf-8')
          PY
          python3 "$RUNNER_TEMP/replay-v3-step.py" "$control" "Install pinned Rust and Ada toolchains" "$RUNNER_TEMP/replay.sh"
          bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/replay.sh"
          echo "LAS_PROMOTION_CONTROL_PIN=PASS"

      - name: Replay verified Linux boundary closure
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/replay-v3-step.py" "$RUNNER_TEMP/v3-control.yml" "Materialize evidence-selected transform and close Linux boundary" "$RUNNER_TEMP/replay.sh"
          bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/replay.sh"

      - name: Replay verified Clippy alias repair
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/replay-v3-step.py" "$RUNNER_TEMP/v3-control.yml" "Factor Clippy complex return shape into a generic named alias" "$RUNNER_TEMP/replay.sh"
          bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/replay.sh"

      - name: Replay verified full gate matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/replay-v3-step.py" "$RUNNER_TEMP/v3-control.yml" "Prove final change boundary and full gate matrix" "$RUNNER_TEMP/replay.sh"
          bash --noprofile --norc -e -o pipefail "$RUNNER_TEMP/replay.sh"

      - name: Bind exact verified final candidate
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          changed="$RUNNER_TEMP/promotion-final-changed"; git diff --name-only -z >"$changed"
          python3 - "$changed" <<'PY'
          import hashlib,os,subprocess,sys
          paths=[p for p in open(sys.argv[1],'rb').read().split(b'\0') if p]
          expected=sorted([os.environ['EXPECTED_PATH_HASH_1'],os.environ['EXPECTED_PATH_HASH_2']])
          if len(paths)!=2 or sorted(hashlib.sha256(p).hexdigest() for p in paths)!=expected: raise SystemExit(70)
          blobs=[]
          for p in paths:
              blob=subprocess.check_output(['git','hash-object','--',p.decode()],text=True).strip()
              blobs.append(hashlib.sha256(blob.encode()).hexdigest())
          proof=hashlib.sha256('\n'.join(sorted(blobs)).encode()).hexdigest()
          print('LAS_PROMOTION_FINAL_BLOBSET_PROOF='+proof)
          if proof!=os.environ['EXPECTED_FINAL_BLOBSET_PROOF']: raise SystemExit(71)
          PY
          rm -f "$changed"; git diff --check
          echo "LAS_PROMOTION_FINAL_BINDING=PASS"

      - name: Commit and fast-forward exact private ref
        shell: bash
        env:
          PRIVATE_WRITE_TOKEN: ${{ secrets.LAS_PRIVATE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          ref="$(cat "$RUNNER_TEMP/private-ref")"; start="$(cat "$RUNNER_TEMP/private-start-sha")"; auth="$(cat "$RUNNER_TEMP/private-auth")"
          echo "::add-mask::$PRIVATE_WRITE_TOKEN"; echo "::add-mask::$auth"; echo "::add-mask::$start"; echo "::add-mask::$ref"
          remote="$(git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote origin "$ref" | awk '{print $1}')"; echo "::add-mask::$remote"
          test "$remote" = "$start"
          test -n "$(git status --porcelain)"
          git config user.name "LAS Verification Repair"
          git config user.email "las-verification@users.noreply.github.com"
          git add -u
          git commit -q -m "Close retired-owner Linux feature boundary"
          new_sha="$(git rev-parse HEAD)"; echo "::add-mask::$new_sha"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" push -q origin HEAD:"$ref"
          echo "LAS_PROMOTION_RESULT=PASS"
          echo "LAS_PROMOTION_COMMIT_PROOF=$(printf '%s' "$new_sha" | sha256sum | awk '{print $1}')"

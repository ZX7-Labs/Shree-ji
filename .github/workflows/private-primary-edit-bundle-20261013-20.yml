          CERT
          openssl cms -encrypt -binary -aes-256-cbc \
            -in "$RUNNER_TEMP/edit-surface.tar.gz" -outform DER \
            -out "$RUNNER_TEMP/edit-surface.cms" "$RUNNER_TEMP/recipient.pem" >/dev/null 2>&1
          rm -f "$RUNNER_TEMP/edit-surface.tar.gz" "$RUNNER_TEMP/recipient.pem"
          echo "LAS_EDIT_BUNDLE_ENCRYPTED=PASS"

      - name: Upload encrypted edit surface
        uses: actions/upload-artifact@v4
        with:
          name: private-primary-edit-surface-encrypted
          path: ${{ runner.temp }}/edit-surface.cms
          if-no-files-found: error
          retention-days: 1

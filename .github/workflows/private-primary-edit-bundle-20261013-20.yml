name: Private primary edit bundle 20261013-20

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-primary-edit-bundle-20261013-20.yml"

permissions:
  contents: read

env:
  TARGET_REF_HASH: 848c0f95eaf6476c9dbfad7b9702a9409ff930d3e512c3f9ce99f0e4011d3764
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: cd450c7edcc0f1c3b72470114325956cb9443e257016541dcdbe25f122debdd4
  EXPECTED_PRIVATE_TREE_PROOF: 11ce7389bd95be39181e0eb693ffde089004e6051e38d4fbdd0fb6e03fc05d47

jobs:
  encrypted-edit-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Recover exact private primary opaquely
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          root="$GITHUB_WORKSPACE/target"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          private_head=""
          while read -r candidate_sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
              private_head="$candidate_sha"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          test -n "$private_head"
          echo "::add-mask::$matched_ref"
          echo "::add-mask::$private_head"
          test "$(printf '%s' "$private_head" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$private_head"
          git checkout -q --detach "$private_head"
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_TREE_PROOF"
          echo "LAS_EDIT_BUNDLE_RECOVERY=PASS"

      - name: Encrypt exact edit surface
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          tar -czf "$RUNNER_TEMP/edit-surface.tar.gz" \
            src/effect_fabric/root_supervisor_active_runtime.rs \
            src/effect_fabric/root_guarded_executor.rs \
            src/effect_fabric/root_control_executor.rs \
            src/effect_fabric/root_supervisor_epoch_coordinator.rs \
            src/effect_fabric/root_supervisor_graceful_handoff.rs \
            src/effect_fabric/root_supervisor_linux_rotation.rs \
            src/effect_fabric/root_supervisor_epoch_coordinator_tests.rs \
            src/effect_fabric/root_supervisor_linux_integration_tests.rs \
            src/lib.rs
          cat >"$RUNNER_TEMP/recipient.pem" <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIIEITCCAomgAwIBAgIUSDZhPk6kiL2oWpzyZ7VL47y7pgowDQYJKoZIhvcNAQEL
          BQAwIDEeMBwGA1UEAwwVTEFTIFJ1c3RmbXQgRXBoZW1lcmFsMB4XDTI2MTAxMjIx

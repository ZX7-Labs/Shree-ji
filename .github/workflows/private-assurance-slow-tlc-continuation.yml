name: Candidate3 exact resumable TLC continuation 20261016

on:
  workflow_dispatch:
    inputs:
      index:
        description: Exact cancelled candidate3 canonical TLC profile index (profile 39 uses its dedicated registered workflow)
        required: true
        type: string
      segment:
        description: Exact continuation segment number
        required: true
        default: "1"
        type: string
      resume_run_id:
        description: Prior candidate3 checkpoint-producing workflow run
        required: false
        default: ""
        type: string
      resume_artifact:
        description: Prior authenticated encrypted candidate3 checkpoint artifact
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: candidate3-resumable-tlc-${{ inputs.index }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TARGET_INDEX: ${{ inputs.index }}
      SEGMENT: ${{ inputs.segment }}
      RESUME_RUN_ID: ${{ inputs.resume_run_id }}
      RESUME_ARTIFACT: ${{ inputs.resume_artifact }}
      CONTINUATION_REF: verify/candidate3-resumable-tlc-20261016
    steps:
      - name: Validate candidate3 generic continuation request
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$CONTINUATION_REF"
          [[ "$TARGET_INDEX" =~ ^[0-9]+$ ]]
          [[ "$SEGMENT" =~ ^[0-9]+$ ]]
          test "$TARGET_INDEX" -ge 0
          test "$TARGET_INDEX" -lt 202
          test "$TARGET_INDEX" -ne 39
          test "$SEGMENT" -ge 1
          if [[ "$SEGMENT" -eq 1 ]]; then
            test -z "$RESUME_RUN_ID"
            test -z "$RESUME_ARTIFACT"
          else
            [[ "$RESUME_RUN_ID" =~ ^[0-9]+$ ]]
            test "$RESUME_ARTIFACT" = "candidate3-resume-state-${TARGET_INDEX}-$((SEGMENT - 1))"
          fi
          echo "LAS_CANDIDATE3_GENERIC_ORCHESTRATOR_REQUEST=PASS"

  continuation:
    needs: validate
    uses: ./.github/workflows/_private-candidate3-resumable-tlc-slice-20261016.yml
    with:
      index: ${{ fromJSON(inputs.index) }}
      segment: ${{ fromJSON(inputs.segment) }}
      resume_run_id: ${{ inputs.resume_run_id }}
      resume_artifact: ${{ inputs.resume_artifact }}
      mode: generic
      orchestrator_workflow: private-assurance-slow-tlc-continuation.yml
    secrets: inherit

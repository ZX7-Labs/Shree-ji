name: Private current-202 TLC28 v5 storage repair experiment

on:
  push:
    branches: [current-202-tlc28-v5-storage-repair-experiment]
    paths:
      - "RUN_CURRENT_202_TLC28_V5_STORAGE_REPAIR"
  workflow_dispatch:
    inputs:
      index:
        description: Exact canonical TLC profile index; this experiment is bound to profile 28
        required: true
        default: "28"
        type: string
      segment:
        description: V5 continuation segment number; manual dispatch is only for native v5 continuation
        required: true
        type: string
      resume_run_id:
        description: Prior v5 workflow run containing the authenticated encrypted checkpoint
        required: true
        type: string
      resume_artifact:
        description: Prior v5 authenticated encrypted checkpoint artifact name
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: current-202-tlc28-v5-storage-repair-exp1
  cancel-in-progress: false

env:
  CONTINUATION_REF: current-202-tlc28-v5-storage-repair-experiment

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      TARGET_INDEX: ${{ github.event_name == 'push' && '28' || inputs.index }}
      SEGMENT: ${{ github.event_name == 'push' && '14' || inputs.segment }}
      RESUME_RUN_ID: ${{ github.event_name == 'push' && '38889300529' || inputs.resume_run_id }}
      RESUME_ARTIFACT: ${{ github.event_name == 'push' && 'current-202-v4-state-28-13' || inputs.resume_artifact }}
      RESUME_GENERATION: ${{ github.event_name == 'push' && 'v4' || 'v5' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate immutable v5 experiment request
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$CONTINUATION_REF"
          test "$TARGET_INDEX" = "28"
          [[ "$SEGMENT" =~ ^[0-9]+$ ]]
          [[ "$RESUME_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          case "$RESUME_GENERATION" in
            v4)
              test "$GITHUB_EVENT_NAME" = "push"
              test "$SEGMENT" = "14"
              test "$RESUME_RUN_ID" = "38889300529"
              test "$RESUME_ARTIFACT" = "current-202-v4-state-28-13"
              ;;
            v5)
              test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
              test "$SEGMENT" -ge 15
              test "$RESUME_ARTIFACT" = "current-202-v5-exp1-state-28-$((SEGMENT - 1))"
              ;;
            *)
              exit 1
              ;;
          esac

          ref_json="$RUNNER_TEMP/continuation-ref.json"
          curl --proto '=https' --tlsv1.2 --fail-with-body -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/$CONTINUATION_REF" >"$ref_json"
          continuation_sha="$(python3 - "$ref_json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              print(json.load(handle)["object"]["sha"])
          PY
          )"
          rm -f "$ref_json"
          test "$continuation_sha" = "$GITHUB_SHA"
          echo "LAS_CURRENT_202_V5_ORCHESTRATOR_REQUEST=PASS"
          echo "LAS_CURRENT_202_V5_ORCHESTRATOR_REF_BINDING=PASS"
          echo "LAS_CURRENT_202_V5_ORCHESTRATOR_GENERATION=$RESUME_GENERATION"

  continuation:
    needs: validate
    uses: ./.github/workflows/_private-assurance-tlc-continuation-slice.yml
    with:
      index: ${{ fromJSON(github.event_name == 'push' && '28' || inputs.index) }}
      segment: ${{ fromJSON(github.event_name == 'push' && '14' || inputs.segment) }}
      resume_run_id: ${{ github.event_name == 'push' && '38889300529' || inputs.resume_run_id }}
      resume_artifact: ${{ github.event_name == 'push' && 'current-202-v4-state-28-13' || inputs.resume_artifact }}
      resume_generation: ${{ github.event_name == 'push' && 'v4' || 'v5' }}
    secrets: inherit

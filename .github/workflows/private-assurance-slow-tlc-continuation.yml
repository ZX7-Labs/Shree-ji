name: Retired legacy 203-profile TLC continuation

on:
  workflow_dispatch:
    inputs:
      index:
        description: Legacy canonical TLC profile index
        required: true
        type: string
      segment:
        description: Legacy continuation segment number
        required: true
        type: string
      resume_run_id:
        description: Prior legacy workflow run containing checkpoint
        required: false
        default: ""
        type: string
      resume_artifact:
        description: Prior legacy checkpoint artifact name
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    steps:
      - name: Reject retired legacy continuation
        shell: bash
        run: |
          set -euo pipefail
          echo "LAS_LEGACY_203_TLC_CONTINUATION=RETIRED"
          echo "Canonical closure is bound to the repaired 202-profile candidate, current-202 V4 generic runner, and dedicated TLC39 runner."
          exit 1

name: Retired default-branch legacy TLC continuation

on:
  workflow_dispatch:
    inputs:
      index:
        description: Legacy canonical TLC profile index
        required: true
        type: string
      segment:
        description: Legacy continuation segment number
        required: true
        type: string
      resume_run_id:
        description: Prior legacy workflow run containing checkpoint
        required: false
        default: ""
        type: string
      resume_artifact:
        description: Prior legacy checkpoint artifact name
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject default-branch legacy continuation
        shell: bash
        run: |
          set -euo pipefail
          echo "LAS_DEFAULT_BRANCH_LEGACY_TLC_CONTINUATION=RETIRED"
          echo "Canonical current-202 generic continuation is bound to current-202-tlc-continuation-v4-runner and its frozen workflow blobs."
          exit 1

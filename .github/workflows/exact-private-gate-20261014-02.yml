name: Exact private gate 20261014-02

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/exact-private-gate-20261014-02.yml"

permissions:
  contents: read

env:
  TARGET_REF_HASH: 28a52175bfc55f4f8b2b0f4312cd2616a65a7082555149f4382746e2254e1b26
  EXPECTED_PRIVATE_SNAPSHOT_PROOF: 35cae022a486542c2dca170eaf416184525df195721fa36bf47b8ee6396329ac
  EXPECTED_PRIVATE_TREE_PROOF: da5008f03c296d0d8e13f279e516ab5059568750d4dd39766b9c49ca60ff5180

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal >/dev/null
          rustup component add --toolchain 1.98.1 rustfmt clippy >/dev/null
          test "$(rustc +1.98.1 --version | awk '{print $2}')" = "1.98.1"
          test "$(cargo +1.98.1 --version | awk '{print $2}')" = "1.98.1"
          echo "LAS_GATE02_TOOLCHAIN=PASS"

      - name: Recover exact private revision opaquely
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORY"
          test -n "$PRIVATE_TOKEN"
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_TOKEN"
          root="$RUNNER_TEMP/private-target"
          mkdir "$root"
          cd "$root"
          git init -q
          git remote add origin "https://github.com/${PRIVATE_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          refs="$RUNNER_TEMP/private-heads"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" ls-remote --heads origin >"$refs"
          matched_ref=""
          private_head=""
          while read -r candidate_sha ref; do
            if [[ "$(printf '%s' "$ref" | sha256sum | awk '{print $1}')" = "$TARGET_REF_HASH" ]]; then
              test -z "$matched_ref"
              matched_ref="$ref"
              private_head="$candidate_sha"
            fi
          done <"$refs"
          rm -f "$refs"
          test -n "$matched_ref"
          test -n "$private_head"
          echo "::add-mask::$matched_ref"
          echo "::add-mask::$private_head"
          test "$(printf '%s' "$private_head" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          git -c http.extraHeader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$matched_ref"
          test "$(git rev-parse FETCH_HEAD)" = "$private_head"
          git checkout -q --detach "$private_head"
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "::add-mask::$tree"
          test "$(printf '%s' "$tree" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_TREE_PROOF"
          test -z "$(git status --porcelain)"
          echo "LAS_GATE02_EXACT_RECOVERY=PASS"

      - name: Discriminate lockfile and formatting
        id: static
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.expected"
          set +e
          cargo +1.98.1 generate-lockfile >/dev/null 2>&1
          lock_gen_rc=$?
          lock_cmp_rc=99
          if [ "$lock_gen_rc" -eq 0 ]; then
            cmp --silent Cargo.lock "$RUNNER_TEMP/Cargo.lock.expected"
            lock_cmp_rc=$?
          fi
          git checkout -q -- Cargo.lock
          cargo +1.98.1 fmt --all -- --check >/dev/null 2>&1
          fmt_rc=$?
          set -e
          echo "LAS_GATE02_LOCK_GENERATE_RC=$lock_gen_rc"
          echo "LAS_GATE02_LOCK_COMPARE_RC=$lock_cmp_rc"
          echo "LAS_GATE02_FMT_RC=$fmt_rc"
          echo "lock_gen_rc=$lock_gen_rc" >>"$GITHUB_OUTPUT"
          echo "lock_cmp_rc=$lock_cmp_rc" >>"$GITHUB_OUTPUT"
          echo "fmt_rc=$fmt_rc" >>"$GITHUB_OUTPUT"
          if [ "$fmt_rc" -ne 0 ]; then
            cargo +1.98.1 fmt --all >/dev/null 2>&1
            python3 - <<'PY'
          import hashlib, subprocess
          paths=[p.decode() for p in subprocess.check_output(['git','diff','--name-only','-z']).split(b'\0') if p]
          print(f"LAS_GATE02_FMT_CHANGED_COUNT={len(paths)}")
          for i,p in enumerate(paths,1):
              print(f"LAS_GATE02_FMT_CHANGED_{i}_PATH_SHA256={hashlib.sha256(p.encode()).hexdigest()}")
          PY
            git reset --hard -q HEAD
          fi
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Compile exact private revision
        id: compile
        shell: bash
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          set +e
          cargo +1.98.1 check --locked --all-targets >/dev/null 2>&1
          default_rc=$?
          cargo +1.98.1 check --locked --all-targets --features linux-peer-credentials >/dev/null 2>&1
          linux_rc=$?
          set -e
          echo "LAS_GATE02_CHECK_DEFAULT_RC=$default_rc"
          echo "LAS_GATE02_CHECK_LINUX_RC=$linux_rc"
          echo "default_rc=$default_rc" >>"$GITHUB_OUTPUT"
          echo "linux_rc=$linux_rc" >>"$GITHUB_OUTPUT"

      - name: Lint exact private revision
        id: clippy
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          set +e
          cargo +1.98.1 clippy --locked --all-targets -- -D warnings >/dev/null 2>&1
          default_rc=$?
          cargo +1.98.1 clippy --locked --all-targets --features linux-peer-credentials -- -D warnings >/dev/null 2>&1
          linux_rc=$?
          set -e
          echo "LAS_GATE02_CLIPPY_DEFAULT_RC=$default_rc"
          echo "LAS_GATE02_CLIPPY_LINUX_RC=$linux_rc"
          echo "default_rc=$default_rc" >>"$GITHUB_OUTPUT"
          echo "linux_rc=$linux_rc" >>"$GITHUB_OUTPUT"

      - name: Verify guarded resumability boundary
        id: focused
        shell: bash
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          set +e
          cargo +1.98.1 test --locked --features linux-peer-credentials --lib effect_fabric::root_supervisor_linux_guarded_resumability_tests -- --test-threads=1 >/dev/null 2>&1
          resumability_rc=$?
          cargo +1.98.1 test --locked --features linux-peer-credentials --lib effect_fabric::root_supervisor_linux_channel::tests:: -- --test-threads=1 >/dev/null 2>&1
          channel_rc=$?
          set -e
          echo "LAS_GATE02_RESUMABILITY_RC=$resumability_rc"
          echo "LAS_GATE02_CHANNEL_RC=$channel_rc"
          echo "resumability_rc=$resumability_rc" >>"$GITHUB_OUTPUT"
          echo "channel_rc=$channel_rc" >>"$GITHUB_OUTPUT"

      - name: Verify full Rust matrices
        id: tests
        shell: bash
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          set +e
          cargo +1.98.1 test --locked --all-targets -- --test-threads=1 >/dev/null 2>&1
          default_rc=$?
          cargo +1.98.1 test --locked --all-targets --features linux-peer-credentials -- --test-threads=1 >/dev/null 2>&1
          linux_rc=$?
          cargo +1.98.1 test --locked --release --features linux-peer-credentials --lib effect_fabric::root_supervisor_ -- --test-threads=1 >/dev/null 2>&1
          release_rc=$?
          set -e
          echo "LAS_GATE02_TEST_DEFAULT_RC=$default_rc"
          echo "LAS_GATE02_TEST_LINUX_RC=$linux_rc"
          echo "LAS_GATE02_TEST_RELEASE_SUPERVISOR_RC=$release_rc"
          echo "default_rc=$default_rc" >>"$GITHUB_OUTPUT"
          echo "linux_rc=$linux_rc" >>"$GITHUB_OUTPUT"
          echo "release_rc=$release_rc" >>"$GITHUB_OUTPUT"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Enforce exact revision and complete verification
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-target"
          test "$(printf '%s' "$(git rev-parse HEAD)" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_SNAPSHOT_PROOF"
          test "$(printf '%s' "$(git rev-parse 'HEAD^{tree}')" | sha256sum | awk '{print $1}')" = "$EXPECTED_PRIVATE_TREE_PROOF"
          test -z "$(git status --porcelain --untracked-files=no)"
          test "${{ steps.static.outputs.lock_gen_rc }}" = 0
          test "${{ steps.static.outputs.lock_cmp_rc }}" = 0
          test "${{ steps.static.outputs.fmt_rc }}" = 0
          test "${{ steps.compile.outputs.default_rc }}" = 0
          test "${{ steps.compile.outputs.linux_rc }}" = 0
          test "${{ steps.clippy.outputs.default_rc }}" = 0
          test "${{ steps.clippy.outputs.linux_rc }}" = 0
          test "${{ steps.focused.outputs.resumability_rc }}" = 0
          test "${{ steps.focused.outputs.channel_rc }}" = 0
          test "${{ steps.tests.outputs.default_rc }}" = 0
          test "${{ steps.tests.outputs.linux_rc }}" = 0
          test "${{ steps.tests.outputs.release_rc }}" = 0
          echo "LAS_GATE02_COMPLETE=PASS"

name: Gemini synthetic API check
on:
  push:
    branches: [main]
    paths:
      - RUN_GEMINI_SYNTHETIC
  workflow_dispatch:
    inputs:
      confirm_free_quota:
        description: Confirm free quota and no paid billing
        type: boolean
        required: true
        default: false
permissions: {}
concurrency:
  group: gemini-synthetic-api-check
  cancel-in-progress: false
jobs:
  check:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.confirm_free_quota == true))
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Single bounded synthetic request
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          python3 -I - <<'PY'
          import json, os, sys, urllib.request, urllib.error

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  raise ValueError('redirect refused')

          def check():
              key = os.environ.pop('GEMINI_API_KEY', '')
              if not key or any(c in key for c in '\r\n'):
                  return 'MISSING_KEY'
              body = {'contents': [{'parts': [{'text': 'What is 17 plus 25? Return only the integer.'}]}],
                      'generationConfig': {'maxOutputTokens': 1024}}
              try:
                  request = urllib.request.Request(
                      'https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent',
                      data=json.dumps(body).encode(), method='POST',
                      headers={'Content-Type': 'application/json', 'x-goog-api-key': key})
                  opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
                  with opener.open(request, timeout=75) as response:
                      raw = response.read(65537)
                  if len(raw) > 65536:
                      return 'REJECTED'
                  candidates = json.loads(raw)['candidates']
                  if len(candidates) != 1 or candidates[0]['finishReason'] != 'STOP':
                      return 'REJECTED'
                  parts = candidates[0]['content']['parts']
                  text = ''.join(p.get('text', '') for p in parts if not p.get('thought', False))
                  return 'PASS' if text.strip() == '42' else 'FAIL'
              except urllib.error.HTTPError as exc:
                  return 'HTTP_' + str(exc.code) if exc.code in (400, 401, 403, 404, 429, 500, 503) else 'HTTP_ERROR'
              except (OSError, ValueError, KeyError, TypeError, AttributeError, RecursionError):
                  return 'REJECTED_OR_UNAVAILABLE'

          status = check()
          print('GEMINI_SYNTHETIC_RESULT=' + status)
          sys.exit(0 if status == 'PASS' else 1)
          PY

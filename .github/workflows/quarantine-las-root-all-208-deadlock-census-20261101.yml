name: Root private 208 exact TLC configuration scope census without false waivers
on:
  push:
    branches:
      - quarantine/las-root-current-native-20261101
    paths:
      - .github/workflows/quarantine-las-root-all-208-deadlock-census-20261101.yml
permissions:
  contents: read
jobs:
  exact-private-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_BRANCH_PROOF: 003f7911ad70012d8db9b3e9b544dd63f188d13fefaa45a0c0231b72dd614407
      EXPECTED_PRIVATE_COMMIT_PROOF: 2ce4f28cc46ffaf0683b6a81a39da09973b2c21f8d8b2fbf6226981709cd54f2
      EXPECTED_PRIVATE_RUNNER_BLOB_PROOF: d4df90336770cf5275996ccf750325a091b071a86a708799281845dc0eb5c74f
    steps:
      - name: Recover exact read-only private source without publishing code
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ secrets.LAS_PRIVATE_REPOSITORY }}
          PRIVATE_READ_TOKEN: ${{ secrets.LAS_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$PRIVATE_REPOSITORY" || -z "$PRIVATE_READ_TOKEN" ]]; then
            echo 'LAS_NATIVE_BRIDGE=FAIL:ACCESS'; exit 1
          fi
          echo "::add-mask::$PRIVATE_REPOSITORY"
          echo "::add-mask::$PRIVATE_READ_TOKEN"
          private="$RUNNER_TEMP/private-source"
          mkdir -m 700 "$private"
          cd "$private"
          git init -q
          git remote add origin "https://github.com/$PRIVATE_REPOSITORY.git"
          authorization="$(printf 'x-access-token:%s' "$PRIVATE_READ_TOKEN" | base64 -w0)"
          echo "::add-mask::$authorization"
          all_refs="$RUNNER_TEMP/private-heads"
          git -c core.fsmonitor=false -c http.extraHeader="AUTHORIZATION: basic $authorization" ls-remote --heads origin > "$all_refs" 2> "$RUNNER_TEMP/secret-fetch-error" || {
            echo 'LAS_NATIVE_BRIDGE=FAIL:READ'; exit 1
          }
          match=''
          while read -r _sha candidate; do
            candidate_proof="$(printf '%s' "$candidate" | sha256sum | awk '{print $1}')"
            if [[ "$candidate_proof" == "$TARGET_BRANCH_PROOF" ]]; then
              [[ -z "$match" ]] || { echo 'LAS_NATIVE_BRIDGE=FAIL:AMBIGUOUS_REF'; exit 1; }
              match="$candidate"
            fi
          done < "$all_refs"
          rm -f "$all_refs" "$RUNNER_TEMP/secret-fetch-error"
          [[ -n "$match" ]] || { echo 'LAS_NATIVE_BRIDGE=FAIL:TARGET'; exit 1; }
          echo "::add-mask::$match"
          git -c core.fsmonitor=false -c http.extraHeader="AUTHORIZATION: basic $authorization" fetch -q --depth=1 origin "$match" > /dev/null 2> "$RUNNER_TEMP/secret-fetch-error" || {
            echo 'LAS_NATIVE_BRIDGE=FAIL:FETCH'; exit 1
          }
          rm -f "$RUNNER_TEMP/secret-fetch-error"
          unset authorization PRIVATE_READ_TOKEN PRIVATE_REPOSITORY
          git -c core.fsmonitor=false checkout -q --detach FETCH_HEAD
          actual="$(git -c core.fsmonitor=false rev-parse --verify HEAD)"
          echo "::add-mask::$actual"
          proof="$(printf '%s' "$actual" | sha256sum | awk '{print $1}')"
          [[ "$proof" == "$EXPECTED_PRIVATE_COMMIT_PROOF" ]] || {
            echo 'LAS_NATIVE_BRIDGE=FAIL:SOURCE_PIN'; exit 1
          }
          [[ -z "$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all)" ]] || {
            echo 'LAS_NATIVE_BRIDGE=FAIL:DIRTY'; exit 1
          }
          script='tools/verification/run_bridge_native_suite.sh'
          [[ -f "$script" && ! -L "$script" ]] || {
            echo 'LAS_NATIVE_BRIDGE=FAIL:RUNNER_MISSING'; exit 1
          }
          blob="$(git -c core.fsmonitor=false hash-object "$script")"
          blob_proof="$(printf '%s' "$blob" | sha256sum | awk '{print $1}')"
          [[ "$blob_proof" == "$EXPECTED_PRIVATE_RUNNER_BLOB_PROOF" ]] || {
            echo 'LAS_NATIVE_BRIDGE=FAIL:RUNNER_PIN'; exit 1
          }
          echo "LAS_NATIVE_BRIDGE=SOURCE_PINNED:$proof"

      - name: Audit all 208 source-owned deadlock-scope configurations and reject undeclared waivers
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-source"
          private="$(mktemp -d "$RUNNER_TEMP/las-scope.XXXXXXXX")"
          chmod 700 "$private"
          work="tools/verification/root_deadlock_inventory"
          if ! python3 -I -B -m unittest discover -s "$work" -p 'test_*.py' -q > "$private/unit-normal.private" 2>&1; then
            echo 'LAS_TLC_SCOPE=FAIL:NORMAL_UNIT'; exit 1
          fi
          grep -Eq '^Ran 20 tests in ' "$private/unit-normal.private" || {
            echo 'LAS_TLC_SCOPE=FAIL:NORMAL_VACUOUS'; exit 1
          }
          if ! python3 -O -I -B -m unittest discover -s "$work" -p 'test_*.py' -q > "$private/unit-optimized.private" 2>&1; then
            echo 'LAS_TLC_SCOPE=FAIL:OPTIMIZED_UNIT'; exit 1
          fi
          grep -Eq '^Ran 20 tests in ' "$private/unit-optimized.private" || {
            echo 'LAS_TLC_SCOPE=FAIL:OPTIMIZED_VACUOUS'; exit 1
          }
          if ! python3 -I -B "$work/tlc_deadlock_inventory.py" \
               --source "$PWD" --private-output "$private/scope.private.json" \
               > "$private/tool.private" 2>&1; then
            echo 'LAS_TLC_SCOPE=FAIL:SOURCE_INVENTORY'; exit 1
          fi
          python3 -I -B - "$private/scope.private.json" <<'PY_REDACTED' || {
          import json,pathlib,sys
          a=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf8"))
          required={'configuration_count':208,'config_false_count':200,
             'cli_disable_count':50,'both_disable_count':48,
             'disabled_union_count':202,'non_disabled_count':6,
             'unreviewed_config_disable_count':152}
          if any(type(a.get(k))!=int or a[k]!=v for k,v in required.items()):raise SystemExit(1)
          if len(a.get('records',[]))!=208:raise SystemExit(1)
          if a.get('scope_status')!='INVENTORY_ONLY_NO_DEADLOCK_FREEDOM_CERTIFICATION':raise SystemExit(1)
          if len(a.get('departments',{}))!=8:raise SystemExit(1)
          print("LAS_TLC_SCOPE=208_CONFIGS_152_UNREVIEWED_DECLARATIONS_CLASSIFIED_NOT_WAIVED")
          PY_REDACTED
            echo 'LAS_TLC_SCOPE=FAIL:UNEXPECTED_SOURCE_CENSUS'; exit 1
          }
          [[ -z "$(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=all)" ]] || {
            echo 'LAS_TLC_SCOPE=FAIL:SOURCE_DRIFT'; exit 1
          }
          rm -rf -- "$private"
          echo 'LAS_TLC_SCOPE=SOURCE_PINNED_208_PROFILE_SCOPE_RECONCILED_NOT_RELEASE'

      - name: Scrub ephemeral checkout
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$RUNNER_TEMP/private-source"
          rm -f -- "$RUNNER_TEMP/private-heads" "$RUNNER_TEMP/secret-fetch-error"
          echo 'LAS_NATIVE_BRIDGE=EPHEMERAL_CLEANUP'
